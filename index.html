<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Task Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Karla:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FAFAF7;
    --card: #FFFFFF;
    --line: #ECEAE3;
    --ink: #22252B;
    --ink-soft: #8A8A85;
    --coral: #FF4E6A;
    --coral-soft: #FFE4E9;
    --teal: #00BFA6;
    --teal-soft: #DAF7F1;
    --yellow: #FFB800;
    --yellow-soft: #FFF3D6;
    --violet: #7C5CFC;
    --violet-soft: #EBE5FF;
    --sky: #1F9EFF;
    --sky-soft: #DFF0FF;
    --pink: #FF3D9A;
    --pink-soft: #FFE0F1;
  }
  * { box-sizing: border-box; }
  html, body { overflow-x: hidden; max-width: 100vw; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  body {
    font-family: 'Karla', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--ink);
    margin: 0;
    padding: 22px 16px 44px;
    line-height: 1.5;
  }
  h1 {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 32px;
    margin: 0 0 4px 0;
    letter-spacing: -0.01em;
    color: var(--ink);
  }
  h1 .accent {
    background: linear-gradient(100deg, var(--coral), var(--violet));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .sub { color: var(--ink-soft); font-size: 12.5px; margin-bottom: 18px; font-weight: 600; }
  #resetBtn {
    background: #fff; color: var(--ink-soft); border: 1.5px solid var(--line);
    padding: 7px 16px; border-radius: 20px; font-size: 11.5px; cursor: pointer;
    margin-bottom: 22px; font-family: 'Karla', sans-serif; font-weight: 700; transition: all 0.2s ease;
  }
  #resetBtn:hover { border-color: var(--violet); color: var(--violet); }

  .hero-stats {
    display: flex; gap: 10px; margin-bottom: 18px; flex-wrap: wrap;
  }
  .hero-card {
    flex: 1; min-width: 90px; border-radius: 16px; padding: 14px 16px; color: #fff;
    animation: pop-in 0.4s cubic-bezier(0.34,1.56,0.64,1) both;
  }
  .hero-card.pct { background: linear-gradient(135deg, var(--violet), var(--coral)); }
  .hero-card.done-c { background: linear-gradient(135deg, var(--teal), #00d9a3); }
  .hero-card.pending-c { background: linear-gradient(135deg, var(--yellow), #ff9d00); }
  .hero-card.overdue-c { background: linear-gradient(135deg, var(--pink), var(--coral)); }
  @keyframes pop-in {
    0% { transform: scale(0.85) translateY(6px); opacity: 0; }
    100% { transform: scale(1) translateY(0); opacity: 1; }
  }
  .hero-card .n { font-family: 'Baloo 2', sans-serif; font-size: 26px; font-weight: 800; line-height: 1; }
  .hero-card .l { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 700; opacity: 0.9; margin-top: 3px; }

  .filters { display: flex; gap: 7px; margin-bottom: 14px; flex-wrap: wrap; }
  .filter-btn {
    background: #fff; border: 1.5px solid var(--line); color: var(--ink-soft);
    padding: 6px 14px; border-radius: 20px; font-size: 12px; cursor: pointer;
    font-family: 'Karla', sans-serif; font-weight: 700; transition: all 0.2s ease;
  }
  .filter-btn:hover { border-color: var(--violet); color: var(--violet); }
  .filter-btn.active { background: var(--ink); border-color: var(--ink); color: #fff; }

  .cat-section { margin-bottom: 24px; }
  .cat-heading {
    font-family: 'Baloo 2', sans-serif; font-size: 16px; font-weight: 700; margin: 0 0 10px 2px;
    display: flex; align-items: center; gap: 8px;
  }
  .cat-heading .dot { width: 12px; height: 12px; border-radius: 5px; display: inline-block; }
  .cat-heading .count {
    font-family: 'Karla', sans-serif; font-size: 11px; color: #fff; font-weight: 700;
    background: var(--ink-soft); border-radius: 10px; padding: 1px 8px; margin-left: auto;
  }

  .task-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
  .task {
    display: flex; align-items: flex-start; gap: 10px; background: var(--card);
    border: 1.5px solid var(--line); border-radius: 14px; padding: 12px 13px;
    animation: rise 0.3s ease-out; transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    position: relative;
  }
  .task:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(34,37,43,0.09); border-color: var(--catcolor, var(--violet)); }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .task.done { opacity: 0.55; }
  .task input[type=checkbox] {
    margin-top: 2px; width: 19px; height: 19px; accent-color: var(--teal); flex-shrink: 0; cursor: pointer;
  }
  .task-body { flex: 1; min-width: 0; }
  .task-name { font-size: 13px; line-height: 1.35; font-weight: 600; overflow-wrap: break-word; word-break: break-word; }
  .task.done .task-name { text-decoration: line-through; color: var(--ink-soft); font-weight: 400; }
  .task-meta { font-size: 10px; margin-top: 7px; display: flex; gap: 5px; align-items: center; flex-wrap: wrap; }
  .tag {
    display: inline-block; font-family: 'Karla', sans-serif; font-size: 9.5px; font-weight: 800;
    padding: 3px 8px; border-radius: 8px; letter-spacing: 0.02em; text-transform: uppercase;
  }
  .own { background: var(--teal-soft); color: #00806e; }
  .mhj { background: var(--sky-soft); color: #0b6fc9; }
  .shk { background: var(--violet-soft); color: #5c3fd6; }
  .fees { background: var(--coral-soft); color: #e0184a; }
  .generic-cat { background: var(--yellow-soft); color: #a56800; }
  .personal { background: var(--pink-soft); color: #d40e79; }
  .urgent-tag { background: var(--coral); color: #fff; }
  .due { color: var(--ink-soft); font-family: 'Karla', sans-serif; font-size: 10px; font-weight: 700; }

  .add-box { display: flex; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
  .add-box input, .add-box select {
    background: #fff; border: 1.5px solid var(--line); color: var(--ink);
    padding: 10px 12px; border-radius: 12px; font-size: 12.5px; font-family: 'Karla', sans-serif; font-weight: 600;
    max-width: 100%;
  }
  #newCat { flex: 1; min-width: 140px; }
  .add-box input:focus, .add-box select:focus { outline: none; border-color: var(--violet); }
  .add-box input[type=text] { flex: 1; }
  .add-box button {
    background: linear-gradient(135deg, var(--violet), var(--coral)); color: #fff; border: none; padding: 10px 22px;
    border-radius: 12px; font-weight: 800; font-size: 12.5px; cursor: pointer;
    font-family: 'Karla', sans-serif; transition: opacity 0.2s ease;
  }
  .add-box button:hover { opacity: 0.88; }
  .empty { color: var(--ink-soft); font-size: 14px; text-align: center; padding: 34px; font-family: 'Baloo 2', sans-serif; font-weight: 600; }
  .loading { text-align: center; padding: 40px; color: var(--ink-soft); font-weight: 700; }

  .confetti-piece {
    position: fixed; top: 0; z-index: 3000; pointer-events: none; border-radius: 2px;
    animation: confetti-fall linear forwards;
  }
  @keyframes confetti-fall {
    0% { transform: translateY(-10px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(100vh) rotate(540deg); opacity: 0; }
  }
</style>
</head>
<body>
<div class="sub" style="margin-bottom:2px; font-family:'Karla',sans-serif; text-transform:uppercase; letter-spacing:0.08em; font-size:11px; color:var(--violet);">Indore · Tax &amp; Accounts</div>
<h1>Mustansirr's <span class="accent">Task Board</span></h1>
<div class="sub" id="lastSync">Loading...</div>
<button id="resetBtn" onclick="resetData()">↻ Reset data (if stuck on old tasks)</button>

<div id="authGate" style="position:fixed; inset:0; background:#FAFAF7; z-index:2000; display:flex; align-items:center; justify-content:center; flex-direction:column; padding:20px;">
  <div style="font-family:'Karla',sans-serif; font-size:11px; letter-spacing:0.08em; color:#7C5CFC; text-transform:uppercase; margin-bottom:8px; font-weight:700;">Indore · Tax &amp; Accounts</div>
  <div style="font-family:'Baloo 2',sans-serif; font-weight:700; font-size:26px; margin-bottom:8px; color:#22252B;">Mustansirr's <span style="background:linear-gradient(100deg,#FF4E6A,#7C5CFC); -webkit-background-clip:text; background-clip:text; color:transparent;">Task Board</span></div>
  <div style="font-size:12.5px; color:#8A8A85; margin-bottom:20px; font-weight:600;">This dashboard is password protected</div>
  <input type="password" id="authInput" placeholder="Enter password" style="width:100%; max-width:280px; background:#fff; border:1.5px solid #ECEAE3; color:#22252B; padding:12px 16px; border-radius:14px; font-size:14px; margin-bottom:10px; text-align:center;" onkeydown="if(event.key==='Enter'){ checkAuth(); }">
  <button onclick="checkAuth()" style="background:linear-gradient(135deg,#7C5CFC,#FF4E6A); color:#fff; border:none; padding:11px 30px; border-radius:14px; font-weight:800; font-size:14px; cursor:pointer; font-family:'Karla',sans-serif;">Unlock</button>
  <div id="authError" style="color:#FF4E6A; font-size:12px; margin-top:12px; display:none; font-weight:700;">Incorrect password — try again.</div>
</div>

<div id="modalOverlay" style="display:none; position:fixed; inset:0; background:rgba(34,37,43,0.5); z-index:1000; align-items:center; justify-content:center;">
  <div style="background:var(--bg); border-radius:20px; padding:22px; width:90%; max-width:340px; box-shadow:0 16px 44px rgba(34,37,43,0.3);">
    <div id="modalTitle" style="font-family:'Baloo 2',sans-serif; font-size:17px; font-weight:700; margin-bottom:14px;"></div>
    <div id="modalFields"></div>
    <div style="display:flex; gap:8px; margin-top:16px; justify-content:flex-end;">
      <button onclick="closeModal()" style="background:#fff; color:var(--ink); border:1.5px solid var(--line); padding:9px 18px; border-radius:12px; font-size:13px; cursor:pointer; font-family:'Karla',sans-serif; font-weight:700;">Skip</button>
      <button id="modalConfirmBtn" style="background:linear-gradient(135deg,var(--teal),#00d9a3); color:#fff; border:none; padding:9px 18px; border-radius:12px; font-size:13px; cursor:pointer; font-weight:800; font-family:'Karla',sans-serif;">Save</button>
    </div>
  </div>
</div>

<div id="summaryArea"></div>

<div class="add-box">
  <select id="newCat" onchange="onCategoryChange()">
    <option value="PERSONAL">PERSONAL</option>
    <option value="OWN">Professional — OWN</option>
    <option value="MHJ">Professional — MHJ</option>
    <option value="SHK">Professional — SHK Husain Arif</option>
    <option value="FEES">Fees (Payable/Received)</option>
    <option value="__NEW__">+ Add new category...</option>
  </select>
  <input type="text" id="newTask" placeholder="Add a new task / client name..." onkeydown="if(event.key==='Enter'){ event.preventDefault(); addTask(); }">
  <input type="date" id="newDueDate" style="flex:1; min-width:130px;" title="Due date (optional)">
  <button onclick="addTask()">Add</button>
</div>
<div class="add-box" id="feeFields" style="display:none;">
  <input type="number" id="feePayable" placeholder="₹ Payable" style="flex:1; min-width:100px;">
  <input type="number" id="feeReceived" placeholder="₹ Received" style="flex:1; min-width:100px;">
  <input type="text" id="feeLinked" placeholder="Linked task/client (optional)" style="flex:2; min-width:150px;">
  <input type="tel" id="feePhone" placeholder="Client phone (optional, for WhatsApp)" style="flex:2; min-width:150px;">
</div>

<div id="app" style="margin-top:20px;">
  <div class="loading">Loading tasks...</div>
</div>

<script>
const STORAGE_KEY = 'tasks-v2';
const WEBHOOK_KEY = 'webhookUrl';
const DEFAULT_WEBHOOK = 'https://script.google.com/macros/s/AKfycbwbXqpF6ok4OLydQae2ORcc_AL9_UM-2km5hQYUMR0y1grw24D42SQB6RGrUnEo68NZCg/exec';
let tasks = [];
let filter = 'all'; // all, own, mhj, pending, done

function getWebhook() {
  return localStorage.getItem(WEBHOOK_KEY) || DEFAULT_WEBHOOK;
}

async function pushToCalendar(name, tag, dueDate) {
  const url = getWebhook();
  if (!url) return null;
  try {
    const paramsObj = { action: 'add', name, tag };
    if (dueDate) paramsObj.dueDate = dueDate;
    const params = new URLSearchParams(paramsObj);
    const res = await fetch(url + '?' + params.toString());
    const data = await res.json();
    return data.id || null;
  } catch (e) { return null; }
}

async function deleteFromCalendar(taskId) {
  const url = getWebhook();
  if (!url || !taskId.startsWith('cal_')) return;
  try {
    const params = new URLSearchParams({ action: 'delete', id: taskId });
    await fetch(url + '?' + params.toString());
  } catch (e) { /* fire and forget */ }
}

async function pullFromCalendar() {
  const url = getWebhook();
  if (!url) return;
  try {
    const res = await fetch(url);
    const events = await res.json();
    const calIds = new Set(events.map(ev => ev.id));
    const existingIds = new Set(tasks.map(t => t.id));
    let added = 0;

    events.forEach(ev => {
      if (existingIds.has(ev.id)) return;
      const tag = ev.tag;
      const type = tag === 'PERSONAL' ? 'personal' : (tag === 'FEES' ? 'fee' : 'professional');
      const cat = (tag === 'PERSONAL') ? null : tag;
      const task = { id: ev.id, name: ev.title, type, cat, due: '', dueDate: ev.dueDate || null, done: ev.done, urgent: false };
      if (tag === 'FEES') {
        task.payable = ev.payable || 0;
        task.received = ev.received || 0;
        task.discount = ev.discount || 0;
        task.linked = ev.linked || '';
        task.phone = ev.phone || '';
      }
      tasks.push(task);
      added++;
    });

    // Remove tasks whose calendar event was deleted directly on Calendar
    // (only affects tasks that originated from / are linked to a real calendar event)
    const beforeCount = tasks.length;
    tasks = tasks.filter(t => !t.id.startsWith('cal_') || calIds.has(t.id));
    const removed = beforeCount - tasks.length;

    if (added > 0 || removed > 0) { saveTasks(); render(); }
    document.getElementById('lastSync').textContent = 'Synced with Calendar ✓ ' + new Date().toLocaleTimeString();
  } catch (e) {
    document.getElementById('lastSync').textContent = 'Calendar sync check failed';
  }
}

const seedTasks = [];

async function loadTasks() {
  let saved = [];
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) saved = JSON.parse(raw);
  } catch (e) {
    saved = [];
  }
  const savedIds = new Set(saved.map(t => t.id));
  const newFromSeed = seedTasks.filter(t => !savedIds.has(t.id));
  tasks = saved.concat(newFromSeed);
  if (newFromSeed.length > 0 || saved.length === 0) saveTasks();
  render();
}

async function saveTasks() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    document.getElementById('lastSync').textContent = 'Saved ' + new Date().toLocaleTimeString();
  } catch (e) {
    document.getElementById('lastSync').textContent = 'Save failed — changes kept only for this page load';
  }
}

function showModal(title, fieldsHtml, onConfirm, confirmLabel, skipLabel) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalFields').innerHTML = fieldsHtml;
  document.getElementById('modalOverlay').style.display = 'flex';
  const btn = document.getElementById('modalConfirmBtn');
  const newBtn = btn.cloneNode(true);
  btn.parentNode.replaceChild(newBtn, btn);
  newBtn.textContent = confirmLabel || 'Save';
  newBtn.style.background = confirmLabel === 'Delete' ? 'var(--coral)' : 'var(--teal)';
  newBtn.onclick = () => { onConfirm(); closeModal(); };
  document.querySelector('#modalOverlay button[onclick="closeModal()"]').textContent = skipLabel || 'Skip';
}

function closeModal() {
  document.getElementById('modalOverlay').style.display = 'none';
}

function inputStyle() {
  return "width:100%; box-sizing:border-box; background:#fff; border:1.5px solid var(--line); color:var(--ink); padding:10px 12px; border-radius:10px; font-size:13px; margin-bottom:10px; font-family:'Karla',sans-serif;";
}

function fireConfetti() {
  if (document.body.style.getPropertyValue('--confetti-disabled') === 'true') return;
  const colors = ['#FF4E6A', '#00BFA6', '#FFB800', '#7C5CFC', '#1F9EFF', '#FF3D9A'];
  for (let i = 0; i < 26; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    const size = 6 + Math.random() * 6;
    piece.style.width = size + 'px';
    piece.style.height = size * 0.4 + 'px';
    piece.style.left = Math.random() * 100 + 'vw';
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    const duration = 1.4 + Math.random() * 1;
    piece.style.animationDuration = duration + 's';
    piece.style.animationDelay = (Math.random() * 0.15) + 's';
    document.body.appendChild(piece);
    setTimeout(() => piece.remove(), (duration + 0.2) * 1000);
  }
}

function toggleTask(id) {
  const t = tasks.find(x => x.id === id);
  if (t) t.done = !t.done;
  saveTasks();
  render();
  if (t && t.done) fireConfetti();
  if (t && t.id.startsWith('cal_')) {
    toggleOnCalendar(t.id, t.done);
  }

  // When marking a professional (non-fee, non-personal) task complete, ask about fees
  if (t && t.done && t.type === 'professional') {
    showModal('Fee for "' + t.name + '"?', `
      <label style="font-size:11px; color:var(--ink-soft);">Payable amount (leave blank to skip)</label>
      <input type="number" id="modalPayable" style="${inputStyle()}" placeholder="₹ Payable">
      <label style="font-size:11px; color:var(--ink-soft);">Received now</label>
      <input type="number" id="modalReceived" style="${inputStyle()}" placeholder="₹ Received" value="0">
      <label style="font-size:11px; color:var(--ink-soft);">Client phone (optional, for WhatsApp reminder)</label>
      <input type="tel" id="modalPhone" style="${inputStyle()}" placeholder="e.g. 9876543210">
    `, () => {
      const payable = parseFloat(document.getElementById('modalPayable').value);
      const received = parseFloat(document.getElementById('modalReceived').value) || 0;
      const phone = document.getElementById('modalPhone').value.trim();
      if (!isNaN(payable) && payable > 0) {
        const localId = 'u'+Date.now();
        const feeTask = { id: localId, name: t.name, type: 'fee', cat: 'FEES', due: '', done: received >= payable, urgent: false, payable, received, linked: t.name, phone };
        tasks.push(feeTask);
        saveTasks();
        render();
        pushFeeToCalendar(t.name, payable, received, t.name, phone).then(calId => {
          if (calId) { feeTask.id = calId; saveTasks(); }
        });
      }
    });
  }
}

async function toggleOnCalendar(taskId, done) {
  const url = getWebhook();
  if (!url) return;
  try {
    const params = new URLSearchParams({ action: 'toggle', id: taskId, done: done ? 'true' : 'false' });
    await fetch(url + '?' + params.toString());
  } catch (e) { /* fire and forget */ }
}

async function sendWhatsAppReminder(taskId, balance) {
  const t = tasks.find(x => x.id === taskId);
  if (!t) return;
  let phone = (t.phone || '').replace(/[^0-9]/g, '');
  if (phone.length === 10) phone = '91' + phone;
  const clientName = t.linked || t.name;

  // Open the window immediately (synchronously, within the click) so browsers don't block it as a popup
  const newWin = window.open('', '_blank');
  if (newWin) newWin.document.write('<body style="font-family:sans-serif; padding:40px; text-align:center; color:#666;">Preparing payment link...</body>');

  let payUrl = null;
  let amountNote = '';
  const url = getWebhook();
  try {
    const params = new URLSearchParams({ action: 'razorpaylink', amount: balance, client: clientName });
    const res = await fetch(url + '?' + params.toString());
    const data = await res.json();
    if (data.status === 'ok' && data.shortUrl) {
      payUrl = data.shortUrl; // real link already has the exact amount, no need to ask them to type it
    }
  } catch (e) { /* try the fallback path below */ }

  if (!payUrl) {
    amountNote = ` (please enter ₹${balance} on the page)`;
    try {
      const res2 = await fetch(url + '?action=fallbacklink');
      const data2 = await res2.json();
      if (data2.status === 'ok' && data2.shortUrl) payUrl = data2.shortUrl;
    } catch (e) { /* absolute last resort below */ }
  }

  if (!payUrl) {
    payUrl = 'https://mustansirrmalikworkdashboard.netlify.app/go.html?u=' + encodeURIComponent('https://razorpay.me/@mustansirmalik'); // still masked, just not shortened
  }

  const message = `🧾 *Fee Reminder*\n\nDear Sir/Madam,\n\nA gentle reminder that your fee for *"${clientName}"* is currently pending.\n\n💰 *Amount Due:* ₹${balance}\n\n👉 *Pay securely here${amountNote}:*\n${payUrl}\n\nThank you for your continued trust — do reach out if you have any questions.\n\nWarm regards,\n*Mustansirr Malik*\n_Tax & Accounts Consultant, Indore_`;
  // api.whatsapp.com (canonical) instead of the wa.me shortener - wa.me has a stronger OS-level
  // preference toward the standard WhatsApp package and doesn't always fall back to Business cleanly
  // even when only Business is installed.
  const waUrl = 'https://api.whatsapp.com/send?phone=' + phone + '&text=' + encodeURIComponent(message);
  // Explicitly target WhatsApp Business's exact app package, bypassing Android's generic link
  // resolution (which seems to have a stale preference toward regular WhatsApp on this device)
  const waBusinessIntent = 'intent://send?phone=' + phone + '&text=' + encodeURIComponent(message) +
    '#Intent;scheme=https;package=com.whatsapp.w4b;S.browser_fallback_url=' + encodeURIComponent(waUrl) + ';end';

  if (newWin) {
    newWin.document.write(`
      <body style="font-family:sans-serif; padding:30px; text-align:center; color:#333;">
        <p><a href="${waBusinessIntent}" style="display:inline-block; background:#25D366; color:#fff; padding:14px 28px; border-radius:10px; text-decoration:none; font-size:16px; font-weight:bold;">Open in WhatsApp Business</a></p>
        <p style="font-size:12px; color:#aaa; margin:8px 0;">— or —</p>
        <p><a href="${waUrl}" style="display:inline-block; background:#3C5470; color:#fff; padding:10px 22px; border-radius:8px; text-decoration:none; font-size:14px;">Open in WhatsApp (regular)</a></p>
        <p style="font-size:13px; color:#888; margin-top:20px;">If that doesn't open your WhatsApp app (regular or Business), copy the message below and paste it manually:</p>
        <textarea readonly style="width:90%; max-width:400px; height:140px; font-size:13px; padding:10px; border-radius:8px; border:1px solid #ccc;">${message}</textarea><br>
        <button onclick="navigator.clipboard.writeText(document.querySelector('textarea').value); this.textContent='Copied!';" style="margin-top:10px; background:#3C5470; color:#fff; border:none; padding:10px 20px; border-radius:8px; cursor:pointer; font-size:14px;">Copy message</button>
        <p style="font-size:12px; color:#888; margin-top:10px;">Client's number: ${phone}</p>
      </body>
    `);
  }
  if (!newWin) window.open(waUrl, '_blank');
}

function toggleFeeFields() {
  const isFee = document.getElementById('newCat').value === 'FEES';
  document.getElementById('feeFields').style.display = isFee ? 'flex' : 'none';
}

function onCategoryChange() {
  const select = document.getElementById('newCat');
  if (select.value === '__NEW__') {
    showModal('Add a new category', `
      <label style="font-size:11px; color:var(--ink-soft);">Category name (e.g. a new employer or client group)</label>
      <input type="text" id="modalNewCatName" style="${inputStyle()}" placeholder="e.g. ABC Company">
    `, () => {
      const raw = document.getElementById('modalNewCatName').value.trim();
      if (!raw) { select.value = 'PERSONAL'; return; }
      const tag = raw.toUpperCase().replace(/[^A-Z0-9]+/g, '_').replace(/^_+|_+$/g, '');
      if (!tag) { select.value = 'PERSONAL'; return; }
      // avoid duplicating an existing option
      let exists = false;
      for (const opt of select.options) { if (opt.value === tag) { exists = true; break; } }
      if (!exists) {
        const newOption = document.createElement('option');
        newOption.value = tag;
        newOption.textContent = 'Professional — ' + raw;
        select.insertBefore(newOption, select.querySelector('option[value="__NEW__"]'));
      }
      select.value = tag;
      toggleFeeFields();
    }, 'Create', 'Cancel');
    select.value = 'PERSONAL'; // revert selection until they confirm in the modal
  } else {
    toggleFeeFields();
  }
}

function addTask() {
  const input = document.getElementById('newTask');
  const catVal = document.getElementById('newCat').value;
  const name = input.value.trim();
  if (!name) return;

  if (catVal === 'FEES') {
    const payable = parseFloat(document.getElementById('feePayable').value) || 0;
    const received = parseFloat(document.getElementById('feeReceived').value) || 0;
    const linked = document.getElementById('feeLinked').value.trim();
    const phone = document.getElementById('feePhone').value.trim();
    const localId = 'u'+Date.now();
    const task = { id: localId, name, type: 'fee', cat: 'FEES', due: '', done: received >= payable && payable > 0, urgent: false, payable, received, linked, phone };
    tasks.push(task);
    input.value = '';
    document.getElementById('feePayable').value = '';
    document.getElementById('feeReceived').value = '';
    document.getElementById('feeLinked').value = '';
    document.getElementById('feePhone').value = '';
    saveTasks();
    render();
    pushFeeToCalendar(name, payable, received, linked, phone).then(calId => {
      if (calId) { task.id = calId; saveTasks(); }
    });
    return;
  }

  const type = catVal === 'PERSONAL' ? 'personal' : 'professional';
  const cat = catVal === 'PERSONAL' ? null : catVal;
  const localId = 'u'+Date.now();
  const dueDateInput = document.getElementById('newDueDate');
  const dueDateVal = dueDateInput.value;
  const task = {id:localId, name, type, cat, due:'', dueDate: dueDateVal ? new Date(dueDateVal + 'T09:00:00').toISOString() : null, done:false, urgent:false};
  tasks.push(task);
  input.value = '';
  dueDateInput.value = '';
  saveTasks();
  render();
  pushToCalendar(name, catVal, dueDateVal).then(calId => {
    if (calId) {
      task.id = calId; // replace temp id with real calendar id for future delete/toggle
      saveTasks();
      if (task.done) {
        // task was marked done while the calendar event was still being created — sync it now
        toggleOnCalendar(task.id, task.done);
      }
    }
  });
}

async function pushFeeToCalendar(name, payable, received, linked, phone) {
  const url = getWebhook();
  if (!url) return null;
  try {
    const params = new URLSearchParams({ action: 'addfee', name, payable, received, linked, phone: phone || '' });
    const res = await fetch(url + '?' + params.toString());
    const data = await res.json();
    return data.id || null;
  } catch (e) { return null; }
}

function setDueDate(id) {
  const t = tasks.find(x => x.id === id);
  if (!t) return;
  const currentVal = t.dueDate ? new Date(t.dueDate).toISOString().slice(0, 10) : '';
  showModal('Due date — ' + t.name, `
    <label style="font-size:11px; color:var(--ink-soft);">Pick a due date</label>
    <input type="date" id="modalDueDate" style="${inputStyle()}" value="${currentVal}">
  `, async () => {
    const val = document.getElementById('modalDueDate').value;
    if (!val) return;
    t.dueDate = new Date(val + 'T09:00:00').toISOString();
    saveTasks();
    render();
    if (t.id.startsWith('cal_')) {
      const url = getWebhook();
      const params = new URLSearchParams({ action: 'setduedate', id: t.id, dueDate: val });
      try { await fetch(url + '?' + params.toString()); } catch (e) { /* fire and forget */ }
    }
  });
}

function recordPayment(id) {
  const t = tasks.find(x => x.id === id);
  if (!t) return;
  showModal('Record payment — ' + t.name, `
    <div style="font-size:11px; color:var(--ink-soft); margin-bottom:8px;">Currently ₹${t.received} of ₹${t.payable} received</div>
    <label style="font-size:11px; color:var(--ink-soft);">Total amount received so far</label>
    <input type="number" id="modalReceivedAmt" style="${inputStyle()}" value="${t.received}">
    <label style="font-size:11px; color:var(--ink-soft);">Discount to write off (optional)</label>
    <input type="number" id="modalDiscountAmt" style="${inputStyle()}" placeholder="₹ Discount" value="${t.discount || 0}">
  `, () => {
    const amount = parseFloat(document.getElementById('modalReceivedAmt').value);
    const discount = parseFloat(document.getElementById('modalDiscountAmt').value) || 0;
    if (isNaN(amount)) return;
    t.received = amount;
    t.discount = discount;
    t.done = (amount + discount) >= t.payable && t.payable > 0;
    saveTasks();
    render();
    if (t.id.startsWith('cal_')) {
      updateFeeOnCalendar(t.id, amount, discount);
    }
  });
}

async function updateFeeOnCalendar(taskId, received, discount) {
  const url = getWebhook();
  if (!url) return;
  try {
    const params = new URLSearchParams({ action: 'updatefee', id: taskId, received, discount: discount || 0 });
    await fetch(url + '?' + params.toString());
  } catch (e) { /* fire and forget */ }
}

function deleteTask(id) {
  const t = tasks.find(x => x.id === id);
  showModal('Remove "' + (t ? t.name : 'this task') + '"?', `
    <div style="font-size:12.5px; color:var(--ink-soft);">This will also remove it from your Calendar.</div>
  `, () => {
    tasks = tasks.filter(x => x.id !== id);
    saveTasks();
    render();
    deleteFromCalendar(id);
  }, 'Delete', 'Cancel');
}

function resetData() {
  showModal('Reset dashboard data?', `
    <div style="font-size:12.5px; color:var(--ink-soft);">This clears saved progress on THIS device and reloads the latest task list fresh from Calendar.</div>
  `, () => {
    localStorage.removeItem(STORAGE_KEY);
    window.location.href = window.location.pathname + '?t=' + Date.now();
  }, 'Reset', 'Cancel');
}

function setFilter(f) {
  filter = f;
  render();
}

function render() {
  const summaryEl = document.getElementById('summaryArea');
  const app = document.getElementById('app');
  const done = tasks.filter(t => t.done).length;
  const pending = tasks.filter(t => !t.done).length;
  const nowTs = Date.now();
  const isOverdue = t => !t.done && t.dueDate && new Date(t.dueDate).getTime() < nowTs;
  const overdue = tasks.filter(isOverdue).length;
  const total = tasks.length;
  const pct = total ? Math.round((done/total)*100) : 0;

  const feeTasks = tasks.filter(t => t.type === 'fee');
  const totalPayable = feeTasks.reduce((s, t) => s + (t.payable || 0), 0);
  const totalReceived = feeTasks.reduce((s, t) => s + (t.received || 0), 0);
  const totalDiscount = feeTasks.reduce((s, t) => s + (t.discount || 0), 0);
  const totalOutstanding = totalPayable - totalReceived - totalDiscount;

  const knownCats = new Set(['MHJ', 'SHK', 'OWN', 'FEES']);
  const extraCats = [...new Set(tasks.filter(t => t.type === 'professional' && !knownCats.has(t.cat)).map(t => t.cat))];

  let filtered = tasks;
  if (filter === 'personal') filtered = tasks.filter(t => t.type === 'personal');
  else if (filter === 'professional') filtered = tasks.filter(t => t.type === 'professional');
  else if (filter === 'own') filtered = tasks.filter(t => t.cat === 'OWN');
  else if (filter === 'mhj') filtered = tasks.filter(t => t.cat === 'MHJ');
  else if (filter === 'shk') filtered = tasks.filter(t => t.cat === 'SHK');
  else if (filter === 'fees') filtered = tasks.filter(t => t.cat === 'FEES');
  else if (filter === 'pending') filtered = tasks.filter(t => !t.done);
  else if (filter === 'done') filtered = tasks.filter(t => t.done);
  else if (extraCats.includes(filter)) filtered = tasks.filter(t => t.cat === filter);

  filtered = [...filtered].sort((a, b) => {
    if (a.done !== b.done) return a.done ? 1 : -1;
    if (!a.done && !b.done) {
      if (a.urgent !== b.urgent) return a.urgent ? -1 : 1;
      // Timeline order: tasks with a real due date come first (earliest/most overdue
      // first), tasks with no due date follow, keeping their existing relative order.
      const aHas = !!a.dueDate, bHas = !!b.dueDate;
      if (aHas !== bHas) return aHas ? -1 : 1;
      if (aHas && bHas) return new Date(a.dueDate) - new Date(b.dueDate);
    }
    return 0;
  });

  let summaryHtml = `
    <div class="hero-stats">
      <div class="hero-card pct"><div class="n">${pct}%</div><div class="l">Complete</div></div>
      <div class="hero-card done-c"><div class="n">${done}</div><div class="l">Done</div></div>
      <div class="hero-card pending-c"><div class="n">${pending}</div><div class="l">Pending</div></div>
      <div class="hero-card overdue-c"><div class="n">${overdue}</div><div class="l">Overdue</div></div>
    </div>
    ${feeTasks.length > 0 ? `
    <div style="display:flex; gap:18px; margin-bottom:20px; padding:14px 16px; background:#fff; border:1.5px solid var(--line); border-radius:16px; flex-wrap:wrap; font-size:12px;">
      <div><span style="color:var(--ink-soft); font-weight:700; font-size:10.5px; text-transform:uppercase;">Receivable</span><br><strong style="font-family:'Baloo 2',sans-serif; font-size:17px;">₹${totalPayable}</strong></div>
      <div><span style="color:var(--ink-soft); font-weight:700; font-size:10.5px; text-transform:uppercase;">Received</span><br><strong style="font-family:'Baloo 2',sans-serif; font-size:17px; color:var(--teal);">₹${totalReceived}</strong></div>
      ${totalDiscount > 0 ? `<div><span style="color:var(--ink-soft); font-weight:700; font-size:10.5px; text-transform:uppercase;">Discounts</span><br><strong style="font-family:'Baloo 2',sans-serif; font-size:17px;">₹${totalDiscount}</strong></div>` : ''}
      <div><span style="color:var(--ink-soft); font-weight:700; font-size:10.5px; text-transform:uppercase;">Outstanding</span><br><strong style="font-family:'Baloo 2',sans-serif; font-size:17px; color:var(--coral);">₹${totalOutstanding}</strong></div>
    </div>` : ''}
    <div class="filters">
      <button class="filter-btn ${filter==='all'?'active':''}" onclick="setFilter('all')">All</button>
      <button class="filter-btn ${filter==='personal'?'active':''}" onclick="setFilter('personal')">Personal</button>
      <button class="filter-btn ${filter==='professional'?'active':''}" onclick="setFilter('professional')">Professional</button>
      <button class="filter-btn ${filter==='pending'?'active':''}" onclick="setFilter('pending')">Pending</button>
      <button class="filter-btn ${filter==='done'?'active':''}" onclick="setFilter('done')">Done</button>
    </div>
    <div class="filters">
      <button class="filter-btn ${filter==='own'?'active':''}" onclick="setFilter('own')">OWN</button>
      <button class="filter-btn ${filter==='mhj'?'active':''}" onclick="setFilter('mhj')">MHJ</button>
      <button class="filter-btn ${filter==='shk'?'active':''}" onclick="setFilter('shk')">SHK Husain Arif</button>
      <button class="filter-btn ${filter==='fees'?'active':''}" onclick="setFilter('fees')">Fees</button>
      ${extraCats.map(cat => `<button class="filter-btn ${filter===cat?'active':''}" onclick="setFilter('${cat}')">${cat.replace(/_/g, ' ')}</button>`).join('')}
    </div>
  `;

  let html = '';
  if (filtered.length === 0) {
    html += '<div class="empty">No tasks here 🎉</div>';
  } else {
    const groupDefs = [
      { key: 'MHJ', label: 'Professional — MHJ', color: 'var(--sky)', match: t => t.cat === 'MHJ' },
    ];
    // Any category beyond the fixed set (e.g. a newly created employer/client group)
    // gets its own section here, right after MHJ, so nothing ever becomes invisible.
    const extraColors = ['#7C5CFC', '#00BFA6', '#FFB800', '#FF3D9A', '#FF4E6A'];
    extraCats.forEach((cat, i) => {
      groupDefs.push({ key: cat, label: 'Professional — ' + cat.replace(/_/g, ' '), color: extraColors[i % extraColors.length], match: t => t.cat === cat });
    });
    groupDefs.push(
      { key: 'SHK', label: 'Professional — SHK Husain Arif', color: 'var(--violet)', match: t => t.cat === 'SHK' },
      { key: 'OWN', label: 'Professional — OWN', color: 'var(--teal)', match: t => t.cat === 'OWN' },
      { key: 'personal', label: 'Personal', color: 'var(--pink)', match: t => t.type === 'personal' },
      { key: 'FEES', label: 'Fees', color: 'var(--coral)', match: t => t.type === 'fee' }
    );

    groupDefs.forEach(g => {
      const groupTasks = filtered.filter(g.match);
      if (groupTasks.length === 0) return;
      html += `<div class="cat-section">
        <div class="cat-heading"><span class="dot" style="background:${g.color}"></span>${g.label} <span class="count">${groupTasks.length}</span></div>
        <div class="task-grid">`;
      groupTasks.forEach(t => {
        const tagClass = t.type === 'personal' ? 'personal' : (t.type === 'fee' ? 'fees' : (t.cat === 'OWN' ? 'own' : (t.cat === 'MHJ' ? 'mhj' : (t.cat === 'SHK' ? 'shk' : 'generic-cat'))));
        const tagLabel = t.type === 'personal' ? 'PERSONAL' : t.cat;
        const isFee = t.type === 'fee';
        const balance = isFee ? (t.payable - t.received - (t.discount || 0)) : 0;
        const taskOverdue = isOverdue(t);
        const dueDateLabel = t.dueDate ? new Date(t.dueDate).toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }) : '';
        html += `
          <div class="task ${t.done?'done':''}" style="--catcolor:${g.color};${!t.done ? `border-left:4px solid ${taskOverdue ? 'var(--coral)' : (g.color.startsWith('var')?g.color:g.color)};` : ''}">
            ${isFee ? '' : `<input type="checkbox" ${t.done?'checked':''} onchange="toggleTask('${t.id}')">`}
            <div class="task-body">
              <div class="task-name">${t.name}</div>
              ${isFee ? `<div style="font-size:11px; margin-top:3px; color:var(--ink-soft); font-weight:600;">₹${t.received} of ₹${t.payable} received${t.discount ? ' + ₹' + t.discount + ' discount' : ''}${balance > 0 ? ' — ₹' + balance + ' due' : ' — fully settled'}${t.linked ? ' · linked: ' + t.linked : ''}</div>` : ''}
              ${isFee && balance > 0 && t.phone ? `<span onclick="sendWhatsAppReminder('${t.id}', ${balance})" style="display:inline-block; margin-top:5px; font-size:11px; color:#25D366; text-decoration:none; font-weight:700; cursor:pointer;">📱 Send WhatsApp reminder</span>` : ''}
              <div class="task-meta">
                <span class="tag ${tagClass}">${tagLabel}</span>
                ${taskOverdue ? '<span class="tag urgent-tag">OVERDUE</span>' : (t.urgent && !t.done ? '<span class="tag urgent-tag">URGENT</span>' : '')}
                ${dueDateLabel && !t.done ? `<span class="due" style="${taskOverdue ? 'color:var(--coral);' : ''}">Due ${dueDateLabel}</span>` : ''}
                ${!t.done ? `<span onclick="setDueDate('${t.id}')" style="cursor:pointer; color:var(--violet); font-size:11px; font-weight:700; text-decoration:underline;">${t.dueDate ? 'Change' : 'Set'} due date</span>` : ''}
                ${isFee ? `<span onclick="recordPayment('${t.id}')" style="cursor:pointer; color:var(--sky); font-size:11px; font-weight:700; text-decoration:underline;">Record payment</span>` : ''}
                <span onclick="deleteTask('${t.id}')" style="cursor:pointer; color:var(--ink-soft); font-size:14px; margin-left:auto;" title="Remove task">✕</span>
              </div>
            </div>
          </div>
        `;
      });
      html += `</div></div>`;
    });
  }

  summaryEl.innerHTML = summaryHtml;
  app.innerHTML = html;
}

// Festival theming: overrides the base color palette for a few days around
// major festivals. Muharram/Ashura is treated as a mourning period, not a
// celebration, so it gets a deliberately muted, sombre palette instead of
// bright festive colors. Dates are for 2026 (confirmed from multiple sources
// where possible); Islamic dates shift ~11 days earlier each year and will
// need updating for 2027 onward.
const FESTIVAL_THEMES = [
  { name: 'Republic Day', start: '2026-01-25', end: '2026-01-26', vars: { coral:'#FF9933', teal:'#138808', violet:'#0B3D91', sky:'#138808', pink:'#FF9933', bg:'#FFF8ED' } },
  { name: 'Holi', start: '2026-03-03', end: '2026-03-05', vars: { coral:'#FF3D71', teal:'#00C2A8', violet:'#9B4DFF', sky:'#1FC4FF', pink:'#FF61D2', yellow:'#FFD400', bg:'#FFF9F0' } },
  { name: 'Eid al-Fitr', start: '2026-03-19', end: '2026-03-22', vars: { coral:'#0F9D6F', teal:'#0F9D6F', violet:'#0B6E4F', sky:'#0F9D6F', pink:'#C9A227', yellow:'#C9A227', bg:'#F5FBF7' } },
  { name: 'Eid al-Adha', start: '2026-05-26', end: '2026-05-29', vars: { coral:'#0F9D6F', teal:'#0F9D6F', violet:'#0B6E4F', sky:'#0F9D6F', pink:'#C9A227', yellow:'#C9A227', bg:'#F5FBF7' } },
  { name: 'Muharram (Ashara Mubaraka)', start: '2026-06-16', end: '2026-06-26', mourning: true, vars: { coral:'#3A3A3E', teal:'#4A4A4E', violet:'#2B2B2F', sky:'#5A5A5E', pink:'#3A3A3E', yellow:'#6A6A6E', bg:'#F2F1EF', ink:'#1C1C1E' } },
  { name: 'Independence Day', start: '2026-08-14', end: '2026-08-16', vars: { coral:'#FF9933', teal:'#138808', violet:'#0B3D91', sky:'#138808', pink:'#FF9933', bg:'#FFF8ED' } },
  { name: 'Mawlid al-Nabi', start: '2026-08-24', end: '2026-08-26', vars: { coral:'#0F9D6F', teal:'#0F9D6F', violet:'#0B6E4F', sky:'#0F9D6F', pink:'#C9A227', yellow:'#C9A227', bg:'#F5FBF7' } },
  { name: 'Ganesh Chaturthi', start: '2026-09-13', end: '2026-09-15', vars: { coral:'#E8542A', teal:'#C9A227', violet:'#8B2E2E', sky:'#E8542A', pink:'#C9A227', yellow:'#F2B705', bg:'#FFF6EC' } },
  { name: 'Dussehra', start: '2026-10-19', end: '2026-10-21', vars: { coral:'#E8542A', teal:'#0F9D6F', violet:'#8B2E2E', sky:'#1F9EFF', pink:'#FF3D9A', yellow:'#F2B705', bg:'#FFF8ED' } },
  { name: 'Diwali', start: '2026-11-06', end: '2026-11-10', vars: { coral:'#B8860B', teal:'#8B2E2E', violet:'#6B2020', sky:'#D4AF37', pink:'#B8860B', yellow:'#D4AF37', bg:'#FFF7E0' } },
  { name: 'Christmas', start: '2026-12-24', end: '2026-12-26', vars: { coral:'#C41E3A', teal:'#0F7A3D', violet:'#0F7A3D', sky:'#C41E3A', pink:'#C41E3A', yellow:'#D4AF37', bg:'#F7FAF7' } },
];

function applyFestivalTheme() {
  const today = new Date();
  const todayStr = today.getFullYear() + '-' + String(today.getMonth()+1).padStart(2,'0') + '-' + String(today.getDate()).padStart(2,'0');
  const active = FESTIVAL_THEMES.find(f => todayStr >= f.start && todayStr <= f.end);
  if (!active) return;
  const root = document.documentElement.style;
  Object.entries(active.vars).forEach(([key, val]) => root.setProperty('--' + key, val));
  if (active.mourning) {
    document.body.style.setProperty('--confetti-disabled', 'true');
  }
  const banner = document.createElement('div');
  banner.textContent = active.mourning ? '· ' + active.name + ' ·' : '✨ ' + active.name + ' ✨';
  banner.style.cssText = 'text-align:center; font-family:"Baloo 2",sans-serif; font-weight:700; font-size:12px; letter-spacing:0.04em; padding:6px; margin-bottom:12px; border-radius:10px; background:rgba(0,0,0,0.06); color:var(--ink);';
  document.body.insertBefore(banner, document.body.firstChild);
}
applyFestivalTheme();

    document.getElementById('authError').style.display = 'block';
