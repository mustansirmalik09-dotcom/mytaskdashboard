<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Task Dashboard &amp; Financial Suite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,500;0,600;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<meta name="theme-color" content="#1E3A8A">
<style>
  :root {
    --bg: #F4F7FE;
    --sheet: #FFFFFF;
    --sheet-alt: #F1F5F9;
    --ink: #0F172A;
    --muted: #64748B;
    --muted-light: #94A3B8;
    --icon: #64748B;
    --field: #CBD5E1;
    --rule: #E2E8F0;
    --rule-soft: #F1F5F9;

    --accent: #2563EB;
    --accent-hover: #1D4ED8;
    --accent-soft: #EFF6FF;
    --accent-border: #BFDBFE;

    --red: #E11D48;
    --red-soft: #FFF1F2;
    --red-border: #FECDD3;

    --green: #059669;
    --green-soft: #ECFDF5;
    --green-border: #A7F3D0;

    --amber: #D97706;
    --amber-soft: #FFFBEB;
    --amber-border: #FDE68A;

    --violet: #7C3AED;
    --violet-soft: #F5F3FF;

    --c-mhj: #2563EB;
    --c-shk: #7C3AED;
    --c-own: #0D9488;
    --c-personal: #DB2777;
    --c-fees: #F59E0B;

    --serif: 'Newsreader', Georgia, serif;
    --sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    --mono: 'IBM Plex Mono', monospace;
    --shadow-sm: 0 2px 6px rgba(15, 23, 42, 0.05);
    --shadow-md: 0 8px 20px -4px rgba(37, 99, 235, 0.12);
  }

  * { box-sizing: border-box; }
  html, body {
    background: linear-gradient(180deg, #EEF2FF 0%, #F8FAFC 35%, #F0FDF4 100%);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 13.5px;
    line-height: 1.45;
    margin: 0 auto;
    max-width: 1120px;
    padding: 12px 12px 64px;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  button, input, select { font-family: var(--sans); }
  .ic { width: 15px; height: 15px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* Vibrant Corporate Masthead */
  .masthead {
    display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center;
    gap: 8px 14px; margin-bottom: 10px; padding: 11px 16px;
    background: linear-gradient(120deg, #1E3A8A 0%, #3B82F6 55%, #7C3AED 100%);
    color: #FFFFFF; border-radius: 14px; box-shadow: var(--shadow-md);
  }
  .masthead-brand { display: flex; align-items: center; gap: 10px; }
  .masthead-crest {
    width: 36px; height: 36px; border-radius: 10px;
    background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(6px);
    color: #FFFFFF; display: grid; place-content: center;
    font-family: var(--serif); font-weight: 700; font-size: 16px;
    border: 1px solid rgba(255, 255, 255, 0.35);
  }
  .masthead h1 { font-family: var(--serif); font-weight: 600; font-size: 20px; line-height: 1.1; margin: 0; color: #FFFFFF; }
  .masthead .sub { color: #DBEAFE; font-size: 11.5px; font-weight: 500; margin-top: 1px; }
  .masthead .status { display: flex; align-items: center; gap: 8px; }
  .sync-badge {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(255, 255, 255, 0.16); border: 1px solid rgba(255, 255, 255, 0.28);
    border-radius: 999px; padding: 3px 10px; font-size: 11px; font-weight: 600; color: #FFFFFF;
  }
  .pulse-dot { width: 7px; height: 7px; border-radius: 50%; background: #34D399; box-shadow: 0 0 0 2px rgba(52, 211, 153, 0.35); }
  #resetBtn {
    background: rgba(255, 255, 255, 0.14); border: 1px solid rgba(255, 255, 255, 0.3);
    border-radius: 8px; padding: 4px 10px; font: 600 11px var(--sans); color: #FFFFFF; cursor: pointer;
  }
  #resetBtn:hover { background: rgba(255, 255, 255, 0.26); }

  /* Top Page Navigation Tabs */
  .page-nav {
    display: flex; gap: 6px; margin-bottom: 10px; padding: 4px;
    background: #FFFFFF; border: 1px solid var(--rule); border-radius: 12px;
    box-shadow: var(--shadow-sm);
  }
  .page-nav-btn {
    flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 7px 10px; border-radius: 9px; border: 0; background: transparent;
    color: var(--muted); font: 700 12.5px var(--sans); cursor: pointer; transition: all 0.15s ease;
  }
  .page-nav-btn.active {
    background: linear-gradient(120deg, #2563EB 0%, #7C3AED 100%);
    color: #FFFFFF; box-shadow: 0 2px 8px rgba(37, 99, 235, 0.25);
  }
  .nav-badge {
    background: #DBEAFE; color: #1E3A8A; padding: 1px 6px; border-radius: 999px; font-size: 10.5px; font-weight: 700;
  }
  .page-nav-btn.active .nav-badge { background: rgba(255, 255, 255, 0.22); color: #FFFFFF; }

  /* Compact Summary Sheet */
  .summary-sheet {
    background: var(--sheet); border: 1px solid var(--rule); border-radius: 12px;
    margin-bottom: 10px; overflow: hidden; box-shadow: var(--shadow-sm);
  }
  .hero-stats { display: grid; grid-template-columns: repeat(4, 1fr); }
  .hero-card { padding: 8px 12px; text-align: center; }
  .hero-card + .hero-card { border-left: 1px solid var(--rule-soft); }
  .hero-card .n { font-family: var(--serif); font-weight: 700; font-size: 20px; line-height: 1.1; color: var(--ink); }
  .hero-card .l { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin-top: 2px; }
  .totals {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;
    border-top: 1px solid var(--rule-soft); padding: 7px 12px; background: #F8FAFC;
  }
  .totals .tot { text-align: center; }
  .totals .l { font-size: 10px; font-weight: 700; text-transform: uppercase; color: var(--muted); }
  .totals .fig { font-family: var(--serif); font-weight: 700; font-size: 15px; color: var(--ink); }
  .totals .fig.out { color: var(--red); }

  /* Filters & Chips */
  .filters { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; align-items: center; }
  .filters.seg {
    flex-wrap: nowrap; padding: 3px; background: #FFFFFF; border: 1px solid var(--rule);
    border-radius: 10px; overflow-x: auto; scrollbar-width: none;
  }
  .filters.seg::-webkit-scrollbar { display: none; }
  .filter-btn { cursor: pointer; font: 600 12px var(--sans); transition: all 0.14s ease; }
  .filters.seg .filter-btn {
    flex: 1 1 auto; border: 0; background: transparent; color: var(--muted);
    padding: 5px 10px; border-radius: 7px; white-space: nowrap;
  }
  .filters.seg .filter-btn.active {
    background: linear-gradient(120deg, #2563EB 0%, #4F46E5 100%);
    color: #FFFFFF; box-shadow: 0 2px 6px rgba(37, 99, 235, 0.22);
  }
  .filters.chips .filter-btn {
    display: inline-flex; align-items: center; background: #FFFFFF; border: 1px solid var(--rule);
    color: var(--ink); padding: 4px 10px; border-radius: 999px; font-size: 11.5px;
  }
  .filters.chips .filter-btn.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 700; }
  .filter-btn .dot { width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; }

  /* Search & Quick Add Bar */
  #searchRow { margin-bottom: 8px; }
  #searchWrap { position: relative; }
  #searchWrap .ico { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--icon); pointer-events: none; }
  #searchBox {
    width: 100%; height: 36px; background: #FFFFFF; border: 1px solid var(--field); color: var(--ink);
    padding: 0 34px; border-radius: 10px; font-size: 13px;
  }
  #searchClear {
    display: none; position: absolute; right: 4px; top: 4px; width: 28px; height: 28px;
    border: 0; background: transparent; color: var(--muted); cursor: pointer;
  }
  .add-box { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .add-box input, .add-box select {
    height: 36px; background: #FFFFFF; border: 1px solid var(--field); color: var(--ink);
    padding: 0 10px; border-radius: 9px; font-size: 13px; min-width: 0;
  }
  #newCat { flex: 1 1 145px; font-weight: 600; }
  #newTask { flex: 2 1 190px; }
  .add-box button {
    height: 36px; padding: 0 16px;
    background: linear-gradient(120deg, #2563EB 0%, #7C3AED 100%);
    color: #FFFFFF; border: 0; border-radius: 9px; font: 700 13px var(--sans); cursor: pointer;
  }

  /* Task Category Sections & Cards */
  .cat-section { margin-bottom: 14px; }
  .cat-heading {
    display: flex; align-items: center; gap: 8px; padding: 7px 12px;
    background: #FFFFFF; border: 1px solid var(--rule); border-radius: 10px;
    margin-bottom: 8px; cursor: pointer; user-select: none; box-shadow: var(--shadow-sm);
  }
  .cat-section.collapsed .cat-heading { margin-bottom: 0; }
  .cat-section.collapsed .chev { transform: rotate(-90deg); }
  .cat-heading .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .cat-heading .title { font-family: var(--serif); font-weight: 700; font-size: 15.5px; color: var(--ink); }
  .cat-heading .count {
    margin-left: auto; padding: 2px 8px; background: #F1F5F9; border-radius: 999px;
    font-size: 11px; font-weight: 600; color: var(--muted);
  }
  .task-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 8px; }
  .task {
    display: flex; align-items: flex-start; gap: 8px; padding: 9px 11px;
    background: #FFFFFF; border: 1px solid var(--rule); border-radius: 10px;
    box-shadow: var(--shadow-sm);
  }
  .task.done-task {
    background: #F8FAFC; border-style: dashed; opacity: 0.84;
  }
  .task.done-task .task-name {
    text-decoration: line-through; color: var(--muted);
  }
  .task .num { font-size: 11px; color: var(--muted-light); font-weight: 600; padding-top: 2px; }
  .task input[type=checkbox] { width: 17px; height: 17px; margin-top: 2px; accent-color: #2563EB; cursor: pointer; }
  .task-body { flex: 1; min-width: 0; }
  .task-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 6px; }
  .task-name { font-size: 13.5px; font-weight: 600; color: var(--ink); overflow-wrap: anywhere; }
  .amt { font-family: var(--serif); font-weight: 700; font-size: 15px; white-space: nowrap; }
  .amt.owed { color: var(--red); }
  .amt.clear { font-size: 11px; font-family: var(--sans); color: var(--green); background: var(--green-soft); padding: 1px 6px; border-radius: 5px; }
  .task-sub { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  .note {
    display: inline-flex; align-items: flex-start; gap: 5px; margin-top: 4px; padding: 3px 8px;
    border-radius: 6px; background: var(--amber-soft); border: 1px solid var(--amber-border);
    color: #92400E; font-size: 11px; font-weight: 500;
  }
  .task-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 5px; }
  .act {
    display: inline-flex; align-items: center; gap: 4px; background: none; border: 0; padding: 0;
    font: 600 11.5px var(--sans); color: var(--accent); cursor: pointer;
  }
  .act:hover { text-decoration: underline; }
  .act.wa { color: var(--green); }
  .act.pay {
    padding: 2px 8px; border: 1px solid var(--accent-border); border-radius: 6px;
    background: var(--accent-soft); color: var(--accent);
  }
  .act.del { color: var(--muted-light); padding: 2px; }
  .act.del:hover { color: var(--red); }
  .done-toggle {
    grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between;
    padding: 7px 12px; background: #F8FAFC; border: 1px dashed var(--field);
    border-radius: 8px; color: var(--muted); font: 600 11.5px var(--sans); cursor: pointer; text-align: left;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  .done-toggle:hover {
    background: var(--accent-soft); color: var(--accent); border-color: var(--accent-border);
  }

  /* Financials & Statements */
  #financialsView, #invoicesView { display: none; }
  .fin-mode-toggle {
    display: inline-flex; gap: 3px; padding: 3px; background: #FFFFFF; border: 1px solid var(--rule);
    border-radius: 10px; overflow-x: auto; max-width: 100%;
  }
  .fin-mode-btn {
    border: 0; background: transparent; padding: 5px 10px; border-radius: 7px;
    font: 700 11.5px var(--sans); color: var(--muted); cursor: pointer; white-space: nowrap;
  }
  .fin-mode-btn.active { background: linear-gradient(120deg, #2563EB 0%, #7C3AED 100%); color: #FFFFFF; }
  .fin-hero-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 8px; margin-bottom: 12px;
  }
  .fin-card {
    background: #FFFFFF; border: 1px solid var(--rule); border-radius: 11px; padding: 10px 12px; box-shadow: var(--shadow-sm);
  }
  .fin-card .f-lbl { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
  .fin-card .f-val { font-family: var(--serif); font-size: 20px; font-weight: 700; margin: 2px 0; }
  .fin-card .f-sub { font-size: 11px; color: var(--muted); }

  .statement-sheet {
    background: #FFFFFF; border: 1px solid var(--rule); border-radius: 12px;
    box-shadow: var(--shadow-sm); margin-bottom: 10px; overflow: hidden;
  }
  .statement-header {
    padding: 11px 14px; color: #FFFFFF; display: flex; justify-content: space-between;
    align-items: center; flex-wrap: wrap; gap: 8px;
  }
  .statement-header h3 { font-family: var(--serif); font-size: 16px; font-weight: 600; margin: 0; }
  .statement-body { padding: 12px 14px; }
  .table-responsive { width: 100%; overflow-x: auto; }
  .stmt-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .stmt-table th {
    background: #F8FAFC; border-bottom: 1px solid var(--rule); padding: 7px 10px;
    font-size: 10.5px; font-weight: 700; text-transform: uppercase; color: var(--muted); text-align: left;
  }
  .stmt-table td { padding: 8px 10px; border-bottom: 1px solid var(--rule-soft); vertical-align: top; }
  .stmt-table th.text-right, .stmt-table td.text-right { text-align: right; }
  .stmt-mono { font-family: var(--mono); font-weight: 600; font-size: 12.5px; }

  .loan-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 10px; }
  .loan-card {
    background: #FFFFFF; border: 1px solid var(--rule); border-radius: 10px; padding: 11px 13px;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .loan-pill { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 999px; }
  .loan-pill.asset { background: var(--red-soft); color: var(--red); }
  .loan-pill.liab { background: var(--amber-soft); color: var(--amber); }
  .loan-pill.settled { background: var(--green-soft); color: var(--green); }

  /* Buttons & Modal */
  .btn {
    height: 36px; padding: 0 14px; border-radius: 9px; border: 1px solid transparent;
    font: 700 12.5px var(--sans); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 5px;
  }
  .btn-primary { background: linear-gradient(120deg, #2563EB 0%, #7C3AED 100%); color: #FFFFFF; }
  .btn-wa { background: linear-gradient(120deg, #059669 0%, #047857 100%); color: #FFFFFF; }
  .btn-danger { background: var(--red); color: #FFFFFF; }
  .btn-quiet { background: #FFFFFF; color: var(--ink); border-color: var(--field); }

  #modalOverlay {
    position: fixed; inset: 0; background: rgba(15, 23, 42, 0.55); backdrop-filter: blur(6px);
    z-index: 1000; align-items: center; justify-content: center; padding: 14px;
  }
  .modal {
    background: #FFFFFF; border-radius: 16px; padding: 20px; width: 100%; max-width: 420px;
    max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 45px rgba(15, 23, 42, 0.25);
  }
  #modalTitle { font-family: var(--serif); font-weight: 700; font-size: 19px; margin-bottom: 10px; }
  #modalFields label { display: block; margin: 0 0 4px; font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--muted); }
  #modalFields input:not([type=checkbox]), #modalFields select, #modalFields textarea {
    display: block; width: 100%; height: 38px; margin-bottom: 10px; padding: 0 10px;
    border: 1px solid var(--field); border-radius: 8px; font-size: 13.5px;
  }
  .modal-actions { display: flex; gap: 8px; margin-top: 14px; justify-content: flex-end; }
  .hint { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
  .presets { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
  .preset { padding: 4px 9px; border: 1px solid var(--rule); border-radius: 999px; background: #F8FAFC; font-size: 11px; cursor: pointer; }
  .receipt-preview {
    white-space: pre-wrap; word-break: break-word; background: var(--green-soft);
    border: 1px solid var(--green-border); border-radius: 8px; padding: 10px; font-size: 12px; max-height: 220px; overflow: auto;
  }

  /* Auth Gate */
  #authGate {
    position: fixed; inset: 0; z-index: 2000; display: flex; align-items: center; justify-content: center; padding: 18px;
    background: radial-gradient(circle at 50% 30%, #1E3A8A 0%, #0F172A 100%);
  }
  .auth-card {
    width: 100%; max-width: 340px; text-align: center; background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.18); backdrop-filter: blur(16px); border-radius: 18px; padding: 28px 22px; color: #FFFFFF;
  }
  .auth-crest {
    width: 46px; height: 46px; margin: 0 auto 12px; border-radius: 12px;
    background: linear-gradient(135deg, #2563EB, #7C3AED); display: grid; place-content: center;
    font-family: var(--serif); font-size: 20px; font-weight: 700;
  }
  #authInput {
    width: 100%; height: 42px; margin: 14px 0 10px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.25);
    background: rgba(255, 255, 255, 0.12); color: #FFFFFF; text-align: center; font-size: 15px;
  }
  #authError { display: none; color: #FDA4AF; font-size: 12px; margin-top: 8px; }
</style>
</head>
<body>

<div id="authGate">
  <div class="auth-card">
    <div class="auth-crest">MM</div>
    <div style="font-family:var(--serif); font-size:23px; font-weight:700;">Mustannsirr Mallik</div>
    <div style="font-size:12px; color:#CBD5E1; margin-top:2px;">Tax &amp; Accounts Consultant &bull; Indore</div>
    <input type="password" id="authInput" placeholder="Enter dashboard password" onkeydown="if(event.key==='Enter') checkAuth();">
    <button type="button" class="btn btn-primary" style="width:100%; height:42px;" onclick="checkAuth()">Unlock Dashboard</button>
    <div id="authError">Incorrect password &mdash; please try again.</div>
  </div>
</div>

<div id="modalOverlay" style="display:none;">
  <div class="modal" role="dialog" aria-labelledby="modalTitle">
    <div id="modalTitle"></div>
    <div id="modalFields"></div>
    <div class="modal-actions">
      <button type="button" id="modalSkipBtn" class="btn btn-quiet" onclick="closeModal()">Cancel</button>
      <button type="button" id="modalConfirmBtn" class="btn btn-primary">Save</button>
    </div>
  </div>
</div>

<header class="masthead">
  <div class="masthead-brand">
    <div class="masthead-crest">MM</div>
    <div>
      <h1>Mustannsirr Mallik</h1>
      <div class="sub">Tax &amp; Accounts Consultant &bull; Indore</div>
    </div>
  </div>
  <div class="status">
    <span class="sync-badge"><span class="pulse-dot"></span><span id="lastSync">Ready</span></span>
    <button id="resetBtn" type="button" onclick="resetData()">Reset</button>
  </div>
</header>

<nav class="page-nav" role="tablist">
  <button type="button" id="tabTasks" class="page-nav-btn active" onclick="switchPage('tasks')">
    <span>Tasks &amp; Invitations</span>
  </button>
  <button type="button" id="tabFinancials" class="page-nav-btn" onclick="switchPage('financials')">
    <span>Financials &amp; Ziyarat</span>
    <span class="nav-badge" id="finBadge">₹1,07,690</span>
  </button>
  <button type="button" id="tabInvoices" class="page-nav-btn" onclick="switchPage('invoices')">
    <span>Invoices</span>
  </button>
</nav>

<div id="tasksView">
  <div id="summaryArea"></div>

  <div id="searchRow">
    <div id="searchWrap">
      <svg class="ic ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="text" id="searchBox" placeholder="Search tasks, invitations, clients, amounts..." oninput="onSearch(this.value)">
      <button type="button" id="searchClear" onclick="clearSearch()">✕</button>
    </div>
  </div>

  <div class="add-box">
    <select id="newCat" onchange="onCategoryChange()">
      <option value="PERSONAL">Personal</option>
      <option value="INVITATION">💌 Invitations</option>
      <option value="OWN">Professional — OWN</option>
      <option value="MHJ">Professional — MHJ</option>
      <option value="SHK">Professional — SHK Husain Arif</option>
      <option value="FEES">Fees</option>
      <option value="__NEW__">+ New category…</option>
    </select>
    <input type="text" id="newTask" placeholder="New task, invitation, or client…" onkeydown="if(event.key==='Enter'){ event.preventDefault(); addTask(); }">
    <input type="date" id="newDueDate" style="flex:1; min-width:115px;">
    <button type="button" onclick="addTask()">+ Add</button>
  </div>

function normalizeFinLedger(obj) {
  const def = getDefaultFinLedger();
  const out = Object.assign({}, def, obj || {});
  if (!out.kathiyawadTrip || typeof out.kathiyawadTrip !== 'object') out.kathiyawadTrip = def.kathiyawadTrip;
  if (!Array.isArray(out.kathiyawadTrip.families)) out.kathiyawadTrip.families = def.kathiyawadTrip.families;
  if (!Array.isArray(out.kathiyawadTrip.payments)) out.kathiyawadTrip.payments = [];
  if (!Array.isArray(out.kathiyawadTrip.contributions)) out.kathiyawadTrip.contributions = [];
  if (!Array.isArray(out.expenses)) out.expenses = [];
  if (!Array.isArray(out.customExpenseCategories)) out.customExpenseCategories = [];
  if (!Array.isArray(out.customLoans)) out.customLoans = [];
  out.customLoans = out.customLoans.map(cl => {
    if (!cl || typeof cl !== 'object') return cl;
    if (!Array.isArray(cl.entries)) cl.entries = [];
    return cl;
  }).filter(Boolean);
  if (!Array.isArray(out.journalEntries)) out.journalEntries = [];
  if (!Array.isArray(out.deletedIds)) out.deletedIds = [];
  if (!out.loansGiven || typeof out.loansGiven !== 'object') out.loansGiven = def.loansGiven;
  if (!out.loansGiven.juzer) out.loansGiven.juzer = def.loansGiven.juzer;
  if (!Array.isArray(out.loansGiven.juzer.entries)) out.loansGiven.juzer.entries = [];
  if (!out.loansTaken || typeof out.loansTaken !== 'object') out.loansTaken = def.loansTaken;
  if (!out.loansTaken.mhj) out.loansTaken.mhj = def.loansTaken.mhj;
  if (!Array.isArray(out.loansTaken.mhj.entries)) out.loansTaken.mhj.entries = [];
  if (!out.loansTaken.hatim) out.loansTaken.hatim = def.loansTaken.hatim;
  if (!Array.isArray(out.loansTaken.hatim.entries)) out.loansTaken.hatim.entries = [];
  return out;
}

function getFinLedger() {
  try {
    const raw = localStorage.getItem(FIN_LEDGER_KEY);
    if (!raw) {
      const def = getDefaultFinLedger();
      localStorage.setItem(FIN_LEDGER_KEY, JSON.stringify(def));

  } catch (e) {}
}

function mergeFinLedgers(local, cloud) {
  if (!cloud || typeof cloud !== 'object') return normalizeFinLedger(local);
  const loc = normalizeFinLedger(local);
  const cld = normalizeFinLedger(cloud);
  const localTs = Number(loc.updatedAt) || 0;
  const cloudTs = Number(cld.updatedAt) || 0;
  const localIsNewer = localTs > cloudTs;

  const merged = localIsNewer ? Object.assign({}, cld, loc) : Object.assign({}, loc, cld);
  const delSet = new Set([...(loc.deletedIds || []), ...(cld.deletedIds || [])]);
  merged.deletedIds = Array.from(delSet);
  merged.updatedAt = Math.max(localTs, cloudTs);

  if (localIsNewer) {
    merged.cashInHand = loc.cashInHand;
    merged.bankSlice = loc.bankSlice;
    merged.loansGiven = loc.loansGiven;
    merged.loansTaken = loc.loansTaken;
    merged.journalIncomeAdj = loc.journalIncomeAdj;
    merged.journalExpenseAdj = loc.journalExpenseAdj;
    merged.journalDrawingsAdj = loc.journalDrawingsAdj;
    merged.journalZiyaratAdj = loc.journalZiyaratAdj;
    merged.journalCapitalAdj = loc.journalCapitalAdj;
  } else {
    merged.cashInHand = cld.cashInHand;
    merged.bankSlice = cld.bankSlice;
    merged.loansGiven = cld.loansGiven;
    merged.loansTaken = cld.loansTaken;
    merged.journalIncomeAdj = cld.journalIncomeAdj;
    merged.journalExpenseAdj = cld.journalExpenseAdj;
    merged.journalDrawingsAdj = cld.journalDrawingsAdj;
    merged.journalZiyaratAdj = cld.journalZiyaratAdj;
    merged.journalCapitalAdj = cld.journalCapitalAdj;
  }

  const mergeById = (locArr, cldArr) => {
    const map = new Map();
    const older = localIsNewer ? cldArr : locArr;
    const newer = localIsNewer ? locArr : cldArr;
    (Array.isArray(older) ? older : []).forEach(item => { if (item && item.id && !delSet.has(item.id)) map.set(item.id, item); });
    (Array.isArray(newer) ? newer : []).forEach(item => { if (item && item.id && !delSet.has(item.id)) map.set(item.id, item); });
    return Array.from(map.values());
  };

  merged.kathiyawadTrip.payments = mergeById(loc.kathiyawadTrip.payments, cld.kathiyawadTrip.payments);
  merged.kathiyawadTrip.contributions = mergeById(loc.kathiyawadTrip.contributions, cld.kathiyawadTrip.contributions);
  merged.expenses = mergeById(loc.expenses, cld.expenses);
  merged.customLoans = mergeById(loc.customLoans, cld.customLoans);
  merged.journalEntries = mergeById(loc.journalEntries, cld.journalEntries);
  merged.customExpenseCategories = Array.from(new Set([...(loc.customExpenseCategories || []), ...(cld.customExpenseCategories || [])]));

  return normalizeFinLedger(merged);
}

async function syncCloudFinLedger(forceCloud) {
  const url = getWebhook();
  if (!url) return;
  try {
    const res = await fetch(url + '?action=getfinledger&_t=' + Date.now(), { cache: 'no-store' });
    const data = await res.json();
    if (data && data.status === 'ok' && data.ledger) {
      const local = getFinLedger();
      const finalLedger = forceCloud ? normalizeFinLedger(data.ledger) : mergeFinLedgers(local, data.ledger);
      localStorage.setItem(FIN_LEDGER_KEY, JSON.stringify(finalLedger));
      render();
      if (activePage === 'financials') renderFinancialsPage();
      const el = document.getElementById('lastSync');
      if (el) el.textContent = 'Synced ✓ ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }
  } catch (e) {}
}

async function pullFromCalendar() {
  const url = getWebhook();
  if (!url) return;
  try {
    const res = await fetch(url);
    const events = await res.json();
    if (!Array.isArray(events)) return;
    const calIds = new Set(events.map(ev => ev.id));
    const existingIds = new Set(tasks.map(t => t.id));
    let changedAny = false;

    events.forEach(ev => {
      if (existingIds.has(ev.id)) {
        const local = tasks.find(x => x.id === ev.id);
        if (local) {
          if (local.name !== ev.title) { local.name = ev.title; changedAny = true; }
          if (local.done !== ev.done) { local.done = ev.done; changedAny = true; }
          if (ev.remark && local.remark !== ev.remark) { local.remark = ev.remark; changedAny = true; }
          if (ev.tag === 'FEES') {
            if (ev.payable !== undefined && local.payable !== ev.payable) { local.payable = ev.payable; changedAny = true; }
            if (ev.received !== undefined && local.received !== ev.received) { local.received = ev.received; changedAny = true; }
            if (ev.invoice && local.invoice !== ev.invoice) { local.invoice = ev.invoice; changedAny = true; }
          }
        }
        return;
      }
      const tag = ev.tag;
      const type = tag === 'PERSONAL' ? 'personal' : (tag === 'INVITATION' ? 'invitation' : (tag === 'FEES' ? 'fee' : 'professional'));
      const cat = (tag === 'PERSONAL') ? null : tag;
      const task = { id: ev.id, name: ev.title, type, cat, due: '', dueDate: ev.dueDate || null, done: ev.done, urgent: false, remark: ev.remark || '' };
      if (tag === 'FEES') {
        task.payable = ev.payable || 0;
        task.received = ev.received || 0;
        task.discount = ev.discount || 0;
        task.linked = ev.linked || '';
        task.phone = ev.phone || '';
        task.invoice = ev.invoice || '';
        task.feeCat = ev.feeCat || '';
      }
      tasks.push(task);
      changedAny = true;
    });

    const beforeLen = tasks.length;
    tasks = tasks.filter(t => !t.id.startsWith('cal_') || calIds.has(t.id));
    if (tasks.length !== beforeLen) changedAny = true;

    // Deduplicate any seed/local duplicate whose title matches a synced Calendar event
    const seenTaskKeys = new Set();
    const deduped = [];
    tasks.forEach(t => {
      if (!t) return;
      const k = (t.type || '') + '|' + String(t.name || '').trim().toLowerCase();
      if (seenTaskKeys.has(k)) { changedAny = true; return; }
      seenTaskKeys.add(k);
      deduped.push(t);
    });
    tasks = deduped;

    if (changedAny) {
      saveTasks();
      render();
      if (activePage === 'financials') renderFinancialsPage();
      if (activePage === 'invoices') renderInvoicesPage();
    }
    const el = document.getElementById('lastSync');
    if (el) el.textContent = 'Synced ✓ ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  } catch (e) {}
}

function onCategoryChange() {

      const tag = raw.toUpperCase().replace(/[^A-Z0-9]+/g, '_').replace(/^_+|_+$/g, '');
      if (!tag) { select.value = 'PERSONAL'; return; }
      let exists = false;
      for (const opt of select.options) { if (opt.value === tag) exists = true; }

        opt.value = tag;
        opt.textContent = 'Professional — ' + raw;

// ---- Financials Modals (Journal, Loans, Sub-Ledger, Expenses, Ziyarat Trip) ----
function getJournalAccountLabel(code) {
  const map = {
    CASH: 'Cash in Hand',
    BANK_SLICE: 'slice SFB Bank',
    LOAN_JUZER: 'Juzer Presswala (Loan Given)',
    LOAN_MHJ: 'MHJ (Loan Taken)',
    LOAN_HATIM: 'Hatim Bhai (Loan Taken)',
    INCOME_FEES: 'Professional Fees Income (P&L)',
    EXPENSE_OP: 'Business Operating Expense (P&L)',
    DRAWINGS: 'Personal Drawings (Capital Deduction)',
    CAPITAL: "Owner's Capital Account",
    ZIYARAT: 'Kathiyawad Ziyarat Advance'
  };
  return map[code] || code;
}

function applyJournalEffect(ledger, code, side, amt) {
  const sign = side === 'dr' ? 1 : -1;
  if (code === 'CASH') ledger.cashInHand = (Number(ledger.cashInHand) || 0) + sign * amt;
  else if (code === 'BANK_SLICE') ledger.bankSlice = (Number(ledger.bankSlice) || 0) + sign * amt;
  else if (code === 'LOAN_JUZER') ledger.loansGiven.juzer.adjustments = (Number(ledger.loansGiven.juzer.adjustments) || 0) + sign * amt;
  else if (code === 'LOAN_MHJ') ledger.loansTaken.mhj.adjustments = (Number(ledger.loansTaken.mhj.adjustments) || 0) - sign * amt;
  else if (code === 'LOAN_HATIM') ledger.loansTaken.hatim.adjustments = (Number(ledger.loansTaken.hatim.adjustments) || 0) - sign * amt;
  else if (code === 'INCOME_FEES') ledger.journalIncomeAdj = (Number(ledger.journalIncomeAdj) || 0) - sign * amt;
  else if (code === 'EXPENSE_OP') ledger.journalExpenseAdj = (Number(ledger.journalExpenseAdj) || 0) + sign * amt;
  else if (code === 'DRAWINGS') ledger.journalDrawingsAdj = (Number(ledger.journalDrawingsAdj) || 0) + sign * amt;
  else if (code === 'ZIYARAT') ledger.journalZiyaratAdj = (Number(ledger.journalZiyaratAdj) || 0) + sign * amt;
  else if (code === 'CAPITAL') ledger.journalCapitalAdj = (Number(ledger.journalCapitalAdj) || 0) - sign * amt;
}

  `;
  showModal('📒 Pass Double-Entry Journal Voucher', `

    <input type="date" id="jvDate" value="${new Date().toISOString().slice(0, 10)}">
    <label>Debit Account (Dr)</label>

    const date = document.getElementById('jvDate').value || new Date().toISOString().slice(0, 10);

function deleteJournalEntry(id) {
  const ledger = getFinLedger();
  const idx = ledger.journalEntries.findIndex(x => x.id === id);
  if (idx === -1) return;
  const jv = ledger.journalEntries[idx];
  showModal('Delete Journal Voucher ' + jv.voucherNo + '?', `<div class="hint">Reverses ${inr(jv.amount)} from both accounts.</div>`, () => {
    applyJournalEffect(ledger, jv.debitAccount, 'cr', jv.amount);
    applyJournalEffect(ledger, jv.creditAccount, 'dr', jv.amount);
    ledger.journalEntries.splice(idx, 1);
    ledger.deletedIds.push(id);
    saveFinLedger(ledger);
    render();
    renderFinancialsPage();
  }, 'Delete', 'Cancel');
}

      ledger.journalIncomeAdj = 0;
      ledger.journalExpenseAdj = 0;
      ledger.journalDrawingsAdj = 0;
      ledger.journalZiyaratAdj = 0;
      ledger.journalCapitalAdj = 0;
    }

    const seenNames = new Set();
    tasks = tasks.filter(t => {
      if (!t) return false;
      const key = (t.type + '|' + String(t.name || '').trim().toLowerCase());
      if (seenNames.has(key)) return false;
      seenNames.add(key);
      return true;
    });

    saveTasks();
    saveFinLedger(ledger);
    render();
    renderFinancialsPage();
    if (activePage === 'invoices') renderInvoicesPage();
  }, 'Save & Sync Cloud', 'Cancel');
}

function recordLoanRepayment(id, isBuiltIn) {
  const ledger = getFinLedger();
  let title = '', currentBalance = 0, isGiven = true;
  if (isBuiltIn) {
    if (id === 'juzer') {
      title = ledger.loansGiven.juzer.name;
      currentBalance = Math.max(0, (Number(ledger.loansGiven.juzer.base) || 0) + (Number(ledger.loansGiven.juzer.adjustments) || 0));
      isGiven = true;
    } else if (id === 'mhj') {
      title = ledger.loansTaken.mhj.name;
      currentBalance = Math.max(0, (Number(ledger.loansTaken.mhj.base) || 0) + (Number(ledger.loansTaken.mhj.adjustments) || 0));
      isGiven = false;
    } else if (id === 'hatim') {
      title = ledger.loansTaken.hatim.name;
      currentBalance = Math.max(0, (Number(ledger.loansTaken.hatim.base) || 0) + (Number(ledger.loansTaken.hatim.adjustments) || 0));
      isGiven = false;
    }
  } else {
    const cl = ledger.customLoans.find(x => String(x.id) === String(id));
    if (!cl) return;
    title = cl.name;
    currentBalance = Math.max(0, (Number(cl.principal) || 0) - (Number(cl.repaid) || 0));
    isGiven = cl.type === 'given';
  }
  showModal('Record Repayment — ' + title, `
    <div class="hint">Pending Balance: <strong>${inr(currentBalance)}</strong></div>
    <label>Repayment Amount (₹)</label>
    <input type="number" id="repayAmt" placeholder="₹ Amount">
    <label>Account / Mode</label>
    <select id="repayMode">
      <option value="slice SFB">slice Small Finance Bank</option>
      <option value="Cash">Cash in Hand</option>
    </select>
  `, () => {
    const amt = parseFloat(document.getElementById('repayAmt').value) || 0;
    const mode = document.getElementById('repayMode').value;
    if (amt <= 0) return;
    const freshLedger = getFinLedger();
    if (isBuiltIn) {
      if (id === 'juzer') freshLedger.loansGiven.juzer.adjustments = (Number(freshLedger.loansGiven.juzer.adjustments) || 0) - amt;
      else if (id === 'mhj') freshLedger.loansTaken.mhj.adjustments = (Number(freshLedger.loansTaken.mhj.adjustments) || 0) - amt;
      else if (id === 'hatim') freshLedger.loansTaken.hatim.adjustments = (Number(freshLedger.loansTaken.hatim.adjustments) || 0) - amt;
    } else {
      const cl = freshLedger.customLoans.find(x => String(x.id) === String(id));
      if (cl) cl.repaid = (Number(cl.repaid) || 0) + amt;
    }
    const cashDelta = isGiven ? amt : -amt;
    if (mode === 'Cash') freshLedger.cashInHand = (Number(freshLedger.cashInHand) || 0) + cashDelta;
    else freshLedger.bankSlice = (Number(freshLedger.bankSlice) || 0) + cashDelta;
    saveFinLedger(freshLedger);
    render();
    renderFinancialsPage();
  }, 'Save Repayment', 'Cancel');
}

function deleteLoanSubEntry(parentId, entryId, isBuiltIn) {
  const ledger = getFinLedger();
  let targetObj = null, isGiven = true;
  if (isBuiltIn) {
    if (parentId === 'juzer') { targetObj = ledger.loansGiven.juzer; isGiven = true; }
    else if (parentId === 'mhj') { targetObj = ledger.loansTaken.mhj; isGiven = false; }
    else if (parentId === 'hatim') { targetObj = ledger.loansTaken.hatim; isGiven = false; }
  } else {
    targetObj = ledger.customLoans.find(x => String(x.id) === String(parentId));
    if (targetObj) isGiven = targetObj.type === 'given';
  }
  if (!targetObj || !Array.isArray(targetObj.entries)) return;
  const idx = targetObj.entries.findIndex(x => String(x.id) === String(entryId));
  if (idx === -1) return;
  const en = targetObj.entries[idx];
  showModal('Delete Sub-Entry: ' + en.desc + '?', `<div class="hint">Reverses ${inr(en.amount)} from loan &amp; ${escapeForHtml(en.mode)}.</div>`, () => {
    const freshLedger = getFinLedger();
    let freshTarget = null;
    if (isBuiltIn) {
      if (parentId === 'juzer') freshTarget = freshLedger.loansGiven.juzer;
      else if (parentId === 'mhj') freshTarget = freshLedger.loansTaken.mhj;
      else if (parentId === 'hatim') freshTarget = freshLedger.loansTaken.hatim;
    } else {
      freshTarget = freshLedger.customLoans.find(x => String(x.id) === String(parentId));
    }
    if (!freshTarget || !Array.isArray(freshTarget.entries)) return;
    const fIdx = freshTarget.entries.findIndex(x => String(x.id) === String(entryId));
    if (fIdx === -1) return;
    const fEn = freshTarget.entries[fIdx];

    if (isBuiltIn) freshTarget.adjustments = (Number(freshTarget.adjustments) || 0) - (Number(fEn.amount) || 0);
    else freshTarget.principal = Math.max(0, (Number(freshTarget.principal) || 0) - (Number(fEn.amount) || 0));

    if (fEn.mode !== 'Direct Adjustment') {
      const cashRev = isGiven ? (Number(fEn.amount) || 0) : -(Number(fEn.amount) || 0);
      if (fEn.mode === 'Cash') freshLedger.cashInHand = (Number(freshLedger.cashInHand) || 0) + cashRev;
      else freshLedger.bankSlice = (Number(freshLedger.bankSlice) || 0) + cashRev;
    }
    freshTarget.entries.splice(fIdx, 1);
    saveFinLedger(freshLedger);
    render();
    renderFinancialsPage();
  }, 'Delete', 'Cancel');
}

function isLoanFeeTask(t) {
  if (!t) return false;
  const txt = String(t.name || '') + ' ' + String(t.linked || '');
  return /juzer presswala|loan\s*&?\s*advance/i.test(txt);
}

  const feeTasks = tasks.filter(t => t && t.type === 'fee' && !isLoanFeeTask(t));

  const totalCollected = feeTasks.reduce((s, t) => s + (Number(t.received) || 0), 0);
  const totalDue = feeTasks.reduce((s, t) => s + Math.max(0, (Number(t.payable) || 0) - (Number(t.received) || 0) - (Number(t.discount) || 0)), 0);

  invEl.innerHTML = `
    <div class="fin-hero-grid">
      <div class="fin-card"><div class="f-lbl">Total Billed</div><div class="f-val">${inr(totalBilled)}</div></div>
      <div class="fin-card"><div class="f-lbl">Collected</div><div class="f-val" style="color:var(--green);">${inr(totalCollected)}</div></div>
      <div class="fin-card"><div class="f-lbl">Pending Balance</div><div class="f-val" style="color:var(--red);">${inr(totalDue)}</div></div>
    </div>
    <div class="statement-sheet">
      <div class="statement-header" style="background:linear-gradient(120deg, #1E3A8A 0%, #7C3AED 100%);">
        <h3>📄 Client Invoices &amp; Billing Register</h3>
        <span style="font-size:11px;">${feeTasks.length} Billable Entries</span>
      </div>
      <div class="statement-body">
        <div class="table-responsive">

                      <button type="button" class="btn btn-quiet" style="height:26px; font-size:11px; padding:0 8px;" onclick="generateOrOpenInvoice('${escapeForHtml(t.id)}')">${t.invoice ? 'View Invoice' : 'Issue Invoice'}</button>
                      ${bal > 0 ? `<button type="button" class="btn btn-wa" style="height:26px; font-size:11px; padding:0 8px;" onclick="sendWhatsAppReminder('${escapeForHtml(t.id)}', ${bal})">Remind</button>` : ''}
                    </td>
                  </tr>
                `;

            </tbody>
          </table>

}

function renderFinancialsPage() {
  const finContainer = document.getElementById('financialsView');
  if (!finContainer) return;
  try {
    const ledger = getFinLedger();
    const cashInHand = Number(ledger.cashInHand) || 0;
    const bankSlice = Number(ledger.bankSlice) || 0;
    const totalLiquidCashBank = cashInHand + bankSlice;

    const juzerNet = Math.max(0, (Number(ledger.loansGiven?.juzer?.base) || 0) + (Number(ledger.loansGiven?.juzer?.adjustments) || 0));
    const mhjNet = Math.max(0, (Number(ledger.loansTaken?.mhj?.base) || 0) + (Number(ledger.loansTaken?.mhj?.adjustments) || 0));
    const hatimNet = Math.max(0, (Number(ledger.loansTaken?.hatim?.base) || 0) + (Number(ledger.loansTaken?.hatim?.adjustments) || 0));

    const customLoansArr = Array.isArray(ledger.customLoans) ? ledger.customLoans : [];
    const customGiven = customLoansArr.filter(c => c.type === 'given').reduce((s, c) => s + Math.max(0, (Number(c.principal) || 0) - (Number(c.repaid) || 0)), 0);
    const customTaken = customLoansArr.filter(c => c.type === 'taken').reduce((s, c) => s + Math.max(0, (Number(c.principal) || 0) - (Number(c.repaid) || 0)), 0);

    const totalLoansGiven = juzerNet + customGiven;
    const totalLoansTaken = mhjNet + hatimNet + customTaken;

    const finBadgeEl = document.getElementById('finBadge');
    if (finBadgeEl) finBadgeEl.textContent = inr(totalLoansGiven);

    const tripPayments = Array.isArray(ledger.kathiyawadTrip?.payments) ? ledger.kathiyawadTrip.payments : [];
    const tripContributions = Array.isArray(ledger.kathiyawadTrip?.contributions) ? ledger.kathiyawadTrip.contributions : [];
    const totalTripOutlay = tripPayments.reduce((s, p) => s + (Number(p.amount) || 0), 0);
    const totalTripContrib = tripContributions.reduce((s, c) => s + (Number(c.amount) || 0), 0);
    const equalFamilyShare = totalTripOutlay / 3;
    const netTripOutflow = Math.max(0, totalTripOutlay - totalTripContrib) + (Number(ledger.journalZiyaratAdj) || 0);

    const allExp = Array.isArray(ledger.expenses) ? ledger.expenses : [];
    const isDrawingCategory = (cat) => /drawing|personal/i.test(String(cat || ''));
    const totalPersonalDrawings = allExp.filter(e => isDrawingCategory(e.category)).reduce((s, e) => s + (Number(e.amount) || 0), 0) + (Number(ledger.journalDrawingsAdj) || 0);
    const totalOperatingExpenses = allExp.filter(e => !isDrawingCategory(e.category)).reduce((s, e) => s + (Number(e.amount) || 0), 0) + (Number(ledger.journalExpenseAdj) || 0);

    const feeTasks = tasks.filter(t => t && t.type === 'fee' && !isLoanFeeTask(t));
    const grossFeeIncome = feeTasks.reduce((s, t) => s + Math.max(0, (Number(t.payable) || 0) - (Number(t.discount) || 0)), 0) + (Number(ledger.journalIncomeAdj) || 0);
    const sundryDebtorsReceivable = feeTasks.reduce((s, t) => s + Math.max(0, (Number(t.payable) || 0) - (Number(t.received) || 0) - (Number(t.discount) || 0)), 0);

    const netProfit = grossFeeIncome - totalOperatingExpenses;

    const totalAssets = totalLiquidCashBank + totalLoansGiven + netTripOutflow + sundryDebtorsReceivable;
    const effectiveCapital = totalAssets - totalLoansTaken;
    const openingCapitalReserves = effectiveCapital - netProfit + totalPersonalDrawings;

    const allFinFolded = ['journal', 'trip', 'loans', 'expenses', 'pl', 'bs'].every(k => !!finCollapsed[k]);
    const isSecOpen = (key) => isFamilyPublicView || finViewMode !== 'all' || !finCollapsed[key];

    let html = '';

    if (!isFamilyPublicView) {
      html += `
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:6px; margin-bottom:10px;">
          <div class="fin-mode-toggle" role="tablist">
            <button type="button" class="fin-mode-btn ${finViewMode === 'all' ? 'active' : ''}" onclick="setFinViewMode('all')">All Ledgers</button>
            <button type="button" class="fin-mode-btn ${finViewMode === 'journal' ? 'active' : ''}" onclick="setFinViewMode('journal')">📒 Journal (${(ledger.journalEntries || []).length})</button>
            <button type="button" class="fin-mode-btn ${finViewMode === 'trip' ? 'active' : ''}" onclick="setFinViewMode('trip')">🕌 Ziyarat Trip</button>
            <button type="button" class="fin-mode-btn ${finViewMode === 'loans' ? 'active' : ''}" onclick="setFinViewMode('loans')">🤝 Loans</button>
            <button type="button" class="fin-mode-btn ${finViewMode === 'expenses' ? 'active' : ''}" onclick="setFinViewMode('expenses')">💸 Expenses</button>

            <button type="button" class="fin-mode-btn ${finViewMode === 'bs' ? 'active' : ''}" onclick="setFinViewMode('bs')">Balance Sheet</button>

          <div style="display:flex; gap:5px; flex-wrap:wrap;">

            <button type="button" class="btn btn-primary" style="height:30px; padding:0 11px; font-size:11px;" onclick="openJournalEntryModal()">📒 + Journal</button>
            <button type="button" class="btn btn-quiet" style="height:30px; padding:0 9px; font-size:11px;" onclick="openAtmCashWithdrawalModal()">🏧 + ATM Cash</button>

            <div class="f-sub">Loans: ${inr(totalLoansGiven)} &bull; Debtors: ${inr(sundryDebtorsReceivable)}</div>
          </div>
          <div class="fin-card">
            <div class="f-lbl">Owner's Net Capital</div>
            <div class="f-val" style="color:var(--green);">${inr(effectiveCapital)}</div>
            <div class="f-sub">Net Profit: ${inr(netProfit)} &bull; Loans Taken: ${inr(totalLoansTaken)}</div>
          </div>
        </div>
      `;
    }

    // 1. Double-Entry Journal Register
    if (!isFamilyPublicView && (finViewMode === 'all' || finViewMode === 'journal')) {
      const jvList = ledger.journalEntries || [];
      const openJv = isSecOpen('journal');
      html += `
        <div class="statement-sheet">
          <div class="statement-header" style="background:linear-gradient(120deg, #1E3A8A 0%, #4F46E5 100%); cursor:pointer;" onclick="toggleFinSection('journal')">

            <div style="display:flex; align-items:center; gap:8px;" onclick="event.stopPropagation()">

          ${openJv ? `<div class="statement-body">

        </div>

          ${openTrip ? `<div class="statement-body">

                ${tripContributions.map(c => `

              }).join('')}
            </div>
          </div>` : ''}
        </div>
      `;
    }

    // 4. Expenses & Personal Drawings
    if (!isFamilyPublicView && (finViewMode === 'all' || finViewMode === 'expenses')) {
      const openExp = isSecOpen('expenses');
      html += `
        <div class="statement-sheet">
          <div class="statement-header" style="background:linear-gradient(120deg, #BE123C 0%, #E11D48 100%); cursor:pointer;" onclick="toggleFinSection('expenses')">
            <h3>${openExp ? '▾' : '▸'} 💸 Expenses &amp; Personal Drawings</h3>
            <div style="display:flex; align-items:center; gap:8px;" onclick="event.stopPropagation()">
              <span style="font-size:11px; font-weight:700;">OpEx: ${inr(totalOperatingExpenses)} &bull; Drawings: ${inr(totalPersonalDrawings)}</span>
              <button type="button" class="btn btn-quiet" style="height:26px; font-size:11px; padding:0 9px;" onclick="openAddExpenseModal()">+ Record Entry</button>
            </div>
          </div>
          ${openExp ? `<div class="statement-body">
            <div class="table-responsive"><table class="stmt-table">
              <thead><tr><th>Date</th><th>Payee</th><th>Category</th><th>Head</th><th>Paid From</th><th class="text-right">Amount</th><th></th></tr></thead>
              <tbody>
                ${allExp.slice().reverse().map(e => {
                  const isDraw = isDrawingCategory(e.category);
                  return `
                    <tr>
                      <td>${escapeForHtml(e.date)}</td>
                      <td><strong>${escapeForHtml(e.payee)}</strong>${e.note ? `<br><small style="color:var(--muted);">${escapeForHtml(e.note)}</small>` : ''}</td>
                      <td>${escapeForHtml(e.category)}</td>
                      <td><span class="loan-pill ${isDraw ? 'liab' : 'asset'}">${isDraw ? 'Capital Drawings' : 'P&L Expense'}</span></td>
                      <td>${escapeForHtml(e.source)}</td>
                      <td class="text-right stmt-mono">${inr(e.amount)}</td>
                      <td><button type="button" class="act del" onclick="deleteExpenseEntry('${e.id}')">${ICON.x}</button></td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table></div>
          </div>` : ''}
        </div>
      `;
    }

    // 5. Accrual Profit & Loss Statement
    if (!isFamilyPublicView && (finViewMode === 'all' || finViewMode === 'pl')) {
      const openPl = isSecOpen('pl');
      html += `
        <div class="statement-sheet">
          <div class="statement-header" style="background:linear-gradient(120deg, #065F46 0%, #059669 100%); cursor:pointer;" onclick="toggleFinSection('pl')">
            <h3>${openPl ? '▾' : '▸'} 📈 Profit &amp; Loss Statement (Accrual Basis)</h3>
            <span style="font-size:11.5px; font-weight:700;">Net Profit: ${inr(netProfit)}</span>
          </div>
          ${openPl ? `<div class="statement-body">
            <div class="table-responsive"><table class="stmt-table">
              <thead><tr><th>Particulars</th><th class="text-right">Amount (₹)</th></tr></thead>
              <tbody>
                <tr><td><strong>Gross Professional Fees Billed (Accrual Income)</strong></td><td class="text-right stmt-mono" style="color:var(--green);">${inr(grossFeeIncome)}</td></tr>
                <tr><td>Less: Operating Business Expenses</td><td class="text-right stmt-mono" style="color:var(--red);">-${inr(totalOperatingExpenses)}</td></tr>
                <tr style="background:#ECFDF5; font-weight:700;"><td>Net Business Profit (Transferred to Capital)</td><td class="text-right stmt-mono" style="color:var(--green);">${inr(netProfit)}</td></tr>
              </tbody>
            </table></div>
          </div>` : ''}
        </div>
      `;
    }

    // 6. Double-Entry Balance Sheet (with Sundry Debtors & Capital Drawings Deduction)
    if (!isFamilyPublicView && (finViewMode === 'all' || finViewMode === 'bs')) {
      const openBs = isSecOpen('bs');
      html += `
        <div class="statement-sheet">
          <div class="statement-header" style="background:linear-gradient(120deg, #0F172A 0%, #1E3A8A 100%); cursor:pointer;" onclick="toggleFinSection('bs')">
            <h3>${openBs ? '▾' : '▸'} ⚖️ Balance Sheet Statement</h3>
            <span style="font-size:11.5px; font-weight:700;">Total Assets = Liabilities + Equity: ${inr(totalAssets)}</span>
          </div>
          ${openBs ? `<div class="statement-body">
            <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(290px, 1fr)); gap:12px;">
              <div>
                <h4 style="margin:0 0 6px; color:#1E3A8A;">Liabilities &amp; Owner's Equity</h4>
                <table class="stmt-table">
                  <tbody>
                    <tr><td>Opening Capital / Prior Reserves</td><td class="text-right stmt-mono">${inr(openingCapitalReserves)}</td></tr>
                    <tr><td style="color:var(--green);">Add: Net Profit from P&amp;L</td><td class="text-right stmt-mono" style="color:var(--green);">+${inr(netProfit)}</td></tr>
                    <tr><td style="color:var(--red);">Less: Personal Drawings</td><td class="text-right stmt-mono" style="color:var(--red);">-${inr(totalPersonalDrawings)}</td></tr>
                    <tr style="background:#F8FAFC; font-weight:700;"><td>Closing Net Owner's Capital Account</td><td class="text-right stmt-mono">${inr(effectiveCapital)}</td></tr>
                    <tr><td>Loans &amp; Advances Taken (MHJ, Hatim &amp; Others)</td><td class="text-right stmt-mono">${inr(totalLoansTaken)}</td></tr>
                    <tr style="background:#EFF6FF; font-weight:700;"><td>Total Liabilities &amp; Equity</td><td class="text-right stmt-mono">${inr(effectiveCapital + totalLoansTaken)}</td></tr>
                  </tbody>
                </table>
              </div>
              <div>
                <h4 style="margin:0 0 6px; color:#065F46;">Assets</h4>
                <table class="stmt-table">
                  <tbody>
                    <tr><td>Cash in Hand</td><td class="text-right stmt-mono" style="color:${cashInHand < 0 ? 'var(--red)' : 'inherit'};">${inr(cashInHand)}</td></tr>
                    <tr><td>slice Small Finance Bank</td><td class="text-right stmt-mono">${inr(bankSlice)}</td></tr>
                    <tr><td>Sundry Debtors (Pending Fees Receivable)</td><td class="text-right stmt-mono">${inr(sundryDebtorsReceivable)}</td></tr>
                    <tr><td>Loans &amp; Advances Given (Juzer &amp; Others)</td><td class="text-right stmt-mono">${inr(totalLoansGiven)}</td></tr>
                    <tr><td>Kathiyawad Ziyarat Net Advance<br><small style="color:var(--muted);">Outlay ${inr(totalTripOutlay)} &minus; Contrib ${inr(totalTripContrib)} (Your 1/3 share: ${inr(equalFamilyShare)})</small></td><td class="text-right stmt-mono">${inr(netTripOutflow)}</td></tr>
                    <tr style="background:#ECFDF5; font-weight:700;"><td>Total Assets</td><td class="text-right stmt-mono">${inr(totalAssets)}</td></tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>` : ''}
        </div>
      `;
    }

    finContainer.innerHTML = html;
  } catch (err) {
    finContainer.innerHTML = `<div class="statement-sheet"><div class="statement-body" style="color:var(--red);">Financial render error: ${escapeForHtml(err.message)}</div></div>`;
  }
}

function render() {
  updateFinNavBadge();
  const app = document.getElementById('app');
  if (!app) return;
  const q = String(searchQuery || '').trim().toLowerCase();
  const visible = tasks.filter(t => {
    if (!t) return false;
    const text = [t.name, t.remark, t.linked, t.invoice, t.cat, t.phone].join(' ').toLowerCase();
    if (q && !text.includes(q)) return false;
    if (filter === 'pending' && t.done) return false;
    if (filter === 'done' && !t.done) return false;
    if (filter === 'fees' && t.type !== 'fee') return false;
    if (filter === 'invitation' && !isInvitationTask(t)) return false;
    return true;
  });

  const pending = tasks.filter(t => t && !t.done).length;
  const completed = tasks.filter(t => t && t.done).length;
  const feeDue = tasks.filter(t => t && t.type === 'fee' && !isLoanFeeTask(t)).reduce((a, t) => a + Math.max(0, (Number(t.payable) || 0) - (Number(t.received) || 0) - (Number(t.discount) || 0)), 0);
  const invCount = tasks.filter(t => t && isInvitationTask(t) && !t.done).length;

  const summary = document.getElementById('summaryArea');
  if (summary) summary.innerHTML = `
    <div class="summary-sheet">
      <div class="hero-stats">
        <div class="hero-card"><div class="n">${tasks.length}</div><div class="l">Total Items</div></div>
        <div class="hero-card"><div class="n" style="color:var(--amber);">${pending}</div><div class="l">Pending</div></div>
        <div class="hero-card"><div class="n" style="color:var(--c-personal);">${invCount}</div><div class="l">Invitations</div></div>
        <div class="hero-card"><div class="n" style="color:var(--red);">${inr(feeDue)}</div><div class="l">Fees Due</div></div>
      </div>
    </div>`;

  const cats = new Map();
  visible.forEach(t => {
    const key = isInvitationTask(t) ? 'INVITATION' : (t.cat || (t.type === 'fee' ? 'FEES' : 'PERSONAL'));
    if (!cats.has(key)) cats.set(key, []);
    cats.get(key).push(t);
  });

  const labels = {
    PERSONAL: 'Personal',
    INVITATION: '💌 Invitations & Events',
    OWN: 'Professional — OWN',
    MHJ: 'Professional — MHJ',
    SHK: 'Professional — SHK Husain Arif',
    FEES: 'Fees & Receivables'
  };

  const renderTaskCard = (t) => {
    const due = t.dueDate ? new Date(t.dueDate).toLocaleDateString('en-IN') : '';
    const balance = Math.max(0, (Number(t.payable) || 0) - (Number(t.received) || 0) - (Number(t.discount) || 0));
    return `<article class="task ${t.done ? 'done-task' : ''}">
      <input type="checkbox" ${t.done ? 'checked' : ''} aria-label="Mark task complete" onchange="toggleTask('${escapeForHtml(t.id)}')">
      <div class="task-body">
        <div class="task-top"><span class="task-name">${escapeForHtml(t.name)}</span>${t.type === 'fee' ? `<span class="amt ${balance ? 'owed' : 'clear'}">${balance ? inr(balance) : 'Settled'}</span>` : ''}</div>
        ${t.linked ? `<div class="task-sub">${escapeForHtml(t.linked)}</div>` : ''}
        ${due ? `<div class="task-sub">Due: ${due}</div>` : ''}
        ${t.remark ? `<div class="note">${escapeForHtml(t.remark)}</div>` : ''}
        <div class="task-meta">
          ${t.type === 'fee' ? `
            <button class="act pay" onclick="recordPayment('${escapeForHtml(t.id)}')">Record payment</button>
            ${balance > 0 ? `<button class="act wa" onclick="sendWhatsAppReminder('${escapeForHtml(t.id)}',${balance})">Send WhatsApp reminder</button>` : ''}
            ${(Number(t.received) || 0) > 0 ? `<button class="act" onclick="offerReceipt('${escapeForHtml(t.id)}')">Receipt</button>` : ''}
            <button class="act" onclick="generateOrOpenInvoice('${escapeForHtml(t.id)}')">${t.invoice ? 'View Invoice' : 'Invoice'}</button>
          ` : ''}
          <button class="act" onclick="setRemark('${escapeForHtml(t.id)}')">Note</button>
          ${isInvitationTask(t) ? '' : `<button class="act" onclick="moveToInvitation('${escapeForHtml(t.id)}')">💌 Invitation</button>`}
          <button class="act del" onclick="deleteTask('${escapeForHtml(t.id)}')">Delete</button>
        </div>
      </div>
    </article>`;
  };

  app.innerHTML = `
    <div class="filters seg">
      <button class="filter-btn ${filter === 'all' ? 'active' : ''}" onclick="setFilter('all')">All</button>
      <button class="filter-btn ${filter === 'invitation' ? 'active' : ''}" onclick="setFilter('invitation')">💌 Invitations</button>
      <button class="filter-btn ${filter === 'pending' ? 'active' : ''}" onclick="setFilter('pending')">Pending</button>
      <button class="filter-btn ${filter === 'done' ? 'active' : ''}" onclick="setFilter('done')">Completed (${completed})</button>
      <button class="filter-btn ${filter === 'fees' ? 'active' : ''}" onclick="setFilter('fees')">Fees</button>
    </div>
    ${cats.size ? Array.from(cats.entries()).map(([cat, items]) => {
      const pendingItems = items.filter(t => !t.done);
      const doneItems = items.filter(t => t.done);
      const showDone = !!doneOpen[cat] || (!!q && doneItems.length > 0);
      const countText = (pendingItems.length > 0 && doneItems.length > 0)
        ? `${pendingItems.length} pending • ${doneItems.length} done`
        : `${items.length}`;

      return `
      <section class="cat-section ${uiState.collapsed[cat] ? 'collapsed' : ''}">
        <div class="cat-heading" onclick="toggleGroup('${escapeForHtml(cat)}')">
          ${ICON.chev}
          <span class="dot" style="background:${cat === 'FEES' ? 'var(--c-fees)' : cat === 'INVITATION' ? 'var(--c-personal)' : 'var(--accent)'}"></span>
          <span class="title">${escapeForHtml(labels[cat] || cat.replace(/_/g, ' '))}</span>
          <span class="count">${countText}</span>
        </div>
        ${uiState.collapsed[cat] ? '' : `<div class="task-grid">
          ${pendingItems.map(renderTaskCard).join('')}
          ${doneItems.length > 0 ? `
            <button type="button" class="done-toggle" onclick="toggleDone('${escapeForHtml(cat)}')">
              <span>${showDone ? '▾' : '▸'} Completed tasks (${doneItems.length})</span>
              <span style="font-size:10.5px; font-weight:700;">${showDone ? 'Fold' : 'Expand'}</span>
            </button>
            ${showDone ? doneItems.map(renderTaskCard).join('') : ''}
          ` : ''}
        </div>`}
      </section>`;
    }).join('') : '<div class="statement-sheet"><div class="statement-body">No matching tasks found.</div></div>'}`;
}

function checkAuth() {
  const input = document.getElementById('authInput');
  const gate = document.getElementById('authGate');
  const error = document.getElementById('authError');
  const expected = localStorage.getItem('dashboardPassword');
  if (!expected || (input && input.value === expected)) {
    if (gate) gate.style.display = 'none';
    sessionStorage.setItem('dashboardUnlocked', '1');
    return;
  }
  if (error) error.style.display = 'block';
}

function resetData() {
  showModal('Reset dashboard data?', `
    <div class="hint">This clears locally stored task, financial and display data from this browser. Cloud records are not deleted.</div>
  `, () => {
    [STORAGE_KEY, FIN_LEDGER_KEY, UI_KEY].forEach(k => localStorage.removeItem(k));
    tasks = [];
    uiState = { collapsed: {} };
    loadTasks();
    renderFinancialsPage();
  }, 'Reset', 'Cancel');
}

function bootDashboard() {
  try {
    if (sessionStorage.getItem('dashboardUnlocked') === '1') {
      const gate = document.getElementById('authGate');
      if (gate) gate.style.display = 'none';
    }
    loadTasks();
    toggleFeeFields();
    renderInvoicesPage();
    if (new URLSearchParams(location.search).get('view') === 'ziyarat') {
      isFamilyPublicView = true;
      switchPage('financials');
    }
    syncCloudFinLedger();
    pullFromCalendar();
  } catch (err) {
    const app = document.getElementById('app');
    if (app) app.innerHTML = '<div class="statement-sheet"><div class="statement-body">Dashboard could not start: ' + escapeForHtml(err.message) + '</div></div>';
    console.error(err);
  }
}
document.addEventListener('DOMContentLoaded', bootDashboard);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    syncCloudFinLedger();
    pullFromCalendar();
  }
});
</script>
</body>
</html>
