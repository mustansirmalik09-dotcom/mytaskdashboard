<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Live Task Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,500;0,600;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<meta name="theme-color" content="#EFF6FF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
  :root {
    --bg: #F4F7FE;
    --sheet: #FFFFFF;
    --sheet-alt: #F8FAFC;
    --ink: #0F172A;
    --ink-light: #1E293B;
    --muted: #64748B;
    --muted-light: #94A3B8;
    --icon: #64748B;
    --field: #CBD5E1;
    --rule: #E2E8F0;
    --rule-soft: #F1F5F9;

    /* Vibrant Corporate Palette */
    --accent: #2563EB;
    --accent-hover: #1D4ED8;
    --accent-soft: #EFF6FF;
    --accent-border: #BFDBFE;

    --violet: #7C3AED;
    --violet-soft: #F5F3FF;
    --violet-border: #DDD6FE;

    --coral: #E11D48;
    --red: #E11D48;
    --red-soft: #FFF1F2;
    --red-border: #FECDD3;

    --green: #059669;
    --green-soft: #ECFDF5;
    --green-border: #A7F3D0;

    --amber: #D97706;
    --amber-soft: #FFFBEB;
    --amber-border: #FDE68A;

    --cyan: #0891B2;
    --cyan-soft: #ECFEFF;

    --c-mhj: #2563EB;
    --c-shk: #7C3AED;
    --c-own: #0D9488;
    --c-personal: #E11D48;
    --c-fees: #F59E0B;

    --serif: 'Newsreader', Georgia, 'Times New Roman', serif;
    --sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;

    --shadow-xs: 0 1px 2px rgba(37, 99, 235, 0.05);
    --shadow-sm: 0 2px 6px rgba(15, 23, 42, 0.05), 0 1px 2px rgba(37, 99, 235, 0.04);
    --shadow-md: 0 8px 18px -4px rgba(37, 99, 235, 0.10), 0 2px 6px -2px rgba(15, 23, 42, 0.05);
    --shadow-modal: 0 25px 50px -12px rgba(15, 23, 42, 0.28);
  }

  * { box-sizing: border-box; }
  html { background: var(--bg); overflow-x: hidden; width: 100%; max-width: 100vw; -webkit-text-size-adjust: 100%; }
  
  body {
    font-family: var(--sans); font-size: 13.5px; line-height: 1.45; color: var(--ink);
    background: radial-gradient(circle at 0% 0%, #EEF2FF 0%, #F4F7FE 45%, #F0FDF4 100%);
    margin: 0 auto; max-width: 1120px; padding: 10px 10px 64px;
    overflow-x: hidden; width: 100%; -webkit-font-smoothing: antialiased;
  }

  button, input, select { font-family: var(--sans); }
  button, [role=button] { -webkit-tap-highlight-color: transparent; }
  :where(button, input, select, a, [role=button]):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .ic { width: 15px; height: 15px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* Vibrant Corporate Masthead */
  .masthead {
    display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center;
    gap: 8px; margin-bottom: 10px; padding: 10px 14px;
    background: linear-gradient(120deg, #1E3A8A 0%, #2563EB 55%, #7C3AED 100%);
    color: #FFFFFF; border-radius: 14px; box-shadow: var(--shadow-md);
  }
  .masthead-brand { display: flex; align-items: center; gap: 10px; }
  .masthead-crest {
    width: 36px; height: 36px; border-radius: 10px;
    background: rgba(255, 255, 255, 0.18); backdrop-filter: blur(6px);
    color: #FFFFFF; display: grid; place-content: center;
    font-family: var(--serif); font-weight: 600; font-size: 16px;
    border: 1px solid rgba(255, 255, 255, 0.35);
  }
  h1 { font-family: var(--serif); font-weight: 600; font-size: 20px; line-height: 1.15; margin: 0; color: #FFFFFF; }
  .sub { color: #DBEAFE; font-size: 11.5px; font-weight: 500; margin-top: 1px; display: flex; align-items: center; gap: 5px; }
  .sub-dot { width: 4px; height: 4px; border-radius: 50%; background: #93C5FD; }
  
  .masthead .status { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #E0E7FF; }
  .sync-badge {
    display: inline-flex; align-items: center; gap: 5px;
    background: rgba(255, 255, 255, 0.16); border: 1px solid rgba(255, 255, 255, 0.28); border-radius: 999px;
    padding: 3px 9px; font-size: 10.5px; font-weight: 600; color: #FFFFFF;
  }
  .pulse-dot { width: 6px; height: 6px; border-radius: 50%; background: #34D399; box-shadow: 0 0 6px #34D399; }
  #resetBtn {
    background: rgba(255, 255, 255, 0.16); border: 1px solid rgba(255, 255, 255, 0.28); border-radius: 7px;
    padding: 3px 8px; font: 600 10.5px var(--sans); color: #FFFFFF; cursor: pointer;
  }
  #resetBtn:hover { background: rgba(255, 255, 255, 0.28); }

  /* Compact Summary Sheet */
  .summary-sheet {
    background: var(--sheet); border: 1px solid var(--rule); border-radius: 14px;
    margin-bottom: 10px; overflow: hidden; box-shadow: var(--shadow-sm);
  }
  .hero-stats { display: grid; grid-template-columns: repeat(4, 1fr); }
  .hero-card { display: flex; flex-direction: column-reverse; justify-content: flex-end; min-width: 0; padding: 8px 8px; position: relative; }
  .hero-card + .hero-card { border-left: 1px solid var(--rule-soft); }
  .hero-card .l { font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin-top: 1px; }
  .hero-card .n { font-family: var(--serif); font-weight: 600; font-size: 17px; line-height: 1.1; font-variant-numeric: tabular-nums; color: var(--ink); }
  .hero-card:nth-child(1) { background: linear-gradient(180deg, #ECFDF5 0%, #FFFFFF 100%); }
  .hero-card:nth-child(1) .n { color: var(--green); }
  .hero-card:nth-child(2) { background: linear-gradient(180deg, #FFFBEB 0%, #FFFFFF 100%); }
  .hero-card:nth-child(2) .n { color: var(--amber); }
  .hero-card:nth-child(3) { background: linear-gradient(180deg, #ECFEFF 0%, #FFFFFF 100%); }
  .hero-card:nth-child(3) .n { color: var(--cyan); }
  .hero-card:nth-child(4) { background: linear-gradient(180deg, #EFF6FF 0%, #FFFFFF 100%); }
  .hero-card:nth-child(4) .n { color: var(--accent); }

  .totals { border-top: 1px solid var(--rule-soft); padding: 4px 0 3px; background: #FAFCFF; }
  .totals > .tot { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 3px 12px; }
  .totals .l { font-size: 11.5px; font-weight: 600; color: var(--muted); }
  .totals .fig { font-family: var(--serif); font-weight: 600; font-size: 15px; font-variant-numeric: tabular-nums; color: var(--ink); }
  .totals > .tot.sum { margin: 3px 12px 0; padding: 5px 0 3px; border-top: 1px dashed var(--rule); }
  .totals .fig.out { color: var(--red); font-size: 16px; border-bottom: 2px solid var(--red); }

  /* Compact Toolbar: Search + Add Task */
  #searchRow { margin: 0 0 8px; }
  #searchWrap { position: relative; }
  #searchWrap .ico { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--accent); pointer-events: none; width: 15px; height: 15px; }
  #searchBox {
    width: 100%; height: 36px; background: #FFFFFF; border: 1.5px solid var(--accent-border); color: var(--ink);
    padding: 0 32px 0 32px; border-radius: 10px; font: 500 13px var(--sans); box-shadow: var(--shadow-xs);
  }
  #searchBox:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.14); }
  #searchClear { display: none; position: absolute; right: 4px; top: 4px; width: 28px; height: 28px; border: 0; background: transparent; color: var(--muted); cursor: pointer; }
  #searchInfo { font-size: 11.5px; color: var(--muted); margin: 4px 2px 0; }
  #searchInfo:empty { display: none; }

  .add-box { display: flex; gap: 5px; margin-bottom: 8px; flex-wrap: wrap; }
  .add-box input, .add-box select {
    height: 36px; background: #FFFFFF; border: 1.5px solid var(--rule); color: var(--ink);
    padding: 0 9px; border-radius: 9px; font: 500 12.5px var(--sans); max-width: 100%; min-width: 0;
  }
  .add-box input:focus, .add-box select:focus { outline: none; border-color: var(--accent); }
  #newCat { flex: 1 1 130px; font-weight: 600; color: var(--accent); background: var(--accent-soft); border-color: var(--accent-border); }
  .add-box input[type=text] { flex: 2 1 170px; }
  .add-box button {
    height: 36px; padding: 0 16px; background: linear-gradient(135deg, #2563EB 0%, #7C3AED 100%);
    color: #FFFFFF; border: 0; border-radius: 9px; font: 700 12.5px var(--sans); cursor: pointer;
    box-shadow: 0 2px 6px rgba(124, 58, 237, 0.25);
  }
  .add-box button:hover { filter: brightness(1.07); }

  /* Playful Category Filters & Sections */
  .filters { display: flex; gap: 5px; margin-bottom: 8px; flex-wrap: wrap; }
  .filters.seg {
    gap: 3px; flex-wrap: nowrap; padding: 3px; background: #E0E7FF;
    border: 1px solid #C7D2FE; border-radius: 10px; overflow-x: auto; scrollbar-width: none;
  }
  .filters.seg::-webkit-scrollbar { display: none; }
  .filter-btn { cursor: pointer; font: 600 12px var(--sans); transition: all 0.15s ease; }
  .filters.seg .filter-btn {
    flex: 1 1 auto; border: 0; background: transparent; color: #3730A3;
    padding: 5px 9px; border-radius: 7px; white-space: nowrap;
  }
  .filters.seg .filter-btn.active {
    background: linear-gradient(135deg, #2563EB 0%, #4F46E5 100%);
    color: #FFFFFF; font-weight: 700; box-shadow: 0 2px 5px rgba(37, 99, 235, 0.25);
  }
  .filters.chips { margin-bottom: 10px; gap: 5px; }
  .filters.chips .filter-btn {
    display: inline-flex; align-items: center; background: #FFFFFF; border: 1.5px solid var(--rule);
    color: var(--ink); padding: 4px 10px; border-radius: 999px; font-size: 11.5px; font-weight: 600;
  }
  .filters.chips .filter-btn.active {
    background: linear-gradient(135deg, #EFF6FF 0%, #F5F3FF 100%);
    border-color: var(--accent); color: var(--accent); font-weight: 700;
  }
  .filter-btn .dot { width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; flex: none; }

  .cat-section { margin-bottom: 12px; }
  .cat-heading {
    display: flex; align-items: center; gap: 7px; margin: 0 0 6px; padding: 5px 10px;
    background: #FFFFFF; border: 1px solid var(--rule); border-radius: 9px; cursor: pointer;
    box-shadow: var(--shadow-xs);
  }
  .cat-heading .dot { width: 9px; height: 9px; border-radius: 3px; flex: none; }
  .cat-heading .title { font-family: var(--serif); font-weight: 600; font-size: 15.5px; color: var(--ink); }
  .cat-heading .count {
    margin-left: auto; padding: 2px 8px; background: var(--accent-soft); border: 1px solid var(--accent-border);
    border-radius: 999px; font: 600 10.5px var(--sans); color: var(--accent);
  }
  .cat-section.collapsed .cat-heading .chev { transform: rotate(-90deg); }

  /* Compact Tasks List */
  .task-grid { background: var(--sheet); border: 1px solid var(--rule); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow-sm); }
  .task {
    display: flex; align-items: flex-start; gap: 7px; padding: 8px 10px;
    border-top: 1px solid var(--rule-soft); position: relative; transition: background 0.12s ease;
  }
  .task:hover { background: #FAFBFD; }
  .task:first-child { border-top: 0; }
  .task.done { opacity: 0.72; }
  .task.done .task-name { text-decoration: line-through; color: var(--muted); font-weight: 500; }
  .task .num { flex: none; width: 16px; text-align: right; font-size: 11px; line-height: 19px; color: var(--muted-light); font-weight: 600; }
  .task input[type=checkbox] {
    -webkit-appearance: none; appearance: none; flex: none; display: grid; place-content: center;
    width: 17px; height: 17px; margin: 1px 0 0; border: 1.8px solid #94A3B8; border-radius: 5px; background: var(--sheet); cursor: pointer;
  }
  .task input[type=checkbox]:checked { background: linear-gradient(135deg, #10B981, #059669); border-color: #059669; }
  .task input[type=checkbox]:checked::before { content: ''; width: 8px; height: 4px; margin-top: -2px; border-left: 2px solid #fff; border-bottom: 2px solid #fff; transform: rotate(-45deg); }
  .task-body { flex: 1; min-width: 0; }
  .task-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 6px; }
  .task-name { flex: 1; min-width: 0; font-size: 13.5px; line-height: 1.32; font-weight: 600; color: var(--ink); overflow-wrap: break-word; word-break: break-word; }
  .amt { flex: none; text-align: right; font-family: var(--serif); font-weight: 700; font-size: 14.5px; }
  .amt.owed { color: var(--red); }
  .amt.clear { font: 700 10.5px var(--sans); color: var(--green); background: var(--green-soft); border: 1px solid var(--green-border); padding: 1px 6px; border-radius: 5px; }
  .task-sub { font-size: 11px; color: var(--muted); margin-top: 1px; }
  .note {
    display: flex; align-items: flex-start; gap: 5px; margin-top: 4px; padding: 3px 8px; border-radius: 6px;
    background: linear-gradient(90deg, #FFFBEB 0%, #FEF3C7 100%); border: 1px solid var(--amber-border); color: #92400E; font-size: 11px; font-weight: 500;
  }
  .task-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 9px; margin-top: 3px; font-size: 11.5px; }
  .act { display: inline-flex; align-items: center; gap: 4px; padding: 2px 0; background: none; border: 0; font: 700 11px var(--sans); color: var(--accent); cursor: pointer; }
  .act.pay { padding: 2px 8px; border: 1px solid var(--accent-border); border-radius: 6px; background: var(--accent-soft); color: var(--accent); }
  .act.wa { color: var(--green); }
  .act.del { flex: none; justify-content: center; width: 24px; height: 24px; color: var(--icon); border: 0; background: none; cursor: pointer; }
  .act.del:hover { color: var(--red); }
  .done-toggle {
    display: block; width: 100%; text-align: left; padding: 7px 12px; background: #F8FAFC; border: 0; border-top: 1px solid var(--rule-soft);
    color: var(--accent); font: 600 11.5px var(--sans); cursor: pointer;
  }

  /* Vibrant Page Nav */
  .page-nav {
    display: flex; gap: 5px; margin: 0 0 10px; padding: 3px;
    background: #E0E7FF; border: 1px solid #C7D2FE; border-radius: 12px; width: 100%;
  }
  .page-nav-btn {
    flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 5px;
    padding: 7px 8px; border-radius: 9px; border: 0; background: transparent;
    color: #3730A3; font: 700 12px var(--sans); cursor: pointer; transition: all 0.15s ease;
  }
  .page-nav-btn.active {
    background: linear-gradient(135deg, #2563EB 0%, #7C3AED 100%);
    color: #FFFFFF; box-shadow: 0 2px 6px rgba(37, 99, 235, 0.25);
  }
  .page-nav-btn .nav-badge { background: rgba(37, 99, 235, 0.12); color: #1E3A8A; padding: 1px 6px; border-radius: 999px; font-size: 10px; font-weight: 800; }
  .page-nav-btn.active .nav-badge { background: rgba(255, 255, 255, 0.24); color: #FFFFFF; }

  /* Financials Page & Collapsible Accordion Sheets */
  #financialsView { display: none; width: 100%; max-width: 100%; }
  .fin-mode-toggle {
    display: flex; gap: 3px; padding: 3px; background: #E0E7FF; border: 1px solid #C7D2FE;
    border-radius: 9px; margin-bottom: 10px; overflow-x: auto; width: 100%; scrollbar-width: none;
  }
  .fin-mode-toggle::-webkit-scrollbar { display: none; }
  .fin-mode-btn {
    flex: 0 0 auto; border: 0; background: transparent; padding: 5px 10px; border-radius: 7px;
    font: 700 11px var(--sans); color: #3730A3; cursor: pointer; white-space: nowrap;
  }
  .fin-mode-btn.active { background: #FFFFFF; color: var(--accent); box-shadow: 0 1px 3px rgba(37, 99, 235, 0.18); }

  .fin-hero-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 10px; width: 100%; }
  .fin-card {
    background: #FFFFFF; border: 1px solid var(--rule); border-radius: 11px; padding: 9px 11px;
    box-shadow: var(--shadow-xs); border-top: 3px solid var(--accent);
  }
  .fin-card:nth-child(1) { border-top-color: var(--green); background: linear-gradient(180deg, #ECFDF5 0%, #FFFFFF 55%); }
  .fin-card:nth-child(2) { border-top-color: #2563EB; background: linear-gradient(180deg, #EFF6FF 0%, #FFFFFF 55%); }
  .fin-card:nth-child(3) { border-top-color: var(--coral); background: linear-gradient(180deg, #FFF1F2 0%, #FFFFFF 55%); }
  .fin-card:nth-child(4) { border-top-color: var(--violet); background: linear-gradient(180deg, #F5F3FF 0%, #FFFFFF 55%); }
  .fin-card .f-lbl { font-size: 9.5px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
  .fin-card .f-val { font-family: var(--serif); font-size: 17.5px; font-weight: 700; color: var(--ink); margin: 2px 0 1px; }
  .fin-card .f-sub { font-size: 10px; color: var(--muted); font-weight: 500; }

  .statement-sheet {
    background: #FFFFFF; border: 1px solid var(--rule); border-radius: 13px;
    box-shadow: var(--shadow-sm); margin-bottom: 9px; overflow: hidden; width: 100%;
    transition: box-shadow 0.15s ease;
  }
  .statement-sheet:hover { box-shadow: var(--shadow-md); }
  .statement-header {
    background: linear-gradient(120deg, #1E3A8A 0%, #2563EB 60%, #0D9488 100%); color: #FFFFFF;
    padding: 11px 13px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px;
    cursor: pointer; user-select: none;
  }
  .statement-header-left { display: flex; align-items: center; gap: 9px; min-width: 0; flex: 1; }
  .stmt-chev {
    width: 22px; height: 22px; border-radius: 6px; background: rgba(255, 255, 255, 0.16);
    display: grid; place-content: center; flex: none; transition: transform 0.2s ease;
  }
  .statement-sheet.collapsed .stmt-chev { transform: rotate(-90deg); }
  .statement-header h3 { font-family: var(--serif); font-size: 15px; font-weight: 600; margin: 0; line-height: 1.2; }
  .statement-body { padding: 10px 10px; width: 100%; }

  /* Loans & Advances Cards */
  .loan-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 8px; margin-bottom: 8px; }
  .loan-card {
    background: #FFFFFF; border: 1px solid var(--rule); border-radius: 10px; padding: 10px 12px;
    box-shadow: var(--shadow-xs); display: flex; flex-direction: column; justify-content: space-between;
  }
  .loan-pill { font-size: 9.5px; font-weight: 800; text-transform: uppercase; padding: 2px 6px; border-radius: 5px; }
  .loan-pill.asset { background: var(--red-soft); color: var(--red); border: 1px solid var(--red-border); }
  .loan-pill.liab { background: var(--amber-soft); color: var(--amber); border: 1px solid var(--amber-border); }
  .loan-pill.settled { background: var(--green-soft); color: var(--green); border: 1px solid var(--green-border); }

  /* Table Responsive Wrapper & Horizontal Touch Scrolling */
  .table-responsive {
    width: 100%;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    margin-bottom: 10px;
    border: 1px solid var(--rule);
    border-radius: 9px;
    background: #FFFFFF;
  }
  .stmt-table {
    width: 100%;
    min-width: 520px;
    border-collapse: collapse;
    font-size: 11.5px;
  }
  .stmt-table th {
    background: linear-gradient(90deg, #EFF6FF 0%, #F5F3FF 100%); border-bottom: 1.5px solid #C7D2FE; padding: 7px 9px;
    font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; color: #1E3A8A;
    white-space: nowrap;
  }
  .stmt-table td {
    padding: 7px 9px; border-bottom: 1px solid var(--rule-soft); vertical-align: top;
    overflow-wrap: break-word; word-break: break-word;
  }
  .stmt-table tr:last-child td { border-bottom: 0; }
  .stmt-mono { font-family: var(--serif); font-weight: 700; font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .text-right { text-align: right; }

  /* Modal */
  #modalOverlay {
    position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(5px);
    z-index: 1000; align-items: center; justify-content: center; padding: 12px;
  }
  .modal {
    background: #FFFFFF; border-radius: 16px; padding: 16px 16px; width: 100%; max-width: 400px;
    max-height: calc(100vh - 24px); max-height: calc(100dvh - 24px); overflow-y: auto;
    box-shadow: var(--shadow-modal); border: 1.5px solid var(--accent-border);
  }
  #modalTitle { font-family: var(--serif); font-weight: 700; font-size: 17.5px; margin-bottom: 10px; color: #1E3A8A; }
  .modal-actions { display: flex; gap: 8px; margin-top: 12px; justify-content: flex-end; }
  #modalFields label { display: block; margin: 0 0 3px; font-size: 10.5px; font-weight: 800; text-transform: uppercase; color: var(--muted); }
  #modalFields input:not([type=checkbox]), #modalFields select {
    display: block; width: 100%; height: 36px; margin-bottom: 9px; padding: 0 10px; background: #FFFFFF; color: var(--ink);
    border: 1.5px solid var(--field); border-radius: 8px; font: 500 13px var(--sans);
  }
  .hint { font-size: 12.5px; color: var(--muted); margin-bottom: 10px; line-height: 1.45; }
  .btn { height: 34px; padding: 0 13px; border-radius: 8px; border: 1px solid transparent; font: 700 12.5px var(--sans); cursor: pointer; transition: all 0.12s ease; }
  .btn-primary { background: linear-gradient(135deg, #2563EB 0%, #7C3AED 100%); color: #fff; box-shadow: 0 2px 5px rgba(37, 99, 235, 0.25); }
  .btn-wa { background: linear-gradient(135deg, #10B981 0%, #059669 100%); color: #fff; box-shadow: 0 2px 5px rgba(5, 150, 105, 0.25); }
  .btn-quiet { background: #FFFFFF; color: #1E3A8A; border-color: #C7D2FE; }
  .btn-danger { background: linear-gradient(135deg, #E11D48 0%, #BE123C 100%); color: #fff; }
  .receipt-preview { white-space: pre-wrap; word-break: break-word; background: var(--green-soft); border: 1px solid var(--green-border); border-radius: 8px; padding: 10px; font-size: 12px; max-height: 220px; overflow-y: auto; }

  /* Auth Gate */
  #authGate {
    position: fixed; inset: 0; z-index: 2000; display: flex; align-items: center; justify-content: center; padding: 16px;
    background: radial-gradient(circle at 20% 20%, #1E3A8A 0%, #0F172A 60%, #312E81 100%);
  }
  .auth-card {
    width: 100%; max-width: 340px; text-align: center;
    background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 18px; padding: 26px 20px; backdrop-filter: blur(14px);
  }
  .auth-crest { width: 44px; height: 44px; margin: 0 auto 12px; border-radius: 12px; background: linear-gradient(135deg, #2563EB, #7C3AED); color: #fff; display: grid; place-content: center; font-family: var(--serif); font-size: 19px; }
  .auth-title { font-family: var(--serif); font-weight: 600; font-size: 22px; color: #FFFFFF; }
  #authInput { width: 100%; height: 42px; margin: 14px 0 10px; padding: 0 14px; background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.25); border-radius: 10px; text-align: center; font-size: 15px; }

  @media (min-width: 720px) {
    body { padding: 16px 20px 64px; }
    h1 { font-size: 24px; }
    .hero-stats { grid-template-columns: repeat(4, 1fr); }
    .fin-hero-grid { grid-template-columns: repeat(4, 1fr); }
    .task-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 10px; background: none; border: 0; box-shadow: none; }
    .task { background: var(--sheet); border: 1px solid var(--rule); border-radius: 10px; box-shadow: var(--shadow-sm); }
    .done-toggle { grid-column: 1 / -1; border: 1px solid var(--rule); border-radius: 10px; background: #FFFFFF; }
    .stmt-table { min-width: 100%; }
  }
</style>
</head>
<body>

<header class="masthead">
  <div class="masthead-brand">
    <div class="masthead-crest">MM</div>
    <div>
      <h1>Mustannsirr Mallik</h1>
      <div class="sub">Tax &amp; Accounts Consultant <span class="sub-dot"></span> Indore</div>
    </div>
  </div>
  <div class="status">
    <span class="sync-badge"><span class="pulse-dot"></span><span id="lastSync">Syncing...</span></span>
    <button id="resetBtn" type="button" onclick="resetData()" title="Reload data">Reset</button>
  </div>
</header>

<nav class="page-nav" role="tablist">
  <button type="button" id="tabTasks" class="page-nav-btn active" onclick="switchPage('tasks')">
    <svg class="ic" viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
    <span>Tasks</span>
  </button>
  <button type="button" id="tabFinancials" class="page-nav-btn" onclick="switchPage('financials')">
    <svg class="ic" viewBox="0 0 24 24"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
    <span>Financials &amp; Ziyarat</span>
    <span class="nav-badge" id="finBadge">₹1.07L</span>
  </button>
  <button type="button" id="tabInvoices" class="page-nav-btn" onclick="switchPage('invoices')">
    <svg class="ic" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
    <span>Invoices</span>
  </button>
</nav>

<div id="modalOverlay" style="display:none;">
  <div class="modal" role="dialog" aria-labelledby="modalTitle">
    <div id="modalTitle"></div>
    <div id="modalFields"></div>
    <div class="modal-actions">
      <button type="button" class="btn btn-quiet" onclick="closeModal()">Skip</button>
      <button type="button" id="modalConfirmBtn" class="btn btn-primary">Save</button>
    </div>
  </div>
</div>

<div id="tasksView">
  <div id="summaryArea"></div>

  <div id="searchRow">
    <div id="searchWrap">
      <svg class="ic ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="text" id="searchBox" placeholder="Search tasks, clients, amounts…" autocomplete="off" oninput="onSearch(this.value)">
      <button type="button" id="searchClear" onclick="clearSearch()"><svg class="ic" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
    <div id="searchInfo"></div>
  </div>

  <div class="add-box">
    <select id="newCat" onchange="onCategoryChange()">
      <option value="PERSONAL">Personal</option>
      <option value="OWN">Professional — OWN</option>
      <option value="MHJ">Professional — MHJ</option>
      <option value="SHK">Professional — SHK Husain Arif</option>
      <option value="FEES">Fees</option>
      <option value="__NEW__">+ New category…</option>
    </select>
    <input type="text" id="newTask" placeholder="New task or client…" onkeydown="if(event.key==='Enter'){ event.preventDefault(); addTask(); }">
    <input type="date" id="newDueDate" style="flex:1; min-width:110px;">
    <button onclick="addTask()">+ Add</button>
  </div>
  <div class="add-box" id="feeFields" style="display:none;">
    <input type="number" id="feePayable" placeholder="₹ Billable" style="flex:1; min-width:90px;">
    <input type="number" id="feeReceived" placeholder="₹ Received" style="flex:1; min-width:90px;">
    <input type="text" id="feeLinked" placeholder="Linked client name" style="flex:1.5;">
    <input type="tel" id="feePhone" placeholder="Client phone" style="flex:1.5;">
  </div>

  <div id="app">
    <div class="loading" style="text-align:center; padding:30px; color:var(--muted);">Loading tasks...</div>
  </div>
</div>

<div id="financialsView"></div>
<div id="invoicesView" style="display:none; width:100%; max-width:100%;"></div>

<div id="authGate">
  <div class="auth-card">
    <div class="auth-crest">MM</div>
    <div class="auth-title">Mustannsirr Mallik</div>
    <div style="font-size:12px; color:#CBD5E1; margin-top:3px;">Tax &amp; Accounts Consultant &bull; Indore</div>
    <input type="password" id="authInput" placeholder="Enter password" onkeydown="if(event.key==='Enter'){ checkAuth(); }">
    <button type="button" class="btn btn-primary" style="width:100%; height:42px;" onclick="checkAuth()">Unlock Dashboard</button>
    <div id="authError" style="display:none; color:#FDA4AF; margin-top:10px; font-size:12.5px; font-weight:600;">Incorrect password</div>
  </div>
</div>

<button type="button" id="toTop" style="display:none; position:fixed; bottom:20px; right:20px; width:40px; height:40px; border-radius:50%; background:linear-gradient(135deg, #2563EB, #7C3AED); color:#fff; border:0; cursor:pointer; box-shadow:0 4px 12px rgba(37,99,235,0.35);" onclick="scrollToTop()">↑</button>

<script>
var tasks = [];
var filter = 'all';
var activePage = 'tasks';
var finViewMode = 'all';
var isFamilyPublicView = false;
var uiState = { collapsed: {}, finOpen: {}, showSummaryDetails: false };
var doneOpen = {};
var searchQuery = '';
var searchTimer = null;

const STORAGE_KEY = 'tasks-v2';
const FIN_LEDGER_KEY = 'mm_fin_ledger_v3';
const UI_KEY = 'dash-ui-v1';
const WEBHOOK_KEY = 'webhookUrl';
const DEFAULT_WEBHOOK = 'https://script.google.com/macros/s/AKfycbwbXqpF6ok4OLydQae2ORcc_AL9_UM-2km5hQYUMR0y1grw24D42SQB6RGrUnEo68NZCg/exec';

try {
  const savedUi = JSON.parse(localStorage.getItem(UI_KEY) || '{}');
  if (savedUi && savedUi.collapsed) uiState.collapsed = savedUi.collapsed;
  if (savedUi && savedUi.finOpen) uiState.finOpen = savedUi.finOpen;
  if (savedUi && typeof savedUi.showSummaryDetails === 'boolean') uiState.showSummaryDetails = savedUi.showSummaryDetails;
} catch (e) {}

const ICON = {
  chat: '<svg class="ic" viewBox="0 0 24 24"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>',
  doc: '<svg class="ic" viewBox="0 0 24 24"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M16 13H8"/><path d="M16 17H8"/><path d="M10 9H8"/></svg>',
  note: '<svg class="ic" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>',
  wallet: '<svg class="ic" viewBox="0 0 24 24"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/></svg>',
  x: '<svg class="ic" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>',
  chev: '<svg class="ic chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>'
};

const EXTRA_COLORS = ['#2563EB', '#7C3AED', '#0D9488', '#E11D48', '#F59E0B'];

function inr(n) {
  const v = Math.round((Number(n) || 0) * 100) / 100;
  return (v < 0 ? '-' : '') + '₹' + Math.abs(v).toLocaleString('en-IN');
}

function escapeForHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function getWebhook() {
  return localStorage.getItem(WEBHOOK_KEY) || DEFAULT_WEBHOOK;
}

function saveUi() {
  try { localStorage.setItem(UI_KEY, JSON.stringify(uiState)); } catch (e) {}
}

function toggleSummaryDetails() {
  uiState.showSummaryDetails = !uiState.showSummaryDetails;
  saveUi();
  render();
}

function toggleGroup(key) {
  if (uiState.collapsed[key]) delete uiState.collapsed[key]; else uiState.collapsed[key] = true;
  saveUi();
  render();
}

function toggleFinSection(key) {
  if (!uiState.finOpen) uiState.finOpen = {};
  uiState.finOpen[key] = !uiState.finOpen[key];
  saveUi();
  renderFinancialsPage();
}

function toggleAllFinSections(expand) {
  const keys = ['journal', 'trip', 'loans', 'expenses', 'pl', 'bs', 'bank'];
  if (!uiState.finOpen) uiState.finOpen = {};
  keys.forEach(k => { uiState.finOpen[k] = !!expand; });
  saveUi();
  renderFinancialsPage();
}

function toggleAllGroups(collapse) {
  const keys = ['MHJ', 'SHK', 'OWN', 'personal', 'FEES'];
  keys.forEach(k => {
    if (collapse) uiState.collapsed[k] = true;
    else delete uiState.collapsed[k];
  });
  saveUi();
  render();
}

function toggleDone(key) {
  doneOpen[key] = !doneOpen[key];
  render();
}

function setFilter(f) {
  filter = f;
  render();
}

function setFinViewMode(mode) {
  finViewMode = mode;
  renderFinancialsPage();
}

function onSearch(val) {
  searchQuery = val || '';
  const clr = document.getElementById('searchClear');
  if (clr) clr.style.display = searchQuery ? 'block' : 'none';
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => render(true), 120);
}

function clearSearch() {
  const box = document.getElementById('searchBox');
  if (box) box.value = '';
  onSearch('');
}

function scrollToTop() {
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

window.addEventListener('scroll', () => {
  const b = document.getElementById('toTop');
  if (b) b.style.display = window.scrollY > 500 ? 'block' : 'none';
}, { passive: true });

function showModal(title, fieldsHtml, onConfirm, confirmLabel, skipLabel) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalFields').innerHTML = fieldsHtml;
  document.getElementById('modalOverlay').style.display = 'flex';
  const btn = document.getElementById('modalConfirmBtn');
  const newBtn = btn.cloneNode(true);
  btn.parentNode.replaceChild(newBtn, btn);
  newBtn.textContent = confirmLabel || 'Save';
  newBtn.className = 'btn ' + (confirmLabel === 'Delete' ? 'btn-danger' : (/whatsapp/i.test(confirmLabel || '') ? 'btn-wa' : 'btn-primary'));
  newBtn.onclick = () => { onConfirm(); closeModal(); };
  document.querySelector('#modalOverlay button[onclick="closeModal()"]').textContent = skipLabel || 'Skip';
}

function closeModal() {
  document.getElementById('modalOverlay').style.display = 'none';
}

function switchPage(page) {
  activePage = page;
  const tasksView = document.getElementById('tasksView');
  const finView = document.getElementById('financialsView');
  const invView = document.getElementById('invoicesView');
  const btnTasks = document.getElementById('tabTasks');
  const btnFin = document.getElementById('tabFinancials');
  const btnInv = document.getElementById('tabInvoices');

  if (tasksView) tasksView.style.display = (page === 'tasks') ? 'block' : 'none';
  if (finView) finView.style.display = (page === 'financials') ? 'block' : 'none';
  if (invView) invView.style.display = (page === 'invoices') ? 'block' : 'none';

  if (btnTasks) btnTasks.classList.toggle('active', page === 'tasks');
  if (btnFin) btnFin.classList.toggle('active', page === 'financials');
  if (btnInv) btnInv.classList.toggle('active', page === 'invoices');

  if (page === 'financials') renderFinancialsPage();
  if (page === 'invoices') renderInvoicesPage();
  try { history.replaceState(null, '', '#' + page); } catch (e) {}
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// =========================================================================
// INVOICES & RAZORPAY REMINDERS (AUTOFILLED AMOUNT)
// =========================================================================
function generateOrOpenInvoice(taskId) {
  const t = tasks.find(x => x.id === taskId);
  if (!t) return;
  const existingInv = String(t.invoice || '').split('|')[0].trim();
  if (existingInv) {
    window.open('invoice.html?inv=' + encodeURIComponent(existingInv), '_blank');
    return;
  }
  const balance = Math.max(0, (t.payable || 0) - (t.received || 0) - (t.discount || 0));
  const payUrl = balance > 0 ? `https://razorpay.me/@mustansirmalik/${Math.round(balance * 100) / 100}` : '';
  const url = getWebhook();

  if (t.id && t.id.startsWith('cal_') && url) {
    showModal('Generating Official Invoice...', `<div class="hint">Creating sequential invoice number for <strong>${escapeForHtml(t.linked || t.name)}</strong>...</div>`, () => {}, 'Close', 'Close');
    fetch(url + '?' + new URLSearchParams({
      action: 'getinvoice',
      id: t.id,
      client: t.linked || t.name,
      payable: t.payable || 0,
      received: t.received || 0,
      discount: t.discount || 0,
      balance: balance,
      pay: payUrl
    }).toString())
      .then(r => r.json())
      .then(data => {
        closeModal();
        if (data && data.status === 'ok' && data.invoiceNumber) {
          t.invoice = data.invoiceNumber;
          saveTasks();
          render();
          if (activePage === 'invoices') renderInvoicesPage();
          window.open('invoice.html?inv=' + encodeURIComponent(data.invoiceNumber), '_blank');
        } else {
          openInstantInvoicePreview(t);
        }
      })
      .catch(() => {
        closeModal();
        openInstantInvoicePreview(t);
      });
  } else {
    const ym = new Date().toISOString().slice(0, 7);
    const localNum = 'INV-' + ym + '-' + String(Math.floor(100 + Math.random() * 899));
    t.invoice = localNum;
    saveTasks();
    render();
    if (activePage === 'invoices') renderInvoicesPage();
    openInstantInvoicePreview(t);
  }
}

function openInstantInvoicePreview(t) {
  const payable = Number(t.payable) || 0;
  const received = Number(t.received) || 0;
  const discount = Number(t.discount) || 0;
  const balance = Math.max(0, payable - received - discount);
  const invNo = String(t.invoice || 'INV-DRAFT').split('|')[0].trim();
  const payUrl = balance > 0 ? `https://razorpay.me/@mustansirmalik/${Math.round(balance * 100) / 100}` : '';

  showModal('📄 Invoice ' + invNo, `
    <div style="background:#F8FAFC; border:1px solid var(--rule); border-radius:10px; padding:12px; font-size:12.5px; line-height:1.6;">
      <div style="display:flex; justify-content:space-between; border-bottom:1px solid var(--rule); padding-bottom:6px; margin-bottom:6px;">
        <strong>Mustannsirr Mallik</strong>
        <span style="font-weight:700; color:var(--accent);">${escapeForHtml(invNo)}</span>
      </div>
      <div><strong>Billed To:</strong> ${escapeForHtml(t.linked || t.name)}</div>
      <div><strong>Work:</strong> ${escapeForHtml(t.name)}</div>
      <div style="margin-top:8px; padding-top:8px; border-top:1px dashed var(--rule);">
        <div style="display:flex; justify-content:space-between;"><span>Total Billable:</span><strong>${inr(payable)}</strong></div>
        <div style="display:flex; justify-content:space-between; color:var(--green);"><span>Received:</span><strong>${inr(received)}</strong></div>
        ${discount > 0 ? `<div style="display:flex; justify-content:space-between;"><span>Discount:</span><strong>${inr(discount)}</strong></div>` : ''}
        <div style="display:flex; justify-content:space-between; font-size:14px; margin-top:4px; color:${balance > 0 ? 'var(--red)' : 'var(--green)'};">
          <span>${balance > 0 ? 'Balance Due:' : 'Status:'}</span>
          <strong>${balance > 0 ? inr(balance) : 'PAID / SETTLED'}</strong>
        </div>
      </div>
    </div>
    ${payUrl ? `<div style="margin-top:10px;"><a href="${payUrl}" target="_blank" rel="noopener" class="btn btn-primary" style="width:100%; display:inline-flex; align-items:center; justify-content:center; text-decoration:none;">💳 Pay ${inr(balance)} Online</a></div>` : ''}
  `, () => {}, 'Done', 'Close');
}

function sendWhatsAppReminder(taskId, balance) {
  const t = tasks.find(x => x.id === taskId);
  if (!t) return;
  const clientName = t.linked || t.name;
  const cleanAmt = Math.round((Number(balance) || 0) * 100) / 100;
  const autofillPayUrl = `https://razorpay.me/@mustansirmalik/${cleanAmt}`;
  const invNo = String(t.invoice || '').split('|')[0].trim();

  const buildMsg = (link) => {
    let m = `🧾 *Fee Reminder*\n\nDear Sir/Madam,\n\nA gentle reminder that your fee for *"${clientName}"* is currently pending.\n\n💰 *Amount Due:* ₹${cleanAmt}`;
    if (invNo) m += `\n\n📄 *Invoice ${invNo}:*\nhttps://mustansirrmalikworkdashboard.netlify.app/invoice.html?inv=${encodeURIComponent(invNo)}`;
    m += `\n\n👉 *Pay ₹${cleanAmt} securely here (Amount pre-filled):*\n${link}\n\nThank you for your continued trust.\n\nWarm regards,\n*Mustannsirr Mallik*\n_Tax & Accounts Consultant, Indore_`;
    return m.replace(/&/g, 'and');
  };

  showModal(`📲 Payment Reminder — ${clientName}`, `
    <label>Client Mobile Number (Save for 1-tap WhatsApp)</label>
    <input type="tel" id="remPhoneInput" value="${escapeForHtml(t.phone || '')}" placeholder="e.g. 9876543210">
    <div id="remLinkStatus" style="font-size:11px; color:var(--green); font-weight:600; margin-bottom:6px;">✓ Amount ₹${cleanAmt} pre-filled in payment link</div>
    <div id="remMsgPreview" class="receipt-preview" style="margin-bottom:10px;">${escapeForHtml(buildMsg(autofillPayUrl))}</div>
    <div style="display:flex; gap:8px;">
      <button type="button" id="remSendWaBtn" class="btn btn-wa" style="flex:1;">📲 Send on WhatsApp</button>
      <button type="button" class="btn btn-quiet" onclick="navigator.clipboard.writeText(document.getElementById('remMsgPreview').textContent); this.textContent='Copied ✓';">📋 Copy</button>
    </div>
  `, () => {
    const newPh = (document.getElementById('remPhoneInput').value || '').trim();
    if (newPh !== (t.phone || '')) {
      t.phone = newPh;
      saveTasks();
      render();
    }
  }, 'Save Phone', 'Close');

  let activePayUrl = autofillPayUrl;
  const sendBtn = document.getElementById('remSendWaBtn');
  if (sendBtn) {
    sendBtn.onclick = () => {
      const phRaw = (document.getElementById('remPhoneInput').value || '').trim();
      if (phRaw && phRaw !== t.phone) {
        t.phone = phRaw;
        saveTasks();
        render();
      }
      let cleanPh = phRaw.replace(/[^0-9]/g, '');
      if (cleanPh.length === 10) cleanPh = '91' + cleanPh;
      const phonePart = cleanPh ? 'phone=' + cleanPh + '&' : '';
      const waUrl = 'https://api.whatsapp.com/send?' + phonePart + 'text=' + encodeURIComponent(buildMsg(activePayUrl));
      window.open(waUrl, '_blank');
    };
  }

  const url = getWebhook();
  if (url) {
    fetch(url + '?' + new URLSearchParams({ action: 'razorpaylink', amount: cleanAmt, client: clientName, id: taskId }).toString())
      .then(r => r.json())
      .then(data => {
        if (data && data.status === 'ok' && data.shortUrl) {
          activePayUrl = data.shortUrl;
          const prevEl = document.getElementById('remMsgPreview');
          const stEl = document.getElementById('remLinkStatus');
          if (prevEl) prevEl.textContent = buildMsg(activePayUrl);
          if (stEl) stEl.textContent = '✓ Dedicated Razorpay link generated (₹' + cleanAmt + ' locked)';
        }
      })
      .catch(() => {});
  }
}

function sendCustomLoanReminder(partyName, phone, balance) {
  const cleanAmt = Math.round((Number(balance) || 0) * 100) / 100;
  const payUrl = `https://razorpay.me/@mustansirmalik/${cleanAmt}`;
  let cleanPh = (phone || '').replace(/[^0-9]/g, '');
  if (cleanPh.length === 10) cleanPh = '91' + cleanPh;
  const msg = `🧾 *Payment Reminder*\n\nDear ${partyName},\n\nA gentle reminder regarding the pending advance/loan balance of *₹${cleanAmt}*.\n\n👉 *Pay ₹${cleanAmt} securely here (Amount pre-filled):*\n${payUrl}\n\nWarm regards,\n*Mustannsirr Mallik*`.replace(/&/g, 'and');
  const waUrl = 'https://api.whatsapp.com/send?' + (cleanPh ? 'phone=' + cleanPh + '&' : '') + 'text=' + encodeURIComponent(msg);

async function pullFromCalendar() {
  const url = getWebhook();
  if (!url) return;
  try {
    const res = await fetch(url);
    const events = await res.json();
    if (!Array.isArray(events)) return;

    const existingIds = new Set(tasks.map(t => t.id));
    let changedCount = 0;

    events.forEach(ev => {
      if (/Monthly Salary Receivable/i.test(ev.title) || /Hakimi Vihar Society/i.test(ev.title)) return;

      if (existingIds.has(ev.id)) {
        const local = tasks.find(x => x.id === ev.id);
        if (local) {
          let changed = false;
          if (local.name !== ev.title) { local.name = ev.title; changed = true; }
          if (local.done !== ev.done) { local.done = ev.done; changed = true; }
          if (local.dueDate !== (ev.dueDate || null)) { local.dueDate = ev.dueDate || null; changed = true; }
          if (local.remark !== (ev.remark || '')) { local.remark = ev.remark || ''; changed = true; }
          if (ev.tag === 'FEES') {
            if (local.payable !== (ev.payable || 0)) { local.payable = ev.payable || 0; changed = true; }
            if (local.received !== (ev.received || 0)) { local.received = ev.received || 0; changed = true; }
            if (local.discount !== (ev.discount || 0)) { local.discount = ev.discount || 0; changed = true; }
            if (local.linked !== (ev.linked || '')) { local.linked = ev.linked || ''; changed = true; }
            if (local.phone !== (ev.phone || '')) { local.phone = ev.phone || ''; changed = true; }
            if (local.invoice !== (ev.invoice || '')) { local.invoice = ev.invoice || ''; changed = true; }
            if (local.feeCat !== (ev.feeCat || '')) { local.feeCat = ev.feeCat || ''; changed = true; }
          }
          if (changed) changedCount++;
        }
        return;
      }

      const tag = ev.tag;
      const type = tag === 'PERSONAL' ? 'personal' : (tag === 'FEES' ? 'fee' : 'professional');
      const cat = (tag === 'PERSONAL') ? null : tag;
      const task = {
        id: ev.id,
        name: ev.title,
        type,
        cat,
        due: '',
        dueDate: ev.dueDate || null,
        done: ev.done,
        urgent: false,
        remark: ev.remark || ''
      };
      if (tag === 'FEES') {
        task.payable = ev.payable || 0;
        task.received = ev.received || 0;
        task.discount = ev.discount || 0;
        task.linked = ev.linked || '';
        task.phone = ev.phone || '';
        task.invoice = ev.invoice || '';
        task.feeCat = ev.feeCat || '';
      }
      tasks.push(task);
      changedCount++;
    });

    if (changedCount > 0) {
      saveTasks();
      render();
      if (activePage === 'financials') renderFinancialsPage();
      if (activePage === 'invoices') renderInvoicesPage();
    }
    const badge = document.getElementById('lastSync');
    if (badge) badge.textContent = 'Synced ✓ ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  } catch (e) {
    const badge = document.getElementById('lastSync');
    if (badge) badge.textContent = 'Offline Cache';
  }
}

        body: JSON.stringify({ action: 'savefinledger', ledger })
      }).catch(() => {});
    }
  } catch (e) {}
}

function mergeFinLedgers(local, cloud) {
  if (!cloud || typeof cloud !== 'object') return local;
  const localTs = Number(local.updatedAt) || 0;
  const cloudTs = Number(cloud.updatedAt) || 0;
  const base = (cloudTs > localTs) ? Object.assign({}, local, cloud) : Object.assign({}, cloud, local);
  const deletedSet = new Set([...(local.deletedIds || []), ...(cloud.deletedIds || [])]);

  const mergeById = (arrA, arrB) => {
    const map = new Map();
    [...(arrA || []), ...(arrB || [])].forEach(item => {
      if (item && item.id && !deletedSet.has(item.id)) map.set(item.id, item);
    });
    return Array.from(map.values());
  };

  const merged = Object.assign({}, base);
  merged.deletedIds = Array.from(deletedSet);
  merged.kathiyawadTrip = Object.assign({}, base.kathiyawadTrip);
  merged.kathiyawadTrip.payments = mergeById(
    local.kathiyawadTrip && local.kathiyawadTrip.payments,
    cloud.kathiyawadTrip && cloud.kathiyawadTrip.payments
  );
  merged.kathiyawadTrip.contributions = mergeById(
    local.kathiyawadTrip && local.kathiyawadTrip.contributions,
    cloud.kathiyawadTrip && cloud.kathiyawadTrip.contributions
  );
  merged.expenses = mergeById(local.expenses, cloud.expenses);
  merged.customLoans = mergeById(local.customLoans, cloud.customLoans);
  merged.loanTransactions = mergeById(local.loanTransactions, cloud.loanTransactions);
  merged.journalEntries = mergeById(local.journalEntries, cloud.journalEntries);
  merged.customExpenseCategories = Array.from(new Set([
    ...(local.customExpenseCategories || []),
    ...(cloud.customExpenseCategories || [])
  ]));
  merged.updatedAt = Math.max(localTs, cloudTs);
  return merged;
}

async function syncCloudFinLedger() {
  const url = getWebhook();
  if (!url) return;
  try {
    const res = await fetch(url + '?action=getfinledger');
    const data = await res.json();
    if (data && data.status === 'ok' && data.ledger) {
      const local = getFinLedger();
      const merged = mergeFinLedgers(local, data.ledger);
      localStorage.setItem(FIN_LEDGER_KEY, JSON.stringify(merged));
      render();
      if (activePage === 'financials') renderFinancialsPage();
    }
  } catch (e) {}
}

const JOURNAL_ACCOUNTS = {
  CASH: 'Cash in Hand (Asset)',
  BANK_SLICE: 'slice SFB Bank (Asset)',
  LOAN_JUZER: 'Juzer Presswala — Loan Given (Asset)',
  LOAN_MHJ: 'MHJ — Loan Taken (Liability)',
  LOAN_HATIM: 'Hatim Bhai — Loan Taken (Liability)',
  INCOME_FEES: 'Professional Fees Income (P&L)',
  EXP_BUSINESS: 'Business Operating Expense (P&L)',
  DRAWINGS: 'Personal Drawings (Capital Deduction)',
  CAPITAL: "Owner's Capital Account (Equity)",
  TRIP_ZIYARAT: 'Kathiyawad Ziyarat Trip Advance (Asset)'
};

function applyJournalSide(ledger, account, amt, sign) {
  // sign = +1 for Debit, -1 for Credit
  const delta = amt * sign;
  if (account === 'CASH') ledger.cashInHand = (Number(ledger.cashInHand) || 0) + delta;
  else if (account === 'BANK_SLICE') ledger.bankSlice = (Number(ledger.bankSlice) || 0) + delta;
  else if (account === 'LOAN_JUZER') ledger.loansGiven.juzer.adjustments = (ledger.loansGiven.juzer.adjustments || 0) + delta;
  else if (account === 'LOAN_MHJ') ledger.loansTaken.mhj.adjustments = (ledger.loansTaken.mhj.adjustments || 0) - delta;
  else if (account === 'LOAN_HATIM') ledger.loansTaken.hatim.adjustments = (ledger.loansTaken.hatim.adjustments || 0) - delta;
  else if (account === 'CAPITAL') ledger.openingCapital = (Number(ledger.openingCapital) || 0) - delta;
}

function openJournalEntryModal() {
  const opts = Object.entries(JOURNAL_ACCOUNTS).map(([k, v]) => `<option value="${k}">${escapeForHtml(v)}</option>`).join('');
  showModal('📒 Record Double-Entry Journal Voucher', `
    <label>Voucher Date</label>
    <input type="date" id="jvDate" value="${new Date().toISOString().slice(0, 10)}">
    <label>Debit Account (Dr)</label>
    <select id="jvDr">${opts}</select>
    <label>Credit Account (Cr)</label>
    <select id="jvCr">
      ${Object.entries(JOURNAL_ACCOUNTS).map(([k, v]) => `<option value="${k}" ${k === 'BANK_SLICE' ? 'selected' : ''}>${escapeForHtml(v)}</option>`).join('')}
    </select>
    <label>Amount (₹)</label>
    <input type="number" id="jvAmt" placeholder="₹ Amount">
    <label>Narration / Reference</label>
    <input type="text" id="jvNarr" placeholder="e.g. Adjustment / Transfer / Fee entry">
  `, () => {
    const date = document.getElementById('jvDate').value || new Date().toISOString().slice(0, 10);
    const dr = document.getElementById('jvDr').value;
    const cr = document.getElementById('jvCr').value;
    const amount = parseFloat(document.getElementById('jvAmt').value) || 0;
    const narration = document.getElementById('jvNarr').value.trim() || 'Journal Voucher Entry';
    if (amount <= 0 || dr === cr) return;

    const ledger = getFinLedger();
    if (!ledger.journalEntries) ledger.journalEntries = [];
    const jv = {
      id: 'jv_' + Date.now(),
      voucherNo: 'JV-' + String(ledger.journalEntries.length + 1).padStart(3, '0'),
      date,
      debitAccount: dr,
      creditAccount: cr,
      amount,
      narration
    };
    ledger.journalEntries.push(jv);
    applyJournalSide(ledger, dr, amount, 1);
    applyJournalSide(ledger, cr, amount, -1);

    if (!uiState.finOpen) uiState.finOpen = {};
    uiState.finOpen.journal = true;
    saveUi();
    saveFinLedger(ledger);
    render();
    renderFinancialsPage();
  }, 'Post Voucher', 'Cancel');
}

function deleteJournalEntry(id) {
  const ledger = getFinLedger();
  const idx = (ledger.journalEntries || []).findIndex(x => x.id === id);
  if (idx === -1) return;
  const jv = ledger.journalEntries[idx];
  showModal(`Delete Voucher ${jv.voucherNo}?`, `
    <div class="hint">Reverses Dr ${JOURNAL_ACCOUNTS[jv.debitAccount] || jv.debitAccount} and Cr ${JOURNAL_ACCOUNTS[jv.creditAccount] || jv.creditAccount} for ${inr(jv.amount)}.</div>
  `, () => {
    applyJournalSide(ledger, jv.debitAccount, jv.amount, -1);
    applyJournalSide(ledger, jv.creditAccount, jv.amount, 1);
    ledger.journalEntries.splice(idx, 1);
    if (!ledger.deletedIds) ledger.deletedIds = [];
    ledger.deletedIds.push(id);
    saveFinLedger(ledger);
    render();
    renderFinancialsPage();
  }, 'Delete', 'Cancel');
}

  const totalGrossFeesBilled = feeTasks.reduce((s, t) => s + (Number(t.payable) || 0), 0);
  const totalFeesReceivedCash = feeTasks.reduce((s, t) => s + (Number(t.received) || 0), 0);
  const totalDiscountAllowed = feeTasks.reduce((s, t) => s + (Number(t.discount) || 0), 0);
  const totalDebtorsReceivable = Math.max(0, totalGrossFeesBilled - totalFeesReceivedCash - totalDiscountAllowed);

  // Journal adjustments for P&L Income / Business Expenses / Drawings / Trip
  let jvIncomeAdj = 0;
  let jvExpenseAdj = 0;
  let jvDrawingsAdj = 0;
  let jvTripAdj = 0;
  (ledger.journalEntries || []).forEach(jv => {
    if (jv.creditAccount === 'INCOME_FEES') jvIncomeAdj += jv.amount;
    if (jv.debitAccount === 'INCOME_FEES') jvIncomeAdj -= jv.amount;
    if (jv.debitAccount === 'EXP_BUSINESS') jvExpenseAdj += jv.amount;
    if (jv.creditAccount === 'EXP_BUSINESS') jvExpenseAdj -= jv.amount;
    if (jv.debitAccount === 'DRAWINGS') jvDrawingsAdj += jv.amount;
    if (jv.creditAccount === 'DRAWINGS') jvDrawingsAdj -= jv.amount;
    if (jv.debitAccount === 'TRIP_ZIYARAT') jvTripAdj += jv.amount;
    if (jv.creditAccount === 'TRIP_ZIYARAT') jvTripAdj -= jv.amount;
  });

  // Classify Expenses vs Personal Drawings (Accounting standard: Drawings deducted from Capital)
  const allExpenses = ledger.expenses || [];
  const businessExpensesList = allExpenses.filter(e => !/drawing|personal/i.test(e.category || ''));
  const personalDrawingsList = allExpenses.filter(e => /drawing|personal/i.test(e.category || ''));
  const totalBusinessExpenses = businessExpensesList.reduce((s, e) => s + (Number(e.amount) || 0), 0) + jvExpenseAdj;
  const totalPersonalDrawings = personalDrawingsList.reduce((s, e) => s + (Number(e.amount) || 0), 0) + jvDrawingsAdj;

  // Net Practice Profit (Accrual Basis)
  const netFeeRevenueAccrued = totalGrossFeesBilled - totalDiscountAllowed + jvIncomeAdj;
  const netPracticeProfit = netFeeRevenueAccrued - totalBusinessExpenses;

  // Loans Given & Taken
  const juzerNet = Math.max(0, (ledger.loansGiven.juzer.base || 0) + (ledger.loansGiven.juzer.adjustments || 0));
  const mhjNet = Math.max(0, (ledger.loansTaken.mhj.base || 0) + (ledger.loansTaken.mhj.adjustments || 0));
  const hatimNet = Math.max(0, (ledger.loansTaken.hatim.base || 0) + (ledger.loansTaken.hatim.adjustments || 0));
  const customLoansGiven = (ledger.customLoans || []).filter(c => c.type === 'given').reduce((s, c) => s + Math.max(0, (c.principal || 0) - (c.repaid || 0)), 0);
  const customLoansTaken = (ledger.customLoans || []).filter(c => c.type === 'taken').reduce((s, c) => s + Math.max(0, (c.principal || 0) - (c.repaid || 0)), 0);

  const totalLoansGiven = juzerNet + customLoansGiven;
  const totalLoansTaken = mhjNet + hatimNet + customLoansTaken;

  // Ziyarat Trip Outlay & Equal 3-Way Split
  const tripPayments = (ledger.kathiyawadTrip && ledger.kathiyawadTrip.payments) || [];
  const tripContributions = (ledger.kathiyawadTrip && ledger.kathiyawadTrip.contributions) || [];
  const totalTripOutlay = tripPayments.reduce((s, p) => s + (Number(p.amount) || 0), 0) + jvTripAdj;

  const cashBal = Number(ledger.cashInHand) || 0;
  const bankBal = Number(ledger.bankSlice) || 0;
  const totalLiquid = cashBal + bankBal;

  // Balance Sheet Reconciliation (Assets = Liabilities + Capital)
  const totalAssets = totalLiquid + totalLoansGiven + totalDebtorsReceivable + tripAdvanceAsset;
  const closingOwnerCapital = totalAssets - totalLoansTaken;
  const openingCapitalDerived = closingOwnerCapital - netPracticeProfit + totalPersonalDrawings;

  const badgeEl = document.getElementById('finBadge');

  let html = '';

          ${finViewMode === 'all' ? `

  // === 1. DOUBLE-ENTRY JOURNAL REGISTER ===
  if (!isFamilyPublicView && (finViewMode === 'all' || finViewMode === 'journal')) {

        ${open ? `

                <tbody>
                  ${families.map(f => {

                    const cPaid = tripContributions.filter(c => c.family === f.name).reduce((s, c) => s + (Number(c.amount) || 0), 0);
                    const totalPaidByFam = pPaid + cPaid;

                        <td>

            ${tripContributions.length > 0 ? `

                    `).join('')}
                  </tbody>
                </table>
              </div>
            ` : ''}
          </div>

      </div>

  }

  // === 3. LOANS & ADVANCES PORTFOLIO (WITH + ADD ENTRY SUB-LEDGER) ===
  if (!isFamilyPublicView && (finViewMode === 'all' || finViewMode === 'loans')) {
    const open = isSecOpen('loans');
    const renderLoanEntries = (loanKey) => {
      const entries = (ledger.loanTransactions || []).filter(tx => tx.loanId === loanKey);
      if (entries.length === 0) return '';
      return `

    html += `

          <div class="statement-header-left">
            <span class="stmt-chev">${ICON.chev}</span>
            <div>
              <h3>🤝 Loans &amp; Advances Manager</h3>

                  <div style="font-size:10.5px; color:var(--muted); margin-bottom:5px;">${escapeForHtml(ledger.loansTaken.mhj.note)}</div>

                </div>

function openAddLoanEntryModal(id, isBuiltIn) {
  const ledger = getFinLedger();
  let title = '';
  let currentBalance = 0;
  let isGiven = true;

  if (isBuiltIn) {
    if (id === 'juzer') {
      title = ledger.loansGiven.juzer.name;
      currentBalance = Math.max(0, ledger.loansGiven.juzer.base + (ledger.loansGiven.juzer.adjustments || 0));
      isGiven = true;
    } else if (id === 'mhj') {
      title = ledger.loansTaken.mhj.name;
      currentBalance = Math.max(0, ledger.loansTaken.mhj.base + (ledger.loansTaken.mhj.adjustments || 0));
      isGiven = false;
    } else if (id === 'hatim') {
      title = ledger.loansTaken.hatim.name;
      currentBalance = Math.max(0, ledger.loansTaken.hatim.base + (ledger.loansTaken.hatim.adjustments || 0));
      isGiven = false;
    }
  } else {
    const cl = (ledger.customLoans || []).find(x => x.id === id);
    if (!cl) return;
    title = cl.name;
    currentBalance = Math.max(0, cl.principal - (cl.repaid || 0));
    isGiven = cl.type === 'given';
  }

  showModal(`➕ Add Entry to ${title}`, `
    <div class="hint">Current Balance (${isGiven ? 'Receivable' : 'Payable'}): <strong>${inr(currentBalance)}</strong></div>
    <label>Date</label>
    <input type="date" id="leDate" value="${new Date().toISOString().slice(0, 10)}">
    <label>Particulars / Description</label>
    <input type="text" id="leDesc" placeholder="${isGiven ? 'e.g. Further cash advance / Medical bill' : 'e.g. Additional borrowing / Expense'}">
    <label>Amount to Add (₹)</label>
    <input type="number" id="leAmt" placeholder="₹ Amount">
    <label>Account / Payment Mode</label>
    <select id="leMode">
      <option value="slice SFB">slice Small Finance Bank</option>
      <option value="Cash">Cash in Hand</option>
      <option value="Adjustment">Direct Adjustment (No Cash/Bank Impact)</option>
    </select>
  `, () => {
    const date = document.getElementById('leDate').value || new Date().toISOString().slice(0, 10);
    const desc = document.getElementById('leDesc').value.trim() || (isGiven ? 'Additional Advance Given' : 'Additional Loan Taken');
    const amt = parseFloat(document.getElementById('leAmt').value) || 0;
    const mode = document.getElementById('leMode').value;
    if (amt <= 0) return;

    const curLedger = getFinLedger();
    if (!curLedger.loanTransactions) curLedger.loanTransactions = [];
    curLedger.loanTransactions.push({
      id: 'ltx_' + Date.now(),
      loanId: id,
      isBuiltIn,
      isGiven,
      kind: 'add',
      date,
      desc,
      amount: amt,
      mode
    });

    if (isBuiltIn) {
      if (id === 'juzer') curLedger.loansGiven.juzer.adjustments = (curLedger.loansGiven.juzer.adjustments || 0) + amt;
      else if (id === 'mhj') curLedger.loansTaken.mhj.adjustments = (curLedger.loansTaken.mhj.adjustments || 0) + amt;
      else if (id === 'hatim') curLedger.loansTaken.hatim.adjustments = (curLedger.loansTaken.hatim.adjustments || 0) + amt;
    } else {
      const cl = (curLedger.customLoans || []).find(x => x.id === id);
      if (cl) cl.principal = (Number(cl.principal) || 0) + amt;
    }

    if (mode === 'Cash') curLedger.cashInHand += (isGiven ? -amt : amt);
    else if (mode === 'slice SFB') curLedger.bankSlice += (isGiven ? -amt : amt);

    if (!uiState.finOpen) uiState.finOpen = {};
    uiState.finOpen.loans = true;
    saveUi();
    saveFinLedger(curLedger);
    render();
    renderFinancialsPage();
  }, 'Add Entry', 'Cancel');
}

function deleteLoanTransaction(txId) {
  const ledger = getFinLedger();
  const idx = (ledger.loanTransactions || []).findIndex(x => x.id === txId);
  if (idx === -1) return;
  const tx = ledger.loanTransactions[idx];
  showModal('Delete Loan Entry?', `
    <div class="hint">Reverses <strong>${escapeForHtml(tx.desc)}</strong> (${inr(tx.amount)}) and restores the loan &amp; cash/bank balances.</div>
  `, () => {
    const sign = tx.kind === 'repay' ? 1 : -1;
    if (tx.isBuiltIn) {
      if (tx.loanId === 'juzer') ledger.loansGiven.juzer.adjustments = (ledger.loansGiven.juzer.adjustments || 0) + sign * tx.amount;
      else if (tx.loanId === 'mhj') ledger.loansTaken.mhj.adjustments = (ledger.loansTaken.mhj.adjustments || 0) + sign * tx.amount;
      else if (tx.loanId === 'hatim') ledger.loansTaken.hatim.adjustments = (ledger.loansTaken.hatim.adjustments || 0) + sign * tx.amount;
    } else {
      const cl = (ledger.customLoans || []).find(x => x.id === tx.loanId);
      if (cl) {
        if (tx.kind === 'repay') cl.repaid = Math.max(0, (cl.repaid || 0) - tx.amount);
        else cl.principal = Math.max(0, (cl.principal || 0) - tx.amount);
      }
    }

    let cashRev = 0;
    if (tx.kind === 'add') cashRev = tx.isGiven ? tx.amount : -tx.amount;
    else cashRev = tx.isGiven ? -tx.amount : tx.amount;

    if (tx.mode === 'Cash') ledger.cashInHand += cashRev;
    else if (tx.mode === 'slice SFB') ledger.bankSlice += cashRev;

    ledger.loanTransactions.splice(idx, 1);
    if (!ledger.deletedIds) ledger.deletedIds = [];
    ledger.deletedIds.push(txId);
    saveFinLedger(ledger);
    render();
    renderFinancialsPage();
  }, 'Delete', 'Cancel');
}

    <div class="hint">Transfers funds from <strong>slice SFB Bank</strong> into <strong>Cash in Hand</strong>.</div>
    <label>Withdrawal Amount (₹)</label>
    <input type="number" id="atmAmt" placeholder="e.g. 10000" value="10000">
    <label>Date</label>
    <input type="date" id="atmDate" value="${new Date().toISOString().slice(0, 10)}">
  `, () => {
    const amt = parseFloat(document.getElementById('atmAmt').value) || 0;
    const date = document.getElementById('atmDate').value || new Date().toISOString().slice(0, 10);
    if (amt <= 0) return;
    const ledger = getFinLedger();
    ledger.cashInHand = (Number(ledger.cashInHand) || 0) + amt;
    ledger.bankSlice = (Number(ledger.bankSlice) || 0) - amt;
    if (!ledger.journalEntries) ledger.journalEntries = [];
    ledger.journalEntries.push({
      id: 'jv_' + Date.now(),
      voucherNo: 'JV-' + String(ledger.journalEntries.length + 1).padStart(3, '0'),
      date,
      debitAccount: 'CASH',
      creditAccount: 'BANK_SLICE',
      amount: amt,
      narration: 'ATM Cash Withdrawal from slice SFB'
    });
    saveFinLedger(ledger);
    render();
    renderFinancialsPage();
  }, 'Record Withdrawal', 'Cancel');
}

function deleteCustomLoan(id) {
  const ledger = getFinLedger();
  const idx = (ledger.customLoans || []).findIndex(x => x.id === id);
  if (idx === -1) return;
  const cl = ledger.customLoans[idx];
  showModal('Delete Loan Entry: ' + cl.name + '?', `
    <div class="hint">This will remove the loan and reverse its remaining cash/bank impact.</div>
  `, () => {
    const rem = Math.max(0, cl.principal - (cl.repaid || 0));
    const revDelta = (cl.type === 'given') ? rem : -rem;
    if (cl.mode === 'Cash') ledger.cashInHand += revDelta;
    else ledger.bankSlice += revDelta;

    ledger.customLoans.splice(idx, 1);
    if (!ledger.deletedIds) ledger.deletedIds = [];
    ledger.deletedIds.push(id);
    saveFinLedger(ledger);
    render();
    renderFinancialsPage();
  }, 'Delete', 'Cancel');
}

function shareZiyaratWithFamilies() {
  const ledger = getFinLedger();
  const tripPayments = (ledger.kathiyawadTrip && ledger.kathiyawadTrip.payments) || [];
  const tripContributions = (ledger.kathiyawadTrip && ledger.kathiyawadTrip.contributions) || [];
  const totalOutlay = tripPayments.reduce((s, p) => s + (p.amount || 0), 0);
  const equalShare = totalOutlay / 3;
  const families = ledger.kathiyawadTrip.families || [];

  const shareUrl = 'https://mustansirrmalikworkdashboard.netlify.app/?view=ziyarat';
  let summaryLines = families.map(f => {
    const pPaid = tripPayments.filter(p => p.family === f.name).reduce((s, p) => s + (p.amount || 0), 0);
    const cPaid = tripContributions.filter(c => c.family === f.name).reduce((s, c) => s + (c.amount || 0), 0);
    const paid = pPaid + cPaid;
    const diff = paid - equalShare;
    const status = diff < -0.5 ? `Due: ${inr(Math.abs(diff))}` : (diff > 0.5 ? `Refund: ${inr(diff)}` : 'Settled');
    return `• *${f.name}:* Paid ${inr(paid)} (${status})`;
  }).join('\n');

  const msg = `🕌 *Kathiyawad Ziyarat Trip — Expense & Share Statement*\n\n` +
    `💰 *Total Trip Outlay:* ${inr(totalOutlay)}\n` +
    `⚖️ *Equal 1/3 Share per Family:* ${inr(equalShare)}\n\n` +
    `*Family Breakdown:*\n${summaryLines}\n\n` +
    `📊 *Live Statement Link (Read-Only):*\n${shareUrl}`;

  const waUrl = 'https://api.whatsapp.com/send?text=' + encodeURIComponent(msg);

  showModal('📲 Share Ziyarat Trip Statement', `
    <div class="hint">Share this live read-only statement link with all 3 families:</div>
    <input type="text" id="ziyaratShareLinkInput" readonly value="${shareUrl}">
    <div class="receipt-preview" style="margin-bottom:10px;">${escapeForHtml(msg)}</div>
    <div style="display:flex; gap:8px;">
      <a href="${waUrl}" target="_blank" rel="noopener" class="btn btn-wa" style="flex:1; display:inline-flex; align-items:center; justify-content:center; text-decoration:none;">
        📲 Share on WhatsApp
      </a>
      <button type="button" class="btn btn-primary" onclick="const el = document.getElementById('ziyaratShareLinkInput'); el.select(); document.execCommand('copy'); this.textContent='Copied ✓';">
        📋 Copy Link
      </button>
    </div>
  `, () => {}, 'Done', 'Close');
}

function deleteTripEntry(kind, id) {
  const ledger = getFinLedger();
  showModal('Delete Trip Entry?', `
    <div class="hint">This will remove the entry and reverse its Cash/Bank balance effect.</div>
  `, () => {
    if (kind === 'payment') {
      const idx = (ledger.kathiyawadTrip.payments || []).findIndex(x => x.id === id);
      if (idx !== -1) {
        const item = ledger.kathiyawadTrip.payments[idx];
        if (item.mode === 'Cash') ledger.cashInHand += item.amount;
        else if (item.mode === 'slice SFB') ledger.bankSlice += item.amount;
        ledger.kathiyawadTrip.payments.splice(idx, 1);
      }
    } else {
      const idx = (ledger.kathiyawadTrip.contributions || []).findIndex(x => x.id === id);
      if (idx !== -1) {
        const item = ledger.kathiyawadTrip.contributions[idx];
        if (item.mode === 'Cash') ledger.cashInHand -= item.amount;
        else if (item.mode === 'slice SFB') ledger.bankSlice -= item.amount;
        ledger.kathiyawadTrip.contributions.splice(idx, 1);
      }
    }
    if (!ledger.deletedIds) ledger.deletedIds = [];
    ledger.deletedIds.push(id);
    saveFinLedger(ledger);
    render();
    renderFinancialsPage();
  }, 'Delete', 'Cancel');
}
