<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Task Dashboard &amp; Financial Suite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,500;0,600;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<meta name="theme-color" content="#F8FAFC">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
  :root {
    --bg: #F8FAFC;
    --sheet: #FFFFFF;
    --sheet-alt: #F1F5F9;
    --ink: #0F172A;
    --ink-light: #1E293B;
    --muted: #64748B;
    --muted-light: #94A3B8;
    --icon: #94A3B8;
    --field: #CBD5E1;
    --rule: #E2E8F0;
    --rule-soft: #F1F5F9;

    --accent: #1E3A8A;
    --accent-hover: #1D4ED8;
    --accent-soft: #EFF6FF;
    --accent-border: #BFDBFE;

    --red: #BE123C;
    --red-soft: #FFF1F2;
    --red-border: #FECDD3;

    --green: #047857;
    --green-soft: #ECFDF5;
    --green-border: #A7F3D0;

    --amber: #B45309;
    --amber-soft: #FFFBEB;
    --amber-border: #FDE68A;

    --purple: #6D28D9;
    --purple-soft: #F5F3FF;
    --purple-border: #DDD6FE;

    --c-mhj: #2563EB;
    --c-shk: #6D28D9;
    --c-own: #0F766E;
    --c-personal: #BE185D;
    --c-fees: #D97706;

    --serif: 'Newsreader', Georgia, 'Times New Roman', serif;
    --sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    --mono: 'IBM Plex Mono', monospace;

    --shadow-xs: 0 1px 2px rgba(15, 23, 42, 0.04);
    --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06), 0 1px 2px rgba(15, 23, 42, 0.04);
    --shadow-md: 0 4px 6px -1px rgba(15, 23, 42, 0.07), 0 2px 4px -2px rgba(15, 23, 42, 0.05);
    --shadow-lg: 0 10px 15px -3px rgba(15, 23, 42, 0.08);
    --shadow-modal: 0 25px 50px -12px rgba(15, 23, 42, 0.25);
  }

  * { box-sizing: border-box; }
  html { background: var(--bg); overflow-x: hidden; max-width: 100vw; -webkit-text-size-adjust: 100%; }
  
  body {
    font-family: var(--sans); font-size: 14.5px; line-height: 1.5; color: var(--ink);
    background: var(--bg); margin: 0 auto; max-width: 1140px; padding: 24px 18px 72px; overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  button, input, select { font-family: var(--sans); }
  button, [role=button] { -webkit-tap-highlight-color: transparent; }
  :where(button, input, select, a, [role=button]):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .ic { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* Masthead */
  .masthead {
    display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center;
    gap: 12px 20px; margin-bottom: 20px; padding: 18px 22px;
    background: #FFFFFF; border: 1px solid var(--rule); border-radius: 16px;
    box-shadow: var(--shadow-sm);
  }
  .masthead-brand { display: flex; align-items: center; gap: 14px; }
  .masthead-crest {
    width: 44px; height: 44px; border-radius: 12px;
    background: linear-gradient(135deg, #0F172A 0%, #1E3A8A 100%);
    color: #F8FAFC; display: grid; place-content: center;
    font-family: var(--serif); font-weight: 600; font-size: 19px; letter-spacing: 0.04em;
    box-shadow: 0 2px 6px rgba(15, 23, 42, 0.18); border: 1px solid rgba(255, 255, 255, 0.15);
  }
  h1 { font-family: var(--serif); font-weight: 600; font-size: 26px; line-height: 1.15; letter-spacing: -0.015em; margin: 0; color: var(--ink); }
  .sub { color: var(--muted); font-size: 13px; font-weight: 500; margin-top: 2px; display: flex; align-items: center; gap: 6px; }
  .sub-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--muted-light); }
  
  .masthead .status { display: flex; align-items: center; gap: 12px; font-size: 12.5px; color: var(--muted); }
  .sync-badge {
    display: inline-flex; align-items: center; gap: 7px;
    background: #F8FAFC; border: 1px solid var(--rule); border-radius: 999px;
    padding: 4px 12px; font-size: 12px; font-weight: 500; color: #475569;
  }
  .pulse-dot { width: 7px; height: 7px; border-radius: 50%; background: #10B981; box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2); }
  
  #resetBtn {
    background: transparent; border: 1px solid var(--rule); border-radius: 8px;
    padding: 6px 12px; font: 600 12px var(--sans); color: var(--muted); cursor: pointer;
    transition: all 0.15s ease;
  }
  #resetBtn:hover { color: var(--red); border-color: var(--red-border); background: var(--red-soft); }

  /* Navigation Bar */
  .page-nav {
    display: flex; gap: 8px; margin: 0 0 20px; padding: 5px;
    background: #EEF2F6; border: 1px solid var(--rule); border-radius: 14px;
    overflow-x: auto; scrollbar-width: none;
  }
  .page-nav::-webkit-scrollbar { display: none; }
  .page-nav-btn {
    flex: 1 1 auto; display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    padding: 10px 16px; border-radius: 10px; border: 0; background: transparent;
    color: var(--muted); font: 600 13.5px var(--sans); cursor: pointer; transition: all 0.15s ease; white-space: nowrap;
  }
  .page-nav-btn:hover { color: var(--ink); background: rgba(255, 255, 255, 0.6); }
  .page-nav-btn.active {
    background: #FFFFFF; color: var(--accent); font-weight: 700; box-shadow: 0 1px 3px rgba(15, 23, 42, 0.08);
  }
  .nav-badge {
    background: var(--accent-soft); color: var(--accent);
    padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 700;
  }
  .page-nav-btn.active .nav-badge { background: var(--accent); color: #FFFFFF; }

  /* Financial Dashboard Elements */
  #financialsView { display: none; }
  .fin-hero-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 14px; margin-bottom: 22px;
  }
  .fin-card {
    background: #FFFFFF; border: 1px solid var(--rule); border-radius: 14px;
    padding: 16px 18px; box-shadow: var(--shadow-sm); position: relative;
  }
  .fin-card.asset { border-left: 4px solid var(--green); }
  .fin-card.receivable { border-left: 4px solid var(--red); }
  .fin-card.liability { border-left: 4px solid var(--amber); }
  .fin-card.net { border-left: 4px solid var(--purple); }
  
  .fin-card .f-lbl { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
  .fin-card .f-val { font-family: var(--serif); font-size: 26px; font-weight: 700; margin: 4px 0 2px; }
  .fin-card.asset .f-val { color: var(--green); }
  .fin-card.receivable .f-val { color: var(--red); }
  .fin-card.liability .f-val { color: var(--amber); }
  .fin-card.net .f-val { color: var(--purple); }
  .fin-card .f-sub { font-size: 12px; color: var(--muted); font-weight: 500; }

  .statement-sheet {
    background: #FFFFFF; border: 1px solid var(--rule); border-radius: 16px;
    box-shadow: var(--shadow-sm); margin-bottom: 24px; overflow: hidden;
  }
  .statement-header {
    background: linear-gradient(135deg, #0F172A 0%, #1E3A8A 100%); color: #FFFFFF;
    padding: 18px 24px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;
  }
  .statement-header h3 { font-family: var(--serif); font-size: 19px; font-weight: 600; margin: 0; }
  .statement-header .stmt-sub { font-size: 12px; color: #94A3B8; font-weight: 500; margin-top: 2px; }
  .stmt-badge {
    background: rgba(255, 255, 255, 0.15); border: 1px solid rgba(255, 255, 255, 0.25);
    border-radius: 999px; padding: 4px 12px; font-size: 11.5px; font-weight: 600; color: #F8FAFC;
  }
  .statement-body { padding: 20px 24px; }

  .stmt-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  .stmt-table th {
    background: #F8FAFC; border-bottom: 1.5px solid var(--rule); padding: 10px 14px;
    font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted);
  }
  .stmt-table td { padding: 11px 14px; border-bottom: 1px solid var(--rule-soft); vertical-align: top; }
  .stmt-table tr.section-row td {
    background: #F8FAFC; font-weight: 700; font-size: 12px; text-transform: uppercase;
    letter-spacing: 0.05em; color: var(--accent); padding-top: 14px; border-bottom: 1px solid var(--rule);
  }
  .stmt-table tr.total-row td {
    border-top: 1.5px solid var(--rule); border-bottom: 3px double var(--rule);
    font-weight: 700; font-size: 14.5px; background: #FAFCFE;
  }
  .stmt-table tr.grand-row td {
    border-top: 2px solid var(--ink); border-bottom: 3px double var(--ink);
    font-weight: 700; font-size: 15.5px; background: #F1F5F9;
  }
  .stmt-mono { font-family: var(--serif); font-weight: 600; font-size: 15.5px; font-variant-numeric: tabular-nums; }
  .stmt-table td.indent { padding-left: 28px; }
  .stmt-table td.indent-sub { padding-left: 44px; color: var(--muted); font-size: 12.5px; }

  .bs-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
  @media (min-width: 860px) { .bs-grid { grid-template-columns: 1fr 1fr; } }

  .fin-pill { font-size: 11px; font-weight: 700; text-transform: uppercase; padding: 2px 8px; border-radius: 6px; }
  .fin-pill.rec { background: var(--red-soft); color: var(--red); border: 1px solid var(--red-border); }
  .fin-pill.pay { background: var(--amber-soft); color: var(--amber); border: 1px solid var(--amber-border); }
  .fin-pill.done { background: var(--green-soft); color: var(--green); border: 1px solid var(--green-border); }

  /* Sub-tab pills */
  .sub-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 18px; }
  .sub-tab-btn {
    border: 1px solid var(--rule); background: #FFFFFF; padding: 7px 14px; border-radius: 8px;
    font: 600 12.5px var(--sans); color: var(--muted); cursor: pointer; transition: all 0.12s ease;
  }
  .sub-tab-btn:hover { color: var(--ink); border-color: var(--field); }
  .sub-tab-btn.active { background: var(--accent); color: #FFFFFF; border-color: var(--accent); }

  /* Tasks & Operations View */
  .summary-sheet {
    background: var(--sheet); border: 1px solid var(--rule); border-radius: 16px;
    margin-bottom: 16px; overflow: hidden; box-shadow: var(--shadow-sm);
  }
  .hero-stats { display: grid; grid-template-columns: repeat(4, 1fr); }
  .hero-card { display: flex; flex-direction: column-reverse; justify-content: flex-end; min-width: 0; padding: 14px 18px 13px; }
  .hero-card + .hero-card { border-left: 1px solid var(--rule-soft); }
  .hero-card .l { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; line-height: 1.3; color: var(--muted); margin-top: 3px; }
  .hero-card .n { font-family: var(--serif); font-weight: 600; font-size: 28px; line-height: 1.1; font-variant-numeric: tabular-nums; color: var(--ink); }
  .hero-card.alert .n { color: var(--red); }

  .totals { border-top: 1px solid var(--rule-soft); padding: 8px 0 6px; background: #FAFCFE; }
  .totals > .tot { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; min-width: 0; padding: 5px 18px; }
  .totals .l { font-size: 13.5px; font-weight: 500; color: var(--muted); }
  .totals .fig { font-family: var(--serif); font-weight: 600; font-size: 19px; line-height: 1.25; font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--ink); }
  .totals .fig.recd { color: var(--green); }
  .totals > .tot.sum { margin: 6px 18px 0; padding: 9px 0 5px; border-top: 1px dashed var(--rule); }
  .totals .fig.out { color: var(--red); font-size: 21px; line-height: 1.1; border-bottom: 2px solid var(--red); }
  .totals .fig.out.clear { color: var(--green); border-bottom-color: var(--green); }

  .filters.seg {
    gap: 3px; display: flex; padding: 4px; background: #EEF2F6;
    border: 1px solid #E2E8F0; border-radius: 12px; overflow-x: auto; scrollbar-width: none; margin-bottom: 12px;
  }
  .filter-btn {
    cursor: pointer; font: 500 13px var(--sans); border: 0; background: transparent; color: var(--muted);
    padding: 7px 12px; border-radius: 8px; white-space: nowrap;
  }
  .filter-btn:hover { color: var(--ink); }
  .filter-btn.active { background: #FFFFFF; color: var(--accent); font-weight: 700; box-shadow: 0 1px 3px rgba(15, 23, 42, 0.08); }

  .filters.chips { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 14px; }
  .filters.chips .filter-btn {
    display: inline-flex; align-items: center; background: #FFFFFF; border: 1px solid var(--rule);
    color: var(--ink); padding: 5px 12px; border-radius: 999px; font-size: 12px; font-weight: 600;
  }
  .filters.chips .filter-btn.active { background: var(--accent-soft); border-color: var(--accent-border); color: var(--accent); }
  .filter-btn .dot { width: 7px; height: 7px; border-radius: 50%; margin-right: 7px; flex: none; }

  #searchWrap { position: relative; margin-bottom: 12px; }
  #searchWrap .ico { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--icon); pointer-events: none; width: 17px; height: 17px; }
  #searchBox {
    width: 100%; height: 44px; background: #FFFFFF; border: 1px solid var(--field); color: var(--ink);
    padding: 0 42px; border-radius: 12px; font: 400 14px var(--sans);
  }

  .add-box { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .add-box input, .add-box select {
    height: 42px; background: #FFFFFF; border: 1px solid var(--field); color: var(--ink);
    padding: 0 12px; border-radius: 10px; font: 400 14px var(--sans); min-width: 0;
  }
  #newTask { flex: 2 1 200px; }
  .add-box button {
    height: 42px; padding: 0 20px; background: linear-gradient(135deg, #1E3A8A 0%, #2563EB 100%);
    color: #FFFFFF; border: 0; border-radius: 10px; font: 600 14px var(--sans); cursor: pointer;
  }

  /* Cards */
  .cat-section { margin-bottom: 24px; }
  .cat-heading { display: flex; align-items: center; gap: 9px; margin: 0 2px 10px; min-height: 28px; cursor: pointer; }
  .cat-heading .dot { width: 9px; height: 9px; border-radius: 3px; flex: none; }
  .cat-heading .title { font-family: var(--serif); font-weight: 600; font-size: 18px; color: var(--ink); }
  .cat-heading .count {
    margin-left: auto; padding: 2px 9px; background: #F1F5F9; border: 1px solid var(--rule);
    border-radius: 999px; font: 500 12px var(--sans); color: var(--muted);
  }

  .task-grid { background: var(--sheet); border: 1px solid var(--rule); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow-sm); }
  .task {
    display: flex; align-items: flex-start; gap: 10px; padding: 13px 16px 11px;
    border-top: 1px solid var(--rule-soft); transition: all 0.15s ease;
  }
  .task:first-child { border-top: 0; }
  .task.overdue { box-shadow: inset 3.5px 0 0 var(--red); background: #FFFDFD; }
  .task.urgent { box-shadow: inset 3.5px 0 0 var(--amber); background: #FFFFFD; }
  .task .num { flex: none; width: 20px; text-align: right; font-size: 12px; line-height: 22px; color: var(--muted-light); }
  
  .task input[type=checkbox] {
    -webkit-appearance: none; appearance: none; flex: none; display: grid; place-content: center;
    width: 20px; height: 20px; margin: 1px 0 0; border: 1.5px solid var(--field); border-radius: 6px; background: var(--sheet); cursor: pointer;
  }
  .task input[type=checkbox]:checked { background: #2563EB; border-color: #2563EB; }
  .task input[type=checkbox]:checked::before { content: ''; width: 9px; height: 5px; margin-top: -2px; border-left: 2px solid #fff; border-bottom: 2px solid #fff; transform: rotate(-45deg); }
  
  .task-body { flex: 1; min-width: 0; }
  .task-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .task-name { font-size: 15px; font-weight: 600; color: var(--ink); }
  .amt { font-family: var(--serif); font-weight: 600; font-size: 17.5px; }
  .amt.owed { color: var(--red); }
  .amt.clear { font: 600 12.5px var(--sans); color: var(--green); background: var(--green-soft); border: 1px solid var(--green-border); padding: 2px 7px; border-radius: 6px; }
  
  .task-sub { display: flex; flex-wrap: wrap; gap: 0 12px; margin-top: 2px; font-size: 12.5px; color: var(--muted); }
  .note {
    display: inline-flex; align-items: flex-start; gap: 6px; margin-top: 6px; padding: 4px 10px;
    border-radius: 8px; background: var(--amber-soft); border: 1px solid var(--amber-border); color: #92400E; font-size: 12px;
  }
  .task-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; margin-top: 6px; }
  .act {
    display: inline-flex; align-items: center; gap: 5px; padding: 4px 0; background: none; border: 0;
    font: 600 12.5px var(--sans); color: var(--accent); cursor: pointer;
  }
  .act:hover { text-decoration: underline; }
  .act.del { width: 28px; height: 28px; justify-content: center; color: var(--icon); border-radius: 6px; }
  .act.del:hover { color: var(--red); background: var(--red-soft); }

  /* Modal */
  #modalOverlay {
    position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(8px);
    z-index: 3000; display: none; align-items: center; justify-content: center; padding: 16px;
  }
  .modal {
    background: #FFFFFF; border-radius: 16px; padding: 24px; width: 100%; max-width: 440px;
    max-height: calc(100vh - 32px); overflow-y: auto; box-shadow: var(--shadow-modal); border: 1px solid var(--rule);
  }
  #modalTitle { font-family: var(--serif); font-weight: 600; font-size: 21px; margin-bottom: 12px; color: var(--ink); }
  .modal-actions { display: flex; gap: 10px; margin-top: 18px; justify-content: flex-end; }
  
  .btn { height: 40px; padding: 0 16px; border-radius: 9px; border: 1px solid transparent; font: 600 13.5px var(--sans); cursor: pointer; }
  .btn-primary { background: linear-gradient(135deg, #1E3A8A 0%, #2563EB 100%); color: #fff; }
  .btn-wa { background: linear-gradient(135deg, #059669 0%, #047857 100%); color: #fff; }
  .btn-danger { background: #BE123C; color: #fff; }
  .btn-quiet { background: #FFFFFF; color: #334155; border-color: var(--field); }

  /* Auth Gate */
  #authGate {
    position: fixed; inset: 0; z-index: 2000; display: flex; align-items: center; justify-content: center; padding: 20px;
    background: radial-gradient(circle at 50% 35%, #1E293B 0%, #0F172A 100%);
  }
  .auth-card {
    width: 100%; max-width: 360px; text-align: center; background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.12); backdrop-filter: blur(20px); border-radius: 20px; padding: 36px 26px;
  }
  .auth-card input {
    width: 100%; height: 46px; margin: 18px 0 12px; padding: 0 16px; background: rgba(255, 255, 255, 0.08);
    color: #FFFFFF; border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 10px; text-align: center; font-size: 16px;
  }
  .auth-card button { width: 100%; height: 46px; border-radius: 10px; }

  @media (min-width: 720px) {
    body { padding: 36px 32px 84px; }
    .summary-sheet { display: grid; grid-template-columns: 1.1fr 0.9fr; }
    .hero-stats { grid-template-columns: repeat(2, 1fr); }
    .hero-card { padding: 16px 20px 14px; }
    .hero-card:nth-child(n+3) { border-top: 1px solid var(--rule-soft); }
    .totals { border-top: 0; border-left: 1px solid var(--rule-soft); }
    .task-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 14px; background: none; border: 0; box-shadow: none; }
    .task { background: var(--sheet); border: 1px solid var(--rule); border-radius: 12px; border-left: 3.5px solid var(--catcolor, var(--rule)); box-shadow: var(--shadow-sm); }
  }
</style>
</head>
<body>

<div id="modalOverlay">
  <div class="modal" role="dialog" aria-labelledby="modalTitle">
    <div id="modalTitle"></div>
    <div id="modalFields"></div>
    <div class="modal-actions">
      <button type="button" class="btn btn-quiet" onclick="closeModal()">Close</button>
      <button type="button" id="modalConfirmBtn" class="btn btn-primary">Save</button>
    </div>
  </div>
</div>

<header class="masthead">
  <div class="masthead-brand">
    <div class="masthead-crest">MM</div>
    <div>
      <h1>Mustannsirr Mallik</h1>
      <div class="sub">Tax &amp; Accounts Consultant <span class="sub-dot"></span> Indore</div>
    </div>
  </div>
  <div class="status">
    <span class="sync-badge"><span class="pulse-dot"></span><span id="lastSync">Ready</span></span>
    <button id="resetBtn" type="button" onclick="resetTaskData()" title="Refreshes tasks from Calendar without touching your financial balances">Reset tasks</button>
  </div>
</header>

<nav class="page-nav" role="tablist">
  <button type="button" id="tabTasks" class="page-nav-btn active" onclick="switchPage('tasks')">
    <svg class="ic" viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
    <span>Tasks &amp; Operations</span>
  </button>

<script>
// ==============================================================================
// SEPARATED CORE ARCHITECTURE
// Module 1: Tasks & Operations State
// Module 2: Persistent Dual-Entry Financial Ledger (Unwiped by Task Resets)
// ==============================================================================

const TASKS_STORAGE_KEY = 'mm-tasks-v3';
const FINANCIAL_LEDGER_KEY = 'mm-financial-ledger-v3';
const WEBHOOK_KEY = 'webhookUrl';
const DEFAULT_WEBHOOK = 'https://script.google.com/macros/s/AKfycbwbXqpF6ok4OLydQae2ORcc_AL9_UM-2km5hQYUMR0y1grw24D42SQB6RGrUnEo68NZCg/exec';

let tasks = [];
let filter = 'all';
let searchQuery = '';

function escapeForHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function inr(n) {
  const v = Math.round((Number(n) || 0) * 100) / 100;
  return (v < 0 ? '-' : '') + '₹' + Math.abs(v).toLocaleString('en-IN');
}

// ------------------------------------------------------------------------------
// FINANCIAL LEDGER ENGINE (Persistent, Isolated, Real-Time)
// ------------------------------------------------------------------------------
const DEFAULT_FINANCIAL_STATE = {
  // 1. Loans Given (Asset)
  loansGiven: {
    juzer: {
      client: 'Juzer Presswala',
      phone: '7869282535',
      opening: 100000,
      expenses: [
        { desc: 'X-Ray', amount: 700, date: '2026-11-05' },
        { desc: 'Plaster', amount: 1800, date: '2026-11-05' },
        { desc: 'Cash Advance', amount: 5000, date: '2026-11-05' },
        { desc: 'Medicine', amount: 190, date: '2026-11-05' }
      ],
      adjustments: 0
    }
  },
  // 2. Loans Taken (Liabilities)
  loansTaken: {
    mhj: {
      party: 'MHJ (Mufazzal Husain Johar)',
      phone: '9425054543',
      principal: 86000,
      adjustments: 0,
      status: 'Pending Clearance'
    },
    hatim: {
      party: 'Hatim Bhai (Adv)',
      phone: '9826768052',
      principal: 5000,
      adjustments: 0,
      status: 'Pending Clearance'
    }
  },
  // 3. Monthly Retainership & Salaries
  salaries: {
    mhj: {
      title: 'MHJ (Mufazzal Husain Johar) Monthly Salary',
      monthlyDue: 24000,
      settled: false,
      amountReceived: 0,
      pendingRemainder: 24000,
      history: []
    },
    hakimi: {
      title: 'Hakimi Vihar Society Accounting Salary',
      monthlyDue: 4000,

      amountReceived: 0,
      pendingRemainder: 4000,
      history: []
    }
  },
  // 4. Contra & Adjustment Log
  adjustmentsLog: []
};

function getFinancialLedger() {
  try {
    const raw = localStorage.getItem(FINANCIAL_LEDGER_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return JSON.parse(JSON.stringify(DEFAULT_FINANCIAL_STATE));
}

function saveFinancialLedger(ledger) {
  try {
    localStorage.setItem(FINANCIAL_LEDGER_KEY, JSON.stringify(ledger));
  } catch (e) {}
  syncFinancialsWithTasks();
  if (activePage === 'financials') renderFinancialsPage();
  updateFinancialBadges();
}

// Computes live net position across all asset & liability schedules
function computeFinancialTotals() {
  const fin = getFinancialLedger();
  
  // A. Juzer Presswala Net Receivable
  const juzerExpTotal = fin.loansGiven.juzer.expenses.reduce((s, x) => s + x.amount, 0);
  const juzerGross = fin.loansGiven.juzer.opening + juzerExpTotal;
  const juzerNetReceivable = Math.max(juzerGross - fin.loansGiven.juzer.adjustments, 0);

  // B. Loans Taken Liabilities
  const mhjNetPayable = Math.max(fin.loansTaken.mhj.principal - fin.loansTaken.mhj.adjustments, 0);
  const hatimNetPayable = Math.max(fin.loansTaken.hatim.principal - fin.loansTaken.hatim.adjustments, 0);
  const totalLoansTaken = mhjNetPayable + hatimNetPayable;

  // C. Salary Receivables
  const mhjSalaryDue = fin.salaries.mhj.settled ? 0 : fin.salaries.mhj.pendingRemainder;
  const hakimiSalaryDue = fin.salaries.hakimi.settled ? 0 : fin.salaries.hakimi.pendingRemainder;
  const totalSalariesReceivable = mhjSalaryDue + hakimiSalaryDue;
  const totalSalariesReceived = fin.salaries.mhj.amountReceived + fin.salaries.hakimi.amountReceived;

  // D. Sundry Debtors from Task Fees
  const feeTasks = tasks.filter(t => t.type === 'fee' && !/Juzer/i.test(t.name) && !/Hakimi/i.test(t.name));
  const clientPayable = feeTasks.reduce((s, t) => s + (t.payable || 0), 0);
  const clientReceived = feeTasks.reduce((s, t) => s + (t.received || 0), 0);
  const clientDiscounts = feeTasks.reduce((s, t) => s + (t.discount || 0), 0);
  const clientDebtors = Math.max(clientPayable - clientReceived - clientDiscounts, 0);

  // E. Practice Turnover & P&L
  const grossTurnover = clientPayable + 28000;
  const netPracticeIncome = grossTurnover - clientDiscounts;

  // F. Balance Sheet
  const totalCurrentAssets = clientDebtors + totalSalariesReceivable + juzerNetReceivable + clientReceived + totalSalariesReceived;
  const totalCurrentLiabilities = totalLoansTaken;
  const netCapital = totalCurrentAssets - totalCurrentLiabilities;

  return {
    juzerGross,
    juzerNetReceivable,
    mhjNetPayable,
    hatimNetPayable,
    totalLoansTaken,
    mhjSalaryDue,
    hakimiSalaryDue,
    totalSalariesReceivable,
    totalSalariesReceived,
    clientPayable,
    clientReceived,
    clientDiscounts,
    clientDebtors,
    grossTurnover,
    netPracticeIncome,
    totalCurrentAssets,
    totalCurrentLiabilities,
    netCapital
  };
}

function updateFinancialBadges() {
  const totals = computeFinancialTotals();
  const badge = document.getElementById('finBadge');
  if (badge) badge.textContent = inr(totals.juzerNetReceivable + totals.totalSalariesReceivable + totals.clientDebtors);
}

// ------------------------------------------------------------------------------
// REAL-TIME SYNCHRONIZATION BRIDGE BETWEEN FINANCIALS & TASKS
// ------------------------------------------------------------------------------
function syncFinancialsWithTasks() {
  const fin = getFinancialLedger();
  const totals = computeFinancialTotals();

  // 1. Juzer Presswala Task Cards
  const juzerFee = tasks.find(t => t.type === 'fee' && /juzer/i.test(t.name));
  if (juzerFee) {
    juzerFee.payable = totals.juzerGross;
    juzerFee.received = fin.loansGiven.juzer.adjustments;
    juzerFee.done = totals.juzerNetReceivable <= 0;
    juzerFee.remark = 'Opening 1,00,000 + Exp 7,690. Outstanding: ' + inr(totals.juzerNetReceivable);
  }

  // 2. MHJ Salary Task Card
  const mhjTask = tasks.find(t => /Monthly Salary Receivable/i.test(t.name) || (t.cat === 'MHJ' && /Salary/i.test(t.name)));
  if (mhjTask) {
    mhjTask.done = fin.salaries.mhj.settled;
    mhjTask.remark = fin.salaries.mhj.settled
      ? 'Fully settled: ' + inr(fin.salaries.mhj.amountReceived) + ' received'
      : (fin.salaries.mhj.amountReceived > 0 ? 'Part payment of ' + inr(fin.salaries.mhj.amountReceived) + ' recd. ' + inr(fin.salaries.mhj.pendingRemainder) + ' PENDING' : 'Due 1st of month: ₹24,000');
  }

  // 3. Hakimi Vihar Salary Task Card
  const hvTask = tasks.find(t => /Hakimi Vihar/i.test(t.name));
  if (hvTask) {
    hvTask.done = fin.salaries.hakimi.settled;
    hvTask.received = fin.salaries.hakimi.amountReceived;
    hvTask.remark = fin.salaries.hakimi.settled
      ? 'Fully settled: ' + inr(fin.salaries.hakimi.amountReceived) + ' received'
      : (fin.salaries.hakimi.amountReceived > 0 ? 'Part payment of ' + inr(fin.salaries.hakimi.amountReceived) + ' recd. ' + inr(fin.salaries.hakimi.pendingRemainder) + ' PENDING' : 'Due 1st of month: ₹4,000');
  }

  saveTasksLocally();
}

// ------------------------------------------------------------------------------
// SALARY SETTLEMENTS & SHORTFALL ENGINE
// ------------------------------------------------------------------------------
function clearSalaryReceivable(entity, defaultAmount) {
  const fin = getFinancialLedger();
  const isMHJ = /mhj/i.test(entity);
  const title = isMHJ ? 'Clear Salary — MHJ (Mufazzal Husain Johar)' : 'Clear Salary — Hakimi Vihar Society';
  const currentDue = isMHJ ? fin.salaries.mhj.pendingRemainder : fin.salaries.hakimi.pendingRemainder;

  showModal(title, `
    <div style="font-size:13px; color:var(--muted); margin-bottom:12px;">
      Total pending receivable: <strong style="color:var(--ink);">${inr(currentDue)}</strong>
    </div>

    <label style="display:block; font-size:11.5px; font-weight:700; color:var(--muted); margin-bottom:4px;">AMOUNT RECEIVED NOW (₹)</label>
    <input type="number" id="modalSalaryAmt" value="${currentDue}" oninput="checkSalaryShortfall(${currentDue}, ${isMHJ})" style="width:100%; height:44px; font-size:16px; font-weight:700; border:1px solid var(--field); border-radius:10px; padding:0 12px; color:var(--green);">

    <!-- Shortfall Decision Box -->
    <div id="salaryShortfallBox" style="display:none; background:#FFFBEB; border:1.5px solid #FDE68A; border-radius:12px; padding:12px 14px; margin:14px 0;">
      <div style="font-weight:700; font-size:13px; color:#B45309; margin-bottom:4px; display:flex; align-items:center; gap:6px;">
        <svg style="width:16px;height:16px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span id="salaryShortfallTitle">Partial Payment Entered</span>
      </div>
      <div id="salaryShortfallDesc" style="font-size:12px; color:#92400E; margin-bottom:10px; line-height:1.4;"></div>
      
      <label style="display:block; font-size:11px; font-weight:700; color:#B45309; margin-bottom:6px;">HOW TO HANDLE THE SHORTFALL?</label>
      <div style="display:flex; flex-direction:column; gap:8px; font-size:12.5px;">
        ${isMHJ ? `
          <label style="display:flex; align-items:flex-start; gap:8px; cursor:pointer; color:var(--ink); font-weight:600;">
            <input type="radio" name="salaryShortfallOpt" value="ADJUST_MHJ_LOAN" checked style="margin-top:2px; accent-color:#7C3AED;">
            <span>Adjust remaining with MHJ Loan Taken (Deducts balance from ₹86,000 Loan &amp; marks salary 100% cleared)</span>
          </label>
        ` : ''}
        <label style="display:flex; align-items:flex-start; gap:8px; cursor:pointer; color:var(--ink); font-weight:600;">
          <input type="radio" name="salaryShortfallOpt" value="KEEP_PENDING" ${!isMHJ ? 'checked' : ''} style="margin-top:2px; accent-color:#BE123C;">
          <span>Keep remaining in Pending (Salary stays partially due on dashboard &amp; Balance Sheet)</span>
        </label>
      </div>
    </div>

    <div style="margin-top:12px;">
      <label style="display:block; font-size:11.5px; font-weight:700; color:var(--muted); margin-bottom:4px;">PAYMENT MODE / ACCOUNT</label>
      <select id="modalSalaryMode" style="width:100%; height:40px; border:1px solid var(--field); border-radius:10px; padding:0 12px; font-weight:600;">
        <option value="Bank Transfer (slice SFB)">Bank Transfer (slice Small Finance Bank)</option>
        <option value="Cash in Hand">Cash in hand</option>
        <option value="Cheque">Cheque</option>
      </select>
    </div>
  `, () => {
    const amt = parseFloat(document.getElementById('modalSalaryAmt').value) || 0;
    const mode = document.getElementById('modalSalaryMode').value;
    const isShortfall = amt < currentDue;
    const shortfallAmt = Math.max(currentDue - amt, 0);
    const radioOpt = isShortfall && document.querySelector('input[name="salaryShortfallOpt"]:checked')
      ? document.querySelector('input[name="salaryShortfallOpt"]:checked').value
      : null;

    const todayStr = new Date().toISOString().slice(0, 10);

    if (isMHJ) {
      if (isShortfall && radioOpt === 'ADJUST_MHJ_LOAN') {
        fin.loansTaken.mhj.adjustments += shortfallAmt;
        fin.salaries.mhj.amountReceived += (amt + shortfallAmt);
        fin.salaries.mhj.pendingRemainder = 0;
        fin.salaries.mhj.settled = true;

        fin.adjustmentsLog.unshift({
          date: todayStr,
          party: 'MHJ (Mufazzal Husain Johar)',
          type: 'Contra Salary Offset',
          amount: shortfallAmt,
          remark: 'Shortfall of ₹' + shortfallAmt.toLocaleString('en-IN') + ' for salary offset against MHJ Loan Taken'
        });
      } else if (isShortfall && radioOpt === 'KEEP_PENDING') {
        fin.salaries.mhj.amountReceived += amt;
        fin.salaries.mhj.pendingRemainder = shortfallAmt;
        fin.salaries.mhj.settled = false;
      } else {
        fin.salaries.mhj.amountReceived += amt;
        fin.salaries.mhj.pendingRemainder = 0;
        fin.salaries.mhj.settled = true;
      }
    } else {
      if (isShortfall) {
        fin.salaries.hakimi.amountReceived += amt;
        fin.salaries.hakimi.pendingRemainder = shortfallAmt;
        fin.salaries.hakimi.settled = false;
      } else {
        fin.salaries.hakimi.amountReceived += amt;
        fin.salaries.hakimi.pendingRemainder = 0;
        fin.salaries.hakimi.settled = true;
      }
    }

    saveFinancialLedger(fin);
    render();
    fireConfetti();
  }, 'Confirm Settlement', 'Cancel');
}

function checkSalaryShortfall(totalDue, isMHJ) {
  const entered = parseFloat(document.getElementById('modalSalaryAmt').value) || 0;
  const box = document.getElementById('salaryShortfallBox');
  if (!box) return;

  if (entered < totalDue) {
    box.style.display = 'block';
    const diff = totalDue - entered;
    document.getElementById('salaryShortfallTitle').textContent = 'Shortfall of ₹' + diff.toLocaleString('en-IN');
    document.getElementById('salaryShortfallDesc').innerHTML = `You entered <strong>₹${entered.toLocaleString('en-IN')}</strong> of total <strong>₹${totalDue.toLocaleString('en-IN')}</strong>. There is an unsettled remainder of <strong>₹${diff.toLocaleString('en-IN')}</strong>.`;
  } else {
    box.style.display = 'none';
  }
}

function reopenSalaryReceivable(entity) {
  const fin = getFinancialLedger();
  if (/mhj/i.test(entity)) {
    fin.salaries.mhj.settled = false;
    fin.salaries.mhj.amountReceived = 0;
    fin.salaries.mhj.pendingRemainder = 24000;
  } else {
    fin.salaries.hakimi.settled = false;
    fin.salaries.hakimi.amountReceived = 0;
    fin.salaries.hakimi.pendingRemainder = 4000;
  }
  saveFinancialLedger(fin);
  render();
}

// ------------------------------------------------------------------------------
// UNIVERSAL CLIENT PAYMENT RECORDING WITH SHORTFALL CONTRA ADJUSTMENT
// ------------------------------------------------------------------------------
function recordPayment(id) {
  const t = tasks.find(x => x.id === id);
  if (!t) return;
  const payable = Number(t.payable) || 0;
  const curReceived = Number(t.received) || 0;
  const curDiscount = Number(t.discount) || 0;

  showModal('Record Payment — ' + t.name, `
    <div style="font-size:13px; color:var(--muted); margin-bottom:12px;">
      Total Payable: <strong>${inr(payable)}</strong> &bull; Received so far: <strong>${inr(curReceived)}</strong>
    </div>

    <label style="display:block; font-size:11.5px; font-weight:700; color:var(--muted); margin-bottom:4px;">TOTAL AMOUNT RECEIVED (₹)</label>
    <input type="number" id="modalReceivedAmt" value="${curReceived}" oninput="updatePaymentShortfall(${payable})" style="width:100%; height:44px; font-size:16px; font-weight:700; border:1px solid var(--field); border-radius:10px; padding:0 12px; color:var(--green);">

    <!-- Universal Shortfall Box -->
    <div id="paymentShortfallBox" style="display:none; background:#FFFBEB; border:1.5px solid #FDE68A; border-radius:12px; padding:12px 14px; margin:14px 0;">
      <div style="font-weight:700; font-size:13px; color:#B45309; margin-bottom:4px; display:flex; align-items:center; gap:6px;">
        <svg style="width:16px;height:16px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span id="paymentShortfallTitle">Partial Payment Entered</span>
      </div>
      <div id="paymentShortfallDesc" style="font-size:12px; color:#92400E; margin-bottom:10px; line-height:1.4;"></div>
      
      <label style="display:block; font-size:11px; font-weight:700; color:#B45309; margin-bottom:6px;">HOW TO HANDLE THE UNPAID REMAINDER?</label>
      <div style="display:flex; flex-direction:column; gap:8px; font-size:12.5px;">
        <label style="display:flex; align-items:flex-start; gap:8px; cursor:pointer; color:var(--ink); font-weight:600;">
          <input type="radio" name="feeShortfallAction" value="KEEP_PENDING" checked style="margin-top:2px; accent-color:#BE123C;">
          <span>Keep in Pending (Leave unpaid remainder as active dues in Sundry Debtors)</span>
        </label>
        <label style="display:flex; align-items:flex-start; gap:8px; cursor:pointer; color:var(--ink); font-weight:600;">
          <input type="radio" name="feeShortfallAction" value="ADJUST_LOAN" style="margin-top:2px; accent-color:#7C3AED;">
          <span>Adjust remaining with Loans &amp; Advances (Set off against Loan Taken)</span>
        </label>
        <label style="display:flex; align-items:flex-start; gap:8px; cursor:pointer; color:var(--ink); font-weight:600;">
          <input type="radio" name="feeShortfallAction" value="DISCOUNT" style="margin-top:2px; accent-color:#D97706;">
          <span>Write off as Discount / Concession (Marks fee 100% settled)</span>
        </label>
      </div>

      <div id="loanTargetSelectRow" style="display:none; margin-top:10px; border-top:1px dashed #FDE68A; padding-top:8px;">
        <label style="font-size:11px; font-weight:700; color:#B45309;">SELECT LOAN ACCOUNT TO OFFSET AGAINST:</label>
        <select id="modalFeeAdjLoanTarget" style="width:100%; height:38px; border:1px solid var(--field); border-radius:8px; font-size:12.5px; font-weight:600; margin-top:4px;">
          <option value="MHJ">MHJ (Mufazzal Husain Johar) Loan Taken (₹86,000)</option>
          <option value="HATIM">Hatim Bhai (Adv) Loan Taken (₹5,000)</option>
          <option value="JUZER">Juzer Presswala Loan Given (₹1,07,690)</option>
        </select>
      </div>
    </div>

    <label style="display:block; font-size:11.5px; font-weight:700; color:var(--muted); margin:12px 0 4px;">DISCOUNT ALLOWED (OPTIONAL)</label>
    <input type="number" id="modalDiscountAmt" value="${curDiscount}" style="width:100%; height:40px; border:1px solid var(--field); border-radius:10px; padding:0 12px;">
  `, () => {
    const amount = parseFloat(document.getElementById('modalReceivedAmt').value) || 0;
    let discount = parseFloat(document.getElementById('modalDiscountAmt').value) || 0;
    const isShortfall = (amount + discount) < payable;
    const shortfallAmt = Math.max(payable - amount - discount, 0);
    const radioAction = isShortfall && document.querySelector('input[name="feeShortfallAction"]:checked')
      ? document.querySelector('input[name="feeShortfallAction"]:checked').value
      : null;

    if (isShortfall && radioAction === 'ADJUST_LOAN') {
      const target = document.getElementById('modalFeeAdjLoanTarget').value;
      const fin = getFinancialLedger();
      if (target === 'MHJ') fin.loansTaken.mhj.adjustments += shortfallAmt;
      else if (target === 'HATIM') fin.loansTaken.hatim.adjustments += shortfallAmt;
      else if (target === 'JUZER') fin.loansGiven.juzer.adjustments += shortfallAmt;

      fin.adjustmentsLog.unshift({
        date: new Date().toISOString().slice(0, 10),
        party: target,
        type: 'Fee Offset',
        amount: shortfallAmt,
        remark: 'Unpaid fee balance of ₹' + shortfallAmt.toLocaleString('en-IN') + ' for "' + t.name + '" adjusted against ' + target
      });

      saveFinancialLedger(fin);
      discount += shortfallAmt;
      t.done = true;
      t.remark = '₹' + amount.toLocaleString('en-IN') + ' recd + ₹' + shortfallAmt.toLocaleString('en-IN') + ' adjusted with ' + target;
    } else if (isShortfall && radioAction === 'DISCOUNT') {
      discount += shortfallAmt;
      t.done = true;
      t.remark = '₹' + amount.toLocaleString('en-IN') + ' recd + ₹' + shortfallAmt.toLocaleString('en-IN') + ' written off';
    } else if (isShortfall && radioAction === 'KEEP_PENDING') {
      t.done = false;
      t.remark = 'Part payment: ₹' + amount.toLocaleString('en-IN') + ' recd. ₹' + shortfallAmt.toLocaleString('en-IN') + ' PENDING';
    } else {
      t.done = (amount + discount) >= payable && payable > 0;
    }

    t.received = amount;
    t.discount = discount;
    saveTasksLocally();
    render();
    if (activePage === 'financials') renderFinancialsPage();
    updateFinancialBadges();
  });

  setTimeout(() => {
    const radios = document.querySelectorAll('input[name="feeShortfallAction"]');
    const loanRow = document.getElementById('loanTargetSelectRow');
    radios.forEach(r => {
      r.addEventListener('change', () => {
        if (loanRow) loanRow.style.display = (r.value === 'ADJUST_LOAN' && r.checked) ? 'block' : 'none';
      });
    });
  }, 50);
}

function updatePaymentShortfall(totalPayable) {
  const entered = parseFloat(document.getElementById('modalReceivedAmt').value) || 0;
  const disc = parseFloat(document.getElementById('modalDiscountAmt').value) || 0;
  const box = document.getElementById('paymentShortfallBox');
  if (!box) return;

  if ((entered + disc) < totalPayable) {
    box.style.display = 'block';
    const diff = totalPayable - (entered + disc);
    document.getElementById('paymentShortfallTitle').textContent = 'Shortfall of ₹' + diff.toLocaleString('en-IN');
    document.getElementById('paymentShortfallDesc').innerHTML = `Amount entered: <strong>₹${entered.toLocaleString('en-IN')}</strong> of total <strong>₹${totalPayable.toLocaleString('en-IN')}</strong>. There is an unsettled remainder of <strong>₹${diff.toLocaleString('en-IN')}</strong>.`;
  } else {
    box.style.display = 'none';
  }
}

function openLoanAdjustmentModal(presetTarget) {
  const todayStr = new Date().toISOString().slice(0, 10);
  const fin = getFinancialLedger();
  const totals = computeFinancialTotals();

  showModal('Adjust Loans & Advances', `
    <div style="font-size:13px; color:var(--muted); margin-bottom:12px;">
      Offset or cross-adjust loans taken/given against fees, salaries, or direct cash/contra settlement.
    </div>

    <label style="display:block; font-size:11.5px; font-weight:700; color:var(--muted); margin-bottom:4px;">SELECT ACCOUNT TO ADJUST</label>
    <select id="modalAdjAccount" style="width:100%; height:40px; margin-bottom:12px; border:1px solid var(--field); border-radius:10px; padding:0 10px; font-weight:600;">
      <option value="JUZER" ${presetTarget === 'JUZER' ? 'selected' : ''}>Juzer Presswala (Loan Given: ${inr(totals.juzerNetReceivable)})</option>
      <option value="MHJ" ${presetTarget === 'MHJ' ? 'selected' : ''}>MHJ - Mufazzal Husain Johar (Loan Taken: ${inr(totals.mhjNetPayable)})</option>
      <option value="HATIM" ${presetTarget === 'HATIM' ? 'selected' : ''}>Hatim Bhai Adv (Loan Taken: ${inr(totals.hatimNetPayable)})</option>
    </select>

    <label style="display:block; font-size:11.5px; font-weight:700; color:var(--muted); margin-bottom:4px;">OFFSET TYPE</label>
    <select id="modalAdjType" style="width:100%; height:40px; margin-bottom:12px; border:1px solid var(--field); border-radius:10px; padding:0 10px;">
      <option value="Salary Contra">Offset against Monthly Salary</option>
      <option value="Fee Contra">Offset against Client Fees</option>
      <option value="Direct Cash/Bank">Direct Cash / Bank Settlement</option>
      <option value="Mutual Ledger Set-off">Mutual Ledger Set-off</option>
    </select>

    <label style="display:block; font-size:11.5px; font-weight:700; color:var(--muted); margin-bottom:4px;">ADJUSTMENT AMOUNT (₹)</label>
    <input type="number" id="modalAdjAmt" placeholder="e.g. 5000" style="width:100%; height:40px; margin-bottom:12px; border:1px solid var(--field); border-radius:10px; padding:0 10px; font-weight:700;">

    <label style="display:block; font-size:11.5px; font-weight:700; color:var(--muted); margin-bottom:4px;">NARRATION / REMARKS</label>
    <input type="text" id="modalAdjRemark" placeholder="e.g. Part settlement received" style="width:100%; height:40px; margin-bottom:4px; border:1px solid var(--field); border-radius:10px; padding:0 10px;">
  `, () => {
    const acc = document.getElementById('modalAdjAccount').value;
    const type = document.getElementById('modalAdjType').value;
    const amt = parseFloat(document.getElementById('modalAdjAmt').value) || 0;
    const remark = (document.getElementById('modalAdjRemark').value || '').trim();

    if (amt <= 0) return;

    if (acc === 'JUZER') fin.loansGiven.juzer.adjustments += amt;
    else if (acc === 'MHJ') fin.loansTaken.mhj.adjustments += amt;
    else if (acc === 'HATIM') fin.loansTaken.hatim.adjustments += amt;

    fin.adjustmentsLog.unshift({
      date: todayStr,
      party: acc === 'JUZER' ? 'Juzer Presswala' : (acc === 'MHJ' ? 'MHJ (Mufazzal Husain Johar)' : 'Hatim Bhai Adv'),
      type,
      amount: amt,
      remark: remark || 'Ledger adjustment'
    });

    saveFinancialLedger(fin);
    render();
    fireConfetti();
  }, 'Confirm Adjustment', 'Cancel');
}

function loadTasks() {
  try {
    const raw = localStorage.getItem(TASKS_STORAGE_KEY);
    if (raw) tasks = JSON.parse(raw);
    else tasks = JSON.parse(JSON.stringify(DEFAULT_TASKS_SEED));
  } catch (e) {
    tasks = JSON.parse(JSON.stringify(DEFAULT_TASKS_SEED));
  }
  syncFinancialsWithTasks();
  render();
}

function saveTasksLocally() {
  try {
    localStorage.setItem(TASKS_STORAGE_KEY, JSON.stringify(tasks));
  } catch (e) {}
}

// Resets only the task view and forces calendar pull without touching financial ledgers
function resetTaskData() {
  showModal('Reset task list?', `
    <div style="font-size:13px; color:var(--muted);">
      This clears stuck or duplicate operational task items and re-syncs fresh from Google Calendar. 
      <br><br>
      <strong style="color:var(--green);">✓ Your Financial Ledgers, Salary Settlements, and Loan Contra entries are 100% preserved.</strong>
    </div>
  `, () => {
    localStorage.removeItem(TASKS_STORAGE_KEY);
    loadTasks();
    pullFromCalendar();
  }, 'Reset Tasks', 'Cancel');
}

async function pullFromCalendar() {
  const url = localStorage.getItem(WEBHOOK_KEY) || DEFAULT_WEBHOOK;
  if (!url) return;
  try {
    const res = await fetch(url);
    const events = await res.json();
    if (!Array.isArray(events)) return;

    const calIds = new Set(events.map(ev => ev.id));
    const existingIds = new Set(tasks.map(t => t.id));

    events.forEach(ev => {
      if (existingIds.has(ev.id)) {
        const local = tasks.find(x => x.id === ev.id);
        if (local) {
          local.name = ev.title;
          local.done = ev.done;
          local.dueDate = ev.dueDate || local.dueDate;
          if (ev.tag === 'FEES') {
            local.payable = ev.payable || local.payable;
            local.received = ev.received || local.received;
          }
        }
      } else {
        const type = ev.tag === 'PERSONAL' ? 'personal' : (ev.tag === 'FEES' ? 'fee' : 'professional');
        tasks.push({
          id: ev.id,
          name: ev.title,
          type,
          cat: ev.tag === 'PERSONAL' ? null : ev.tag,
          done: ev.done,
          dueDate: ev.dueDate || null,
          payable: ev.payable || 0,
          received: ev.received || 0,
          discount: ev.discount || 0,
          remark: ev.remark || ''
        });
      }
    });

    tasks = tasks.filter(t => !t.id.startsWith('cal_') || calIds.has(t.id));
    syncFinancialsWithTasks();
    render();
    document.getElementById('lastSync').textContent = 'Synced ✓ ' + new Date().toLocaleTimeString();
  } catch (e) {
    document.getElementById('lastSync').textContent = 'Sync offline';
  }
}

function addTask() {
  const input = document.getElementById('newTask');
  const catVal = document.getElementById('newCat').value;
  const name = input.value.trim();
  const dueDateVal = document.getElementById('newDueDate').value;
  if (!name) return;

  const type = catVal === 'PERSONAL' ? 'personal' : (catVal === 'FEES' ? 'fee' : 'professional');
  const task = {
    id: 'u_' + Date.now(),
    name,
    type,
    cat: catVal === 'PERSONAL' ? null : catVal,
    dueDate: dueDateVal ? new Date(dueDateVal + 'T09:00:00').toISOString() : null,
    done: false,
    payable: catVal === 'FEES' ? 0 : undefined,
    received: catVal === 'FEES' ? 0 : undefined
  };

  tasks.unshift(task);
  input.value = '';
  document.getElementById('newDueDate').value = '';
  saveTasksLocally();
  render();
}

function toggleTask(id) {
  const t = tasks.find(x => x.id === id);
  if (!t) return;
  t.done = !t.done;
  saveTasksLocally();
  render();
  if (t.done) fireConfetti();
}

function deleteTask(id) {
  tasks = tasks.filter(x => x.id !== id);
  saveTasksLocally();
  render();
}

function setFilter(f) {
  filter = f;
  render();
}

function onSearch(val) {
  searchQuery = val || '';
  render();
}

let activePage = (location.hash === '#financials') ? 'financials' : 'tasks';

function switchPage(page) {
  activePage = page;
  const tasksView = document.getElementById('tasksView');
  const finView = document.getElementById('financialsView');
  const btnTasks = document.getElementById('tabTasks');
  const btnFin = document.getElementById('tabFinancials');

  if (page === 'financials') {
    if (tasksView) tasksView.style.display = 'none';
    if (finView) {
      finView.style.display = 'block';
      renderFinancialsPage();
    }
    if (btnTasks) btnTasks.classList.remove('active');
    if (btnFin) btnFin.classList.add('active');
    try { history.replaceState(null, '', '#financials'); } catch (e) {}
  } else {
    if (tasksView) tasksView.style.display = 'block';
    if (finView) finView.style.display = 'none';
    if (btnTasks) btnTasks.classList.add('active');
    if (btnFin) btnFin.classList.remove('active');
    try { history.replaceState(null, '', '#tasks'); } catch (e) {}
  }
}

function render() {
  const app = document.getElementById('app');
  const summaryEl = document.getElementById('summaryArea');
  if (!app) return;

  updateFinancialBadges();

  let filtered = tasks;
  if (filter === 'personal') filtered = tasks.filter(t => t.type === 'personal');
  else if (filter === 'professional') filtered = tasks.filter(t => t.type === 'professional');
  else if (filter === 'fees') filtered = tasks.filter(t => t.type === 'fee');
  else if (filter === 'pending') filtered = tasks.filter(t => !t.done);
  else if (filter === 'done') filtered = tasks.filter(t => t.done);
  else if (filter === 'mhj') filtered = tasks.filter(t => t.cat === 'MHJ');
  else if (filter === 'shk') filtered = tasks.filter(t => t.cat === 'SHK');
  else if (filter === 'own') filtered = tasks.filter(t => t.cat === 'OWN');

  if (searchQuery.trim()) {
    const q = searchQuery.toLowerCase();
    filtered = filtered.filter(t => (t.name + ' ' + (t.remark || '')).toLowerCase().includes(q));
  }

  const doneCount = tasks.filter(t => t.done).length;
  const pendingCount = tasks.filter(t => !t.done).length;
  const pct = tasks.length ? Math.round((doneCount / tasks.length) * 100) : 0;

  summaryEl.innerHTML = `
    <div class="summary-sheet">
      <div class="hero-stats">
        <div class="hero-card"><div class="n">${pct}%</div><div class="l">Complete</div></div>
        <div class="hero-card"><div class="n">${doneCount}</div><div class="l">Done</div></div>
        <div class="hero-card"><div class="n">${pendingCount}</div><div class="l">Pending</div></div>
        <div class="hero-card"><div class="n">${tasks.length}</div><div class="l">Total Tasks</div></div>
      </div>
      <div class="totals">
        <div class="tot"><div class="l">Sundry Debtors (Fees Due)</div><div class="fig out">${inr(computeFinancialTotals().clientDebtors)}</div></div>
        <div class="tot"><div class="l">Salaries Due</div><div class="fig">${inr(computeFinancialTotals().totalSalariesReceivable)}</div></div>
        <div class="tot sum"><div class="l">Loans Given (Juzer Presswala)</div><div class="fig recd">${inr(computeFinancialTotals().juzerNetReceivable)}</div></div>
      </div>
    </div>

    <div class="filters seg">
      <button type="button" class="filter-btn ${filter === 'all' ? 'active' : ''}" onclick="setFilter('all')">All</button>
      <button type="button" class="filter-btn ${filter === 'pending' ? 'active' : ''}" onclick="setFilter('pending')">Pending</button>
      <button type="button" class="filter-btn ${filter === 'done' ? 'active' : ''}" onclick="setFilter('done')">Done</button>
      <button type="button" class="filter-btn ${filter === 'fees' ? 'active' : ''}" onclick="setFilter('fees')">Fees</button>
      <button type="button" class="filter-btn ${filter === 'personal' ? 'active' : ''}" onclick="setFilter('personal')">Personal</button>
    </div>

    <div class="filters chips">
      <button type="button" class="filter-btn ${filter === 'mhj' ? 'active' : ''}" onclick="setFilter('mhj')"><i class="dot" style="background:var(--c-mhj)"></i>MHJ</button>
      <button type="button" class="filter-btn ${filter === 'shk' ? 'active' : ''}" onclick="setFilter('shk')"><i class="dot" style="background:var(--c-shk)"></i>SHK</button>
      <button type="button" class="filter-btn ${filter === 'own' ? 'active' : ''}" onclick="setFilter('own')"><i class="dot" style="background:var(--c-own)"></i>OWN</button>
    </div>
  `;

  if (filtered.length === 0) {
    app.innerHTML = '<div style="text-align:center; padding:40px; color:var(--muted); background:#fff; border-radius:12px; border:1px dashed var(--rule);">No tasks found.</div>';
    return;
  }

  let html = '<div class="task-grid">';
  filtered.forEach((t, i) => {
    const isFee = t.type === 'fee';
    const isMHJSalary = /Monthly Salary/i.test(t.name) || (t.cat === 'MHJ' && /Salary/i.test(t.name));
    const isHVSalary = /Hakimi Vihar/i.test(t.name);
    const balance = isFee ? Math.max((t.payable || 0) - (t.received || 0) - (t.discount || 0), 0) : 0;
    
    html += `
      <div class="task ${t.done ? 'done' : ''}">
        <span class="num">${i + 1}.</span>
        ${isFee ? '' : `<input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggleTask('${t.id}')">`}
        <div class="task-body">
          <div class="task-top">
            <div class="task-name">${escapeForHtml(t.name)}</div>
            ${isFee ? `<div class="amt ${balance > 0 ? 'owed' : 'clear'}">${balance > 0 ? inr(balance) : 'Settled'}</div>` : ''}
            <button type="button" class="act del" onclick="deleteTask('${t.id}')">✕</button>
          </div>
          ${t.remark ? `<div class="note"><span>${escapeForHtml(t.remark)}</span></div>` : ''}
          <div class="task-meta">
            ${isMHJSalary && !t.done ? `<button type="button" class="act" style="color:var(--green); font-weight:700;" onclick="clearSalaryReceivable('MHJ')">✓ Settle MHJ Salary</button>` : ''}
            ${isHVSalary && !t.done ? `<button type="button" class="act" style="color:var(--green); font-weight:700;" onclick="clearSalaryReceivable('Hakimi Vihar')">✓ Settle Hakimi Vihar</button>` : ''}
            ${isFee && !isHVSalary ? `<button type="button" class="act" style="color:var(--accent); font-weight:700;" onclick="recordPayment('${t.id}')">Record Payment</button>` : ''}
            ${/Juzer/i.test(t.name) ? `<button type="button" class="act" style="color:var(--purple); font-weight:700;" onclick="openLoanAdjustmentModal('JUZER')">⚖️ Adjust Loan</button>` : ''}

        </div>
      </div>
    `;
  });
  html += '</div>';
  app.innerHTML = html;
}

// Modal System
function showModal(title, html, onConfirm, confirmText, cancelText) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalFields').innerHTML = html;
  const overlay = document.getElementById('modalOverlay');
  overlay.style.display = 'flex';
  const btn = document.getElementById('modalConfirmBtn');
  const clone = btn.cloneNode(true);
  btn.parentNode.replaceChild(clone, btn);
  clone.textContent = confirmText || 'Save';
  clone.onclick = () => { onConfirm(); closeModal(); };
}

function closeModal() {
  document.getElementById('modalOverlay').style.display = 'none';
}

function fireConfetti() {
  const colors = ['#1E3A8A', '#047857', '#B45309', '#6D28D9'];
  for (let i = 0; i < 20; i++) {
    const el = document.createElement('div');
    el.style.position = 'fixed';
    el.style.top = '0';
    el.style.left = Math.random() * 100 + 'vw';
    el.style.width = '8px';
    el.style.height = '4px';
    el.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
    el.style.zIndex = '9999';
    el.style.transition = 'transform 1.2s ease-out, opacity 1.2s ease-out';
    document.body.appendChild(el);
    setTimeout(() => {
      el.style.transform = `translateY(100vh) rotate(${Math.random() * 360}deg)`;
      el.style.opacity = '0';
    }, 10);
    setTimeout(() => el.remove(), 1300);
  }
}
