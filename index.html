
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Task Dashboard &amp; Financial Suite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,500;0,600;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<meta name="theme-color" content="#F8FAFC">
<style>
  :root {
    --bg: #F8FAFC;
    --sheet: #FFFFFF;
    --sheet-alt: #F1F5F9;
    --ink: #0F172A;
    --muted: #64748B;
    --muted-light: #94A3B8;
    --icon: #94A3B8;
    --field: #CBD5E1;
    --rule: #E2E8F0;
    --rule-soft: #F1F5F9;

    --accent: #1E3A8A;
    --accent-hover: #1D4ED8;
    --accent-soft: #EFF6FF;
    --accent-border: #BFDBFE;

    --red: #BE123C;
    --red-soft: #FFF1F2;
    --red-border: #FECDD3;

    --green: #047857;
    --green-soft: #ECFDF5;
    --green-border: #A7F3D0;

    --amber: #B45309;
    --amber-soft: #FFFBEB;
    --amber-border: #FDE68A;

    --c-mhj: #2563EB;
    --c-shk: #6D28D9;
    --c-own: #0F766E;
    --c-personal: #BE185D;
    --c-fees: #D97706;

    --serif: 'Newsreader', Georgia, 'Times New Roman', serif;
    --sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    --mono: 'IBM Plex Mono', monospace;

    --shadow-xs: 0 1px 2px rgba(15, 23, 42, 0.04);
    --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06), 0 1px 2px rgba(15, 23, 42, 0.04);
    --shadow-modal: 0 25px 50px -12px rgba(15, 23, 42, 0.25);
  }

  * { box-sizing: border-box; }
  html { background: var(--bg); overflow-x: hidden; max-width: 100vw; -webkit-text-size-adjust: 100%; }

  body {
    font-family: var(--sans); font-size: 14px; line-height: 1.45; color: var(--ink);
    background: var(--bg); margin: 0 auto; max-width: 1140px; padding: 14px 14px 60px; overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  button, input, select, textarea { font-family: var(--sans); }
  button, [role=button] { -webkit-tap-highlight-color: transparent; }
  :where(button, input, select, a, [role=button]):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #searchBox:focus, .add-box input:focus, .add-box select:focus, #modalFields input:focus, #modalFields select:focus, #modalFields textarea:focus {
    outline: none; border-color: #2563EB; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
  }
  .ic { width: 15px; height: 15px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* Masthead */
  .masthead {
    display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center;
    gap: 8px 14px; margin-bottom: 12px; padding: 12px 18px;
    background: #FFFFFF; border: 1px solid var(--rule); border-radius: 12px;
    box-shadow: var(--shadow-xs);
  }
  .masthead-brand { display: flex; align-items: center; gap: 10px; }
  .masthead-crest {
    width: 38px; height: 38px; border-radius: 10px;
    background: linear-gradient(135deg, #0F172A 0%, #1E3A8A 100%);
    color: #F8FAFC; display: grid; place-content: center;
    font-family: var(--serif); font-weight: 600; font-size: 17px; letter-spacing: 0.04em;
    box-shadow: 0 2px 4px rgba(15, 23, 42, 0.15); border: 1px solid rgba(255, 255, 255, 0.15);
  }
  h1 { font-family: var(--serif); font-weight: 600; font-size: 21px; line-height: 1.15; margin: 0; color: var(--ink); }
  .sub { color: var(--muted); font-size: 12px; font-weight: 500; margin-top: 1px; display: flex; align-items: center; gap: 5px; }
  .sub-dot { width: 3px; height: 3px; border-radius: 50%; background: var(--muted-light); }
  
  .masthead .status {
    display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted);
  }
  .sync-badge {
    display: inline-flex; align-items: center; gap: 6px;
    background: #F8FAFC; border: 1px solid var(--rule); border-radius: 999px;
    padding: 3px 10px; font-size: 11.5px; font-weight: 500; color: #475569;
  }
  .pulse-dot {
    width: 6px; height: 6px; border-radius: 50%; background: #10B981;
    box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2);
  }
  .pulse-dot.syncing { background: #F59E0B; }
  
  #resetBtn {
    background: transparent; border: 1px solid var(--rule); border-radius: 6px;
    padding: 3px 8px; font: 600 11.5px var(--sans); color: var(--muted); cursor: pointer;
  }
  #resetBtn:hover { color: var(--ink); border-color: var(--muted); background: var(--sheet-alt); }

  /* Navigation */
  .page-nav {
    display: flex; gap: 6px; margin: 0 0 12px; padding: 3px;
    background: #EEF2F6; border: 1px solid var(--rule); border-radius: 10px;
    max-width: 440px;
  }
  .page-nav-btn {
    flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 8px 12px; border-radius: 7px; border: 0; background: transparent;
    color: var(--muted); font: 600 13px var(--sans); cursor: pointer; transition: all 0.15s ease;
  }
  .page-nav-btn:hover { color: var(--ink); background: rgba(255, 255, 255, 0.6); }
  .page-nav-btn.active {
    background: #FFFFFF; color: var(--accent); box-shadow: 0 1px 2px rgba(15, 23, 42, 0.08);
  }
  .page-nav-btn .nav-badge {
    background: var(--accent-soft); color: var(--accent);
    padding: 1px 6px; border-radius: 999px; font-size: 10.5px; font-weight: 700;
  }
  .page-nav-btn.active .nav-badge { background: var(--accent); color: #FFFFFF; }

  /* KPI Summary */
  .summary-sheet {
    background: var(--sheet); border: 1px solid var(--rule); border-radius: 12px;
    margin-bottom: 12px; overflow: hidden; box-shadow: var(--shadow-xs);
  }
  .hero-stats { display: grid; grid-template-columns: repeat(4, 1fr); }
  .hero-card { display: flex; flex-direction: column-reverse; justify-content: flex-end; min-width: 0; padding: 8px 12px 7px; }
  .hero-card + .hero-card { border-left: 1px solid var(--rule-soft); }
  .hero-card .l { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; line-height: 1.2; color: var(--muted); margin-top: 2px; }
  .hero-card .n { font-family: var(--serif); font-weight: 600; font-size: 22px; line-height: 1.1; font-variant-numeric: tabular-nums; color: var(--ink); }

  .totals { border-top: 1px solid var(--rule-soft); padding: 6px 0; background: #FAFCFE; }
  .totals > .tot { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; min-width: 0; padding: 3px 14px; }
  .totals .l { font-size: 12.5px; font-weight: 500; color: var(--muted); }
  .totals .fig { font-family: var(--serif); font-weight: 600; font-size: 16px; font-variant-numeric: tabular-nums; color: var(--ink); }
  .totals .fig.recd { color: var(--green); }
  .totals > .tot.sum { margin: 4px 14px 0; padding: 6px 0 3px; border-top: 1px dashed var(--rule); }
  .totals .fig.out { color: var(--red); font-size: 17px; line-height: 1.1; border-bottom: 2px solid var(--red); }
  .totals .fig.out.clear { color: var(--green); border-bottom-color: var(--green); }

  /* Loan Strip */
  .loan-strip {
    background: #FFFFFF; border: 1px solid #E2E8F0; border-left: 3.5px solid var(--accent);
    border-radius: 10px; padding: 8px 12px; margin-bottom: 12px; box-shadow: var(--shadow-xs);
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px;
  }
  .loan-strip-items { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; font-size: 12px; }
  .loan-pill-item { display: inline-flex; align-items: baseline; gap: 5px; }
  .loan-pill-item b { font-weight: 600; }
  .loan-pill-item span.red { color: var(--red); font-weight: 700; font-family: var(--serif); font-size: 14px; }
  .loan-pill-item span.amber { color: var(--amber); font-weight: 700; font-family: var(--serif); font-size: 14px; }

  /* Filters */
  .filters { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .filters.seg {
    gap: 2px; flex-wrap: nowrap; padding: 3px; background: #EEF2F6;
    border: 1px solid #E2E8F0; border-radius: 10px; overflow-x: auto; scrollbar-width: none;
  }
  .filters.seg::-webkit-scrollbar { display: none; }
  .filter-btn { cursor: pointer; font: 500 12.5px var(--sans); border: 0; background: transparent; padding: 5px 10px; border-radius: 6px; color: var(--muted); }
  .filters.seg .filter-btn.active { background: #FFFFFF; color: var(--accent); font-weight: 600; box-shadow: 0 1px 2px rgba(15, 23, 42, 0.08); }
  
  .filters.chips { margin-bottom: 10px; gap: 5px; }
  .filters.chips .filter-btn {
    display: inline-flex; align-items: center; background: #FFFFFF; border: 1px solid var(--rule);
    color: var(--ink); padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 500;
  }
  .filters.chips .filter-btn.active { background: var(--accent-soft); border-color: var(--accent-border); color: var(--accent); font-weight: 600; }
  .filter-btn .dot { width: 6px; height: 6px; border-radius: 50%; margin-right: 6px; flex: none; }

  /* Search & Add */
  #searchRow { margin: 0 0 10px; }
  #searchWrap { position: relative; }
  #searchWrap .ico { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--icon); pointer-events: none; width: 15px; height: 15px; }
  #searchBox {
    width: 100%; height: 38px; background: #FFFFFF; border: 1px solid var(--field); color: var(--ink);
    padding: 0 36px; border-radius: 9px; font: 400 13.5px var(--sans);
    box-shadow: var(--shadow-xs);
  }
  #searchClear {
    display: none; position: absolute; right: 4px; top: 4px; width: 30px; height: 30px;
    padding: 0; border: 0; background: transparent; color: var(--muted); cursor: pointer; border-radius: 6px;
  }
  #searchClear svg { display: block; margin: auto; width: 14px; height: 14px; }
  #searchInfo { font-size: 11.5px; color: var(--muted); margin: 4px 2px 0; font-weight: 500; }

  .add-box { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
  .add-box input, .add-box select {
    height: 38px; background: #FFFFFF; border: 1px solid var(--field); color: var(--ink);
    padding: 0 10px; border-radius: 8px; font: 400 13.5px var(--sans); max-width: 100%; min-width: 0;
  }
  #newCat { flex: 1 1 140px; font-weight: 500; }
  .add-box input[type=text] { flex: 2 1 180px; }
  .add-box button {
    height: 38px; padding: 0 18px;
    background: linear-gradient(135deg, #1E3A8A 0%, #2563EB 100%);
    color: #FFFFFF; border: 0; border-radius: 8px; font: 600 13.5px var(--sans); cursor: pointer;
  }

  #app { margin-top: 14px; }
  .empty { color: var(--muted); font-size: 14px; text-align: center; padding: 32px 14px; background: #FFFFFF; border: 1px dashed var(--rule); border-radius: 10px; }

  /* Sections & Cards */
  .cat-section { margin-bottom: 16px; }
  .cat-heading { display: flex; align-items: center; gap: 8px; margin: 0 2px 7px; min-height: 26px; cursor: pointer; user-select: none; }
  .cat-heading .dot { width: 8px; height: 8px; border-radius: 2px; flex: none; }
  .cat-heading .title { font-family: var(--serif); font-weight: 600; font-size: 16.5px; color: var(--ink); }
  .cat-heading .count {
    margin-left: auto; padding: 1px 7px; background: #F1F5F9; border: 1px solid var(--rule);
    border-radius: 999px; font: 500 11px var(--sans); color: var(--muted); white-space: nowrap; flex-shrink: 0;
  }
  .cat-heading .count b { font-weight: 600; color: var(--ink); }
  .cat-heading .count.has-pending b { color: #BE123C; }
  .cat-heading .chev { width: 14px; height: 14px; color: var(--icon); transition: transform .15s ease; }
  .cat-section.collapsed .cat-heading .chev { transform: rotate(-90deg); }

  .task-grid { background: var(--sheet); border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; box-shadow: var(--shadow-xs); }
  .task {
    display: flex; align-items: flex-start; gap: 8px; padding: 9px 12px 8px;
    border-top: 1px solid var(--rule-soft); position: relative;
  }
  .task:first-child { border-top: 0; }
  .task .num { flex: none; width: 18px; margin-left: -2px; text-align: right; font-size: 11px; line-height: 20px; color: var(--muted-light); font-variant-numeric: tabular-nums; font-weight: 500; }
  
  .task input[type=checkbox] {
    -webkit-appearance: none; appearance: none; flex: none; display: grid; place-content: center;
    width: 17px; height: 17px; margin: 2px 0 0; border: 1.5px solid var(--field); border-radius: 5px; background: var(--sheet); cursor: pointer;
  }
  .task input[type=checkbox]:checked { background: #2563EB; border-color: #2563EB; }
  .task input[type=checkbox]:checked::before { content: ''; width: 8px; height: 4px; margin-top: -2px; border-left: 2px solid #fff; border-bottom: 2px solid #fff; transform: rotate(-45deg); }
  
  .task-body { flex: 1; min-width: 0; }
  .task-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .task-name { flex: 1; min-width: 0; font-size: 14px; line-height: 1.35; font-weight: 600; color: var(--ink); overflow-wrap: anywhere; }
  .amt { flex: none; text-align: right; font-family: var(--serif); font-weight: 600; font-size: 16px; line-height: 1.15; font-variant-numeric: tabular-nums; }
  .amt.owed { color: var(--red); }
  .amt.clear { font: 600 11.5px var(--sans); color: var(--green); background: var(--green-soft); border: 1px solid var(--green-border); padding: 1px 6px; border-radius: 4px; }
  .amt small { display: block; font: 500 10.5px var(--sans); color: var(--muted); }
  
  .task-sub { display: flex; flex-wrap: wrap; align-items: center; gap: 0 10px; margin-top: 2px; font-size: 12px; line-height: 1.4; color: var(--muted); }
  .note {
    display: flex; align-items: flex-start; gap: 5px; margin-top: 4px; width: fit-content; max-width: 100%;
    padding: 3px 8px; border-radius: 6px; background: var(--amber-soft); border: 1px solid var(--amber-border);
    color: #92400E; font-size: 11.5px; line-height: 1.35; font-weight: 500;
  }
  .note .ic { margin-top: 2px; width: 12px; height: 12px; color: var(--amber); }

  .task-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 0 10px; margin-top: 3px; font-size: 12px; }
  .act {
    display: inline-flex; align-items: center; gap: 4px; padding: 3px 0; background: none; border: 0;
    font: 600 11.5px var(--sans); color: var(--accent); cursor: pointer; text-underline-offset: 2px;
  }
  .act:hover { text-decoration: underline; }
  .act.wa { color: var(--green); }
  .act.pay {
    padding: 2px 7px; margin: 1px 0; border: 1px solid var(--rule); border-radius: 6px;
    background: #F8FAFC; color: #1E3A8A; font-weight: 600;
  }
  .act.del {
    display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px;
    margin: -3px 0; padding: 0; border-radius: 6px; color: var(--icon); background: transparent; border: 0; cursor: pointer;
  }
  .act.del:hover { color: var(--red); background: var(--red-soft); }

  .task.done { padding: 7px 12px 6px; opacity: 0.72; }
  .task.done .task-name { font-weight: 400; color: var(--muted); text-decoration: line-through; }
  .done-toggle {
    display: block; width: 100%; text-align: left; padding: 8px 12px; background: #FAFCFE; border: 0; border-top: 1px solid var(--rule-soft);
    color: var(--muted); font: 500 12px var(--sans); cursor: pointer;
  }

  #toTop {
    position: fixed; right: 16px; bottom: 18px; width: 38px; height: 38px; padding: 0; border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.2); background: #0F172A; color: #fff; cursor: pointer;
    box-shadow: 0 4px 12px rgba(15, 23, 42, 0.3); opacity: 0; pointer-events: none; transform: translateY(6px);
    transition: opacity 0.2s ease, transform 0.2s ease; z-index: 900;
  }
  #toTop.show { opacity: 0.95; pointer-events: auto; transform: none; }

  /* Modals */
  .btn { height: 38px; padding: 0 16px; border-radius: 8px; border: 1px solid transparent; font: 600 13.5px var(--sans); cursor: pointer; }
  .btn-primary { background: linear-gradient(135deg, #1E3A8A 0%, #2563EB 100%); color: #fff; }
  .btn-wa { background: linear-gradient(135deg, #059669 0%, #047857 100%); color: #fff; }
  .btn-danger { background: linear-gradient(135deg, #BE123C 0%, #E11D48 100%); color: #fff; }
  .btn-quiet { background: #FFFFFF; color: #334155; border-color: var(--field); }

  #modalOverlay {
    position: fixed; inset: 0; background: rgba(15, 23, 42, 0.55); backdrop-filter: blur(6px);
    z-index: 1000; align-items: center; justify-content: center; padding: 14px;
  }
  .modal {
    background: #FFFFFF; border-radius: 14px; padding: 20px; width: 100%; max-width: 440px;
    max-height: calc(100vh - 28px); max-height: calc(100dvh - 28px); overflow-y: auto;
    box-shadow: var(--shadow-modal); border: 1px solid var(--rule);
  }
  #modalTitle { font-family: var(--serif); font-weight: 600; font-size: 19px; line-height: 1.25; margin-bottom: 12px; color: var(--ink); }
  .modal-actions { display: flex; gap: 8px; margin-top: 16px; justify-content: flex-end; }
  #modalFields label { display: block; margin: 0 0 4px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
  #modalFields input:not([type=checkbox]), #modalFields select, #modalFields textarea {
    display: block; width: 100%; height: 38px; margin-bottom: 12px; padding: 0 10px; background: #FFFFFF; color: var(--ink);
    border: 1px solid var(--field); border-radius: 8px; font: 400 13.5px var(--sans);
  }
  #modalFields .check-row {
    display: flex; align-items: center; gap: 8px; margin: 8px 0 2px;
    font-size: 13px; font-weight: 600; color: var(--green); cursor: pointer;
  }
  #modalFields .check-row input[type=checkbox] { width: 17px; height: 17px; margin: 0; flex: none; accent-color: var(--green); }
  .receipt-preview {
    white-space: pre-wrap; word-break: break-word; background: var(--green-soft);
    border: 1px solid var(--green-border); border-radius: 8px; padding: 10px 12px;
    font-size: 12.5px; line-height: 1.45; max-height: 220px; overflow-y: auto; color: var(--ink);
  }
  .hint { font-size: 12px; line-height: 1.45; color: var(--muted); margin-bottom: 10px; }

  #authGate {
    position: fixed; inset: 0; z-index: 2000; display: flex; align-items: center; justify-content: center; padding: 16px;
    background: radial-gradient(circle at 50% 35%, #1E293B 0%, #0F172A 100%);
  }
  .auth-card {
    width: 100%; max-width: 340px; text-align: center;
    background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(20px); border-radius: 16px; padding: 30px 22px;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
  }
  .auth-crest {
    width: 44px; height: 44px; margin: 0 auto 12px; border-radius: 12px;
    background: linear-gradient(135deg, #1E3A8A, #2563EB);
    color: #FFFFFF; display: grid; place-content: center;
    font-family: var(--serif); font-size: 18px; font-weight: 600;
  }
  .auth-title { font-family: var(--serif); font-weight: 600; font-size: 22px; color: #FFFFFF; }
  .auth-sub { font-size: 12px; color: #94A3B8; margin-top: 2px; }
  .auth-note { margin: 18px 0 8px; font-size: 11.5px; color: #94A3B8; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }
  #authInput {
    display: block; width: 100%; height: 42px; margin-bottom: 10px; padding: 0 14px;
    background: rgba(255, 255, 255, 0.08); color: #FFFFFF; border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 10px; font: 400 15px var(--sans); text-align: center;
  }
  #authInput:focus { border-color: #3B82F6; outline: none; }
  .auth-card .btn { width: 100%; height: 42px; }
  #authError { display: none; margin-top: 10px; font-size: 12.5px; font-weight: 600; color: #FB7185; }

  @media (min-width: 760px) {
    body { padding: 20px 24px 60px; }
    h1 { font-size: 24px; }
    .summary-sheet { display: grid; grid-template-columns: 1.2fr 0.8fr; }
    .hero-stats { grid-template-columns: repeat(4, 1fr);
