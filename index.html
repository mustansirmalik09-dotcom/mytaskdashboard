<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Live Task Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,500;0,600;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<meta name="theme-color" content="#EFF6FF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
  :root {
    --bg: #F4F7FE;
    --sheet: #FFFFFF;
    --sheet-alt: #F8FAFC;
    --ink: #0F172A;
    --ink-light: #1E293B;
    --muted: #64748B;
    --muted-light: #94A3B8;
    --icon: #64748B;
    --field: #CBD5E1;
    --rule: #E2E8F0;
    --rule-soft: #F1F5F9;

    /* Vibrant Corporate Palette */
    --accent: #2563EB;
    --accent-hover: #1D4ED8;
    --accent-soft: #EFF6FF;
    --accent-border: #BFDBFE;

    --violet: #7C3AED;
    --violet-soft: #F5F3FF;
    --violet-border: #DDD6FE;

    --coral: #E11D48;
    --red: #E11D48;
    --red-soft: #FFF1F2;
    --red-border: #FECDD3;

    --green: #059669;
    --green-soft: #ECFDF5;
    --green-border: #A7F3D0;

    --amber: #D97706;
    --amber-soft: #FFFBEB;
    --amber-border: #FDE68A;

    --cyan: #0891B2;
    --cyan-soft: #ECFEFF;

    --c-mhj: #2563EB;
    --c-shk: #7C3AED;
    --c-own: #0D9488;
    --c-personal: #E11D48;
    --c-invitation: #DB2777;
    --c-fees: #F59E0B;

    --serif: 'Newsreader', Georgia, 'Times New Roman', serif;
    --sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;

    --shadow-xs: 0 1px 2px rgba(37, 99, 235, 0.05);
    --shadow-sm: 0 2px 6px rgba(15, 23, 42, 0.05), 0 1px 2px rgba(37, 99, 235, 0.04);
    --shadow-md: 0 8px 18px -4px rgba(37, 99, 235, 0.10), 0 2px 6px -2px rgba(15, 23, 42, 0.05);
    --shadow-modal: 0 25px 50px -12px rgba(15, 23, 42, 0.28);
  }

  * { box-sizing: border-box; }
  html { background: var(--bg); overflow-x: hidden; width: 100%; max-width: 100vw; -webkit-text-size-adjust: 100%; }
  
  body {
    font-family: var(--sans); font-size: 13.5px; line-height: 1.45; color: var(--ink);
    background: radial-gradient(circle at 0% 0%, #EEF2FF 0%, #F4F7FE 45%, #F0FDF4 100%);
    margin: 0 auto; max-width: 1120px; padding: 10px 10px 64px;
    overflow-x: hidden; width: 100%; -webkit-font-smoothing: antialiased;
  }

  button, input, select { font-family: var(--sans); }
  button, [role=button] { -webkit-tap-highlight-color: transparent; }
  :where(button, input, select, a, [role=button]):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .ic { width: 15px; height: 15px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* Vibrant Corporate Masthead */
  .masthead {
    display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center;
    gap: 8px; margin-bottom: 10px; padding: 10px 14px;
    background: linear-gradient(120deg, #1E3A8A 0%, #2563EB 55%, #7C3AED 100%);
    color: #FFFFFF; border-radius: 14px; box-shadow: var(--shadow-md);
  }
  .masthead-brand { display: flex; align-items: center; gap: 10px; }
  .masthead-crest {
    width: 36px; height: 36px; border-radius: 10px;
    background: rgba(255, 255, 255, 0.18); backdrop-filter: blur(6px);
    color: #FFFFFF; display: grid; place-content: center;
    font-family: var(--serif); font-weight: 600; font-size: 16px;
    border: 1px solid rgba(255, 255, 255, 0.35);
  }
  h1 { font-family: var(--serif); font-weight: 600; font-size: 20px; line-height: 1.15; margin: 0; color: #FFFFFF; }
  .sub { color: #DBEAFE; font-size: 11.5px; font-weight: 500; margin-top: 1px; display: flex; align-items: center; gap: 5px; }
  .sub-dot { width: 4px; height: 4px; border-radius: 50%; background: #93C5FD; }
  
  .masthead .status { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #E0E7FF; }
  .sync-badge {
    display: inline-flex; align-items: center; gap: 5px;
    background: rgba(255, 255, 255, 0.16); border: 1px solid rgba(255, 255, 255, 0.28); border-radius: 999px;
    padding: 3px 9px; font-size: 10.5px; font-weight: 600; color: #FFFFFF;
  }
  .pulse-dot { width: 6px; height: 6px; border-radius: 50%; background: #34D399; box-shadow: 0 0 6px #34D399; }
  #resetBtn {
    background: rgba(255, 255, 255, 0.16); border: 1px solid rgba(255, 255, 255, 0.28); border-radius: 7px;
    padding: 3px 8px; font: 600 10.5px var(--sans); color: #FFFFFF; cursor: pointer;
  }
  #resetBtn:hover { background: rgba(255, 255, 255, 0.28); }

  /* Compact Summary Sheet */
  .summary-sheet {
    background: var(--sheet); border: 1px solid var(--rule); border-radius: 14px;
    margin-bottom: 10px; overflow: hidden; box-shadow: var(--shadow-sm);
  }
  .hero-stats { display: grid; grid-template-columns: repeat(4, 1fr); }
  .hero-card { display: flex; flex-direction: column-reverse; justify-content: flex-end; min-width: 0; padding: 8px 8px; position: relative; }
  .hero-card + .hero-card { border-left: 1px solid var(--rule-soft); }
  .hero-card .l { font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin-top: 1px; }
  .hero-card .n { font-family: var(--serif); font-weight: 600; font-size: 17px; line-height: 1.1; font-variant-numeric: tabular-nums; color: var(--ink); }
  .hero-card:nth-child(1) { background: linear-gradient(180deg, #ECFDF5 0%, #FFFFFF 100%); }
  .hero-card:nth-child(1) .n { color: var(--green); }
  .hero-card:nth-child(2) { background: linear-gradient(180deg, #FFFBEB 0%, #FFFFFF 100%); }
  .hero-card:nth-child(2) .n { color: var(--amber); }
  .hero-card:nth-child(3) { background: linear-gradient(180deg, #ECFEFF 0%, #FFFFFF 100%); }
  .hero-card:nth-child(3) .n { color: var(--cyan); }
  .hero-card:nth-child(4) { background: linear-gradient(180deg, #EFF6FF 0%, #FFFFFF 100%); }
  .hero-card:nth-child(4) .n { color: var(--accent); }

  .totals { border-top: 1px solid var(--rule-soft); padding: 4px 0 3px; background: #FAFCFF; }
  .totals > .tot { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 3px 12px; }
  .totals .l { font-size: 11.5px; font-weight: 600; color: var(--muted); }
  .totals .fig { font-family: var(--serif); font-weight: 600; font-size: 15px; font-variant-numeric: tabular-nums; color: var(--ink); }
  .totals > .tot.sum { margin: 3px 12px 0; padding: 5px 0 3px; border-top: 1px dashed var(--rule); }
  .totals .fig.out { color: var(--red); font-size: 16px; border-bottom: 2px solid var(--red); }

  /* Compact Toolbar: Search + Add Task */
  #searchRow { margin: 0 0 8px; }
  #searchWrap { position: relative; }
  #searchWrap .ico { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--accent); pointer-events: none; width: 15px; height: 15px; }
  #searchBox {
    width: 100%; height: 36px; background: #FFFFFF; border: 1.5px solid var(--accent-border); color: var(--ink);
    padding: 0 32px 0 32px; border-radius: 10px; font: 500 13px var(--sans); box-shadow: var(--shadow-xs);
  }
  #searchBox:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.14); }
  #searchClear { display: none; position: absolute; right: 4px; top: 4px; width: 28px; height: 28px; border: 0; background: transparent; color: var(--muted); cursor: pointer; }
  #searchInfo { font-size: 11.5px; color: var(--muted); margin: 4px 2px 0; }
  #searchInfo:empty { display: none; }

  .add-box { display: flex; gap: 5px; margin-bottom: 8px; flex-wrap: wrap; }
  .add-box input, .add-box select {
    height: 36px; background: #FFFFFF; border: 1.5px solid var(--rule); color: var(--ink);
    padding: 0 9px; border-radius: 9px; font: 500 12.5px var(--sans); max-width: 100%; min-width: 0;
  }
  .add-box input:focus, .add-box select:focus { outline: none; border-color: var(--accent); }
  #newCat { flex: 1 1 130px; font-weight: 600; color: var(--accent); background: var(--accent-soft); border-color: var(--accent-border); }
  .add-box input[type=text] { flex: 2 1 170px; }
  .add-box button {
    height: 36px; padding: 0 16px; background: linear-gradient(135deg, #2563EB 0%, #7C3AED 100%);
    color: #FFFFFF; border: 0; border-radius: 9px; font: 700 12.5px var(--sans); cursor: pointer;
    box-shadow: 0 2px 6px rgba(124, 58, 237, 0.25);
  }
  .add-box button:hover { filter: brightness(1.07); }

  /* Playful Category Filters & Sections */
  .filters { display: flex; gap: 5px; margin-bottom: 8px; flex-wrap: wrap; }
  .filters.seg {
    gap: 3px; flex-wrap: nowrap; padding: 3px; background: #E0E7FF;
    border: 1px solid #C7D2FE; border-radius: 10px; overflow-x: auto; scrollbar-width: none;
  }
  .filters.seg::-webkit-scrollbar { display: none; }
  .filter-btn { cursor: pointer; font: 600 12px var(--sans); transition: all 0.15s ease; }
  .filters.seg .filter-btn {
    flex: 1 1 auto; border: 0; background: transparent; color: #3730A3;
    padding: 5px 9px; border-radius: 7px; white-space: nowrap;
  }
  .filters.seg .filter-btn.active {
    background: linear-gradient(135deg, #2563EB 0%, #4F46E5 100%);
    color: #FFFFFF; font-weight: 700; box-shadow: 0 2px 5px rgba(37, 99, 235, 0.25);
  }
  .filters.chips { margin-bottom: 10px; gap: 5px; }
  .filters.chips .filter-btn {
    display: inline-flex; align-items: center; background: #FFFFFF; border: 1.5px solid var(--rule);
    color: var(--ink); padding: 4px 10px; border-radius: 999px; font-size: 11.5px; font-weight: 600;
  }
  .filters.chips .filter-btn.active {
    background: linear-gradient(135deg, #EFF6FF 0%, #F5F3FF 100%);
    border-color: var(--accent); color: var(--accent); font-weight: 700;
  }
  .filter-btn .dot { width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; flex: none; }

  .cat-section { margin-bottom: 12px; }
  .cat-heading {
    display: flex; align-items: center; gap: 7px; margin: 0 0 6px; padding: 5px 10px;
    background: #FFFFFF; border: 1px solid var(--rule); border-radius: 9px; cursor: pointer;
    box-shadow: var(--shadow-xs);
  }
  .cat-heading .dot { width: 9px; height: 9px; border-radius: 3px; flex: none; }
  .cat-heading .title { font-family: var(--serif); font-weight: 600; font-size: 15.5px; color: var(--ink); }
  .cat-heading .count {
    margin-left: auto; padding: 2px 8px; background: var(--accent-soft); border: 1px solid var(--accent-border);
    border-radius: 999px; font: 600 10.5px var(--sans); color: var(--accent);
  }
  .cat-section.collapsed .cat-heading .chev { transform: rotate(-90deg); }

  /* Compact Tasks List */
  .task-grid { background: var(--sheet); border: 1px solid var(--rule); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow-sm); }
  .task {
    display: flex; align-items: flex-start; gap: 7px; padding: 8px 10px;
    border-top: 1px solid var(--rule-soft); position: relative; transition: background 0.12s ease;
  }
  .task:hover { background: #FAFBFD; }
  .task:first-child { border-top: 0; }
  .task.done { opacity: 0.72; }
  .task.done .task-name { text-decoration: line-through; color: var(--muted); font-weight: 500; }
  .task .num { flex: none; width: 16px; text-align: right; font-size: 11px; line-height: 19px; color: var(--muted-light); font-weight: 600; }
  .task input[type=checkbox] {
    -webkit-appearance: none; appearance: none; flex: none; display: grid; place-content: center;
    width: 17px; height: 17px; margin: 1px 0 0; border: 1.8px solid #94A3B8; border-radius: 5px; background: var(--sheet); cursor: pointer;
  }
  .task input[type=checkbox]:checked { background: linear-gradient(135deg, #10B981, #059669); border-color: #059669; }
  .task input[type=checkbox]:checked::before { content: ''; width: 8px; height: 4px; margin-top: -2px; border-left: 2px solid #fff; border-bottom: 2px solid #fff; transform: rotate(-45deg); }
  .task-body { flex: 1; min-width: 0; }
  .task-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 6px; }
  .task-name { flex: 1; min-width: 0; font-size: 13.5px; line-height: 1.32; font-weight: 600; color: var(--ink); overflow-wrap: break-word; word-break: break-word; }
  .amt { flex: none; text-align: right; font-family: var(--serif); font-weight: 700; font-size: 14.5px; }
  .amt.owed { color: var(--red); }
  .amt.clear { font: 700 10.5px var(--sans); color: var(--green); background: var(--green-soft); border: 1px solid var(--green-border); padding: 1px 6px; border-radius: 5px; }
  .task-sub { font-size: 11px; color: var(--muted); margin-top: 1px; }
  .note {
    display: flex; align-items: flex-start; gap: 5px; margin-top: 4px; padding: 3px 8px; border-radius: 6px;
    background: linear-gradient(90deg, #FFFBEB 0%, #FEF3C7 100%); border: 1px solid var(--amber-border); color: #92400E; font-size: 11px; font-weight: 500;
  }
  .task-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 9px; margin-top: 3px; font-size: 11.5px; }
  .act { display: inline-flex; align-items: center; gap: 4px; padding: 2px 0; background: none; border: 0; font: 700 11px var(--sans); color: var(--accent); cursor: pointer; }
  .act.pay { padding: 2px 8px; border: 1px solid var(--accent-border); border-radius: 6px; background: var(--accent-soft); color: var(--accent); }
  .act.wa { color: var(--green); }
  .act.del { flex: none; justify-content: center; width: 24px; height: 24px; color: var(--icon); border: 0; background: none; cursor: pointer; }
  .act.del:hover { color: var(--red); }
  .done-toggle {
    display: block; width: 100%; text-align: left; padding: 7px 12px; background: #F8FAFC; border: 0; border-top: 1px solid var(--rule-soft);
    color: var(--accent); font: 600 11.5px var(--sans); cursor: pointer;
  }

  /* Vibrant Page Nav */
  .page-nav {
    display: flex; gap: 5px; margin: 0 0 10px; padding: 3px;
    background: #E0E7FF; border: 1px solid #C7D2FE; border-radius: 12px; width: 100%;
  }
  .page-nav-btn {
    flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 5px;
    padding: 7px 8px; border-radius: 9px; border: 0; background: transparent;
    color: #3730A3; font: 700 12px var(--sans); cursor: pointer; transition: all 0.15s ease;
  }
  .page-nav-btn.active {
    background: linear-gradient(135deg, #2563EB 0%, #7C3AED 100%);
    color: #FFFFFF; box-shadow: 0 2px 6px rgba(37, 99, 235, 0.25);
  }
  .page-nav-btn .nav-badge { background: rgba(37, 99, 235, 0.12); color: #1E3A8A; padding: 1px 6px; border-radius: 999px; font-size: 10px; font-weight: 800; }
  .page-nav-btn.active .nav-badge { background: rgba(255, 255, 255, 0.24); color: #FFFFFF; }

  /* Financials Page & Collapsible Accordion Sheets */
  #financialsView { display: none; width: 100%; max-width: 100%; }
  .fin-mode-toggle {
    display: flex; gap: 3px; padding: 3px; background: #E0E7FF; border: 1px solid #C7D2FE;
    border-radius: 9px; margin-bottom: 10px; overflow-x: auto; width: 100%; scrollbar-width: none;
  }
  .fin-mode-toggle::-webkit-scrollbar { display: none; }
  .fin-mode-btn {
    flex: 0 0 auto; border: 0; background: transparent; padding: 5px 10px; border-radius: 7px;
    font: 700 11px var(--sans); color: #3730A3; cursor: pointer; white-space: nowrap;
  }
  .fin-mode-btn.active { background: #FFFFFF; color: var(--accent); box-shadow: 0 1px 3px rgba(37, 99, 235, 0.18); }

  .fin-hero-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 10px; width: 100%; }
  .fin-card {
    background: #FFFFFF; border: 1px solid var(--rule); border-radius: 11px; padding: 9px 11px;
    box-shadow: var(--shadow-xs); border-top: 3px solid var(--accent);
  }
  .fin-card:nth-child(1) { border-top-color: var(--green); background: linear-gradient(180deg, #ECFDF5 0%, #FFFFFF 55%); }
  .fin-card:nth-child(2) { border-top-color: #2563EB; background: linear-gradient(180deg, #EFF6FF 0%, #FFFFFF 55%); }
  .fin-card:nth-child(3) { border-top-color: var(--coral); background: linear-gradient(180deg, #FFF1F2 0%, #FFFFFF 55%); }
  .fin-card:nth-child(4) { border-top-color: var(--violet); background: linear-gradient(180deg, #F5F3FF 0%, #FFFFFF 55%); }
  .fin-card .f-lbl { font-size: 9.5px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
  .fin-card .f-val { font-family: var(--serif); font-size: 17.5px; font-weight: 700; color: var(--ink); margin: 2px 0 1px; }
  .fin-card .f-sub { font-size: 10px; color: var(--muted); font-weight: 500; }

  .statement-sheet {
    background: #FFFFFF; border: 1px solid var(--rule); border-radius: 13px;
    box-shadow: var(--shadow-sm); margin-bottom: 9px; overflow: hidden; width: 100%;
    transition: box-shadow 0.15s ease;
  }
  .statement-sheet:hover { box-shadow: var(--shadow-md); }
  .statement-header {
    background: linear-gradient(120deg, #1E3A8A 0%, #2563EB 60%, #0D9488 100%); color: #FFFFFF;
    padding: 11px 13px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px;
    cursor: pointer; user-select: none;
  }
  .statement-header-left { display: flex; align-items: center; gap: 9px; min-width: 0; flex: 1; }
  .stmt-chev {
    width: 22px; height: 22px; border-radius: 6px; background: rgba(255, 255, 255, 0.16);
    display: grid; place-content: center; flex: none; transition: transform 0.2s ease;
  }
  .statement-sheet.collapsed .stmt-chev { transform: rotate(-90deg); }
  .statement-header h3 { font-family: var(--serif); font-size: 15px; font-weight: 600; margin: 0; line-height: 1.2; }
  .statement-body { padding: 10px 10px; width: 100%; }

  /* Loans & Advances Cards */
  .loan-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 8px; margin-bottom: 8px; }
  .loan-card {
    background: #FFFFFF; border: 1px solid var(--rule); border-radius: 10px; padding: 10px 12px;
    box-shadow: var(--shadow-xs); display: flex; flex-direction: column; justify-content: space-between;
  }
  .loan-pill { font-size: 9.5px; font-weight: 800; text-transform: uppercase; padding: 2px 6px; border-radius: 5px; }
  .loan-pill.asset { background: var(--red-soft); color: var(--red); border: 1px solid var(--red-border); }
  .loan-pill.liab { background: var(--amber-soft); color: var(--amber); border: 1px solid var(--amber-border); }
  .loan-pill.settled { background: var(--green-soft); color: var(--green); border: 1px solid var(--green-border); }

  /* Table Responsive Wrapper & Horizontal Touch Scrolling */
  .table-responsive {
    width: 100%;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    margin-bottom: 10px;
    border: 1px solid var(--rule);
    border-radius: 9px;
    background: #FFFFFF;
  }
  .stmt-table {
    width: 100%;
    min-width: 520px;
    border-collapse: collapse;
    font-size: 11.5px;
  }
  .stmt-table th {
    background: linear-gradient(90deg, #EFF6FF 0%, #F5F3FF 100%); border-bottom: 1.5px solid #C7D2FE; padding: 7px 9px;
    font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; color: #1E3A8A;
    white-space: nowrap;
  }
  .stmt-table td {
    padding: 7px 9px; border-bottom: 1px solid var(--rule-soft); vertical-align: top;
    overflow-wrap: break-word; word-break: break-word;
  }
  .stmt-table tr:last-child td { border-bottom: 0; }
  .stmt-mono { font-family: var(--serif); font-weight: 700; font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .text-right { text-align: right; }

  /* Modal */
  #modalOverlay {
    position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(5px);
    z-index: 1000; align-items: center; justify-content: center; padding: 12px;
  }
  .modal {
    background: #FFFFFF; border-radius: 16px; padding: 16px 16px; width: 100%; max-width: 400px;
    max-height: calc(100vh - 24px); max-height: calc(100dvh - 24px); overflow-y: auto;
    box-shadow: var(--shadow-modal); border: 1.5px solid var(--accent-border);
  }
  #modalTitle { font-family: var(--serif); font-weight: 700; font-size: 17.5px; margin-bottom: 10px; color: #1E3A8A; }
  .modal-actions { display: flex; gap: 8px; margin-top: 12px; justify-content: flex-end; }
  #modalFields label { display: block; margin: 0 0 3px; font-size: 10.5px; font-weight: 800; text-transform: uppercase; color: var(--muted); }
  #modalFields input:not([type=checkbox]), #modalFields select {
    display: block; width: 100%; height: 36px; margin-bottom: 9px; padding: 0 10px; background: #FFFFFF; color: var(--ink);
    border: 1.5px solid var(--field); border-radius: 8px; font: 500 13px var(--sans);
  }
  .hint { font-size: 12.5px; color: var(--muted); margin-bottom: 10px; line-height: 1.45; }

<script>

function inr(n) {

function toggleGroup(key) {

}

}

}

// ---- Core Task Persistence, Modal & Two-Way Calendar/Cloud Sync ----

async function loadTasks() {
  let saved = [];
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (Array.isArray(parsed)) saved = parsed;
    }
  } catch (e) {
    saved = [];
  }
  const savedIds = new Set(saved.map(t => t.id));
  const newFromSeed = seedTasks.filter(t => !savedIds.has(t.id));
  tasks = saved.concat(newFromSeed);
  saveTasks();
  render();
  if (activePage === 'financials') renderFinancialsPage();
  if (activePage === 'invoices') renderInvoicesPage();
}

function saveTasks() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    const syncEl = document.getElementById('lastSync');
    if (syncEl) syncEl.textContent = 'Saved ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  } catch (e) {}
}

function showModal(title, fieldsHtml, onConfirm, confirmLabel, skipLabel) {
  const overlay = document.getElementById('modalOverlay');
  if (!overlay) return;
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalFields').innerHTML = fieldsHtml;
  overlay.style.display = 'flex';
  const btn = document.getElementById('modalConfirmBtn');
  const newBtn = btn.cloneNode(true);
  btn.parentNode.replaceChild(newBtn, btn);
  newBtn.textContent = confirmLabel || 'Save';
  newBtn.className = 'btn ' + (confirmLabel === 'Delete' ? 'btn-danger' : (/whatsapp/i.test(confirmLabel || '') ? 'btn-wa' : 'btn-primary'));
  newBtn.onclick = () => {
    const res = onConfirm();
    if (res !== false) closeModal();
  };
  const cancelBtn = document.querySelector('#modalOverlay button[onclick="closeModal()"]');
  if (cancelBtn) cancelBtn.textContent = skipLabel || 'Cancel';
}

function closeModal() {
  const overlay = document.getElementById('modalOverlay');
  if (overlay) overlay.style.display = 'none';
}

function onCategoryChange() {
  const select = document.getElementById('newCat');
  if (!select) return;
  if (select.value === '__NEW__') {
    showModal('Add a new category', `
      <label>Category name (e.g. a new employer or client group)</label>
      <input type="text" id="modalNewCatName" placeholder="e.g. ABC Company">
    `, () => {
      const raw = document.getElementById('modalNewCatName').value.trim();
      if (!raw) { select.value = 'PERSONAL'; return; }
      const tag = raw.toUpperCase().replace(/[^A-Z0-9]+/g, '_').replace(/^_+|_+$/g, '');
      if (!tag) { select.value = 'PERSONAL'; return; }
      let exists = false;
      for (const opt of select.options) { if (opt.value === tag) { exists = true; break; } }
      if (!exists) {
        const newOption = document.createElement('option');
        newOption.value = tag;
        newOption.textContent = 'Professional — ' + raw;
        select.insertBefore(newOption, select.querySelector('option[value="__NEW__"]'));
      }
      select.value = tag;
      document.getElementById('feeFields').style.display = 'none';
    }, 'Create', 'Cancel');
    select.value = 'PERSONAL';
  } else {
    const feeBox = document.getElementById('feeFields');
    if (feeBox) feeBox.style.display = select.value === 'FEES' ? 'flex' : 'none';
  }
}

function addTask() {
  const input = document.getElementById('newTask');
  const catVal = document.getElementById('newCat').value;
  const name = input.value.trim();
  if (!name) return;

  if (catVal === 'FEES') {
    const payable = parseFloat(document.getElementById('feePayable').value) || 0;
    const received = parseFloat(document.getElementById('feeReceived').value) || 0;
    const linked = document.getElementById('feeLinked').value.trim();
    const phone = document.getElementById('feePhone').value.trim();
    const localId = 'u' + Date.now();
    const task = { id: localId, name, type: 'fee', cat: 'FEES', feeCat: '', due: '', done: received >= payable && payable > 0, urgent: false, payable, received, discount: 0, linked, phone };
    tasks.push(task);
    input.value = '';
    document.getElementById('feePayable').value = '';
    document.getElementById('feeReceived').value = '';
    document.getElementById('feeLinked').value = '';
    document.getElementById('feePhone').value = '';
    saveTasks();
    render();
    if (activePage === 'invoices') renderInvoicesPage();
    pushFeeToCalendar(name, payable, received, linked, phone, '').then(calId => {
      if (calId) { task.id = calId; saveTasks(); }
    });
    return;
  }

  const type = catVal === 'PERSONAL' ? 'personal' : (catVal === 'INVITATION' ? 'invitation' : 'professional');
  const cat = catVal === 'PERSONAL' ? null : catVal;
  const localId = 'u' + Date.now();
  const dueDateInput = document.getElementById('newDueDate');
  const dueDateVal = dueDateInput ? dueDateInput.value : '';
  const task = { id: localId, name, type, cat, due: '', dueDate: dueDateVal ? new Date(dueDateVal + 'T09:00:00').toISOString() : null, done: false, urgent: false };
  tasks.push(task);
  input.value = '';
  if (dueDateInput) dueDateInput.value = '';
  saveTasks();
  render();
  pushToCalendar(name, catVal, dueDateVal).then(calId => {
    if (calId) {
      task.id = calId;
      saveTasks();
      if (task.done) toggleOnCalendar(task.id, task.done);
    }
  });
}

function toggleTask(id) {
  const t = tasks.find(x => x.id === id);
  if (!t) return;
  t.done = !t.done;
  saveTasks();
  render();
  if (t.id.startsWith('cal_')) toggleOnCalendar(t.id, t.done);

  if (t.done && t.type === 'professional') {
    const GROUP_DEFAULT_PHONES = { SHK: '9425320184', HATIM_BHAI_ADV: '9826768052' };
    const defaultPhone = (t.cat && GROUP_DEFAULT_PHONES[t.cat]) ? GROUP_DEFAULT_PHONES[t.cat] : '';
    showModal('Fee for "' + t.name + '"?', `
      <label>Payable amount (leave blank to skip)</label>
      <input type="number" id="modalPayable" placeholder="₹ Payable">
      <label>Received now</label>
      <input type="number" id="modalReceived" placeholder="₹ Received" value="0">
      <label>Client phone (optional, for WhatsApp reminder)</label>
      <input type="tel" id="modalPhone" placeholder="e.g. 9876543210" value="${defaultPhone}">
    `, () => {
      const payable = parseFloat(document.getElementById('modalPayable').value);
      const received = parseFloat(document.getElementById('modalReceived').value) || 0;
      const phone = document.getElementById('modalPhone').value.trim();
      if (!isNaN(payable) && payable > 0) {
        const localId = 'u' + Date.now();
        const feeTask = { id: localId, name: t.name, type: 'fee', cat: 'FEES', feeCat: t.cat || '', due: '', done: received >= payable, urgent: false, payable, received, discount: 0, linked: t.name, phone };
        tasks.push(feeTask);
        saveTasks();
        render();
        pushFeeToCalendar(t.name, payable, received, t.name, phone, t.cat || '').then(calId => {
          if (calId) { feeTask.id = calId; saveTasks(); }
        });
      }
    }, 'Save Fee', 'Skip');
  }
}

function setDueDate(id) {
  const t = tasks.find(x => x.id === id);
  if (!t) return;
  const currentVal = t.dueDate ? new Date(t.dueDate).toISOString().slice(0, 10) : '';
  showModal('Due date — ' + t.name, `
    <label>Pick a due date</label>
    <input type="date" id="modalDueDate" value="${currentVal}">
  `, async () => {
    const val = document.getElementById('modalDueDate').value;
    if (!val) return;
    t.dueDate = new Date(val + 'T09:00:00').toISOString();

async function pullFromCalendar() {
  const url = getWebhook();
  if (!url) return;
  try {
    const res = await fetch(url);
    const events = await res.json();
    if (!Array.isArray(events)) return;
    const calIds = new Set(events.map(ev => ev.id));
    const existingIds = new Set(tasks.map(t => t.id));
    let changedCount = 0;

    events.forEach(ev => {
      if (existingIds.has(ev.id)) {
        const local = tasks.find(x => x.id === ev.id);
        if (local) {
          if (local.name !== ev.title) { local.name = ev.title; changedCount++; }
          if (local.done !== ev.done) { local.done = ev.done; changedCount++; }
          if (local.dueDate !== (ev.dueDate || null)) { local.dueDate = ev.dueDate || null; changedCount++; }
          if (local.remark !== (ev.remark || '')) { local.remark = ev.remark || ''; changedCount++; }
          if (ev.tag === 'FEES') {
            local.payable = ev.payable || 0;
            local.received = ev.received || 0;
            local.discount = ev.discount || 0;
            local.linked = ev.linked || '';
            local.phone = ev.phone || '';
            local.invoice = ev.invoice || '';
            local.feeCat = ev.feeCat || '';
          }
        }
        return;
      }
      const tag = ev.tag;
      const type = tag === 'PERSONAL' ? 'personal' : (tag === 'INVITATION' ? 'invitation' : (tag === 'FEES' ? 'fee' : 'professional'));
      const cat = tag === 'PERSONAL' ? null : tag;
      const task = { id: ev.id, name: ev.title, type, cat, due: '', dueDate: ev.dueDate || null, done: ev.done, urgent: false, remark: ev.remark || '' };
      if (tag === 'FEES') {
        task.payable = ev.payable || 0;
        task.received = ev.received || 0;
        task.discount = ev.discount || 0;
        task.linked = ev.linked || '';
        task.phone = ev.phone || '';
        task.invoice = ev.invoice || '';
        task.feeCat = ev.feeCat || '';
      }
      tasks.push(task);
      changedCount++;
    });

    const beforeLen = tasks.length;
    tasks = tasks.filter(t => !t.id.startsWith('cal_') || calIds.has(t.id));
    if (tasks.length !== beforeLen || changedCount > 0) {
      saveTasks();
      render();
      if (activePage === 'financials') renderFinancialsPage();
      if (activePage === 'invoices') renderInvoicesPage();
    }
    const syncEl = document.getElementById('lastSync');
    if (syncEl) syncEl.textContent = 'Synced ✓ ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  } catch (e) {
    const syncEl = document.getElementById('lastSync');
    if (syncEl) syncEl.textContent = 'Offline / Local';
  }
}

let finLedger = getDefaultFinLedger();

function normalizeFinLedger(rawObj) {
  const def = getDefaultFinLedger();
  if (!rawObj || typeof rawObj !== 'object') return def;
  const toArr = (val, fallback) => {
    if (Array.isArray(val)) return val;
    if (val && typeof val === 'object') return Object.values(val);
    return fallback;
  };
  const out = {
    updatedAt: Number(rawObj.updatedAt) || def.updatedAt,
    deletedIds: toArr(rawObj.deletedIds, []),
    cashInHand: typeof rawObj.cashInHand === 'number' && !isNaN(rawObj.cashInHand) ? rawObj.cashInHand : def.cashInHand,
    bankBalance: typeof rawObj.bankBalance === 'number' && !isNaN(rawObj.bankBalance) ? rawObj.bankBalance : def.bankBalance,
    tripName: rawObj.tripName || def.tripName,
    customExpenseCategories: toArr(rawObj.customExpenseCategories, def.customExpenseCategories),
    tripDisbursements: toArr(rawObj.tripDisbursements, def.tripDisbursements),
    tripContributions: toArr(rawObj.tripContributions, []),
    loansGiven: toArr(rawObj.loansGiven, def.loansGiven),
    loansTaken: toArr(rawObj.loansTaken, def.loansTaken),
    expenses: toArr(rawObj.expenses, def.expenses),
    journalEntries: toArr(rawObj.journalEntries, [])
  };
  out.loansGiven.forEach(l => { if (l && !Array.isArray(l.entries)) l.entries = []; });
  out.loansTaken.forEach(l => { if (l && !Array.isArray(l.entries)) l.entries = []; });
  return out;
}

function saveFinLedger(skipCloud) {
  finLedger = normalizeFinLedger(finLedger);
  finLedger.updatedAt = Date.now();
  try { localStorage.setItem(FIN_LEDGER_KEY, JSON.stringify(finLedger)); } catch (e) {}
  if (!skipCloud) pushFinLedgerToCloud();

function mergeFinLedgers(localRaw, cloudRaw) {
  const local = normalizeFinLedger(localRaw);
  if (!cloudRaw || typeof cloudRaw !== 'object') return local;
  const cloud = normalizeFinLedger(cloudRaw);
  const delSet = new Set([...local.deletedIds, ...cloud.deletedIds]);
  const mergeList = (a = [], b = []) => {
    const map = new Map();
    [...(Array.isArray(a) ? a : []), ...(Array.isArray(b) ? b : [])].forEach(item => {
      if (item && item.id && !delSet.has(item.id)) map.set(item.id, item);
    });
    return Array.from(map.values());
  };
  const useCloudScalar = (cloud.updatedAt || 0) >= (local.updatedAt || 0);
  const cats = Array.from(new Set([...local.customExpenseCategories, ...cloud.customExpenseCategories]));
  return normalizeFinLedger({
    updatedAt: Math.max(local.updatedAt || 0, cloud.updatedAt || 0),
    deletedIds: Array.from(delSet),
    cashInHand: useCloudScalar ? cloud.cashInHand : local.cashInHand,
    bankBalance: useCloudScalar ? cloud.bankBalance : local.bankBalance,
    tripName: cloud.tripName || local.tripName,
    customExpenseCategories: cats,
    tripDisbursements: mergeList(local.tripDisbursements, cloud.tripDisbursements),
    tripContributions: mergeList(local.tripContributions, cloud.tripContributions),
    loansGiven: mergeList(local.loansGiven, cloud.loansGiven),
    loansTaken: mergeList(local.loansTaken, cloud.loansTaken),
    expenses: mergeList(local.expenses, cloud.expenses),
    journalEntries: mergeList(local.journalEntries, cloud.journalEntries)
  });
}

  const bal = Math.max((t.payable || 0) - (t.received || 0) - (t.discount || 0), 0);

  if (t.invoice) {
    window.open('https://mustansirrmalikworkdashboard.netlify.app/invoice.html?inv=' + encodeURIComponent(t.invoice), '_blank');
    return;
  }

  const url = getWebhook();
  if (url && t.id.startsWith('cal_')) {
    try {
      const res = await fetch(url + '?' + new URLSearchParams({
        action: 'getinvoice',
        id: t.id,
        client: t.linked || t.name,
        payable: t.payable || 0,
        received: t.received || 0,
        discount: t.discount || 0,
        balance: bal,
        pay: buildAutofillPayUrl(bal)
      }).toString());
      const data = await res.json();
      if (data && data.status === 'ok' && data.invoiceNumber) {
        t.invoice = data.invoiceNumber;
        saveTasks();
        render();
        if (activePage === 'invoices') renderInvoicesPage();
        window.open('https://mustansirrmalikworkdashboard.netlify.app/invoice.html?inv=' + encodeURIComponent(data.invoiceNumber), '_blank');
        return;
      }
    } catch (e) {}
  }

  const invNo = 'INV-' + new Date().toISOString().slice(0, 7) + '-' + String(Math.floor(100 + Math.random() * 899));
  t.invoice = invNo;
  saveTasks();
  render();
  if (activePage === 'invoices') renderInvoicesPage();
  showModal('Invoice Preview — ' + invNo, `
    <div style="background:#F8FAFC; border:1px solid var(--rule); border-radius:10px; padding:12px; font-size:12.5px; line-height:1.6;">
      <div><strong>Invoice No:</strong> ${invNo}</div>
      <div><strong>Client / Service:</strong> ${escapeForHtml(t.linked || t.name)}</div>
      <div><strong>Total Billable:</strong> ${inr(t.payable)}</div>
      <div><strong>Received:</strong> ${inr(t.received)}</div>
      <div><strong>Balance Due:</strong> <span style="color:var(--red); font-weight:700;">${inr(bal)}</span></div>
    </div>
  `, () => {}, 'Done', 'Close');
}

function openAddLoanEntryModal(type, loanId) {
  const list = type === 'given' ? finLedger.loansGiven : finLedger.loansTaken;
  const loan = list.find(l => l.id === loanId);
  if (!loan) return;
  const isGiven = type === 'given';
  showModal(`+ Add Entry — ${loan.partyName}`, `
    <div class="hint">${isGiven ? 'Record additional advance given or expense paid on behalf of' : 'Record additional borrowing / advance taken from'} <strong>${escapeForHtml(loan.partyName)}</strong>.</div>
    <label>Date</label>
    <input type="date" id="leDate" value="${new Date().toISOString().slice(0, 10)}">
    <label>Particulars / Description</label>
    <input type="text" id="leDesc" placeholder="e.g. Cash Advance, Medical, X-Ray, Top-up">
    <label>Amount (₹)</label>
    <input type="number" id="leAmount" placeholder="e.g. 2000">
    <label>Account / Mode</label>
    <select id="leMode">
      <option value="Bank (slice SFB)">Bank (slice Small Finance Bank)</option>
      <option value="Cash in Hand">Cash in Hand</option>
      <option value="Direct Adjustment">Direct Adjustment (No Cash/Bank change)</option>
    </select>
  `, () => {
    const amt = parseFloat(document.getElementById('leAmount').value);
    const desc = document.getElementById('leDesc').value.trim() || (isGiven ? 'Additional Advance Given' : 'Additional Borrowing');
    const date = document.getElementById('leDate').value || new Date().toISOString().slice(0, 10);
    const mode = document.getElementById('leMode').value;
    if (isNaN(amt) || amt <= 0) return false;

    if (!Array.isArray(loan.entries)) loan.entries = [];
    loan.entries.push({
      id: 'le_' + Date.now(),
      kind: 'addition',
      date,
      desc,
      amount: amt,
      mode
    });
    loan.amount = Math.round(((loan.amount || 0) + amt) * 100) / 100;

    if (mode === 'Cash in Hand') {
      finLedger.cashInHand = Math.round((finLedger.cashInHand + (isGiven ? -amt : amt)) * 100) / 100;
    } else if (mode === 'Bank (slice SFB)') {
      finLedger.bankBalance = Math.round((finLedger.bankBalance + (isGiven ? -amt : amt)) * 100) / 100;
    }

    if (loan.id === 'lg_juzer') {
      const jpFee = tasks.find(x => x.id === 'cal_lghida9k5kgvrvqamrebcdv18c' || (x.type === 'fee' && /juzer presswala/i.test(x.name)));
      if (jpFee) { jpFee.payable = loan.amount; saveTasks(); }
    }

    saveFinLedger();
    renderFinancialsPage();
    render();
  }, 'Save Entry', 'Cancel');
}

function deleteLoanSubEntry(type, loanId, entryId) {
  const list = type === 'given' ? finLedger.loansGiven : finLedger.loansTaken;
  const loan = list.find(l => l.id === loanId);
  if (!loan || !Array.isArray(loan.entries)) return;
  const entry = loan.entries.find(e => e.id === entryId);
  if (!entry) return;
  const isGiven = type === 'given';

  showModal('Delete Sub-Entry?', `
    <div class="hint">Remove "${escapeForHtml(entry.desc)}" (${inr(entry.amount)}) and reverse its effect on ${escapeForHtml(loan.partyName)} and ${escapeForHtml(entry.mode)}?</div>
  `, () => {
    if (entry.kind === 'repayment') {
      loan.repaid = Math.max(Math.round(((loan.repaid || 0) - entry.amount) * 100) / 100, 0);
      if (entry.mode === 'Cash in Hand') {
        finLedger.cashInHand = Math.round((finLedger.cashInHand + (isGiven ? -entry.amount : entry.amount)) * 100) / 100;
      } else if (entry.mode === 'Bank (slice SFB)') {
        finLedger.bankBalance = Math.round((finLedger.bankBalance + (isGiven ? -entry.amount : entry.amount)) * 100) / 100;
      }
    } else {
      loan.amount = Math.max(Math.round(((loan.amount || 0) - entry.amount) * 100) / 100, 0);
      if (entry.mode === 'Cash in Hand') {
        finLedger.cashInHand = Math.round((finLedger.cashInHand + (isGiven ? entry.amount : -entry.amount)) * 100) / 100;
      } else if (entry.mode === 'Bank (slice SFB)') {
        finLedger.bankBalance = Math.round((finLedger.bankBalance + (isGiven ? entry.amount : -entry.amount)) * 100) / 100;
      }
    }

    loan.entries = loan.entries.filter(e => e.id !== entryId);
    if (loan.id === 'lg_juzer') {
      const jpFee = tasks.find(x => x.id === 'cal_lghida9k5kgvrvqamrebcdv18c' || (x.type === 'fee' && /juzer presswala/i.test(x.name)));
      if (jpFee) { jpFee.payable = loan.amount; jpFee.received = loan.repaid; saveTasks(); }
    }

    saveFinLedger();
    renderFinancialsPage();
    render();
  }, 'Delete', 'Cancel');
}

  `, () => {
    const net = (loan.amount || 0) - (loan.repaid || 0);
    if (type === 'given') {
      finLedger.loansGiven = finLedger.loansGiven.filter(l => l.id !== id);
      finLedger.bankBalance = Math.round((finLedger.bankBalance + net) * 100) / 100;
    } else {
      finLedger.loansTaken = finLedger.loansTaken.filter(l => l.id !== id);
      finLedger.bankBalance = Math.round((finLedger.bankBalance - net) * 100) / 100;
    }
    finLedger.deletedIds.push(id);
    saveFinLedger();
    renderFinancialsPage();
    render();
  }, 'Delete', 'Cancel');
}

// ---- Double-Entry Journal Vouchers ----
const JOURNAL_ACCOUNTS = [
  { key: 'cash', label: 'Cash in Hand (Asset)' },
  { key: 'bank', label: 'slice SFB Bank (Asset)' },
  { key: 'loan_juzer', label: 'Juzer Presswala — Loan Given (Asset)' },
  { key: 'loan_mhj', label: 'MHJ — Loan Taken (Liability)' },
  { key: 'loan_hatim', label: 'Hatim Bhai — Loan Taken (Liability)' },
  { key: 'income_fees', label: 'Professional Fees Income (P&L Credit)' },
  { key: 'expense_biz', label: 'Business Operating Expense (P&L Debit)' },
  { key: 'drawings', label: 'Personal Drawings (Capital Deduction)' },
  { key: 'capital', label: "Owner's Capital Account (Equity)" }
];

function applyJournalAccountDelta(accKey, delta) {
  if (accKey === 'cash') finLedger.cashInHand = Math.round((finLedger.cashInHand + delta) * 100) / 100;
  else if (accKey === 'bank') finLedger.bankBalance = Math.round((finLedger.bankBalance + delta) * 100) / 100;
  else if (accKey === 'loan_juzer') {
    const jp = finLedger.loansGiven.find(l => l.id === 'lg_juzer');
    if (jp) jp.amount = Math.round((jp.amount + delta) * 100) / 100;
  } else if (accKey === 'loan_mhj') {
    const mhj = finLedger.loansTaken.find(l => l.id === 'lt_mhj');
    if (mhj) mhj.amount = Math.round((mhj.amount - delta) * 100) / 100;
  } else if (accKey === 'loan_hatim') {
    const hb = finLedger.loansTaken.find(l => l.id === 'lt_hatim');
    if (hb) hb.amount = Math.round((hb.amount - delta) * 100) / 100;
  }
}

function openJournalEntryModal() {
  const opts = JOURNAL_ACCOUNTS.map(a => `<option value="${a.key}">${a.label}</option>`).join('');
  showModal('📒 New Double-Entry Journal Voucher', `
    <label>Debit Account (Dr)</label>
    <select id="jvDrSelect">${opts}</select>
    <label>Credit Account (Cr)</label>
    <select id="jvCrSelect">${opts}</select>
    <label>Amount (₹)</label>
    <input type="number" id="jvAmount" placeholder="e.g. 5000">
    <label>Voucher Date</label>
    <input type="date" id="jvDate" value="${new Date().toISOString().slice(0, 10)}">
    <label>Narration / Particulars</label>
    <input type="text" id="jvNarration" placeholder="e.g. Capital introduced / Adjustment entry">
  `, () => {
    const dr = document.getElementById('jvDrSelect').value;
    const cr = document.getElementById('jvCrSelect').value;
    const amount = parseFloat(document.getElementById('jvAmount').value);
    const date = document.getElementById('jvDate').value || new Date().toISOString().slice(0, 10);
    const narration = document.getElementById('jvNarration').value.trim() || 'Journal Adjustment';
    if (dr === cr || isNaN(amount) || amount <= 0) return false;

    applyJournalAccountDelta(dr, amount);
    applyJournalAccountDelta(cr, -amount);

    finLedger.journalEntries.push({
      id: 'jv_' + Date.now(),
      date,
      dr,
      cr,
      amount,
      narration
    });
    saveFinLedger();
    renderFinancialsPage();
    render();
  }, 'Post Voucher', 'Cancel');
}

function deleteJournalEntry(id) {
  const jv = finLedger.journalEntries.find(x => x.id === id);
  if (!jv) return;
  showModal('Reverse & Delete Voucher?', `
    <div class="hint">This will reverse Dr ${jv.dr} / Cr ${jv.cr} for ${inr(jv.amount)}.</div>
  `, () => {
    applyJournalAccountDelta(jv.dr, -jv.amount);
    applyJournalAccountDelta(jv.cr, jv.amount);
    finLedger.journalEntries = finLedger.journalEntries.filter(x => x.id !== id);
    finLedger.deletedIds.push(id);
    saveFinLedger();
    renderFinancialsPage();
    render();
  }, 'Delete', 'Cancel');
}

function deleteTripEntry(kind, id) {
  if (isFamilyPublicView) return;
  showModal('Delete Trip Entry?', `
    <div class="hint">Removes this entry and recalculates the 3-family equal split.</div>
  `, () => {
    if (kind === 'disb') {
      const item = finLedger.tripDisbursements.find(x => x.id === id);
      if (item) {
        if (item.mode === 'Cash in Hand') finLedger.cashInHand = Math.round((finLedger.cashInHand + item.amount) * 100) / 100;
        else if (item.mode === 'Bank (slice SFB)') finLedger.bankBalance = Math.round((finLedger.bankBalance + item.amount) * 100) / 100;
        finLedger.tripDisbursements = finLedger.tripDisbursements.filter(x => x.id !== id);
      }
    } else {
      const item = finLedger.tripContributions.find(x => x.id === id);
      if (item) {
        if (item.mode === 'Cash in Hand') finLedger.cashInHand = Math.round((finLedger.cashInHand - item.amount) * 100) / 100;
        else if (item.mode === 'Bank (slice SFB)') finLedger.bankBalance = Math.round((finLedger.bankBalance - item.amount) * 100) / 100;
        finLedger.tripContributions = finLedger.tripContributions.filter(x => x.id !== id);
      }
    }
    finLedger.deletedIds.push(id);
    saveFinLedger();
    renderFinancialsPage();
    render();
  }, 'Delete', 'Cancel');
}

function shareZiyaratWithFamilies() {
  const shareUrl = window.location.origin + window.location.pathname + '?view=ziyarat';
  const totalOutlay = finLedger.tripDisbursements.reduce((s, x) => s + (x.amount || 0), 0);
  const sharePerFamily = totalOutlay / 3;

  const getPaid = (fam) =>
    finLedger.tripDisbursements.filter(x => x.paidByFamily === fam).reduce((s, x) => s + (x.amount || 0), 0) +
    finLedger.tripContributions.filter(x => x.family === fam).reduce((s, x) => s + (x.amount || 0), 0);

  const mPaid = getPaid('mine'), fPaid = getPaid('father_in_law'), sPaid = getPaid('sister_in_law');
  const fmtBal = (paid) => {
    const diff = paid - sharePerFamily;
    return diff >= 0 ? `Overpaid / Refund: ${inr(diff)}` : `Due to Pay: ${inr(Math.abs(diff))}`;
  };

  const summaryMsg = `🕌 *Kathiyawad Ziyarat Trip — Expense & 3-Family Split*\n\n` +
    `• *Total Trip Outlay:* ${inr(totalOutlay)}\n` +
    `• *Equal 1/3 Share per Family:* ${inr(sharePerFamily)}\n\n` +
    `1️⃣ *Mustannsirr Family:* Paid ${inr(mPaid)} (${fmtBal(mPaid)})\n` +
    `2️⃣ *Father-in-law Family:* Paid ${inr(fPaid)} (${fmtBal(fPaid)})\n` +
    `3️⃣ *Sister-in-law Family:* Paid ${inr(sPaid)} (${fmtBal(sPaid)})\n\n` +
    `🔗 *View Live Itemized Statement:*\n${shareUrl}`;

  const waUrl = 'https://api.whatsapp.com/send?text=' + encodeURIComponent(summaryMsg);

  showModal('📲 Share Ziyarat Trip with Families', `
    <div class="hint">Families can view the itemized trip expenditure and 1/3 split in read-only mode (no editing or business data shown).</div>
    <div class="receipt-preview" style="margin-bottom:10px;">${escapeForHtml(summaryMsg)}</div>
    <div style="display:flex; gap:8px; flex-wrap:wrap;">
      <a href="${waUrl}" target="_blank" rel="noopener" class="btn btn-wa" style="flex:1; display:inline-flex; align-items:center; justify-content:center; gap:6px; text-decoration:none;">
        ${ICON.chat} <span>Share via WhatsApp</span>
      </a>
      <button type="button" class="btn btn-quiet" onclick="copyTextToClipboard('${shareUrl}', this)">Copy Link</button>
    </div>
  `, () => {}, 'Done', 'Close');
}

// ---- Render Financials & Ziyarat Page ----
function renderFinancialsPage() {
  const finContainer = document.getElementById('financialsView');
  if (!finContainer) return;

  // 1. Accrual Fees & Sundry Debtors
  const feeTasks = tasks.filter(t => t.type === 'fee' && !t.name.includes('Advance Credit Balance') && !/juzer presswala/i.test(t.name));
  const totalGrossFeesBilled = feeTasks.reduce((s, t) => s + (t.payable || 0), 0);
  const totalFeesReceivedCash = feeTasks.reduce((s, t) => s + (t.received || 0), 0);
  const totalDiscountAllowed = feeTasks.reduce((s, t) => s + (t.discount || 0), 0);
  const totalDebtorsReceivable = Math.max(totalGrossFeesBilled - totalFeesReceivedCash - totalDiscountAllowed, 0);

  // Journal P&L Adjustments
  const jvIncomeAdj = finLedger.journalEntries.reduce((s, j) => s + (j.cr === 'income_fees' ? j.amount : (j.dr === 'income_fees' ? -j.amount : 0)), 0);
  const jvBizExpAdj = finLedger.journalEntries.reduce((s, j) => s + (j.dr === 'expense_biz' ? j.amount : (j.cr === 'expense_biz' ? -j.amount : 0)), 0);
  const jvDrawingsAdj = finLedger.journalEntries.reduce((s, j) => s + (j.dr === 'drawings' ? j.amount : (j.cr === 'drawings' ? -j.amount : 0)), 0);

  // Separate Business Operating Expenses vs Personal Drawings (Capital Account Deduction)
  const isPersonalDrawing = (cat) => /personal|drawing/i.test(cat || '');
  const businessExpenses = finLedger.expenses.filter(e => !isPersonalDrawing(e.category));
  const drawingEntries = finLedger.expenses.filter(e => isPersonalDrawing(e.category));

  const totalBusinessExpenses = businessExpenses.reduce((s, e) => s + (e.amount || 0), 0) + jvBizExpAdj;
  const totalPersonalDrawings = drawingEntries.reduce((s, e) => s + (e.amount || 0), 0) + jvDrawingsAdj;

  const netFeeRevenueAccrued = (totalGrossFeesBilled - totalDiscountAllowed) + jvIncomeAdj;
  const netPracticeProfit = netFeeRevenueAccrued - totalBusinessExpenses;

  // Loans & Advances Totals
  const totalLoansGiven = finLedger.loansGiven.reduce((s, l) => s + Math.max((l.amount || 0) - (l.repaid || 0), 0), 0);
  const totalLoansTaken = finLedger.loansTaken.reduce((s, l) => s + Math.max((l.amount || 0) - (l.repaid || 0), 0), 0);

  // Ziyarat Trip 3-Family Calculations
  const totalTripOutlay = finLedger.tripDisbursements.reduce((s, x) => s + (x.amount || 0), 0);
  const sharePerFamily = totalTripOutlay / 3;
  const familyDefs = [
    { key: 'mine', label: 'Mustannsirr Family (Mine)' },
    { key: 'father_in_law', label: 'Father-in-law Family' },
    { key: 'sister_in_law', label: 'Sister-in-law Family' }
  ];
  const familyRows = familyDefs.map(f => {
    const disbPaid = finLedger.tripDisbursements.filter(x => x.paidByFamily === f.key).reduce((s, x) => s + (x.amount || 0), 0);
    const contribPaid = finLedger.tripContributions.filter(x => x.family === f.key).reduce((s, x) => s + (x.amount || 0), 0);
    const totalPaid = disbPaid + contribPaid;
    const netBal = Math.round((totalPaid - sharePerFamily) * 100) / 100;
    return { ...f, disbPaid, contribPaid, totalPaid, netBal };
  });

  // Balance Sheet Equilibrium
  const totalLiquidFunds = finLedger.cashInHand + finLedger.bankBalance;
  const tripReceivableAsset = Math.max(familyRows.filter(r => r.key !== 'mine' && r.netBal < 0).reduce((s, r) => s + Math.abs(r.netBal), 0), 0);
  const totalAssets = totalLiquidFunds + totalLoansGiven + totalDebtorsReceivable + tripReceivableAsset;
  const totalLiabilities = totalLoansTaken;
  const ownerCapitalNet = Math.round((totalAssets - totalLiabilities) * 100) / 100;
  const ownerOpeningCapital = Math.round((ownerCapitalNet - netPracticeProfit + totalPersonalDrawings) * 100) / 100;

  const badgeEl = document.getElementById('finBadge');
  if (badgeEl) badgeEl.textContent = inr(totalLoansGiven);

  const isSecOpen = (key) => {
    if (isFamilyPublicView && key === 'trip') return true;

    return !!(uiState.finOpen && uiState.finOpen[key]);

  const renderSection = (key, title, subtitle, badgeText, gradientCss, bodyHtml, extraHeaderBtn = '') => {

          <div class="f-sub">Debtors ${inr(totalDebtorsReceivable)} + Loans ${inr(totalLoansGiven)}</div>
        </div>
        <div class="fin-card">
          <div class="f-lbl">Owner's Net Capital</div>
          <div class="f-val" style="color:var(--violet);">${inr(ownerCapitalNet)}</div>

        </div>

// ---- Tasks Page Rendering ----
function render(listOnly) {
  const summaryEl = document.getElementById('summaryArea');
  const app = document.getElementById('app');
  if (!app) return;

  try {
    const safeTasks = Array.isArray(tasks) ? tasks.filter(Boolean) : [];
    const done = safeTasks.filter(t => t.done).length;
    const pending = safeTasks.filter(t => !t.done).length;
    const nowTs = Date.now();
    const isOverdue = t => {
      if (t.done || !t.dueDate) return false;
      const ms = new Date(t.dueDate).getTime();
      return !isNaN(ms) && ms < nowTs;
    };

    const feeTasks = safeTasks.filter(t => t.type === 'fee' && !String(t.name || '').includes('Advance Credit Balance'));
    const totalPayable = feeTasks.reduce((s, t) => s + (Number(t.payable) || 0), 0);
    const totalReceived = feeTasks.reduce((s, t) => s + (Number(t.received) || 0), 0);
    const totalDiscount = feeTasks.reduce((s, t) => s + (Number(t.discount) || 0), 0);
    const totalOutstanding = Math.max(totalPayable - totalReceived - totalDiscount, 0);

    const liquidTotal = Math.round(((Number(finLedger.cashInHand) || 0) + (Number(finLedger.bankBalance) || 0)) * 100) / 100;
    const totalLoansGiven = (finLedger.loansGiven || []).reduce((s, l) => s + Math.max((Number(l.amount) || 0) - (Number(l.repaid) || 0), 0), 0);

    const knownCats = new Set(['MHJ', 'SHK', 'OWN', 'FEES', 'INVITATION']);
    const extraCats = [...new Set(safeTasks.filter(t => t.type === 'professional' && t.cat && !knownCats.has(t.cat)).map(t => String(t.cat)))];

    let filtered = safeTasks;
    if (filter === 'personal') filtered = safeTasks.filter(t => t.type === 'personal' && !isInvitationTask(t));
    else if (filter === 'invitation') filtered = safeTasks.filter(t => isInvitationTask(t));
    else if (filter === 'professional') filtered = safeTasks.filter(t => t.type === 'professional' && !isInvitationTask(t));
    else if (filter === 'own') filtered = safeTasks.filter(t => t.cat === 'OWN');
    else if (filter === 'mhj') filtered = safeTasks.filter(t => t.cat === 'MHJ');
    else if (filter === 'shk') filtered = safeTasks.filter(t => t.cat === 'SHK');
    else if (filter === 'fees') filtered = safeTasks.filter(t => t.type === 'fee');
    else if (filter === 'pending') filtered = safeTasks.filter(t => !t.done);
    else if (filter === 'done') filtered = safeTasks.filter(t => t.done);
    else if (extraCats.includes(filter)) filtered = safeTasks.filter(t => t.cat === filter);

    const q = (searchQuery || '').trim().toLowerCase();
    const searchActive = q.length > 0;
    if (searchActive) {
      const words = q.split(/\s+/);
      filtered = filtered.filter(t => {
        const hay = [t.name, t.linked, t.invoice, t.remark, t.phone, t.cat].map(v => String(v || '')).join(' ').toLowerCase();
        return words.every(w => hay.includes(w));
      });
    }

    filtered = [...filtered].sort((a, b) => {
      if (!!a.done !== !!b.done) return a.done ? 1 : -1;
      if (!a.done && !b.done) {
        if (!!a.urgent !== !!b.urgent) return a.urgent ? -1 : 1;
        const aHas = !!a.dueDate, bHas = !!b.dueDate;
        if (aHas !== bHas) return aHas ? -1 : 1;
        if (aHas && bHas) return new Date(a.dueDate) - new Date(b.dueDate);
      }
      return 0;
    });

    const filterBtn = (key, label, dotColor) =>
      `<button type="button" class="filter-btn ${filter === key ? 'active' : ''}" onclick="setFilter('${key}')">${dotColor ? `<i class="dot" style="background:${dotColor}"></i>` : ''}${label}</button>`;

    const invCount = safeTasks.filter(t => isInvitationTask(t) && !t.done).length;

    let summaryHtml = `
      <div class="summary-sheet">
        <div class="hero-stats">
          <div class="hero-card"><div class="n">${done}</div><div class="l">Done</div></div>
          <div class="hero-card"><div class="n">${pending}</div><div class="l">Pending</div></div>
          <div class="hero-card" style="cursor:pointer;" onclick="switchPage('financials')"><div class="n">${inr(liquidTotal)}</div><div class="l">Liquid ↗</div></div>
          <div class="hero-card" style="cursor:pointer;" onclick="switchPage('financials')"><div class="n">${inr(totalLoansGiven)}</div><div class="l">Loans Given ↗</div></div>
        </div>
        <div style="display:flex; justify-content:space-between; align-items:center; padding:5px 12px; background:#F8FAFC; border-top:1px solid var(--rule-soft); font-size:11px;">
          <button type="button" style="border:0; background:none; color:var(--accent); font-weight:700; cursor:pointer; padding:0;" onclick="toggleSummaryDetails()">
            ${uiState.showSummaryDetails ? '▴ Hide Cash & Receivables' : '▾ Cash & Bank Details'}
          </button>
          <button type="button" style="border:0; background:none; color:var(--accent); font-weight:700; cursor:pointer; padding:0;" onclick="switchPage('financials')">Open Financials &amp; Ziyarat &rarr;</button>
        </div>
        ${uiState.showSummaryDetails ? `
          <div class="totals">
            <div class="tot"><div class="l">Cash in Hand / slice SFB Bank</div><div class="fig">${inr(finLedger.cashInHand)} / ${inr(finLedger.bankBalance)}</div></div>
            <div class="tot"><div class="l">Fees Receivable / Collected</div><div class="fig">${inr(totalPayable)} / ${inr(totalReceived)}</div></div>
            <div class="tot sum"><div class="l">Net Pending Client Fees</div><div class="fig out">${inr(totalOutstanding)}</div></div>
          </div>
        ` : ''}
      </div>

      <div class="filters seg">
        ${filterBtn('all', 'All')}
        ${filterBtn('personal', 'Personal')}
        ${filterBtn('invitation', '💌 Invitations' + (invCount ? ' (' + invCount + ')' : ''))}
        ${filterBtn('professional', 'Professional')}
        ${filterBtn('pending', 'Pending')}
        ${filterBtn('done', 'Done')}
      </div>
      <div class="filters chips">
        ${filterBtn('own', 'OWN', 'var(--c-own)')}
        ${filterBtn('mhj', 'MHJ', 'var(--c-mhj)')}
        ${filterBtn('shk', 'SHK', 'var(--c-shk)')}
        ${filterBtn('invitation', 'Invitations', 'var(--c-invitation)')}
        ${filterBtn('fees', 'Fees', 'var(--c-fees)')}
        ${extraCats.map((cat, i) => filterBtn(cat, cat.replace(/_/g, ' '), EXTRA_COLORS[i % EXTRA_COLORS.length])).join('')}
        <button type="button" class="filter-btn" onclick="toggleAllGroups(true)">⊟ Fold All</button>
        <button type="button" class="filter-btn" onclick="toggleAllGroups(false)">⊞ Expand All</button>
      </div>
    `;

    let html = '';
    const forceOpen = filter !== 'all' || searchActive;
    let shownCount = 0;

    if (filtered.length === 0) {
      html = '<div class="empty" style="text-align:center; padding:24px; color:var(--muted); background:#fff; border:1px solid var(--rule); border-radius:12px;">No tasks match your filter.</div>';
    } else {
      const groupDefs = [
        { key: 'MHJ', label: 'Professional — MHJ', color: 'var(--c-mhj)', match: t => t.cat === 'MHJ' }
      ];
      extraCats.forEach((cat, i) => {
        groupDefs.push({ key: cat, label: 'Professional — ' + cat.replace(/_/g, ' '), color: EXTRA_COLORS[i % EXTRA_COLORS.length], match: t => t.cat === cat });
      });
      groupDefs.push(
        { key: 'SHK', label: 'Professional — SHK Husain Arif', color: 'var(--c-shk)', match: t => t.cat === 'SHK' },
        { key: 'OWN', label: 'Professional — OWN', color: 'var(--c-own)', match: t => t.cat === 'OWN' },
        { key: 'INVITATION', label: '💌 Invitations & Events', color: 'var(--c-invitation)', match: t => isInvitationTask(t) },
        { key: 'personal', label: 'Personal', color: 'var(--c-personal)', match: t => t.type === 'personal' && !isInvitationTask(t) },
        { key: 'FEES', label: 'Fees & Receivables', color: 'var(--c-fees)', match: t => t.type === 'fee' && !String(t.name || '').includes('Advance Credit Balance') }
      );

      const renderCard = (t, idx) => {
        const isFee = t.type === 'fee';
        const balance = isFee ? Math.max((Number(t.payable) || 0) - (Number(t.received) || 0) - (Number(t.discount) || 0), 0) : 0;
        const taskOverdue = isOverdue(t);
        let dueDateLabel = '';
        if (t.dueDate) {
          const dObj = new Date(t.dueDate);
          if (!isNaN(dObj.getTime())) dueDateLabel = dObj.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });
        }
        const safeId = escapeForHtml(String(t.id || ''));
        return `
          <div class="task${t.done ? ' done' : ''}">
            <span class="num">${idx + 1}.</span>
            ${isFee ? '' : `<input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggleTask('${safeId}')">`}
            <div class="task-body">
              <div class="task-top">
                <div class="task-name">${escapeForHtml(t.name || 'Untitled')}</div>
                ${isFee ? (balance > 0 ? `<div class="amt owed">${inr(balance)}</div>` : `<div class="amt clear">Settled</div>`) : ''}
                <button type="button" class="act del" onclick="deleteTask('${safeId}')" title="Delete">${ICON.x}</button>
              </div>
              ${isFee ? `<div class="task-sub">${inr(t.received)} of ${inr(t.payable)} received ${t.invoice ? '• ' + escapeForHtml(t.invoice) : ''}</div>` : ''}
              ${dueDateLabel && !t.done ? `<div class="task-sub" style="color:${taskOverdue ? 'var(--red)' : 'var(--muted)'}; font-weight:600;">Due ${dueDateLabel}</div>` : ''}
              ${t.remark && !t.done ? `<div class="note">${ICON.note}<span>${escapeForHtml(t.remark)}</span></div>` : ''}
              <div class="task-meta">
                ${isFee ? `<button type="button" class="act pay" onclick="recordPayment('${safeId}')">Record payment</button>` : ''}
                ${isFee && balance > 0 ? `<button type="button" class="act wa" onclick="sendWhatsAppReminder('${safeId}', ${balance})">${ICON.chat}Send WhatsApp reminder</button>` : ''}
                ${isFee && (Number(t.received) || 0) > 0 ? `<button type="button" class="act wa" onclick="offerReceipt('${safeId}')">${ICON.doc}Receipt</button>` : ''}
                ${isFee ? `<button type="button" class="act" onclick="openOrGenerateInvoice('${safeId}')">${ICON.doc}Invoice</button>` : ''}
                ${!t.done ? `<button type="button" class="act" onclick="setDueDate('${safeId}')">Due date</button>` : ''}
                ${!t.done ? `<button type="button" class="act" onclick="setRemark('${safeId}')">Remark</button>` : ''}
                ${!isFee && !isInvitationTask(t) && !t.done ? `<button type="button" class="act" style="color:var(--c-invitation);" onclick="moveTaskToInvitation('${safeId}')">💌 Invitation</button>` : ''}
              </div>
            </div>
          </div>
        `;
      };

      const feeBalance = t => (t.type === 'fee' && !String(t.name || '').includes('Advance Credit Balance')) ? ((Number(t.payable) || 0) - (Number(t.received) || 0) - (Number(t.discount) || 0)) : 0;
      const isFinished = t => t.done && feeBalance(t) <= 0;

      groupDefs.forEach(g => {
        const groupTasks = filtered.filter(g.match);
        if (groupTasks.length === 0) return;
        shownCount += groupTasks.length;
        const open = groupTasks.filter(t => !isFinished(t));
        const closed = groupTasks.filter(isFinished);
        const ordered = open.concat(closed);
        const collapsed = !forceOpen && !!uiState.collapsed[g.key];

        html += `<div class="cat-section${collapsed ? ' collapsed' : ''}">
          <div class="cat-heading" onclick="toggleGroup('${g.key}')">
            ${ICON.chev}
            <span class="dot" style="background:${g.color}"></span>
            <span class="title">${g.label}</span>
            <span class="count">${open.length} pending${closed.length ? ' · ' + closed.length + ' done' : ''}</span>
          </div>`;
        if (!collapsed) {
          html += '<div class="task-grid">';
          open.forEach(t => { html += renderCard(t, ordered.indexOf(t)); });
          if (closed.length) {
            const expanded = filter === 'done' || searchActive || !!doneOpen[g.key];
            if (filter !== 'done' && !searchActive) {
              html += `<button type="button" class="done-toggle" onclick="toggleDone('${g.key}')">${expanded ? '▴ Hide completed' : '✓ ' + closed.length + ' completed · show'}</button>`;
            }
            if (expanded) closed.forEach(t => { html += renderCard(t, ordered.indexOf(t)); });
          }
          html += '</div>';
        }
        html += '</div>';
      });
    }

    if (!listOnly && summaryEl) summaryEl.innerHTML = summaryHtml;
    app.innerHTML = html;
    const infoEl = document.getElementById('searchInfo');
    if (infoEl) infoEl.textContent = searchActive ? `${shownCount} of ${safeTasks.length} tasks` : '';
  } catch (err) {
    console.error('Render error:', err);
    app.innerHTML = '<div style="padding:18px; background:#FFF1F2; border:1px solid #FECDD3; border-radius:12px; color:#BE123C; font-size:13px;">Render recovery: ' + escapeForHtml(err.message) + ' — <button type="button" class="btn btn-quiet" onclick="localStorage.removeItem(\'tasks-v2\'); location.reload();">Reload Fresh</button></div>';
  }
}

const DASHBOARD_PASSWORD = 'Mustansir@2026';
const AUTH_KEY = 'dashboard-auth-ok';

function checkAuth() {
  const input = document.getElementById('authInput');
  if (input && input.value === DASHBOARD_PASSWORD) {
    localStorage.setItem(AUTH_KEY, 'yes');
    document.getElementById('authGate').style.display = 'none';
    startDashboard();
  } else {
    const errEl = document.getElementById('authError');
    if (errEl) errEl.style.display = 'block';
    if (input) input.value = '';
  }
}

function startDashboard() {
  const params = new URLSearchParams(window.location.search);
  isFamilyPublicView = params.get('view') === 'ziyarat' || location.hash === '#ziyarat';

  if (isFamilyPublicView) {
    const nav = document.querySelector('.page-nav');
    const resetBtn = document.getElementById('resetBtn');
    const subEl = document.querySelector('.masthead .sub');
    if (nav) nav.style.display = 'none';
    if (resetBtn) resetBtn.style.display = 'none';
    if (subEl) subEl.textContent = 'Kathiyawad Ziyarat Trip • Family Expenditure Portal';
    finViewMode = 'trip';
    switchPage('financials');
    syncCloudFinLedger();
    return;
  }

  if (location.hash === '#financials') switchPage('financials');
  else if (location.hash === '#invoices') switchPage('invoices');

  loadTasks().then(() => {
    pullFromCalendar();
    syncCloudFinLedger();
  });
}

(function boot() {
  const params = new URLSearchParams(window.location.search);
  const isPublic = params.get('view') === 'ziyarat' || location.hash === '#ziyarat';
  if (isPublic || localStorage.getItem(AUTH_KEY) === 'yes') {
    document.getElementById('authGate').style.display = 'none';
    startDashboard();
  } else {
    const inp = document.getElementById('authInput');
    if (inp) inp.focus();
  }
})();
</script>
