function toggleTask(id) {
  const t = tasks.find(x => x.id === id);
  if (!t) return;
  t.done = !t.done;
  saveTasks();
  render();
  if (t.id && t.id.startsWith('cal_')) toggleOnCalendar(t.id, t.done);

  if (t.done && t.type === 'professional') {
    const GROUP_DEFAULT_PHONES = { SHK: '9425320184', HATIM_BHAI_ADV: '9826768052' };
    const defaultPhone = (t.cat && GROUP_DEFAULT_PHONES[t.cat]) ? GROUP_DEFAULT_PHONES[t.cat] : '';
    showModal('Fee for "' + t.name + '"?', `
      <label>Billable Amount (₹)</label>
      <input type="number" id="modalPayable" placeholder="₹ Payable">
      <label>Received Now (₹)</label>
      <input type="number" id="modalReceived" placeholder="₹ Received" value="0">
      <label>Client Phone (Optional)</label>
      <input type="tel" id="modalPhone" placeholder="e.g. 9876543210" value="${defaultPhone}">
    `, () => {
      const payable = parseFloat(document.getElementById('modalPayable').value);
      const received = parseFloat(document.getElementById('modalReceived').value) || 0;
      const phone = document.getElementById('modalPhone').value.trim();
      if (!isNaN(payable) && payable > 0) {
        const localId = 'u' + Date.now();
        const feeTask = { id: localId, name: t.name, type: 'fee', cat: 'FEES', feeCat: t.cat || '', due: '', done: received >= payable, urgent: false, payable, received, discount: 0, linked: t.name, phone };
        tasks.push(feeTask);
        if (received > 0) {
          const ledger = getFinLedger();
          ledger.bankSlice = (Number(ledger.bankSlice) || 0) + received;
          saveFinLedger(ledger);
        }
        saveTasks();
        render();
        pushFeeToCalendar(t.name, payable, received, t.name, phone, t.cat || '').then(calId => {
          if (calId) { feeTask.id = calId; saveTasks(); }
        });
      }
    }, 'Save Fee', 'Skip');
  }
}

function recordPayment(id) {
  const t = tasks.find(x => x.id === id);
  if (!t) return;
  showModal('Record Payment — ' + t.name, `
    <div class="hint">Currently ${inr(t.received)} of ${inr(t.payable)} received</div>
    <label>Total Received So Far (₹)</label>
    <input type="number" id="modalReceivedAmt" value="${t.received}">
    <label>Discount Allowed (₹)</label>
    <input type="number" id="modalDiscountAmt" value="${t.discount || 0}">
    <label>Deposit Account</label>
    <select id="modalPayMode">
      <option value="slice SFB">slice Small Finance Bank</option>
      <option value="Cash">Cash in Hand</option>
    </select>
  `, () => {
    const amount = parseFloat(document.getElementById('modalReceivedAmt').value);
    const discount = parseFloat(document.getElementById('modalDiscountAmt').value) || 0;
    const mode = document.getElementById('modalPayMode').value;
    if (isNaN(amount)) return;
    const prevReceived = Number(t.received) || 0;
    const delta = amount - prevReceived;
    t.received = amount;
    t.discount = discount;
    t.done = (amount + discount) >= t.payable && t.payable > 0;

    if (delta !== 0) {
      const ledger = getFinLedger();
      if (mode === 'Cash') ledger.cashInHand = (Number(ledger.cashInHand) || 0) + delta;
      else ledger.bankSlice = (Number(ledger.bankSlice) || 0) + delta;
      saveFinLedger(ledger);
    }

    saveTasks();
    render();
    if (activePage === 'financials') renderFinancialsPage();
    if (activePage === 'invoices') renderInvoicesPage();
    if (t.id && t.id.startsWith('cal_')) updateFeeOnCalendar(t.id, amount, discount);

    if (delta > 0 && !t.name.includes('Advance Credit Balance')) {
      setTimeout(() => offerReceipt(t.id, delta), 0);
    }
  }, 'Save', 'Cancel');
}

function offerReceipt(taskId, paidNow) {
  const t = tasks.find(x => x.id === taskId);
  if (!t) return;
  const label = t.linked || t.name;
  const payable = Number(t.payable) || 0;
  const received = Number(t.received) || 0;
  const discount = Number(t.discount) || 0;
  const balance = Math.max(0, payable - received - discount);
  const amount = paidNow > 0 ? paidNow : received;
  const invNo = String(t.invoice || '').split('|')[0].trim();

  let msg = `🧾 *Payment Receipt*\n\nDear Sir/Madam,\n\nWe have received your payment for *"${label}"*. Thank you!\n\n✅ *Amount Received:* ₹${amount}`;
  if (discount > 0) msg += `\n🏷️ *Discount Allowed:* ₹${discount}`;
  if (payable > 0) msg += balance > 0 ? `\n💰 *Balance Due:* ₹${balance}` : `\n✅ *Status:* Fully settled`;
  if (invNo) msg += `\n\n📄 *Invoice ${invNo}:*\nhttps://mustansirrmalikworkdashboard.netlify.app/invoice.html?inv=${encodeURIComponent(invNo)}`;
  msg += `\n\nWarm regards,\n*Mustannsirr Mallik*\n_Tax & Accounts Consultant, Indore_`;
  msg = msg.replace(/&/g, 'and');

  let cleanPh = (t.phone || '').replace(/[^0-9]/g, '');
  if (cleanPh.length === 10) cleanPh = '91' + cleanPh;
  const waUrl = 'https://api.whatsapp.com/send?' + (cleanPh ? 'phone=' + cleanPh + '&' : '') + 'text=' + encodeURIComponent(msg);

  showModal('📲 Send Payment Receipt?', `
    <div class="receipt-preview" style="margin-bottom:10px;">${escapeForHtml(msg)}</div>
    <a href="${waUrl}" target="_blank" rel="noopener" class="btn btn-wa" style="width:100%; display:inline-flex; align-items:center; justify-content:center; text-decoration:none;">
      📲 Send Receipt on WhatsApp
    </a>
  `, () => {}, 'Done', 'Close');
}

function setDueDate(id) {
  const t = tasks.find(x => x.id === id);
  if (!t) return;
  const cur = t.dueDate ? new Date(t.dueDate).toISOString().slice(0, 10) : '';
  showModal('Due Date — ' + t.name, `
    <label>Pick a Due Date</label>
    <input type="date" id="modalDueDate" value="${cur}">
  `, () => {
    const val = document.getElementById('modalDueDate').value;
    if (!val) return;
    t.dueDate = new Date(val + 'T09:00:00').toISOString();
    saveTasks();
    render();
    if (t.id && t.id.startsWith('cal_')) {
      const url = getWebhook();
      if (url) fetch(url + '?' + new URLSearchParams({ action: 'setduedate', id: t.id, dueDate: val }).toString()).catch(() => {});
    }
  }, 'Save', 'Cancel');
}

async function pushToCalendar(name, tag, dueDate) {
  const url = getWebhook();
  if (!url) return null;
  try {
    const paramsObj = { action: 'add', name, tag };
    if (dueDate) paramsObj.dueDate = dueDate;
    const res = await fetch(url + '?' + new URLSearchParams(paramsObj).toString());
    const data = await res.json();
    return data.id || null;
  } catch (e) { return null; }
}

function setRemark(id) {
  const t = tasks.find(x => x.id === id);
  if (!t) return;
  showModal('Edit Remark: ' + t.name, `
    <input type="text" id="mRemark" value="${escapeForHtml(t.remark || '')}" placeholder="Add note or remark">
  `, () => {
    t.remark = document.getElementById('mRemark').value.trim();
    saveTasks();
    render();
    if (t.id && t.id.startsWith('cal_')) {
      const url = getWebhook();
      if (url) fetch(url + '?' + new URLSearchParams({ action: 'setremark', id: t.id, remark: t.remark }).toString()).catch(() => {});
    }
  }, 'Save', 'Cancel');
}

function deleteTask(id) {
  const t = tasks.find(x => x.id === id);
  if (!t) return;
  showModal('Delete Task: ' + t.name + '?', `
    <div class="hint">This will remove the task from your dashboard and Google Calendar.</div>
  `, () => {
    tasks = tasks.filter(x => x.id !== id);
    saveTasks();
    render();
    deleteFromCalendar(id);
  }, 'Delete', 'Cancel');
}

function addTask() {
  const input = document.getElementById('newTask');
  const catVal = document.getElementById('newCat').value;
  const name = input.value.trim();
  if (!name) return;

  if (catVal === 'FEES') {
    const payable = parseFloat(document.getElementById('feePayable').value) || 0;
    const received = parseFloat(document.getElementById('feeReceived').value) || 0;
    const linked = document.getElementById('feeLinked').value.trim();
    const phone = document.getElementById('feePhone').value.trim();
    const feeTask = {
      id: 'fee_' + Date.now(), name: name, type: 'fee', cat: 'FEES', feeCat: 'OWN',
      done: received >= payable && payable > 0, payable: payable, received: received,
      discount: 0, linked: linked, phone: phone
    };
    tasks.push(feeTask);
    if (received > 0) {
      const ledger = getFinLedger();
      ledger.bankSlice = (Number(ledger.bankSlice) || 0) + received;
      saveFinLedger(ledger);
    }
    input.value = '';
    document.getElementById('feePayable').value = '';
    document.getElementById('feeReceived').value = '';
    document.getElementById('feeLinked').value = '';
    document.getElementById('feePhone').value = '';
    saveTasks();
    render();
    pushFeeToCalendar(name, payable, received, linked, phone, 'OWN').then(calId => {
      if (calId) { feeTask.id = calId; saveTasks(); }
    });
  } else {
    const dueVal = document.getElementById('newDueDate').value;
    const newTask = {
      id: 'task_' + Date.now(), name: name, type: catVal === 'PERSONAL' ? 'personal' : 'professional',
      cat: catVal === 'PERSONAL' ? 'PERSONAL' : catVal, done: false,
      dueDate: dueVal ? new Date(dueVal + 'T09:00:00').toISOString() : null, remark: ''
    };
    tasks.push(newTask);
    input.value = '';
    document.getElementById('newDueDate').value = '';
    saveTasks();
    render();
    pushToCalendar(name, catVal, dueVal).then(calId => {
      if (calId) { newTask.id = calId; saveTasks(); }
    });
  }
}

function onCategoryChange() {
  const select = document.getElementById('newCat');
  if (select.value === '__NEW__') {
    showModal('Add a new category', `
      <label>Category name</label>
      <input type="text" id="modalNewCatName" placeholder="e.g. ABC Company">
    `, () => {
      const raw = document.getElementById('modalNewCatName').value.trim();
      if (!raw) { select.value = 'PERSONAL'; return; }
      const tag = raw.toUpperCase().replace(/[^A-Z0-9]+/g, '_').replace(/^_+|_+$/g, '');
      const opt = document.createElement('option');
      opt.value = tag;
      opt.textContent = 'Professional — ' + raw;
      select.insertBefore(opt, select.querySelector('option[value="__NEW__"]'));
      select.value = tag;
    }, 'Create', 'Cancel');
    select.value = 'PERSONAL';
  }
  document.getElementById('feeFields').style.display = (select.value === 'FEES') ? 'flex' : 'none';
}

// =========================================================================
// MAIN TASKS & RECONCILED SUMMARY RENDERER
// =========================================================================
function render(listOnly) {
  const summaryEl = document.getElementById('summaryArea');
  const app = document.getElementById('app');
  if (!app) return;

  const ledger = getFinLedger();
  const cashBal = Number(ledger.cashInHand) || 0;
  const bankBal = Number(ledger.bankSlice) || 0;
  const totalLiquid = cashBal + bankBal;

  const juzerNet = Math.max(0, (ledger.loansGiven.juzer.base || 0) + (ledger.loansGiven.juzer.adjustments || 0));
  const customLoansGiven = (ledger.customLoans || []).filter(c => c.type === 'given').reduce((s, c) => s + Math.max(0, (c.principal || 0) - (c.repaid || 0)), 0);
  const totalLoansGiven = juzerNet + customLoansGiven;

  const doneCount = tasks.filter(t => t.done).length;
  const pendingCount = tasks.filter(t => !t.done).length;

  const badgeEl = document.getElementById('finBadge');
  if (badgeEl) badgeEl.textContent = inr(totalLiquid);

  const knownCats = new Set(['MHJ', 'SHK', 'OWN', 'FEES', 'PERSONAL']);
  const extraCats = [...new Set(tasks.filter(t => t.type === 'professional' && t.cat && !knownCats.has(t.cat)).map(t => t.cat))];

  let filtered = tasks;
  if (filter === 'personal') filtered = tasks.filter(t => t.type === 'personal');
  else if (filter === 'professional') filtered = tasks.filter(t => t.type === 'professional');
  else if (filter === 'own') filtered = tasks.filter(t => t.cat === 'OWN');
  else if (filter === 'mhj') filtered = tasks.filter(t => t.cat === 'MHJ');
  else if (filter === 'shk') filtered = tasks.filter(t => t.cat === 'SHK');
  else if (filter === 'fees') filtered = tasks.filter(t => t.type === 'fee');
  else if (filter === 'pending') filtered = tasks.filter(t => !t.done);
  else if (filter === 'done') filtered = tasks.filter(t => t.done);
  else if (extraCats.includes(filter)) filtered = tasks.filter(t => t.cat === filter);

  const q = searchQuery.trim().toLowerCase();
  const searchActive = q.length > 0;
  if (searchActive) {
    const words = q.split(/\s+/);
    filtered = filtered.filter(t => {
      const hay = [t.name, t.linked, t.invoice, t.remark, t.phone, t.cat].join(' ').toLowerCase();
      return words.every(w => hay.includes(w));
    });
  }

  const filterBtn = (key, label, dotColor) =>
    `<button type="button" class="filter-btn ${filter === key ? 'active' : ''}" onclick="setFilter('${key}')">${dotColor ? `<i class="dot" style="background:${dotColor}"></i>` : ''}${label}</button>`;

  if (!listOnly && summaryEl) {
    summaryEl.innerHTML = `
      <div class="summary-sheet">
        <div class="hero-stats">
          <div class="hero-card"><div class="n">${doneCount}</div><div class="l">Done</div></div>
          <div class="hero-card"><div class="n">${pendingCount}</div><div class="l">Pending</div></div>
          <div class="hero-card" style="cursor:pointer;" onclick="switchPage('financials')"><div class="n">${inr(totalLiquid)}</div><div class="l">Liquid ↗</div></div>
          <div class="hero-card" style="cursor:pointer;" onclick="switchPage('financials')"><div class="n">${inr(totalLoansGiven)}</div><div class="l">Loans Given ↗</div></div>
        </div>
        ${uiState.showSummaryDetails ? `
          <div class="totals">
            <div class="tot"><div class="l">Cash in Hand</div><div class="fig" style="color:${cashBal < 0 ? 'var(--red)' : 'var(--ink)'};">${inr(cashBal)}</div></div>
            <div class="tot"><div class="l">slice Small Finance Bank</div><div class="fig" style="color:var(--green);">${inr(bankBal)}</div></div>
            <div class="tot sum"><div class="l">Total Reconciled Liquidity</div><div class="fig">${inr(totalLiquid)}</div></div>
          </div>
        ` : ''}
        <div style="display:flex; justify-content:space-between; align-items:center; padding:4px 12px; background:#F8FAFC; border-top:1px solid var(--rule-soft); font-size:11px;">
          <button type="button" class="act" onclick="toggleSummaryDetails()">${uiState.showSummaryDetails ? '▴ Hide Cash/Bank' : '▾ Cash & Bank Details'}</button>
          <button type="button" class="act" onclick="switchPage('financials')">Open Financials &amp; Ziyarat &rarr;</button>
        </div>
      </div>

      <div class="filters seg">
        ${filterBtn('all', 'All')}${filterBtn('personal', 'Personal')}${filterBtn('professional', 'Professional')}${filterBtn('pending', 'Pending')}${filterBtn('done', 'Done')}
      </div>
      <div class="filters chips">
        ${filterBtn('own', 'OWN', 'var(--c-own)')}${filterBtn('mhj', 'MHJ', 'var(--c-mhj)')}${filterBtn('shk', 'SHK', 'var(--c-shk)')}${filterBtn('fees', 'Fees', 'var(--c-fees)')}
        ${extraCats.map((c, i) => filterBtn(c, c.replace(/_/g, ' '), EXTRA_COLORS[i % EXTRA_COLORS.length])).join('')}
        <button type="button" class="filter-btn" onclick="toggleAllGroups(true)">⊟ Fold All</button>
        <button type="button" class="filter-btn" onclick="toggleAllGroups(false)">⊞ Expand All</button>
      </div>
    `;
  }

  let html = '';
  const forceOpen = filter !== 'all' || searchActive;
  let shownCount = 0;

  if (filtered.length === 0) {
    html = `<div style="text-align:center; padding:24px; color:var(--muted); background:#fff; border-radius:12px; border:1px dashed var(--rule);">No tasks match your filter.</div>`;
  } else {
    const groupDefs = [
      { key: 'MHJ', label: 'Professional — MHJ', color: 'var(--c-mhj)', match: t => t.cat === 'MHJ' }
    ];
    extraCats.forEach((cat, i) => {
      groupDefs.push({ key: cat, label: 'Professional — ' + cat.replace(/_/g, ' '), color: EXTRA_COLORS[i % EXTRA_COLORS.length], match: t => t.cat === cat });
    });
    groupDefs.push(
      { key: 'SHK', label: 'Professional — SHK Husain Arif', color: 'var(--c-shk)', match: t => t.cat === 'SHK' },
      { key: 'OWN', label: 'Professional — OWN', color: 'var(--c-own)', match: t => t.cat === 'OWN' },
      { key: 'personal', label: 'Personal', color: 'var(--c-personal)', match: t => t.type === 'personal' },
      { key: 'FEES', label: 'Fees & Receivables', color: 'var(--c-fees)', match: t => t.type === 'fee' && !t.name.includes('Advance Credit Balance') }
    );

    const renderCard = (t, idx) => {
      const isFee = t.type === 'fee';
      const balance = isFee ? Math.max(0, (t.payable || 0) - (t.received || 0) - (t.discount || 0)) : 0;
      const dueDateLabel = t.dueDate ? new Date(t.dueDate).toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }) : '';
      const invNo = String(t.invoice || '').split('|')[0].trim();

      return `
        <div class="task${t.done ? ' done' : ''}">
          <span class="num">${idx + 1}.</span>
          ${isFee ? '' : `<input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggleTask('${t.id}')">`}
          <div class="task-body">
            <div class="task-top">
              <div class="task-name">${escapeForHtml(t.name)}</div>
              ${isFee ? (balance > 0 ? `<div class="amt owed">${inr(balance)}</div>` : `<div class="amt clear">Settled</div>`) : ''}
              <button type="button" class="act del" onclick="deleteTask('${t.id}')">${ICON.x}</button>
            </div>
            ${isFee ? `<div class="task-sub">${inr(t.received)} of ${inr(t.payable)} received${invNo ? ' &bull; <strong>' + escapeForHtml(invNo) + '</strong>' : ''}</div>` : ''}
            ${t.remark && !t.done ? `<div class="note">${ICON.note}<span>${escapeForHtml(t.remark)}</span></div>` : ''}
            <div class="task-meta">
              ${dueDateLabel && !t.done ? `<span style="color:var(--muted);">Due ${dueDateLabel}</span>` : ''}
              ${isFee ? `<button type="button" class="act pay" onclick="recordPayment('${t.id}')">Payment</button>` : ''}
              ${isFee ? `<button type="button" class="act" onclick="generateOrOpenInvoice('${t.id}')">${invNo ? '📄 Invoice' : '✨ Invoice'}</button>` : ''}
              ${isFee && balance > 0 ? `<button type="button" class="act wa" onclick="sendWhatsAppReminder('${t.id}', ${balance})">${ICON.chat} Send WhatsApp reminder</button>` : ''}
              ${isFee && (t.received || 0) > 0 ? `<button type="button" class="act wa" onclick="offerReceipt('${t.id}', 0)">${ICON.doc} Receipt</button>` : ''}
              ${!t.done ? `<button type="button" class="act" onclick="setDueDate('${t.id}')">Due date</button>` : ''}
              ${!t.done ? `<button type="button" class="act" onclick="setRemark('${t.id}')">Remark</button>` : ''}
            </div>
          </div>
        </div>
      `;
    };

    const isFinished = t => t.done && (t.type !== 'fee' || ((t.payable || 0) - (t.received || 0) - (t.discount || 0)) <= 0);

    groupDefs.forEach(g => {
      const groupTasks = filtered.filter(g.match);
      if (groupTasks.length === 0) return;
      shownCount += groupTasks.length;
      const open = groupTasks.filter(t => !isFinished(t));
      const closed = groupTasks.filter(isFinished);
      const ordered = open.concat(closed);
      const collapsed = !forceOpen && !!uiState.collapsed[g.key];
      const key = escapeForHtml(g.key);

      html += `
        <div class="cat-section${collapsed ? ' collapsed' : ''}">
          <div class="cat-heading" onclick="toggleGroup('${key}')">
            ${ICON.chev}
            <span class="dot" style="background:${g.color}"></span>
            <span class="title">${escapeForHtml(g.label)}</span>
            <span class="count">${open.length} pending${closed.length ? ' · ' + closed.length + ' done' : ''}</span>
          </div>
          ${!collapsed ? `
            <div class="task-grid">
              ${open.map(t => renderCard(t, ordered.indexOf(t))).join('')}
              ${closed.length ? `
                <button type="button" class="done-toggle" onclick="toggleDone('${key}')">${doneOpen[g.key] ? '▴ Hide completed' : '✓ ' + closed.length + ' completed · show'}</button>
                ${(doneOpen[g.key] || filter === 'done' || searchActive) ? closed.map(t => renderCard(t, ordered.indexOf(t))).join('') : ''}
              ` : ''}
            </div>
          ` : ''}
        </div>
      `;
    });
  }

  app.innerHTML = html;
  const info = document.getElementById('searchInfo');
  if (info) info.textContent = searchActive ? shownCount + ' of ' + tasks.length + ' tasks' : '';
}

function resetData() {
  showModal('Reset & Resync with Calendar?', `
    <div class="hint">Reloads tasks from Google Calendar and synchronizes with cloud storage.</div>
  `, () => {
    localStorage.removeItem(STORAGE_KEY);
    window.location.reload();
  }, 'Reset', 'Cancel');
}

function checkPublicZiyaratView() {
  const urlParams = new URLSearchParams(window.location.search);
  const isTrip = urlParams.get('view') === 'ziyarat' || window.location.hash === '#ziyarat';
  if (!isTrip) return false;

  isFamilyPublicView = true;
  const gate = document.getElementById('authGate');
  if (gate) gate.style.display = 'none';

  const nav = document.querySelector('.page-nav');
  if (nav) nav.style.display = 'none';
  const statusEl = document.querySelector('.masthead .status');
  if (statusEl) statusEl.style.display = 'none';

  switchPage('financials');
  setFinViewMode('trip');
  syncCloudFinLedger();
  return true;
}

const DASHBOARD_PASSWORD = 'Mustansir@2026';
const AUTH_KEY = 'dashboard-auth-ok';

function checkAuth() {
  const input = document.getElementById('authInput');
  if (input.value === DASHBOARD_PASSWORD) {
    localStorage.setItem(AUTH_KEY, 'yes');
    document.getElementById('authGate').style.display = 'none';
    startDashboard();
  } else {
    document.getElementById('authError').style.display = 'block';
    input.value = '';
  }
}

function startDashboard() {
  loadTasks();
  pullFromCalendar();
  syncCloudFinLedger();
  if (window.location.hash === '#financials') switchPage('financials');
  else if (window.location.hash === '#invoices') switchPage('invoices');
}

function boot() {
  if (checkPublicZiyaratView()) return;
  if (localStorage.getItem(AUTH_KEY) === 'yes') {
    const gate = document.getElementById('authGate');
    if (gate) gate.style.display = 'none';
    startDashboard();
  } else {
    const inp = document.getElementById('authInput');
    if (inp) inp.focus();
  }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}
</script>
