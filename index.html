function toggleTask(id) {
  const t = tasks.find(x => x.id === id);
  if (!t) return;
  t.done = !t.done;
  saveTasks();
  render();
  if (t.id.startsWith('cal_')) toggleOnCalendar(t.id, t.done);

  if (t.done && t.type !== 'fee') {
    fireConfetti();

    const targetName = (t.linked || t.name).trim().toLowerCase();
    const existingFee = tasks.find(x => x.type === 'fee' && (
      (x.linked && x.linked.trim().toLowerCase() === targetName) ||
      x.name.trim().toLowerCase() === targetName ||
      x.name.trim().toLowerCase().includes(targetName)
    ));

    if (existingFee && !existingFee.done) {
      setTimeout(() => recordPayment(existingFee.id), 120);
      return;
    }

    const catPhones = getCategoryPhones();
    const defaultPhone = catPhones[t.cat] || (t.cat === 'SHK' ? '9425320184' : (t.cat === 'MHJ' ? '9425054543' : (t.cat === 'HATIM_BHAI_ADV' ? '9826768052' : '')));

    const promptHtml = `
      <div class="hint">Task "<strong>${escapeForHtml(t.name)}</strong>" marked complete! Enter fee details to bill client and record payment.</div>
      <label>Total Billable Fee (₹) (Leave blank or 0 to skip fee entry)</label>
      <input type="number" id="modalPromptPayable" placeholder="₹ Total Fee" oninput="checkPromptShortfall()">
      <label>Amount Received Right Now (₹)</label>
      <input type="number" id="modalPromptReceived" placeholder="0" value="0" oninput="checkPromptShortfall()">
      <label>Account Debited / Deposited Into</label>
      <select id="modalPromptSource">
        <option value="bank">slice Small Finance Bank (Auto-debit bank balance)</option>
        <option value="cash">Cash in hand (Auto-debit physical cash)</option>
      </select>
      <label>Client Mobile Number (for WhatsApp Receipt)</label>
      <input type="tel" id="modalPromptPhone" placeholder="Mobile Number" value="${defaultPhone}">
      <label class="check-row">
        <input type="checkbox" id="modalPromptSendReceipt" checked>
        Offer WhatsApp payment receipt after saving
      </label>

      <div id="promptShortfallCard" style="display:none; background:#FFFBEB; border:1px solid #FDE68A; border-radius:8px; padding:10px; margin-top:10px; margin-bottom:12px;">
        <div style="font-weight:700; color:#B45309; font-size:12px;" id="promptShortfallTitle">Shortfall Detected</div>
        <div style="font-size:11.5px; color:#78350F; margin:4px 0 8px;" id="promptShortfallDesc"></div>
        <label style="font-size:11px; font-weight:700; color:#B45309;">Action for Remaining Balance:</label>
        <select id="promptShortfallAction" style="height:34px; font-size:12px; margin-bottom:0;">
          <option value="pending">Keep remaining balance in Pending (Sundry Debtors)</option>
          <option value="adjust_mhj">Adjust against MHJ Loan Taken (₹86,000)</option>
          <option value="adjust_hatim">Adjust against Hatim Bhai Loan Taken (₹5,000)</option>
          <option value="adjust_juzer">Adjust against Juzer Presswala Advance (₹1,07,690)</option>
          <option value="discount">Write off as Discount / Concession</option>
        </select>
      </div>
    `;

    setTimeout(() => {
      showModal('Record Payment / Fee — ' + t.name, promptHtml, () => {
        const payable = parseFloat(document.getElementById('modalPromptPayable').value) || 0;
        const received = parseFloat(document.getElementById('modalPromptReceived').value) || 0;
        const phone = document.getElementById('modalPromptPhone').value.trim();
        const source = document.getElementById('modalPromptSource').value;
        const wantReceipt = document.getElementById('modalPromptSendReceipt') ? document.getElementById('modalPromptSendReceipt').checked : false;
        const shortfallActionEl = document.getElementById('promptShortfallAction');
        const shortfallAction = shortfallActionEl ? shortfallActionEl.value : 'pending';

        if (payable <= 0) return;

        const ledger = getFinLedger();
        const localFeeId = 'u' + Date.now();
        let discount = 0;
        let isDone = (received >= payable);
        let remark = '';

        if (received > 0) {
          if (source === 'cash') {
            ledger.cashInHand = Math.round(((ledger.cashInHand || 0) + received) * 100) / 100;
          } else {
            ledger.bankSlice = Math.round(((ledger.bankSlice || 0) + received) * 100) / 100;
          }
        }

        const diff = payable - received;
        if (diff > 0 && shortfallAction.startsWith('adjust_')) {
          let targetName = 'MHJ';
          if (shortfallAction === 'adjust_mhj') {
            ledger.loansTaken.mhj.adjustments += diff;
            targetName = 'MHJ Loan Taken';
          } else if (shortfallAction === 'adjust_hatim') {
            ledger.loansTaken.hatim.adjustments += diff;
            targetName = 'Hatim Bhai Loan Taken';
          } else if (shortfallAction === 'adjust_juzer') {
            ledger.loansGiven.juzer.adjustments += diff;
            targetName = 'Juzer Presswala Loan Given';
          }
          ledger.adjustmentsLog.unshift({
            date: new Date().toISOString().slice(0, 10),
            desc: `Offset ${inr(diff)} shortfall on ${t.name} against ${targetName}`,
            amount: diff
          });
          isDone = true;
          remark = `Received ${inr(received)} in ${source === 'cash' ? 'Cash' : 'Bank'}. Balance ${inr(diff)} adjusted against ${targetName}.`;
        } else if (diff > 0 && shortfallAction === 'discount') {
          discount = diff;
          isDone = true;
          remark = `Received ${inr(received)}. Shortfall ${inr(diff)} written off as concession.`;
        } else if (diff > 0) {
          remark = `Received ${inr(received)} in ${source === 'cash' ? 'Cash' : 'Bank'}. Remaining ${inr(diff)} pending.`;
        }

        saveFinLedger(ledger);

        const feeTask = {
          id: localFeeId,
          name: t.name,
          type: 'fee',
          cat: 'FEES',
          feeCat: t.cat || 'SHK',
          due: '',
          done: isDone,
          urgent: false,
          payable: payable,
          received: received,
          discount: discount,
          linked: t.name,
          phone: phone,
          remark: remark
        };

        tasks.unshift(feeTask);
        saveTasks();
        render();
        if (activePage === 'financials') renderFinancialsPage();

        pushFeeToCalendar(t.name, payable, received, t.name, phone, t.cat || '').then(calId => {
          if (calId) { feeTask.id = calId; saveTasks(); }
        });

        if (wantReceipt && received > 0) {
          setTimeout(() => offerReceipt(feeTask.id, received, true), 80);
        }
      }, 'Save & Bill Fee', 'Skip Fee');
    }, 80);
  }
}

function checkPromptShortfall() {
  const pEl = document.getElementById('modalPromptPayable');
  const rEl = document.getElementById('modalPromptReceived');
  const card = document.getElementById('promptShortfallCard');
  if (!pEl || !rEl || !card) return;

  const payable = parseFloat(pEl.value) || 0;
  const received = parseFloat(rEl.value) || 0;
  const shortfall = payable - received;

  if (payable > 0 && received > 0 && shortfall > 0) {
    card.style.display = 'block';
    document.getElementById('promptShortfallTitle').textContent = `Shortfall of ${inr(shortfall)}`;
    document.getElementById('promptShortfallDesc').textContent = `Amount received is less than total fee. Select how to handle the remaining ${inr(shortfall)}:`;
  } else {
    card.style.display = 'none';
  }
}

async function pushFeeToCalendar(name, payable, received, linked, phone, feeCat) {
  const url = getWebhook();
  if (!url) return null;
  try {
    const params = new URLSearchParams({ action: 'addfee', name, payable, received, linked, phone: phone || '', feeCat: feeCat || '' });
    const res = await fetch(url + '?' + params.toString());
    const data = await res.json();
    return data.id || null;
  } catch (e) { return null; }
}

async function toggleOnCalendar(taskId, done) {
  const url = getWebhook();
  if (!url) return;
  try {
    const params = new URLSearchParams({ action: 'toggle', id: taskId, done: done ? 'true' : 'false' });
    await fetch(url + '?' + params.toString());
  } catch (e) {}
}

function deleteTask(id) {
  const t = tasks.find(x => x.id === id);
  showModal('Remove "' + (t ? t.name : 'this task') + '"?', `
    <div class="hint">This removes it from your dashboard and Calendar.</div>
  `, () => {
    tasks = tasks.filter(x => x.id !== id);
    saveTasks();
    render();
    if (id.startsWith('cal_')) {
      const url = getWebhook();
      if (url) fetch(url + '?action=delete&id=' + id).catch(()=>{});
    }
  }, 'Delete', 'Cancel');
}

function setRemark(id) {
  const t = tasks.find(x => x.id === id);
  if (!t) return;
  const presets = ['Waiting for documents', 'Client confirmation pending', 'In progress', 'Waiting for portal', 'Awaiting payment'];
  const presetsHtml = presets.map(p => `<button type="button" onclick="document.getElementById('modalRemarkText').value='${p}'" class="preset">${p}</button>`).join('');
  showModal('Remark — ' + t.name, `
    <div class="presets">${presetsHtml}</div>
    <label>Or custom note</label>
    <input type="text" id="modalRemarkText" placeholder="Why is this pending?" value="${escapeForHtml(t.remark || '')}">
  `, async () => {
    const val = document.getElementById('modalRemarkText').value.trim();
    t.remark = val;
    saveTasks();
    render();
    if (t.id.startsWith('cal_')) {
      const url = getWebhook();
      if (url) fetch(url + '?action=setremark&id=' + t.id + '&remark=' + encodeURIComponent(val)).catch(()=>{});
    }
  }, 'Save', 'Cancel');
}

function setDueDate(id) {
  const t = tasks.find(x => x.id === id);
  if (!t) return;
  const currentVal = t.dueDate ? new Date(t.dueDate).toISOString().slice(0, 10) : '';
  showModal('Due date — ' + t.name, `
    <label>Pick a due date</label>
    <input type="date" id="modalDueDate" value="${currentVal}">
  `, async () => {
    const val = document.getElementById('modalDueDate').value;
    if (!val) return;
    t.dueDate = new Date(val + 'T09:00:00').toISOString();
    saveTasks();
    render();
    if (t.id.startsWith('cal_')) {
      const url = getWebhook();
      if (url) fetch(url + '?action=setduedate&id=' + t.id + '&dueDate=' + val).catch(()=>{});
    }
  });
}

function recordPayment(id) {
  const t = tasks.find(x => x.id === id);
  if (!t) return;
  const payable = Number(t.payable) || 0;
  const currentRec = Number(t.received) || 0;

  showModal('Record payment — ' + t.name, `
    <div class="hint">Total Payable: <strong>${inr(payable)}</strong> &bull; Received so far: <strong>${inr(currentRec)}</strong></div>
    <label>Total Amount Received so far (₹)</label>
    <input type="number" id="modalReceivedAmt" value="${currentRec}" oninput="checkShortfall(${payable})">
    <label>Deposit To Account (Double-Entry Debit)</label>
    <select id="modalPayMode">
      <option value="bank">slice Small Finance Bank (Immediately increases Bank Balance)</option>
      <option value="cash">Cash in hand (Immediately increases Cash Balance)</option>
    </select>
    <label>Discount / Concession (₹)</label>
    <input type="number" id="modalDiscountAmt" placeholder="0" value="${t.discount || 0}" oninput="checkShortfall(${payable})">
    
    <label class="check-row">
      <input type="checkbox" id="modalSendReceipt" checked>
      Offer a WhatsApp payment receipt after saving
    </label>
    <div id="modalReceiptHint" class="hint" style="margin-top:4px;"></div>

    <div id="shortfallCard" style="display:none; background:#FFFBEB; border:1px solid #FDE68A; border-radius:8px; padding:10px; margin-top:10px; margin-bottom:12px;">
      <div style="font-weight:700; color:#B45309; font-size:12px;" id="shortfallTitle">Shortfall Detected</div>
      <div style="font-size:11.5px; color:#78350F; margin:4px 0 8px;" id="shortfallDesc"></div>
      <label style="font-size:11px; font-weight:700; color:#B45309;">Action for Remaining Balance:</label>
      <select id="shortfallAction" style="height:34px; font-size:12px; margin-bottom:0;">
        <option value="pending">Keep remaining balance in Pending (Sundry Debtors)</option>
        <option value="adjust_mhj">Adjust against MHJ Loan Taken (₹86,000)</option>
        <option value="adjust_hatim">Adjust against Hatim Bhai Loan Taken (₹5,000)</option>
        <option value="adjust_juzer">Adjust against Juzer Presswala Advance (₹1,07,690)</option>
        <option value="discount">Write off as Discount / Concession</option>
      </select>
    </div>
  `, () => {
    const entered = parseFloat(document.getElementById('modalReceivedAmt').value) || 0;
    const discount = parseFloat(document.getElementById('modalDiscountAmt').value) || 0;
    const payMode = document.getElementById('modalPayMode').value;
    const wantReceipt = document.getElementById('modalSendReceipt') ? document.getElementById('modalSendReceipt').checked : false;
    const shortfallActionEl = document.getElementById('shortfallAction');
    const shortfallAction = shortfallActionEl ? shortfallActionEl.value : 'pending';

    const diff = entered - currentRec;
    const ledger = getFinLedger();
    
    if (diff > 0) {
      if (payMode === 'cash') {
        ledger.cashInHand = Math.round(((ledger.cashInHand || 0) + diff) * 100) / 100;
      } else {
        ledger.bankSlice = Math.round(((ledger.bankSlice || 0) + diff) * 100) / 100;
      }
    }

    const remaining = payable - entered - discount;

    if (remaining > 0 && shortfallAction.startsWith('adjust_')) {
      let targetName = 'MHJ';
      if (shortfallAction === 'adjust_mhj') {
        ledger.loansTaken.mhj.adjustments += remaining;
        targetName = 'MHJ Loan Taken';
      } else if (shortfallAction === 'adjust_hatim') {
        ledger.loansTaken.hatim.adjustments += remaining;
        targetName = 'Hatim Bhai Loan Taken';
      } else if (shortfallAction === 'adjust_juzer') {
        ledger.loansGiven.juzer.adjustments += remaining;
        targetName = 'Juzer Presswala Loan Given';
      }
      ledger.adjustmentsLog.unshift({
        date: new Date().toISOString().slice(0, 10),
        desc: `Offset ${inr(remaining)} shortfall on ${t.name} against ${targetName}`,
        amount: remaining
      });

      t.received = entered;
      t.discount = discount;
      t.done = true;
      t.remark = `Received ${inr(entered)} in ${payMode === 'cash' ? 'Cash' : 'Bank'}. Balance ${inr(remaining)} adjusted against ${targetName}.`;
    } else if (remaining > 0 && shortfallAction === 'discount') {
      t.received = entered;
      t.discount = discount + remaining;
      t.done = true;
      t.remark = `Received ${inr(entered)}. Shortfall ${inr(remaining)} written off as concession.`;
    } else {
      t.received = entered;
      t.discount = discount;
      t.done = (entered + discount) >= payable;
      if (remaining > 0) {
        t.remark = `Received ${inr(entered)} in ${payMode === 'cash' ? 'Cash' : 'Bank'}. Remaining ${inr(diff > 0 ? remaining : diff)} pending.`;
      }
    }

    saveFinLedger(ledger);
    saveTasks();
    render();
    if (activePage === 'financials') renderFinancialsPage();
    if (t.id.startsWith('cal_')) updateFeeOnCalendar(t.id, t.received, t.discount);

    const paidNow = Math.round(diff * 100) / 100;
    if (wantReceipt && entered > 0 && !t.name.includes('Advance Credit Balance')) {
      setTimeout(() => offerReceipt(t.id, paidNow > 0 ? paidNow : entered, true), 50);
    }
  });

  const amtEl = document.getElementById('modalReceivedAmt');
  const boxEl = document.getElementById('modalSendReceipt');
  const hintEl = document.getElementById('modalReceiptHint');
  const updateReceiptHint = () => {
    if (!boxEl || !hintEl) return;
    if (!boxEl.checked) { hintEl.textContent = 'No receipt prompt will open.'; return; }
    const val = parseFloat(amtEl.value) || 0;
    const addl = Math.round((val - currentRec) * 100) / 100;
    hintEl.textContent = addl > 0
      ? `Receipt will be generated for new payment of ${inr(addl)}.`
      : `Receipt will show total received so far (${inr(val)}).`;
  };
  if (amtEl && boxEl) {
    amtEl.addEventListener('input', updateReceiptHint);
    boxEl.addEventListener('change', updateReceiptHint);
    updateReceiptHint();
  }
}

function checkShortfall(payable) {
  const entered = parseFloat(document.getElementById('modalReceivedAmt').value) || 0;
  const discount = parseFloat(document.getElementById('modalDiscountAmt').value) || 0;
  const shortfall = payable - entered - discount;
  const card = document.getElementById('shortfallCard');
  if (shortfall > 0) {
    card.style.display = 'block';
    document.getElementById('shortfallTitle').textContent = `Shortfall of ${inr(shortfall)}`;
    document.getElementById('shortfallDesc').textContent = `Total received is less than billable amount. Choose how to handle the remaining ${inr(shortfall)}:`;
  } else {
    card.style.display = 'none';
  }
}

async function updateFeeOnCalendar(taskId, received, discount) {
  const url = getWebhook();
  if (!url) return;
  try {
    const params = new URLSearchParams({ action: 'updatefee', id: taskId, received, discount: discount || 0 });
    await fetch(url + '?' + params.toString());
  } catch (e) {}
}

function toggleFeeFields() {
  const isFee = document.getElementById('newCat').value === 'FEES';
  document.getElementById('feeFields').style.display = isFee ? 'flex' : 'none';
}

function onCategoryChange() {
  const select = document.getElementById('newCat');
  if (select.value === '__NEW__') {
    showModal('Add new category', `
      <label>Category name</label>
      <input type="text" id="modalNewCatName" placeholder="e.g. ABC Company">
    `, () => {
      const raw = document.getElementById('modalNewCatName').value.trim();
      if (!raw) { select.value = 'MHJ'; return; }
      const tag = raw.toUpperCase().replace(/[^A-Z0-9]+/g, '_').replace(/^_+|_+$/g, '');
      const opt = document.createElement('option');
      opt.value = tag;
      opt.textContent = 'Professional — ' + raw;
      select.insertBefore(opt, select.querySelector('option[value="__NEW__"]'));
      select.value = tag;
      toggleFeeFields();
    }, 'Create', 'Cancel');
    select.value = 'MHJ';
  } else {
    toggleFeeFields();
  }
}

function addTask() {
  const input = document.getElementById('newTask');
  const catVal = document.getElementById('newCat').value;
  const name = input.value.trim();
  if (!name) return;

  if (catVal === 'FEES') {
    const payable = parseFloat(document.getElementById('feePayable').value) || 0;
    const received = parseFloat(document.getElementById('feeReceived').value) || 0;
    const linked = document.getElementById('feeLinked').value.trim();
    const phone = document.getElementById('feePhone').value.trim();
    const localId = 'u'+Date.now();
    const task = { id: localId, name, type: 'fee', cat: 'FEES', feeCat: '', due: '', done: received >= payable && payable > 0, urgent: false, payable, received, linked, phone };
    tasks.unshift(task);
    input.value = '';
    document.getElementById('feePayable').value = '';
    document.getElementById('feeReceived').value = '';
    document.getElementById('feeLinked').value = '';
    document.getElementById('feePhone').value = '';
    saveTasks();
    render();
    pushFeeToCalendar(name, payable, received, linked, phone, '').then(calId => {
      if (calId) { task.id = calId; saveTasks(); }
    });
    return;
  }

  const type = catVal === 'PERSONAL' ? 'personal' : 'professional';
  const cat = catVal === 'PERSONAL' ? null : catVal;
  const localId = 'u'+Date.now();
  const dueDateInput = document.getElementById('newDueDate');
  const dueDateVal = dueDateInput.value;
  const task = { id: localId, name, type, cat, due: '', dueDate: dueDateVal ? new Date(dueDateVal + 'T09:00:00').toISOString() : null, done: false, urgent: false };
  tasks.unshift(task);
  input.value = '';
  dueDateInput.value = '';
  saveTasks();
  render();

  const url = getWebhook();
  if (url) {
    var paramsObj = { action: 'add', name: name, tag: catVal };
    if (dueDateVal) paramsObj.dueDate = dueDateVal;
    fetch(url + '?' + new URLSearchParams(paramsObj).toString())
      .then(r => r.json())
      .then(d => { if (d && d.id) { task.id = d.id; saveTasks(); } })
      .catch(()=>{});
  }
}

function setFilter(f) {
  filter = f;
  render();
}

function render(listOnly) {
  const summaryEl = document.getElementById('summaryArea');
  const app = document.getElementById('app');
  const nowTs = Date.now();

  const isOverdue = t => !t.done && t.dueDate && new Date(t.dueDate).getTime() < nowTs;
  const done = tasks.filter(t => t.done).length;
  const pending = tasks.filter(t => !t.done).length;
  const overdue = tasks.filter(isOverdue).length;
  const total = tasks.length;
  const pct = total ? Math.round((done/total)*100) : 0;

  const feeTasks = tasks.filter(t => t.type === 'fee' && !t.name.includes('Advance Credit Balance'));
  const totalPayable = feeTasks.reduce((s, t) => s + (t.payable || 0), 0);
  const totalReceived = feeTasks.reduce((s, t) => s + (t.received || 0), 0);
  const totalDiscount = feeTasks.reduce((s, t) => s + (t.discount || 0), 0);
  const totalOutstanding = totalPayable - totalReceived - totalDiscount;

  const knownCats = new Set(['MHJ', 'SHK', 'OWN', 'FEES']);
  const extraCats = [...new Set(tasks.filter(t => t.type === 'professional' && !knownCats.has(t.cat)).map(t => t.cat))];

  let filtered = tasks;
  if (filter === 'personal') filtered = tasks.filter(t => t.type === 'personal');
  else if (filter === 'professional') filtered = tasks.filter(t => t.type === 'professional');
  else if (filter === 'own') filtered = tasks.filter(t => t.cat === 'OWN');
  else if (filter === 'mhj') filtered = tasks.filter(t => t.cat === 'MHJ');
  else if (filter === 'shk') filtered = tasks.filter(t => t.cat === 'SHK');
  else if (filter === 'fees') filtered = tasks.filter(t => t.cat === 'FEES');
  else if (filter === 'pending') filtered = tasks.filter(t => !t.done);
  else if (filter === 'done') filtered = tasks.filter(t => t.done);
  else if (extraCats.includes(filter)) filtered = tasks.filter(t => t.cat === filter);

  const q = searchQuery.trim().toLowerCase();
  const searchActive = q.length > 0;
  if (searchActive) {
    const words = q.split(/\s+/);
    filtered = filtered.filter(t => {
      const hay = [t.name, t.linked, t.invoice, t.remark, t.phone, t.cat].join(' ').toLowerCase();
      return words.every(w => hay.includes(w));
    });
  }

  const filterBtn = (key, label, dotColor) =>
    `<button type="button" class="filter-btn ${filter === key ? 'active' : ''}" aria-pressed="${filter === key}" onclick="setFilter('${key}')">${dotColor ? `<i class="dot" style="background:${dotColor}"></i>` : ''}${label}</button>`;

  if (!listOnly) {
    summaryEl.innerHTML = `
      <div class="summary-sheet">
        <div class="hero-stats">
          <div class="hero-card"><div class="n">${pct}%</div><div class="l">Complete</div></div>
          <div class="hero-card"><div class="n">${pending}</div><div class="l">Pending</div></div>
          <div class="hero-card alert"><div class="n">${overdue}</div><div class="l">Overdue</div></div>
          <div class="hero-card"><div class="n">${done}</div><div class="l">Done</div></div>
        </div>
        ${feeTasks.length > 0 ? `
        <div class="totals">
          <div class="tot"><div class="l">Gross Receivable</div><div class="fig">${inr(totalPayable)}</div></div>
          <div class="tot"><div class="l">Realized in Cash/Bank</div><div class="fig recd">${inr(totalReceived)}</div></div>
          <div class="tot sum"><div class="l">Net Outstanding</div><div class="fig out${totalOutstanding > 0 ? '' : ' clear'}">${inr(totalOutstanding)}</div></div>
        </div>` : ''}
      </div>

      <div class="loan-strip">
        <div class="loan-strip-items">
          <div class="loan-pill-item"><b>Juzer Presswala:</b> <span class="red">₹1,07,690</span> (Adv Given)</div>
          <div class="loan-pill-item"><b>MHJ:</b> <span class="amber">₹86,000</span> (Loan Taken)</div>
          <div class="loan-pill-item"><b>Hatim Bhai:</b> <span class="amber">₹5,000</span> (Loan Taken)</div>
          <div class="loan-pill-item"><b>Kathiyawad Ziyarat:</b> <span style="color:#0284C7; font-weight:700;">₹13,000 Disbursed (3 Families)</span></div>
        </div>
        <button type="button" onclick="switchPage('financials')" style="background:none; border:0; color:var(--accent); font-weight:700; font-size:12px; cursor:pointer;">Financials Page &rarr;</button>
      </div>

      <div class="filters seg" role="group" aria-label="Status filters">
        ${filterBtn('all', 'All')}${filterBtn('pending', 'Pending First')}${filterBtn('professional', 'Professional')}${filterBtn('fees', 'Fees')}${filterBtn('personal', 'Personal')}${filterBtn('done', 'Completed')}
      </div>
      <div class="filters chips" role="group" aria-label="Category filters">
        ${filterBtn('mhj', 'MHJ (Mufazzal Husain Johar)', 'var(--c-mhj)')}
        ${filterBtn('shk', 'SHK Husain Arif', 'var(--c-shk)')}
        ${filterBtn('own', 'OWN', 'var(--c-own)')}
        ${extraCats.map((cat, i) => filterBtn(cat, cat.replace(/_/g, ' '), EXTRA_COLORS[i % EXTRA_COLORS.length])).join('')}
      </div>
    `;
  }

  const groupDefs = [
    { key: 'MHJ', label: 'Professional — MHJ (Mufazzal Husain Johar)', color: 'var(--c-mhj)', match: t => t.cat === 'MHJ' },
    { key: 'SHK', label: 'Professional — SHK Husain Arif', color: 'var(--c-shk)', match: t => t.cat === 'SHK' },
    { key: 'OWN', label: 'Professional — OWN', color: 'var(--c-own)', match: t => t.cat === 'OWN' }
  ];

  extraCats.forEach((cat, i) => {
    groupDefs.push({ key: cat, label: 'Professional — ' + cat.replace(/_/g, ' '), color: EXTRA_COLORS[i % EXTRA_COLORS.length], match: t => t.cat === cat });
  });

  groupDefs.push(
    { key: 'FEES', label: 'Fees & Receivables', color: 'var(--c-fees)', match: t => t.type === 'fee' && !t.name.includes('Advance Credit Balance') },
    { key: 'PERSONAL', label: 'Personal & Routine', color: 'var(--c-personal)', match: t => t.type === 'personal' }
  );

  const renderCard = (t, idx, g) => {
    const isFee = t.type === 'fee';
    const isNamaz = t.type === 'personal' && /namaz/i.test(t.name);
    const balance = isFee ? (t.payable - t.received - (t.discount || 0)) : 0;
    const taskOverdue = isOverdue(t);
    const dueDateLabel = t.dueDate ? (isNamaz
      ? new Date(t.dueDate).toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit', hour12: true })
      : new Date(t.dueDate).toLocaleDateString('en-IN', { day: 'numeric', month: 'short' })) : '';
    const showLinked = !!t.linked && t.linked.trim().toLowerCase() !== t.name.replace(/^✅\s*/, '').trim().toLowerCase();
    const stateClass = (isFee ? ' fee' : '') + (t.done ? ' done' : (taskOverdue ? ' overdue' : (t.urgent ? ' urgent' : '')));
    const amount = !isFee ? '' : (balance > 0
      ? `<div class="amt owed">${inr(balance)}<small>due</small></div>`
      : '<div class="amt clear">Settled</div>');
    const status = (taskOverdue ? '<span class="badge over">Overdue</span>' : (t.urgent && !t.done ? '<span class="badge urgent">Urgent</span>' : ''))
      + (dueDateLabel && !t.done ? `<span class="due${taskOverdue ? ' over' : ''}">Due ${dueDateLabel}</span>` : '');
    const sub = !isFee ? '' : `<div class="task-sub"><span>${inr(t.received)} of ${inr(t.payable)} recd${t.discount ? ' + ' + inr(t.discount) + ' disc' : ''}</span>${showLinked ? '<span>&bull; ' + escapeForHtml(t.linked) + '</span>' : ''}</div>`;
    
    const actions = [
      isFee && !t.done ? `<button type="button" class="act pay" onclick="recordPayment('${t.id}')">Record payment</button>` : '',
      isFee && t.received > 0 && !t.name.includes('Advance Credit Balance') ? `<button type="button" class="act wa" onclick="offerReceipt('${t.id}', 0, false)">${ICON.doc} Send receipt</button>` : '',
      /Kathiyawad/i.test(t.name) ? `<button type="button" class="act" onclick="switchPage('financials'); setFinViewMode('trip');" style="color:#0284C7; font-weight:700;">🕌 Open Trip Statement</button>` : '',
      !t.done && !isNamaz ? `<button type="button" class="act" onclick="setDueDate('${t.id}')">${t.dueDate ? 'Due' : 'Set due'}</button>` : '',
      !t.done ? `<button type="button" class="act" onclick="setRemark('${t.id}')">${t.remark ? 'Note' : '+ Note'}</button>` : ''
    ].join('');
    
    const meta = (isFee ? '' : status) + actions;

    return `
      <div class="task${stateClass}" style="--catcolor:${g.color}">
        <span class="num">${idx + 1}.</span>
        ${isFee ? '' : `<input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggleTask('${t.id}')" aria-label="Mark done: ${escapeForHtml(t.name)}">`}
        <div class="task-body">
          <div class="task-top">
            <div class="task-name">${escapeForHtml(t.name)}</div>${amount}
            <button type="button" class="act del" onclick="deleteTask('${t.id}')" title="Remove">${ICON.x}</button>
          </div>
          ${sub}
          ${t.remark ? `<div class="note">${ICON.note}<span>${escapeForHtml(t.remark)}</span></div>` : ''}
          ${meta ? `<div class="task-meta">${meta}</div>` : ''}
        </div>
      </div>
    `;
  };

  let html = '';
  let shownCount = 0;

  if (filtered.length === 0) {
    html = `<div class="empty">No tasks match your selection.</div>`;
  } else {
    groupDefs.forEach(g => {
      const groupTasks = filtered.filter(g.match);
      if (groupTasks.length === 0) return;
      shownCount += groupTasks.length;

      const open = groupTasks.filter(t => !t.done).sort((a, b) => {
        const aOver = isOverdue(a), bOver = isOverdue(b);
        if (aOver !== bOver) return aOver ? -1 : 1;
        if (a.urgent !== b.urgent) return a.urgent ? -1 : 1;
        if (a.dueDate && b.dueDate) return new Date(a.dueDate) - new Date(b.dueDate);
        if (a.dueDate) return -1;
        if (b.dueDate) return 1;
        return 0;
      });

      const closed = groupTasks.filter(t => t.done);
      const isFolded = !!uiState.collapsed[g.key];
      const hasPending = open.length > 0;

      html += `
        <div class="cat-section${isFolded ? ' collapsed' : ''}">
          <div class="cat-heading fold" onclick="toggleGroup('${escapeForHtml(g.key)}')">
            ${ICON.chev}
            <span class="dot" style="background:${g.color}"></span>
            <span class="title"><span>${escapeForHtml(g.label)}</span></span>
            <span class="count ${hasPending ? 'has-pending' : ''}"><b>${open.length} pending</b>${closed.length ? ' &bull; ' + closed.length + ' done' : ''}</span>
          </div>
      `;

      if (!isFolded) {
        html += `<div class="task-grid">`;
        open.forEach((t, i) => { html += renderCard(t, i, g); });
        
        if (closed.length) {
          const isDoneOpen = filter === 'done' || !!doneOpen[g.key];
          if (filter !== 'done') {
            html += `<button class="done-toggle" onclick="toggleDone('${escapeForHtml(g.key)}')">${isDoneOpen ? '▴ Hide completed' : '✓ ' + closed.length + ' completed &bull; show'}</button>`;
          }
          if (isDoneOpen) {
            closed.forEach((t, i) => { html += renderCard(t, open.length + i, g); });
          }
        }
        html += `</div>`;
      }
      html += `</div>`;
    });
  }

  app.innerHTML = html;
  const info = document.getElementById('searchInfo');
  if (info) info.textContent = searchActive ? shownCount + ' of ' + tasks.length + ' tasks' : '';
}

let finViewMode = 'all';

function switchPage(page) {
  activePage = page;
  const tasksView = document.getElementById('tasksView');
  const finView = document.getElementById('financialsView');
  const btnTasks = document.getElementById('tabTasks');
  const btnFin = document.getElementById('tabFinancials');

  if (page === 'financials') {
    tasksView.style.display = 'none';
    finView.style.display = 'block';
    btnTasks.classList.remove('active');
    btnFin.classList.add('active');
    renderFinancialsPage();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } else {
    tasksView.style.display = 'block';
    finView.style.display = 'none';
    btnTasks.classList.add('active');
    btnFin.classList.remove('active');
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

function setFinViewMode(mode) {
  finViewMode = mode;
  renderFinancialsPage();
}

function renderFinancialsPage() {
  const finContainer = document.getElementById('financialsView');
  if (!finContainer) return;

  const ledger = getFinLedger();

  const feeTasks = tasks.filter(t => t.type === 'fee' && !t.name.includes('Advance Credit Balance') && !t.name.includes('Juzer Presswala'));
  const grossFeesBilled = feeTasks.reduce((s, t) => s + (t.payable || 0), 0);
  const feesReceivedCash = feeTasks.reduce((s, t) => s + (t.received || 0), 0);

                  <tr><th>Liabilities &amp; Capital</th><th class="text-right">Amount (₹)</th></tr>
                </thead>
                <tbody>
                  <tr style="background:#F8FAFC; font-weight:700;"><td colspan="2" style="color:var(--accent);">I. OWNER'S CAPITAL ACCOUNT</td></tr>
                  <tr>
                    <td>Base / Opening Capital Balance</td>
                    <td class="text-right stmt-mono">${inr(initialOpeningCapital)}</td>
                  </tr>
                  <tr style="background:#ECFDF5;">
                    <td style="color:var(--green); font-weight:600;">
                      Add: Net Practice Profit Transferred from P&amp;L
                      <div style="font-size:11px; color:var(--muted); font-weight:400;">Auto-credited from current period professional surplus</div>
                    </td>
                    <td class="text-right stmt-mono" style="color:var(--green); font-weight:700;">+ ${inr(netProfit)}</td>
                  </tr>
                  <tr style="font-weight:700; background:#FAFCFE; border-top:1px dashed var(--rule);">
                    <td>Total Capital Account &amp; Net Worth</td>
                    <td class="text-right stmt-mono" style="color:var(--green); font-size:15px;">${inr(effectiveCapital)}</td>
                  </tr>

                  <tr style="background:#F8FAFC; font-weight:700;"><td colspan="2" style="color:var(--amber); padding-top:12px;">II. CURRENT LIABILITIES (LOANS TAKEN)</td></tr>
                  <tr>
                    <td>Loan Taken — MHJ (Mufazzal Husain Johar)</td>
                    <td class="text-right stmt-mono" style="color:var(--amber);">${inr(mhjNet)}</td>
                  </tr>
                  <tr>
                    <td>Loan Taken — Hatim Bhai (Advocate)</td>
                    <td class="text-right stmt-mono" style="color:var(--amber);">${inr(hatimNet)}</td>
                  </tr>
                  <tr style="font-weight:700; background:#FAFCFE;">
                    <td>Total Current Liabilities</td>
                    <td class="text-right stmt-mono" style="color:var(--amber);">${inr(totalLoansTaken)}</td>
                  </tr>
                  <tr style="font-weight:700; background:#F1F5F9; border-top:2px solid var(--ink);">
                    <td><strong>TOTAL LIABILITIES &amp; CAPITAL</strong></td>
                    <td class="text-right stmt-mono" style="font-size:15px;">${inr(effectiveCapital + totalLoansTaken)}</td>
                  </tr>
                </tbody>
              </table>
            </div>

            <!-- Assets -->
            <div style="border:1px solid var(--rule); border-radius:10px; overflow:hidden;">
              <table class="stmt-table">
                <thead>
                  <tr><th>Assets &amp; Properties</th><th class="text-right">Amount (₹)</th></tr>
                </thead>
                <tbody>
                  <tr style="background:#F8FAFC; font-weight:700;"><td colspan="2" style="color:var(--accent);">I. CURRENT ASSETS &amp; ADVANCES</td></tr>
                  <tr>
                    <td>Loans &amp; Advances Given — Juzer Presswala</td>
                    <td class="text-right stmt-mono" style="color:var(--red);">${inr(juzerNet)}</td>
                  </tr>
                  <tr>
                    <td>Sundry Debtors (Active Client Fees Receivable)</td>
                    <td class="text-right stmt-mono" style="color:var(--red);">${inr(netDebtorsDue)}</td>
                  </tr>
                  <tr style="background:#F0F9FF;">
                    <td style="color:#0369A1; font-weight:600;">
                      Kathiyawad Ziyarat Trip Net Advance / Asset
                      <div style="font-size:11px; color:#0284C7; font-weight:400;">3 Families &bull; Disbursed (${inr(totalTripPayments)}) &minus; Received (${inr(totalTripContributions)})</div>
                    </td>
                    <td class="text-right stmt-mono" style="color:#0369A1; font-weight:700;">${inr(effectiveTripAsset)}</td>
                  </tr>

                  <tr style="background:#F8FAFC; font-weight:700;"><td colspan="2" style="color:var(--green); padding-top:12px;">II. LIQUID CASH &amp; BANK BALANCES</td></tr>
                  <tr>
                    <td>Cash in Hand (Physical Vault)</td>
                    <td class="text-right stmt-mono" style="color:${cashInHand >= 0 ? 'var(--green)' : 'var(--red)'}; font-weight:700;">${inr(cashInHand)}</td>
                  </tr>
                  <tr>
                    <td>slice Small Finance Bank (A/c: 033311501064738)</td>
                    <td class="text-right stmt-mono" style="color:#1E3A8A; font-weight:700;">${inr(bankSlice)}</td>
                  </tr>
                  <tr style="font-weight:700; background:#FAFCFE;">
                    <td>Total Current Assets &amp; Bank Balances</td>
                    <td class="text-right stmt-mono">${inr(totalAssets)}</td>
                  </tr>
                  <tr style="font-weight:700; background:#F1F5F9; border-top:2px solid var(--ink);">
                    <td><strong>TOTAL ASSETS</strong></td>
                    <td class="text-right stmt-mono" style="font-size:15px;">${inr(totalAssets)}</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    `;
  }

  // === EXPENSES & OUTFLOWS SCHEDULE ===
  if (finViewMode === 'all' || finViewMode === 'expenses') {
    html += `
      <div class="statement-sheet">
        <div class="statement-header" style="background:linear-gradient(135deg, #334155 0%, #1E293B 100%);">
          <div>
            <h3>Expenses &amp; Outflows Ledger (2-Way Double Entry)</h3>
            <div style="font-size:11.5px; color:#94A3B8;">Bank debit SMS parser, cash payments, portal filing challans &amp; operating costs</div>
          </div>
          <button type="button" class="btn btn-quiet" style="height:32px; font-size:12px;" onclick="openAddExpenseModal()">+ Record / Parse Expense</button>
        </div>
        <div class="statement-body">
          <table class="stmt-table">
            <thead>
              <tr>
                <th>Date</th>
                <th>Paid To / Beneficiary</th>
                <th>Paid From (2nd Effect)</th>
                <th>Category</th>
                <th>Details &amp; Reference</th>
                <th class="text-right">Amount (₹)</th>
                <th style="width:48px; text-align:center;">Action</th>
              </tr>
            </thead>
            <tbody>
              ${expensesList.length === 0 ? `<tr><td colspan="7" style="text-align:center; color:var(--muted); padding:20px;">No operating expenses recorded yet.</td></tr>` : ''}
              ${expensesList.map(e => `
                <tr>
                  <td>${e.date}</td>
                  <td><strong>${escapeForHtml(e.payee)}</strong></td>
                  <td><span style="font-size:11px; font-weight:600; padding:2px 7px; background:${e.source === 'Cash' ? '#ECFDF5; color:var(--green); border:1px solid #A7F3D0;' : '#EFF6FF; color:#1E3A8A; border:1px solid #BFDBFE;'}; border-radius:4px;">${escapeForHtml(e.source || 'slice SFB')}</span></td>
                  <td><span style="font-size:11px; padding:2px 6px; background:#F1F5F9; border-radius:4px;">${escapeForHtml(e.category)}</span></td>
                  <td style="color:var(--muted); font-size:12px;">${escapeForHtml(e.note || '-')}</td>
                  <td class="text-right stmt-mono" style="color:var(--red); font-weight:700;">&minus; ${inr(e.amount)}</td>
                  <td style="text-align:center;">
                    <button type="button" class="act del" onclick="deleteExpenseEntry('${e.id}')" title="Delete & revert expense entry" aria-label="Delete entry">${ICON.x}</button>
                  </td>
                </tr>
              `).join('')}
              <tr style="font-weight:700; background:#FAFCFE;">
                <td colspan="5">Total Operating Expenses Deducted from P&amp;L</td>
                <td class="text-right stmt-mono" style="color:var(--red); font-size:15px;">&minus; ${inr(totalOperatingExpenses)}</td>
                <td></td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    `;
  }

  // === MUTUAL CONTRA ADJUSTMENTS ===
  if (finViewMode === 'all' || finViewMode === 'adjust') {
    const adjLogs = ledger.adjustmentsLog || [];
    html += `
      <div class="statement-sheet">
        <div class="statement-header" style="background:linear-gradient(135deg, #1E3A8A 0%, #0F172A 100%);">
          <div>
            <h3>Mutual Contra &amp; Loan Adjustment History</h3>
            <div style="font-size:11.5px; color:#94A3B8;">Audit log of offsets between fees, loans taken, and loans given</div>
          </div>
        </div>
        <div class="statement-body">
          <table class="stmt-table">
            <thead>
              <tr>
                <th>Date</th>
                <th>Adjustment Description</th>
                <th class="text-right">Amount Offset (₹)</th>
                <th style="width:48px; text-align:center;">Action</th>
              </tr>
            </thead>
            <tbody>
              ${adjLogs.length === 0 ? `<tr><td colspan="4" style="text-align:center; color:var(--muted); padding:20px;">No contra adjustments recorded yet.</td></tr>` : ''}
              ${adjLogs.map((a, idx) => `
                <tr>
                  <td>${a.date}</td>
                  <td>${escapeForHtml(a.desc)}</td>
                  <td class="text-right stmt-mono" style="color:var(--green); font-weight:700;">${inr(a.amount)}</td>
                  <td style="text-align:center;">
                    <button type="button" class="act del" onclick="deleteAdjustmentEntry(${idx})" title="Delete adjustment log" aria-label="Delete log entry">${ICON.x}</button>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      </div>
    `;
  }

  finContainer.innerHTML = html;
}

const DASHBOARD_PASSWORD = 'Mustansir@2026';
const AUTH_KEY = 'dashboard-auth-ok';

function checkAuth() {
  const input = document.getElementById('authInput');
  if (input.value === DASHBOARD_PASSWORD) {
    localStorage.setItem(AUTH_KEY, 'yes');
    document.getElementById('authGate').style.display = 'none';
    startDashboard();
    if (location.hash === '#financials') switchPage('financials');
  } else {
    document.getElementById('authError').style.display = 'block';
    input.value = '';
  }
}

function startDashboard() {
  syncCloudFinLedger().then(() => {
    loadTasks().then(() => {
      pullFromCalendar();
    });
  });
}

if (localStorage.getItem(AUTH_KEY) === 'yes') {
  document.getElementById('authGate').style.display = 'none';
  startDashboard();
} else {
  document.getElementById('authInput').focus();
}
</script>
</body>
</html>
