<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Live Task Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,500;0,600;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Public+Sans:wght@400;500;600;700&family=Baloo+2:wght@500;600;700;800&family=Karla:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<meta name="theme-color" content="#F3F5F8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
  :root {
    --bg: #F8FAFC;
    --sheet: #FFFFFF;
    --sheet-alt: #F1F5F9;
    --ink: #0F172A;
    --ink-light: #1E293B;
    --muted: #64748B;
    --muted-light: #94A3B8;
    --icon: #94A3B8;
    --field: #CBD5E1;
    --rule: #E2E8F0;
    --rule-soft: #F1F5F9;

    --accent: #1E3A8A;
    --accent-hover: #1D4ED8;
    --accent-soft: #EFF6FF;
    --accent-border: #BFDBFE;

    --red: #BE123C;
    --red-soft: #FFF1F2;
    --red-border: #FECDD3;

    --green: #047857;
    --green-soft: #ECFDF5;
    --green-border: #A7F3D0;

    --amber: #B45309;
    --amber-soft: #FFFBEB;
    --amber-border: #FDE68A;

    --c-mhj: #2563EB;
    --c-shk: #6D28D9;
    --c-own: #0F766E;
    --c-personal: #BE185D;
    --c-fees: #D97706;

    --serif: 'Newsreader', Georgia, 'Times New Roman', serif;
    --sans: 'Plus Jakarta Sans', 'Public Sans', system-ui, -apple-system, sans-serif;

    --shadow-xs: 0 1px 2px rgba(15, 23, 42, 0.04);
    --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06), 0 1px 2px rgba(15, 23, 42, 0.04);
    --shadow-md: 0 4px 6px -1px rgba(15, 23, 42, 0.07), 0 2px 4px -2px rgba(15, 23, 42, 0.05);
    --shadow-lg: 0 10px 15px -3px rgba(15, 23, 42, 0.08), 0 4px 6px -4px rgba(15, 23, 42, 0.03);
    --shadow-modal: 0 25px 50px -12px rgba(15, 23, 42, 0.25);
  }

  * { box-sizing: border-box; }
  html { background: var(--bg); overflow-x: hidden; width: 100%; max-width: 100vw; -webkit-text-size-adjust: 100%; }
  
  body {
    font-family: var(--sans); font-size: 14px; line-height: 1.5; color: var(--ink);
    background: var(--bg); margin: 0 auto; max-width: 1120px; padding: 14px 10px 72px;
    overflow-x: hidden; width: 100%; -webkit-font-smoothing: antialiased;
  }

  button, input, select { font-family: var(--sans); }
  button, [role=button] { -webkit-tap-highlight-color: transparent; }
  :where(button, input, select, a, [role=button]):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .ic { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* Masthead */
  .masthead {
    display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center;
    gap: 10px; margin-bottom: 14px; padding: 14px 16px;
    background: #FFFFFF; border: 1px solid var(--rule); border-radius: 14px;
    box-shadow: var(--shadow-sm);
  }
  .masthead-brand { display: flex; align-items: center; gap: 12px; }
  .masthead-crest {
    width: 40px; height: 40px; border-radius: 10px;
    background: linear-gradient(135deg, #0F172A 0%, #1E3A8A 100%);
    color: #F8FAFC; display: grid; place-content: center;
    font-family: var(--serif); font-weight: 600; font-size: 17px;
    box-shadow: 0 2px 5px rgba(15, 23, 42, 0.15);
  }
  h1 { font-family: var(--serif); font-weight: 600; font-size: 22px; line-height: 1.15; margin: 0; color: var(--ink); }
  .sub { color: var(--muted); font-size: 12px; font-weight: 500; margin-top: 2px; display: flex; align-items: center; gap: 5px; }
  .sub-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--muted-light); }
  
  .masthead .status { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--muted); }
  .sync-badge {
    display: inline-flex; align-items: center; gap: 6px;
    background: #F8FAFC; border: 1px solid var(--rule); border-radius: 999px;
    padding: 3px 10px; font-size: 11px; font-weight: 500; color: #475569;
  }
  .pulse-dot { width: 6px; height: 6px; border-radius: 50%; background: #10B981; }
  #resetBtn {
    background: transparent; border: 1px solid var(--rule); border-radius: 6px;
    padding: 4px 8px; font: 600 11px var(--sans); color: var(--muted); cursor: pointer;
  }

  /* Summary Sheet */
  .summary-sheet {
    background: var(--sheet); border: 1px solid var(--rule); border-radius: 14px;
    margin-bottom: 14px; overflow: hidden; box-shadow: var(--shadow-sm);
  }
  .hero-stats { display: grid; grid-template-columns: repeat(4, 1fr); }
  .hero-card { display: flex; flex-direction: column-reverse; justify-content: flex-end; min-width: 0; padding: 10px 8px; }
  .hero-card + .hero-card { border-left: 1px solid var(--rule-soft); }
  .hero-card .l { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin-top: 2px; }
  .hero-card .n { font-family: var(--serif); font-weight: 600; font-size: 20px; line-height: 1.1; font-variant-numeric: tabular-nums; color: var(--ink); }
  .hero-card.alert .n { color: var(--red); }

  .totals { border-top: 1px solid var(--rule-soft); padding: 6px 0 4px; background: #FAFCFE; }
  .totals > .tot { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 4px 14px; }
  .totals .l { font-size: 12.5px; font-weight: 500; color: var(--muted); }
  .totals .fig { font-family: var(--serif); font-weight: 600; font-size: 17px; font-variant-numeric: tabular-nums; color: var(--ink); }
  .totals .fig.recd { color: var(--green); }
  .totals > .tot.sum { margin: 4px 14px 0; padding: 6px 0 4px; border-top: 1px dashed var(--rule); }
  .totals .fig.out { color: var(--red); font-size: 18px; border-bottom: 2px solid var(--red); }
  .totals .fig.out.clear { color: var(--green); border-bottom-color: var(--green); }

  /* Search & Inputs */
  #searchRow { margin: 0 0 10px; }
  #searchWrap { position: relative; }
  #searchWrap .ico { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--icon); pointer-events: none; width: 16px; height: 16px; }
  #searchBox {
    width: 100%; height: 42px; background: #FFFFFF; border: 1px solid var(--field); color: var(--ink);
    padding: 0 36px 0 36px; border-radius: 10px; font: 400 13.5px var(--sans); box-shadow: var(--shadow-xs);
  }
  #searchClear { display: none; position: absolute; right: 6px; top: 6px; width: 30px; height: 30px; border: 0; background: transparent; color: var(--muted); cursor: pointer; }

  .add-box { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .add-box input, .add-box select {
    height: 40px; background: #FFFFFF; border: 1px solid var(--field); color: var(--ink);
    padding: 0 10px; border-radius: 8px; font: 400 13px var(--sans); max-width: 100%; min-width: 0;
  }
  #newCat { flex: 1 1 140px; font-weight: 500; }
  .add-box input[type=text] { flex: 2 1 180px; }
  .add-box button {
    height: 40px; padding: 0 18px; background: linear-gradient(135deg, #1E3A8A 0%, #2563EB 100%);
    color: #FFFFFF; border: 0; border-radius: 8px; font: 600 13px var(--sans); cursor: pointer;
  }

  /* Category Filters & Sections */
  .filters { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .filters.seg {
    gap: 3px; flex-wrap: nowrap; padding: 3px; background: #EEF2F6;
    border: 1px solid #E2E8F0; border-radius: 10px; overflow-x: auto; scrollbar-width: none;
  }
  .filters.seg::-webkit-scrollbar { display: none; }
  .filter-btn { cursor: pointer; font: 500 12.5px var(--sans); transition: all 0.15s ease; }
  .filters.seg .filter-btn {
    flex: 1 1 auto; border: 0; background: transparent; color: var(--muted);
    padding: 6px 10px; border-radius: 7px; white-space: nowrap;
  }
  .filters.seg .filter-btn.active { background: #FFFFFF; color: var(--accent); font-weight: 600; box-shadow: 0 1px 2px rgba(15, 23, 42, 0.08); }
  .filters.chips { margin-bottom: 12px; gap: 6px; }
  .filters.chips .filter-btn {
    display: inline-flex; align-items: center; background: #FFFFFF; border: 1px solid var(--rule);
    color: var(--ink); padding: 5px 11px; border-radius: 999px; font-size: 12px; font-weight: 500;
  }
  .filters.chips .filter-btn.active { background: var(--accent-soft); border-color: var(--accent-border); color: var(--accent); font-weight: 600; }
  .filter-btn .dot { width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; flex: none; }

  .cat-section { margin-bottom: 18px; }
  .cat-heading { display: flex; align-items: center; gap: 8px; margin: 0 2px 8px; min-height: 28px; cursor: pointer; }
  .cat-heading .dot { width: 8px; height: 8px; border-radius: 3px; flex: none; }
  .cat-heading .title { font-family: var(--serif); font-weight: 600; font-size: 16.5px; color: var(--ink); }
  .cat-heading .count {
    margin-left: auto; padding: 2px 8px; background: #F1F5F9; border: 1px solid var(--rule);
    border-radius: 999px; font: 500 11px var(--sans); color: var(--muted);
  }
  .cat-section.collapsed .cat-heading .chev { transform: rotate(-90deg); }

  /* Tasks List */
  .task-grid { background: var(--sheet); border: 1px solid var(--rule); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow-sm); }
  .task {
    display: flex; align-items: flex-start; gap: 8px; padding: 11px 12px 10px;
    border-top: 1px solid var(--rule-soft); position: relative;
  }
  .task:first-child { border-top: 0; }
  .task .num { flex: none; width: 18px; text-align: right; font-size: 11px; line-height: 20px; color: var(--muted-light); }
  .task input[type=checkbox] {
    -webkit-appearance: none; appearance: none; flex: none; display: grid; place-content: center;
    width: 18px; height: 18px; margin: 1px 0 0; border: 1.5px solid var(--field); border-radius: 5px; background: var(--sheet); cursor: pointer;
  }
  .task input[type=checkbox]:checked { background: #2563EB; border-color: #2563EB; }
  .task input[type=checkbox]:checked::before { content: ''; width: 8px; height: 4px; margin-top: -2px; border-left: 2px solid #fff; border-bottom: 2px solid #fff; transform: rotate(-45deg); }
  .task-body { flex: 1; min-width: 0; }
  .task-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .task-name { flex: 1; min-width: 0; font-size: 14px; line-height: 1.35; font-weight: 600; color: var(--ink); overflow-wrap: break-word; word-break: break-word; }
  .amt { flex: none; text-align: right; font-family: var(--serif); font-weight: 600; font-size: 15px; }
  .amt.owed { color: var(--red); }
  .amt.clear { font: 600 11px var(--sans); color: var(--green); background: var(--green-soft); border: 1px solid var(--green-border); padding: 1px 6px; border-radius: 4px; }
  .task-sub { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  .note {
    display: flex; align-items: flex-start; gap: 5px; margin-top: 6px; padding: 3px 8px; border-radius: 6px;
    background: var(--amber-soft); border: 1px solid var(--amber-border); color: #92400E; font-size: 11px;
  }
  .task-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; margin-top: 4px; font-size: 12px; }
  .act { display: inline-flex; align-items: center; gap: 4px; padding: 4px 0; background: none; border: 0; font: 600 11.5px var(--sans); color: var(--accent); cursor: pointer; }
  .act.pay { padding: 3px 8px; border: 1px solid var(--rule); border-radius: 6px; background: #F8FAFC; }
  .act.wa { color: var(--green); }
  .act.del { flex: none; justify-content: center; width: 26px; height: 26px; color: var(--icon); border: 0; background: none; cursor: pointer; }
  .act.del:hover { color: var(--red); }
  .done-toggle {
    display: block; width: 100%; text-align: left; padding: 10px 14px; background: #FAFCFE; border: 0; border-top: 1px solid var(--rule-soft);
    color: var(--muted); font: 500 12px var(--sans); cursor: pointer;
  }

  /* Page Nav */
  .page-nav {
    display: flex; gap: 6px; margin: 0 0 14px; padding: 3px;
    background: #EEF2F6; border: 1px solid var(--rule); border-radius: 12px; width: 100%;
  }
  .page-nav-btn {
    flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 8px 10px; border-radius: 8px; border: 0; background: transparent;
    color: var(--muted); font: 600 12.5px var(--sans); cursor: pointer;
  }
  .page-nav-btn.active { background: #FFFFFF; color: var(--accent); box-shadow: 0 1px 2px rgba(15, 23, 42, 0.08); }
  .page-nav-btn .nav-badge { background: var(--accent-soft); color: var(--accent); padding: 1px 6px; border-radius: 999px; font-size: 10.5px; font-weight: 700; }
  .page-nav-btn.active .nav-badge { background: var(--accent); color: #FFFFFF; }

  /* Financials Page & Mobile Responsive Tables */
  #financialsView { display: none; width: 100%; max-width: 100%; }
  .fin-mode-toggle {
    display: flex; gap: 3px; padding: 3px; background: #EEF2F6; border: 1px solid var(--rule);
    border-radius: 8px; margin-bottom: 12px; overflow-x: auto; width: 100%; scrollbar-width: none;
  }
  .fin-mode-toggle::-webkit-scrollbar { display: none; }
  .fin-mode-btn {
    flex: 0 0 auto; border: 0; background: transparent; padding: 6px 10px; border-radius: 6px;
    font: 600 11.5px var(--sans); color: var(--muted); cursor: pointer; white-space: nowrap;
  }
  .fin-mode-btn.active { background: #FFFFFF; color: var(--accent); box-shadow: 0 1px 2px rgba(15, 23, 42, 0.08); }

  .fin-hero-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 14px; width: 100%; }
  .fin-card { background: #FFFFFF; border: 1px solid var(--rule); border-radius: 10px; padding: 10px 12px; box-shadow: var(--shadow-xs); }
  .fin-card .f-lbl { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
  .fin-card .f-val { font-family: var(--serif); font-size: 18px; font-weight: 700; color: var(--ink); margin: 2px 0 1px; }
  .fin-card .f-sub { font-size: 10.5px; color: var(--muted); }

  .statement-sheet {
    background: #FFFFFF; border: 1px solid var(--rule); border-radius: 12px;
    box-shadow: var(--shadow-sm); margin-bottom: 16px; overflow: hidden; width: 100%;
  }
  .statement-header {
    background: linear-gradient(135deg, #0F172A 0%, #1E3A8A 100%); color: #FFFFFF;
    padding: 14px 14px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;
  }
  .statement-header h3 { font-family: var(--serif); font-size: 16px; font-weight: 600; margin: 0; }
  .statement-body { padding: 12px 10px; width: 100%; }

  /* Loans & Advances Cards */
  .loan-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 10px; margin-bottom: 12px; }
  .loan-card {
    background: #FFFFFF; border: 1px solid var(--rule); border-radius: 10px; padding: 12px 14px;
    box-shadow: var(--shadow-xs); display: flex; flex-direction: column; justify-content: space-between;
  }
  .loan-pill { font-size: 10px; font-weight: 700; text-transform: uppercase; padding: 2px 6px; border-radius: 4px; }
  .loan-pill.asset { background: var(--red-soft); color: var(--red); border: 1px solid var(--red-border); }
  .loan-pill.liab { background: var(--amber-soft); color: var(--amber); border: 1px solid var(--amber-border); }
  .loan-pill.settled { background: var(--green-soft); color: var(--green); border: 1px solid var(--green-border); }

  /* Table Responsive Wrapper & Horizontal Touch Scrolling */
  .table-responsive {
    width: 100%;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    margin-bottom: 12px;
    border: 1px solid var(--rule);
    border-radius: 8px;
    background: #FFFFFF;
  }
  .stmt-table {
    width: 100%;
    min-width: 540px;
    border-collapse: collapse;
    font-size: 12px;
  }
  .stmt-table th {
    background: #F8FAFC; border-bottom: 1.5px solid var(--rule); padding: 8px 10px;
    font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted);
    white-space: nowrap;
  }
  .stmt-table td {
    padding: 8px 10px; border-bottom: 1px solid var(--rule-soft); vertical-align: top;
    overflow-wrap: break-word; word-break: break-word;
  }
  .stmt-table tr:last-child td { border-bottom: 0; }
  .stmt-mono { font-family: var(--serif); font-weight: 600; font-size: 13.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* Modal */
  #modalOverlay {
    position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px);
    z-index: 1000; align-items: center; justify-content: center; padding: 12px;
  }
  .modal {
    background: #FFFFFF; border-radius: 14px; padding: 18px 16px; width: 100%; max-width: 400px;
    max-height: calc(100vh - 24px); max-height: calc(100dvh - 24px); overflow-y: auto;
    box-shadow: var(--shadow-modal); border: 1px solid var(--rule);
  }
  #modalTitle { font-family: var(--serif); font-weight: 600; font-size: 18px; margin-bottom: 10px; }
  .modal-actions { display: flex; gap: 8px; margin-top: 14px; justify-content: flex-end; }
  #modalFields label { display: block; margin: 0 0 4px; font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--muted); }
  #modalFields input:not([type=checkbox]), #modalFields select {
    display: block; width: 100%; height: 38px; margin-bottom: 10px; padding: 0 10px; background: #FFFFFF; color: var(--ink);
    border: 1px solid var(--field); border-radius: 8px; font: 400 13.5px var(--sans);
  }
  .btn { height: 36px; padding: 0 14px; border-radius: 8px; border: 1px solid transparent; font: 600 13px var(--sans); cursor: pointer; }
  .btn-primary { background: linear-gradient(135deg, #1E3A8A 0%, #2563EB 100%); color: #fff; }
  .btn-wa { background: linear-gradient(135deg, #059669 0%, #047857 100%); color: #fff; }
  .btn-quiet { background: #FFFFFF; color: #334155; border-color: var(--field); }
  .btn-danger { background: #BE123C; color: #fff; }
  .receipt-preview { white-space: pre-wrap; word-break: break-word; background: var(--green-soft); border: 1px solid var(--green-border); border-radius: 8px; padding: 10px; font-size: 12px; max-height: 220px; overflow-y: auto; }

  /* Auth Gate */
  #authGate {
    position: fixed; inset: 0; z-index: 2000; display: flex; align-items: center; justify-content: center; padding: 16px;
    background: radial-gradient(circle at 50% 35%, #1E293B 0%, #0F172A 100%);
  }
  .auth-card {
    width: 100%; max-width: 340px; text-align: center;
    background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 16px; padding: 28px 20px; backdrop-filter: blur(12px);
  }
  .auth-crest { width: 44px; height: 44px; margin: 0 auto 12px; border-radius: 10px; background: linear-gradient(135deg, #1E3A8A, #2563EB); color: #fff; display: grid; place-content: center; font-family: var(--serif); font-size: 19px; }
  .auth-title { font-family: var(--serif); font-weight: 600; font-size: 22px; color: #FFFFFF; }
  #authInput { width: 100%; height: 44px; margin: 16px 0 10px; padding: 0 14px; background: rgba(255,255,255,0.08); color: #fff; border: 1px solid rgba(255,255,255,0.2); border-radius: 10px; text-align: center; font-size: 15px; }

  @media (min-width: 720px) {
    body { padding: 24px 24px 80px; }
    h1 { font-size: 28px; }
    .hero-stats { grid-template-columns: repeat(4, 1fr); }
    .fin-hero-grid { grid-template-columns: repeat(4, 1fr); }
    .task-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; background: none; border: 0; box-shadow: none; }
    .task { background: var(--sheet); border: 1px solid var(--rule); border-radius: 10px; box-shadow: var(--shadow-sm); }
    .done-toggle { grid-column: 1 / -1; border: 1px solid var(--rule); border-radius: 10px; background: #FFFFFF; }
    .stmt-table { min-width: 100%; }
  }
</style>
</head>
<body>

<header class="masthead">
  <div class="masthead-brand">
    <div class="masthead-crest">MM</div>
    <div>
      <h1>Mustannsirr Mallik</h1>
      <div class="sub">Tax &amp; Accounts Consultant <span class="sub-dot"></span> Indore</div>
    </div>
  </div>
  <div class="status">
    <span class="sync-badge"><span class="pulse-dot"></span><span id="lastSync">Syncing...</span></span>
    <button id="resetBtn" type="button" onclick="resetData()" title="Reload data">Reset</button>
  </div>
</header>

<nav class="page-nav" role="tablist">
  <button type="button" id="tabTasks" class="page-nav-btn active" onclick="switchPage('tasks')">
    <svg class="ic" viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
    <span>Tasks</span>
  </button>

// =========================================================================
async function pushToCalendar(name, tag, dueDate) {
  const url = getWebhook();
  if (!url) return null;
  try {
    const paramsObj = { action: 'add', name, tag };
    if (dueDate) paramsObj.dueDate = dueDate;
    const res = await fetch(url + '?' + new URLSearchParams(paramsObj).toString());
    const data = await res.json();
    return data.id || null;
  } catch (e) { return null; }
}

async function deleteFromCalendar(taskId) {
  const url = getWebhook();
  if (!url || !taskId || !taskId.startsWith('cal_')) return;
  try {
    await fetch(url + '?' + new URLSearchParams({ action: 'delete', id: taskId }).toString());
  } catch (e) {}
}

async function toggleOnCalendar(taskId, done) {
  const url = getWebhook();
  if (!url || !taskId || !taskId.startsWith('cal_')) return;
  try {
    await fetch(url + '?' + new URLSearchParams({ action: 'toggle', id: taskId, done: done ? 'true' : 'false' }).toString());
  } catch (e) {}
}

async function pushFeeToCalendar(name, payable, received, linked, phone, feeCat) {
  const url = getWebhook();
  if (!url) return null;
  try {
    const params = new URLSearchParams({ action: 'addfee', name, payable, received, linked, phone: phone || '', feeCat: feeCat || '' });
    const res = await fetch(url + '?' + params.toString());
    const data = await res.json();
    return data.id || null;
  } catch (e) { return null; }
}

async function updateFeeOnCalendar(taskId, received, discount) {
  const url = getWebhook();
  if (!url || !taskId || !taskId.startsWith('cal_')) return;
  try {
    await fetch(url + '?' + new URLSearchParams({ action: 'updatefee', id: taskId, received, discount: discount || 0 }).toString());
  } catch (e) {}
}

async function pullFromCalendar() {
  const url = getWebhook();
  if (!url) return;
  try {
    const res = await fetch(url);
    const events = await res.json();
    if (!Array.isArray(events)) return;

    const existingIds = new Set(tasks.map(t => t.id));
    let changedCount = 0;

    events.forEach(ev => {
      if (/Monthly Salary Receivable/i.test(ev.title) || /Hakimi Vihar Society/i.test(ev.title)) return;

      if (existingIds.has(ev.id)) {
        const local = tasks.find(x => x.id === ev.id);
        if (local) {
          let changed = false;
          if (local.name !== ev.title) { local.name = ev.title; changed = true; }
          if (local.done !== ev.done) { local.done = ev.done; changed = true; }
          if (local.dueDate !== (ev.dueDate || null)) { local.dueDate = ev.dueDate || null; changed = true; }
          if (local.remark !== (ev.remark || '')) { local.remark = ev.remark || ''; changed = true; }
          if (ev.tag === 'FEES') {
            if (local.payable !== (ev.payable || 0)) { local.payable = ev.payable || 0; changed = true; }
            if (local.received !== (ev.received || 0)) { local.received = ev.received || 0; changed = true; }
            if (local.discount !== (ev.discount || 0)) { local.discount = ev.discount || 0; changed = true; }
            if (local.linked !== (ev.linked || '')) { local.linked = ev.linked || ''; changed = true; }
            if (local.phone !== (ev.phone || '')) { local.phone = ev.phone || ''; changed = true; }
            if (local.invoice !== (ev.invoice || '')) { local.invoice = ev.invoice || ''; changed = true; }
            if (local.feeCat !== (ev.feeCat || '')) { local.feeCat = ev.feeCat || ''; changed = true; }
          }
          if (changed) changedCount++;
        }
        return;
      }

      const tag = ev.tag;
      const type = tag === 'PERSONAL' ? 'personal' : (tag === 'FEES' ? 'fee' : 'professional');
      const cat = (tag === 'PERSONAL') ? null : tag;
      const task = {
        id: ev.id,
        name: ev.title,
        type,
        cat,
        due: '',
        dueDate: ev.dueDate || null,
        done: ev.done,
        urgent: false,
        remark: ev.remark || ''
      };
      if (tag === 'FEES') {
        task.payable = ev.payable || 0;
        task.received = ev.received || 0;
        task.discount = ev.discount || 0;
        task.linked = ev.linked || '';
        task.phone = ev.phone || '';
        task.invoice = ev.invoice || '';
        task.feeCat = ev.feeCat || '';
      }
      tasks.push(task);
      changedCount++;
    });

    if (changedCount > 0) {
      saveTasks();
      render();
      if (activePage === 'financials') renderFinancialsPage();
    }
    const badge = document.getElementById('lastSync');
    if (badge) badge.textContent = 'Synced ✓ ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  } catch (e) {
    const badge = document.getElementById('lastSync');
    if (badge) badge.textContent = 'Offline Cache';
  }
}

    if (!parsed.customLoans) parsed.customLoans = [];
    if (!parsed.deletedIds) parsed.deletedIds = [];
    if (!parsed.loansGiven) parsed.loansGiven = def.loansGiven;
    if (!parsed.loansTaken) parsed.loansTaken = def.loansTaken;
    return parsed;
  } catch (e) {
    return getDefaultFinLedger();
  }
}

function saveFinLedger(ledger) {
  try {
    ledger.updatedAt = Date.now();
    localStorage.setItem(FIN_LEDGER_KEY, JSON.stringify(ledger));
  } catch (e) {}

  const url = getWebhook();
  if (url) {
    try {
      const payloadStr = JSON.stringify({ action: 'savefinledger', ledger: ledger });
      fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: payloadStr,
        redirect: 'follow'
      }).catch(() => {
        const getUrl = url + '?action=savefinledger&data=' + encodeURIComponent(JSON.stringify(ledger));
        new Image().src = getUrl;
      });
    } catch (err) {}
  }
}

function mergeFinLedgers(local, cloud) {
  if (!cloud || typeof cloud !== 'object') return local;
  const merged = Object.assign({}, local, cloud);
  const delSet = new Set([...(local.deletedIds || []), ...(cloud.deletedIds || [])]);
  merged.deletedIds = Array.from(delSet);

  if ((local.updatedAt || 0) >= (cloud.updatedAt || 0)) {
    merged.cashInHand = local.cashInHand;
    merged.bankSlice = local.bankSlice;
    merged.loansGiven = local.loansGiven;
    merged.loansTaken = local.loansTaken;
  }

  const mergeById = (arr1, arr2) => {
    const map = new Map();
    (arr2 || []).forEach(item => { if (item && item.id && !delSet.has(item.id)) map.set(item.id, item); });
    (arr1 || []).forEach(item => { if (item && item.id && !delSet.has(item.id)) map.set(item.id, item); });
    return Array.from(map.values());
  };

  merged.kathiyawadTrip.payments = mergeById(
    local.kathiyawadTrip && local.kathiyawadTrip.payments,
    cloud.kathiyawadTrip && cloud.kathiyawadTrip.payments
  );
  merged.kathiyawadTrip.contributions = mergeById(
    local.kathiyawadTrip && local.kathiyawadTrip.contributions,
    cloud.kathiyawadTrip && cloud.kathiyawadTrip.contributions
  );
  merged.expenses = mergeById(local.expenses, cloud.expenses);
  merged.customLoans = mergeById(local.customLoans, cloud.customLoans);

  return merged;
}

    const data = await res.json();
    if (data && data.status === 'ok' && data.ledger) {

      localStorage.setItem(FIN_LEDGER_KEY, JSON.stringify(merged));
      if (activePage === 'financials') renderFinancialsPage();
      else render();
    }
  } catch (err) {}
}

function recordPayment(id) {
  const t = tasks.find(x => x.id === id);
  if (!t) return;
  showModal('Record payment — ' + t.name, `
    <div class="hint">Currently ${inr(t.received)} of ${inr(t.payable)} received</div>
    <label>Total amount received so far (₹)</label>
    <input type="number" id="modalReceivedAmt" value="${t.received}">
    <label>Discount to write off (optional)</label>
    <input type="number" id="modalDiscountAmt" placeholder="₹ Discount" value="${t.discount || 0}">
    <label>Deposit New Payment To</label>
    <select id="modalPayMode">
      <option value="Cash">Cash in Hand</option>
      <option value="slice SFB">slice Small Finance Bank</option>
    </select>
    <label style="display:flex; align-items:center; gap:8px; margin:8px 0; font-size:12.5px; font-weight:600; color:var(--green); cursor:pointer;">
      <input type="checkbox" id="modalSendReceipt" checked> Offer WhatsApp receipt after saving
    </label>
  `, () => {
    const amount = parseFloat(document.getElementById('modalReceivedAmt').value);
    const discount = parseFloat(document.getElementById('modalDiscountAmt').value) || 0;
    const mode = document.getElementById('modalPayMode').value;
    const wantReceipt = document.getElementById('modalSendReceipt').checked;
    if (isNaN(amount)) return;

    const prevReceived = Number(t.received) || 0;
    const delta = Math.round((amount - prevReceived) * 100) / 100;
    t.received = amount;
    t.discount = discount;
    t.done = (amount + discount) >= t.payable && t.payable > 0;
    saveTasks();

    if (delta !== 0) {
      const ledger = getFinLedger();
      if (mode === 'Cash') ledger.cashInHand += delta;
      else ledger.bankSlice += delta;
      saveFinLedger(ledger);
    }

    render();
    if (activePage === 'financials') renderFinancialsPage();
    if (t.id && t.id.startsWith('cal_')) {
      updateFeeOnCalendar(t.id, amount, discount);
    }

    if (wantReceipt && amount > 0) {
      setTimeout(() => offerReceipt(t.id, delta > 0 ? delta : 0, true), 100);
    }
  }, 'Save', 'Cancel');
}

function offerReceipt(taskId, paidNow, afterSave) {
  const t = tasks.find(x => x.id === taskId);
  if (!t) return;
  const payable = Number(t.payable) || 0;
  const received = Number(t.received) || 0;
  const discount = Number(t.discount) || 0;
  const balance = Math.max(Math.round((payable - received - discount) * 100) / 100, 0);
  const amount = paidNow > 0 ? paidNow : received;
  const invNumber = String(t.invoice || '').split('|')[0].trim();

  let msg = `🧾 *Payment Receipt*\n\nDear Sir/Madam,\n\nWe have received your payment for *"${t.linked || t.name}"*. Thank you!\n\n✅ *Amount Received:* ₹${amount}`;
  if (discount > 0) msg += `\n🏷️ *Discount Allowed:* ₹${discount}`;
  msg += balance > 0 ? `\n💰 *Balance Due:* ₹${balance}` : `\n✅ *Status:* Fully settled`;
  if (invNumber) msg += `\n\n📄 *Invoice ${invNumber}:*\nhttps://mustansirrmalikworkdashboard.netlify.app/invoice.html?inv=${encodeURIComponent(invNumber)}`;
  msg += `\n\nWarm regards,\n*Mustannsirr Mallik*\n_Tax & Accounts Consultant, Indore_`.replace(/&/g, 'and');

  const waUrl = 'https://api.whatsapp.com/send?phone=' + (t.phone || '').replace(/[^0-9]/g, '') + '&text=' + encodeURIComponent(msg);

  showModal('WhatsApp Payment Receipt', `
    <div class="receipt-preview">${escapeForHtml(msg)}</div>
    <div style="margin-top:10px;">
      <a href="${waUrl}" target="_blank" rel="noopener" class="btn btn-wa" style="width:100%; display:inline-flex; align-items:center; justify-content:center; text-decoration:none;">
        📲 Open WhatsApp &amp; Send Receipt
      </a>
    </div>
  `, () => {}, 'Done', 'Close');
}

function recordLoanRepayment(loanKeyOrId, isBase) {
  const ledger = getFinLedger();
  let title = '', currentDue = 0, loanType = 'given';

  if (isBase) {
    if (loanKeyOrId === 'juzer') {
      title = ledger.loansGiven.juzer.name;
      currentDue = Math.max(0, ledger.loansGiven.juzer.base + (ledger.loansGiven.juzer.adjustments || 0));
      loanType = 'given';
    } else if (loanKeyOrId === 'mhj') {
      title = ledger.loansTaken.mhj.name;
      currentDue = Math.max(0, ledger.loansTaken.mhj.base + (ledger.loansTaken.mhj.adjustments || 0));
      loanType = 'taken';
    } else if (loanKeyOrId === 'hatim') {
      title = ledger.loansTaken.hatim.name;
      currentDue = Math.max(0, ledger.loansTaken.hatim.base + (ledger.loansTaken.hatim.adjustments || 0));
      loanType = 'taken';
    }
  } else {
    const item = ledger.customLoans.find(x => x.id === loanKeyOrId);
    if (!item) return;
    title = item.name;
    currentDue = Math.max(0, item.principal - (item.repaid || 0));
    loanType = item.type;
  }

  const actionLabel = loanType === 'given' ? 'Repayment Received From' : 'Repayment Paid To';
  const modeLabel = loanType === 'given' ? 'Deposited Into' : 'Paid From';

  showModal(`${actionLabel}: ${title}`, `
    <div class="hint">Current Balance Outstanding: <b>${inr(currentDue)}</b></div>
    <label>Repayment Amount (₹)</label>
    <input type="number" id="mRepayAmt" value="${currentDue}" placeholder="₹ Amount">
    <label>${modeLabel}</label>
    <select id="mRepayMode">
      <option value="Cash">Cash in Hand</option>
      <option value="slice SFB">slice Small Finance Bank</option>
    </select>
  `, () => {
    const amt = parseFloat(document.getElementById('mRepayAmt').value) || 0;
    const mode = document.getElementById('mRepayMode').value;
    if (amt <= 0) return;

    if (isBase) {
      if (loanKeyOrId === 'juzer') ledger.loansGiven.juzer.adjustments = (ledger.loansGiven.juzer.adjustments || 0) - amt;
      else if (loanKeyOrId === 'mhj') ledger.loansTaken.mhj.adjustments = (ledger.loansTaken.mhj.adjustments || 0) - amt;
      else if (loanKeyOrId === 'hatim') ledger.loansTaken.hatim.adjustments = (ledger.loansTaken.hatim.adjustments || 0) - amt;
    } else {
      const item = ledger.customLoans.find(x => x.id === loanKeyOrId);
      if (item) item.repaid = (item.repaid || 0) + amt;
    }

    const cashDelta = (loanType === 'given') ? amt : -amt;
    if (mode === 'Cash') ledger.cashInHand += cashDelta;
    else ledger.bankSlice += cashDelta;

    saveFinLedger(ledger);
    renderFinancialsPage();
    render();
  }, 'Record Repayment', 'Cancel');
}

function deleteCustomLoan(id) {
  const ledger = getFinLedger();
  const item = ledger.customLoans.find(x => x.id === id);
  if (!item) return;

  const netOutstanding = item.principal - (item.repaid || 0);
  showModal(`Delete Loan Entry: ${item.name}?`, `
    <div class="hint">Deleting this entry will reverse the remaining ${inr(netOutstanding)} effect on <b>${item.mode}</b>.</div>
  `, () => {
    const reversal = (item.type === 'given') ? netOutstanding : -netOutstanding;
    if (item.mode === 'Cash') ledger.cashInHand += reversal;
    else ledger.bankSlice += reversal;

    ledger.customLoans = ledger.customLoans.filter(x => x.id !== id);
    if (!ledger.deletedIds) ledger.deletedIds = [];
    ledger.deletedIds.push(id);

    saveFinLedger(ledger);
    renderFinancialsPage();
    render();
  }, 'Delete', 'Cancel');
}

function shareZiyaratWithFamilies() {
  const ledger = getFinLedger();
  const payments = ledger.kathiyawadTrip.payments || [];
  const contributions = ledger.kathiyawadTrip.contributions || [];

  const totalOutlay = payments.reduce((s, p) => s + (p.amount || 0), 0);
  const equalShare = totalOutlay / 3;

  const getFamPaid = (famName) => {
    const pSum = payments.filter(p => p.family === famName).reduce((s, p) => s + (p.amount || 0), 0);
    const cSum = contributions.filter(c => c.family === famName).reduce((s, c) => s + (c.amount || 0), 0);
    return pSum + cSum;
  };

  const famLines = (ledger.kathiyawadTrip.families || []).map(f => {
    const paid = getFamPaid(f.name);
    const diff = paid - equalShare;
    const status = diff < -0.5 ? `Due: ${inr(Math.abs(diff))}` : (diff > 0.5 ? `Refund Due: ${inr(diff)}` : 'Settled ✓');
    return `• *${f.name}*: Paid ${inr(paid)} | Share ${inr(equalShare)} (${status})`;
  }).join('\n');

function renderFinancialsPage() {

  const totalLiquidCashBank = cashInHand + bankSlice;

  const juzerNet = Math.max(0, (ledger.loansGiven.juzer.base || 0) + (ledger.loansGiven.juzer.adjustments || 0));
  const customGivenList = (ledger.customLoans || []).filter(l => l.type === 'given');
  const customGivenNet = customGivenList.reduce((s, l) => s + Math.max(0, (l.principal || 0) - (l.repaid || 0)), 0);
  const totalLoansGiven = juzerNet + customGivenNet;

  const mhjNet = Math.max(0, (ledger.loansTaken.mhj.base || 0) + (ledger.loansTaken.mhj.adjustments || 0));
  const hatimNet = Math.max(0, (ledger.loansTaken.hatim.base || 0) + (ledger.loansTaken.hatim.adjustments || 0));
  const customTakenList = (ledger.customLoans || []).filter(l => l.type === 'taken');
  const customTakenNet = customTakenList.reduce((s, l) => s + Math.max(0, (l.principal || 0) - (l.repaid || 0)), 0);
  const totalLoansTaken = mhjNet + hatimNet + customTakenNet;

  const tripPayments = (ledger.kathiyawadTrip && ledger.kathiyawadTrip.payments) || [];
  const tripContributions = (ledger.kathiyawadTrip && ledger.kathiyawadTrip.contributions) || [];

  const totalTripContrib = tripContributions.reduce((s, c) => s + (c.amount || 0), 0);

  const totalPersonalDrawings = personalDrawingsList.reduce((s, e) => s + (e.amount || 0), 0);
  const netProfit = grossFeeIncome - totalOperatingExpenses;

  const totalAssets = totalLiquidCashBank + totalLoansGiven + netTripOutflow;

          <div><span style="color:var(--muted);">Account:</span> <b style="font-family:var(--serif); color:var(--accent);">033311501064738</b></div>
          <div><span style="color:var(--muted);">IFSC:</span> <b style="font-family:var(--serif); color:var(--accent);">NESF0000333</b></div>

function render(listOnly) {
  const summaryEl = document.getElementById('summaryArea');
  const app = document.getElementById('app');
  if (!app) return;

  const ledger = getFinLedger();
  const cashInHand = ledger.cashInHand;
  const bankSlice = ledger.bankSlice;
  const totalLiquid = cashInHand + bankSlice;

  const juzerNet = Math.max(0, ledger.loansGiven.juzer.base + (ledger.loansGiven.juzer.adjustments || 0));
  const customGivenNet = (ledger.customLoans || []).filter(l => l.type === 'given').reduce((s, l) => s + Math.max(0, l.principal - (l.repaid || 0)), 0);
  const totalLoansGiven = juzerNet + customGivenNet;

  const badgeEl = document.getElementById('finBadge');
  if (badgeEl) badgeEl.textContent = inr(totalLoansGiven);

  const doneCount = tasks.filter(t => t.done).length;
  const pendingCount = tasks.filter(t => !t.done).length;

  const knownCats = new Set(['MHJ', 'SHK', 'OWN', 'FEES']);
  const extraCats = [...new Set(tasks.filter(t => t.type === 'professional' && t.cat && !knownCats.has(t.cat)).map(t => t.cat))];

  const filterBtn = (key, label, dotColor) =>
    `<button type="button" class="filter-btn ${filter === key ? 'active' : ''}" onclick="setFilter('${key}')">${dotColor ? `<i class="dot" style="background:${dotColor}"></i>` : ''}${label}</button>`;

  let summaryHtml = `
    <div class="summary-sheet">
      <div class="hero-stats">
        <div class="hero-card"><div class="n">${doneCount}</div><div class="l">Done</div></div>
        <div class="hero-card"><div class="n">${pendingCount}</div><div class="l">Pending</div></div>
        <div class="hero-card"><div class="n" style="color:#0284C7;">₹13k</div><div class="l">Ziyarat</div></div>
        <div class="hero-card"><div class="n">${inr(totalLiquid)}</div><div class="l">Liquid</div></div>
      </div>
      <div class="totals">
        <div class="tot"><div class="l">Cash in Hand</div><div class="fig" style="color:${cashInHand >= 0 ? 'var(--green)' : 'var(--red)'};">${inr(cashInHand)}</div></div>
        <div class="tot"><div class="l">slice SFB Bank</div><div class="fig" style="color:#1E3A8A;">${inr(bankSlice)}</div></div>
        <div class="tot sum"><div class="l">Total Loans &amp; Advances Given</div><div class="fig out">${inr(totalLoansGiven)}</div></div>
      </div>
    </div>
    <div class="filters seg" role="group">
      ${filterBtn('all', 'All')}${filterBtn('personal', 'Personal')}${filterBtn('professional', 'Professional')}${filterBtn('pending', 'Pending')}${filterBtn('done', 'Done')}
    </div>
    <div class="filters chips" role="group">
      ${filterBtn('own', 'OWN', 'var(--c-own)')}${filterBtn('mhj', 'MHJ', 'var(--c-mhj)')}${filterBtn('shk', 'SHK Husain Arif', 'var(--c-shk)')}${filterBtn('fees', 'Fees', 'var(--c-fees)')}
      ${extraCats.map((cat, i) => filterBtn(cat, cat.replace(/_/g, ' '), EXTRA_COLORS[i % EXTRA_COLORS.length])).join('')}
    </div>
  `;

  let filtered = tasks;
  if (filter === 'personal') filtered = tasks.filter(t => t.type === 'personal');
  else if (filter === 'professional') filtered = tasks.filter(t => t.type === 'professional');
  else if (filter === 'own') filtered = tasks.filter(t => t.cat === 'OWN');
  else if (filter === 'mhj') filtered = tasks.filter(t => t.cat === 'MHJ');
  else if (filter === 'shk') filtered = tasks.filter(t => t.cat === 'SHK');
  else if (filter === 'fees') filtered = tasks.filter(t => t.cat === 'FEES' || t.type === 'fee');
  else if (filter === 'pending') filtered = tasks.filter(t => !t.done);
  else if (filter === 'done') filtered = tasks.filter(t => t.done);
  else if (extraCats.includes(filter)) filtered = tasks.filter(t => t.cat === filter);

  const q = (document.getElementById('searchBox') ? document.getElementById('searchBox').value : '').trim().toLowerCase();
  if (q) {
    filtered = filtered.filter(t => (t.name + ' ' + (t.linked || '') + ' ' + (t.remark || '')).toLowerCase().includes(q));
  }

  let html = '';
  if (filtered.length === 0) {
    html = '<div style="text-align:center; padding:30px; color:var(--muted);">No matching tasks found.</div>';
  } else {
    const groupDefs = [
      { key: 'MHJ', label: 'Professional — MHJ', color: 'var(--c-mhj)', match: t => t.cat === 'MHJ' }
    ];
    extraCats.forEach((cat, i) => {
      groupDefs.push({ key: cat, label: 'Professional — ' + cat.replace(/_/g, ' '), color: EXTRA_COLORS[i % EXTRA_COLORS.length], match: t => t.cat === cat });
    });
    groupDefs.push(
      { key: 'SHK', label: 'Professional — SHK Husain Arif', color: 'var(--c-shk)', match: t => t.cat === 'SHK' },
      { key: 'OWN', label: 'Professional — OWN', color: 'var(--c-own)', match: t => t.cat === 'OWN' },
      { key: 'personal', label: 'Personal', color: 'var(--c-personal)', match: t => t.type === 'personal' && !['MHJ', 'SHK', 'OWN', 'FEES'].includes(t.cat) },
      { key: 'FEES', label: 'Fees & Receivables', color: 'var(--c-fees)', match: t => t.type === 'fee' || t.cat === 'FEES' }
    );

    const forceOpen = filter !== 'all' || q.length > 0;

    groupDefs.forEach(g => {
      const groupTasks = filtered.filter(g.match);
      if (groupTasks.length === 0) return;

      const open = groupTasks.filter(t => !t.done);
      const closed = groupTasks.filter(t => t.done);
      const ordered = open.concat(closed);
      const collapsed = !forceOpen && !!uiState.collapsed[g.key];

      html += `
        <div class="cat-section${collapsed ? ' collapsed' : ''}">
          <div class="cat-heading" onclick="toggleGroup('${g.key}')">
            ${ICON.chev}
            <span class="dot" style="background:${g.color}"></span>
            <span class="title">${g.label}</span>
            <span class="count"><b>${open.length} pending</b>${closed.length ? ' · ' + closed.length + ' done' : ''}</span>
          </div>
      `;

      if (!collapsed) {
        html += '<div class="task-grid">';
        const renderItem = (t) => {
          const idx = ordered.indexOf(t);
          const isFee = t.type === 'fee';
          const bal = isFee ? Math.max(0, (t.payable || 0) - (t.received || 0) - (t.discount || 0)) : 0;
          return `
            <div class="task" style="border-left:3.5px solid ${g.color};">
              <span class="num">${idx + 1}.</span>
              <input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggleTask('${t.id}')">
              <div class="task-body">
                <div class="task-top">
                  <div class="task-name" style="${t.done ? 'text-decoration:line-through; color:var(--muted);' : ''}">${escapeForHtml(t.name)}</div>
                  ${isFee ? `<div class="amt ${bal <= 0 ? 'clear' : 'owed'}">${bal <= 0 ? 'Settled' : inr(bal)}</div>` : ''}
                  <button type="button" class="act del" onclick="deleteTask('${t.id}')">${ICON.x}</button>
                </div>
                ${isFee ? `<div class="task-sub">${inr(t.received)} of ${inr(t.payable)} received${t.invoice ? ' &bull; ' + t.invoice : ''}</div>` : ''}
                ${t.remark ? `<div class="note">${ICON.note}<span>${escapeForHtml(t.remark)}</span></div>` : ''}
                <div class="task-meta">
                  ${isFee ? `<button type="button" class="act pay" onclick="recordPayment('${t.id}')">Record payment</button>` : ''}
                  ${isFee && t.received > 0 ? `<button type="button" class="act wa" onclick="offerReceipt('${t.id}', 0)">Send receipt</button>` : ''}
                  ${!t.done ? `<button type="button" class="act" onclick="setRemark('${t.id}')">Remark</button>` : ''}
                </div>
              </div>
            </div>
          `;
        };

        open.forEach(t => { html += renderItem(t); });

        if (closed.length) {
          const showAll = filter === 'done' || q.length > 0;
          const expanded = showAll || !!doneOpen[g.key];
          if (!showAll) {
            html += `<button type="button" class="done-toggle" onclick="toggleDone('${g.key}')">${expanded ? '▴ Hide completed' : '✓ ' + closed.length + ' completed · show'}</button>`;
          }
          if (expanded) closed.forEach(t => { html += renderItem(t); });
        }

        html += '</div>';
      }
      html += '</div>';
    });
  }

  if (!listOnly && summaryEl) summaryEl.innerHTML = summaryHtml;
  app.innerHTML = html;
}

function onSearch(val) { render(true); }
function clearSearch() {
  const box = document.getElementById('searchBox');
  if (box) box.value = '';
  render(true);
}

function setRemark(id) {
  const t = tasks.find(x => x.id === id);
  if (!t) return;
  showModal('Edit Remark: ' + t.name, `
    <input type="text" id="mRemark" value="${escapeForHtml(t.remark || '')}" placeholder="Add note or remark">
  `, () => {
    t.remark = document.getElementById('mRemark').value.trim();
    saveTasks();
    render();
    if (t.id && t.id.startsWith('cal_')) {
      const url = getWebhook();
      if (url) fetch(url + '?' + new URLSearchParams({ action: 'setremark', id: t.id, remark: t.remark }).toString()).catch(() => {});
    }
  }, 'Save', 'Cancel');
}

function deleteTask(id) {
  const t = tasks.find(x => x.id === id);
  if (!t) return;
  showModal('Delete Task: ' + t.name + '?', `
    <div class="hint">This will remove the task from your dashboard and Google Calendar.</div>
  `, () => {
    tasks = tasks.filter(x => x.id !== id);
    saveTasks();
    render();
    deleteFromCalendar(id);
  }, 'Delete', 'Cancel');
}

function addTask() {
  const input = document.getElementById('newTask');
  const catVal = document.getElementById('newCat').value;
  const name = input.value.trim();
  if (!name) return;

  if (catVal === 'FEES') {
    const payable = parseFloat(document.getElementById('feePayable').value) || 0;
    const received = parseFloat(document.getElementById('feeReceived').value) || 0;
    const linked = document.getElementById('feeLinked').value.trim();
    const phone = document.getElementById('feePhone').value.trim();
    const feeTask = {
      id: 'fee_' + Date.now(), name: name, type: 'fee', cat: 'FEES', feeCat: 'OWN',
      done: received >= payable && payable > 0, payable: payable, received: received,
      discount: 0, linked: linked, phone: phone
    };
    tasks.push(feeTask);
    input.value = '';
    document.getElementById('feePayable').value = '';
    document.getElementById('feeReceived').value = '';
    saveTasks();
    render();
    pushFeeToCalendar(name, payable, received, linked, phone, 'OWN').then(calId => {
      if (calId) { feeTask.id = calId; saveTasks(); }
    });
  } else {
    const dueVal = document.getElementById('newDueDate').value;
    const newTask = {
      id: 'task_' + Date.now(), name: name, type: catVal === 'PERSONAL' ? 'personal' : 'professional',
      cat: catVal === 'PERSONAL' ? 'PERSONAL' : catVal, done: false,
      dueDate: dueVal ? new Date(dueVal + 'T09:00:00').toISOString() : null, remark: ''
    };
    tasks.push(newTask);
    input.value = '';
    document.getElementById('newDueDate').value = '';
    saveTasks();
    render();
    pushToCalendar(name, catVal, dueVal).then(calId => {
      if (calId) { newTask.id = calId; saveTasks(); }
    });
  }
}

function onCategoryChange() {
  const select = document.getElementById('newCat');
  if (select.value === '__NEW__') {
    showModal('Add a new category', `
      <label>Category name</label>
      <input type="text" id="modalNewCatName" placeholder="e.g. ABC Company">
    `, () => {
      const raw = document.getElementById('modalNewCatName').value.trim();
      if (!raw) { select.value = 'PERSONAL'; return; }
      const tag = raw.toUpperCase().replace(/[^A-Z0-9]+/g, '_').replace(/^_+|_+$/g, '');
      const opt = document.createElement('option');
      opt.value = tag;
      opt.textContent = 'Professional — ' + raw;
      select.insertBefore(opt, select.querySelector('option[value="__NEW__"]'));
      select.value = tag;
    }, 'Create', 'Cancel');
    select.value = 'PERSONAL';
  }
  document.getElementById('feeFields').style.display = (select.value === 'FEES') ? 'flex' : 'none';
}

function resetData() {
  showModal('Reset & Resync with Calendar?', `
    <div class="hint">Reloads tasks from Google Calendar and synchronizes with cloud storage.</div>
  `, () => {
    localStorage.removeItem(STORAGE_KEY);
    window.location.reload();
  }, 'Reset', 'Cancel');
}

function checkPublicZiyaratView() {
  const urlParams = new URLSearchParams(window.location.search);
  const isTrip = urlParams.get('view') === 'ziyarat' || window.location.hash === '#ziyarat';
  if (!isTrip) return false;

  isFamilyPublicView = true;
  const gate = document.getElementById('authGate');
  if (gate) gate.style.display = 'none';

  const nav = document.querySelector('.page-nav');
  if (nav) nav.style.display = 'none';
  const statusEl = document.querySelector('.masthead .status');
  if (statusEl) statusEl.style.display = 'none';

  switchPage('financials');
  setFinViewMode('trip');
  return true;
}

const DASHBOARD_PASSWORD = 'Mustansir@2026';
const AUTH_KEY = 'dashboard-auth-ok';

function checkAuth() {
  const input = document.getElementById('authInput');
  if (input.value === DASHBOARD_PASSWORD) {
    localStorage.setItem(AUTH_KEY, 'yes');
    document.getElementById('authGate').style.display = 'none';
    startDashboard();
  } else {
    document.getElementById('authError').style.display = 'block';
    input.value = '';
  }
}

function startDashboard() {
  loadTasks();
  pullFromCalendar();
  syncCloudFinLedger();
}

function boot() {
  if (checkPublicZiyaratView()) return;
  if (localStorage.getItem(AUTH_KEY) === 'yes') {
    const gate = document.getElementById('authGate');
    if (gate) gate.style.display = 'none';
    startDashboard();
  } else {
    const inp = document.getElementById('authInput');
    if (inp) inp.focus();
  }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}
</script>
