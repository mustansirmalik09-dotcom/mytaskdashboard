function setFilter(f) {
  filter = f;
  render();
}

function render(listOnly) {
  const summaryEl = document.getElementById('summaryArea');
  const app = document.getElementById('app');
  const done = tasks.filter(t => t.done).length;
  const pending = tasks.filter(t => !t.done).length;
  const nowTs = Date.now();
  const isOverdue = t => !t.done && t.dueDate && new Date(t.dueDate).getTime() < nowTs;
  const overdue = tasks.filter(isOverdue).length;
  const total = tasks.length;
  const pct = total ? Math.round((done/total)*100) : 0;

  const feeTasks = tasks.filter(t => t.type === 'fee' && !t.name.includes('Advance Credit Balance'));
  const creditBalances = tasks.filter(t => t.type === 'fee' && t.name.includes('Advance Credit Balance'));
  const totalPayable = feeTasks.reduce((s, t) => s + (t.payable || 0), 0);
  const totalReceived = feeTasks.reduce((s, t) => s + (t.received || 0), 0);
  const totalDiscount = feeTasks.reduce((s, t) => s + (t.discount || 0), 0);
  const totalOutstanding = totalPayable - totalReceived - totalDiscount;

  const knownCats = new Set(['MHJ', 'SHK', 'OWN', 'FEES']);
  const extraCats = [...new Set(tasks.filter(t => t.type === 'professional' && !knownCats.has(t.cat)).map(t => t.cat))];

  let filtered = tasks;
  if (filter === 'personal') filtered = tasks.filter(t => t.type === 'personal');
  else if (filter === 'professional') filtered = tasks.filter(t => t.type === 'professional');
  else if (filter === 'own') filtered = tasks.filter(t => t.cat === 'OWN');
  else if (filter === 'mhj') filtered = tasks.filter(t => t.cat === 'MHJ');
  else if (filter === 'shk') filtered = tasks.filter(t => t.cat === 'SHK');
  else if (filter === 'fees') filtered = tasks.filter(t => t.cat === 'FEES');
  else if (filter === 'pending') filtered = tasks.filter(t => !t.done);
  else if (filter === 'done') filtered = tasks.filter(t => t.done);
  else if (extraCats.includes(filter)) filtered = tasks.filter(t => t.cat === filter);

  // Search runs on top of whichever filter is chosen. Every word must match somewhere in the
  // task's name, linked client, invoice number, remark, phone or category.
  const q = searchQuery.trim().toLowerCase();
  const searchActive = q.length > 0;
  if (searchActive) {
    const words = q.split(/\s+/);
    filtered = filtered.filter(t => {
      const hay = [t.name, t.linked, t.invoice, t.remark, t.phone, t.cat].join(' ').toLowerCase();
      return words.every(w => hay.includes(w));
    });
  }

  filtered = [...filtered].sort((a, b) => {
    if (a.done !== b.done) return a.done ? 1 : -1;
    if (!a.done && !b.done) {
      if (a.urgent !== b.urgent) return a.urgent ? -1 : 1;
      // Timeline order: tasks with a real due date come first (earliest/most overdue
      // first), tasks with no due date follow, keeping their existing relative order.
      const aHas = !!a.dueDate, bHas = !!b.dueDate;
      if (aHas !== bHas) return aHas ? -1 : 1;
      if (aHas && bHas) return new Date(a.dueDate) - new Date(b.dueDate);
    }
    return 0;
  });

  const filterBtn = (key, label, dotColor) =>
    `<button type="button" class="filter-btn ${filter === key ? 'active' : ''}" aria-pressed="${filter === key}" onclick="setFilter('${key}')">${dotColor ? `<i class="dot" style="background:${dotColor}"></i>` : ''}${label}</button>`;

  let summaryHtml = `
    <div class="summary-sheet">
      <div class="hero-stats">
        <div class="hero-card pct"><div class="n">${pct}%</div><div class="l">Complete</div></div>
        <div class="hero-card done-c"><div class="n">${done}</div><div class="l">Done</div></div>
        <div class="hero-card pending-c"><div class="n">${pending}</div><div class="l">Pending</div></div>
        <div class="hero-card overdue-c${overdue > 0 ? ' alert' : ''}"><div class="n">${overdue}</div><div class="l">Overdue</div></div>
      </div>
      ${feeTasks.length > 0 ? `
      <div class="totals">
        <div class="tot"><div class="l">Receivable</div><div class="fig">${inr(totalPayable)}</div></div>
        <div class="tot"><div class="l">Received</div><div class="fig recd">${inr(totalReceived)}</div></div>
        <div class="tot sum"><div class="l">Outstanding</div><div class="fig out${totalOutstanding > 0 ? '' : ' clear'}">${inr(totalOutstanding)}</div></div>
        ${totalDiscount > 0 ? `<div class="totals-note">Discounts allowed: ${inr(totalDiscount)}</div>` : ''}
      </div>` : ''}
    </div>
    ${creditBalances.length > 0 ? `
    <div class="credit-note">
      <div class="credit-title">${ICON.wallet}Advance Credit Available</div>
      ${creditBalances.map(c => `<div class="credit-line">${c.name.replace('Advance Credit Balance', '').replace(/^[\s—\-–]+|[\s—\-–]+$/g, '') || c.name} — <strong>${inr(c.payable)}</strong> remaining</div>`).join('')}
      <div class="credit-hint">Check before charging again — this may already cover upcoming work.</div>
    </div>` : ''}
    <div class="filters seg" role="group" aria-label="Show">
      ${filterBtn('all', 'All')}${filterBtn('personal', 'Personal')}${filterBtn('professional', 'Professional')}${filterBtn('pending', 'Pending')}${filterBtn('done', 'Done')}
    </div>
    <div class="filters chips" role="group" aria-label="Client group">
      ${filterBtn('own', 'OWN', 'var(--c-own)')}${filterBtn('mhj', 'MHJ', 'var(--c-mhj)')}${filterBtn('shk', 'SHK Husain Arif', 'var(--c-shk)')}${filterBtn('fees', 'Fees', 'var(--c-fees)')}
      ${extraCats.map((cat, i) => filterBtn(cat, cat.replace(/_/g, ' '), EXTRA_COLORS[i % EXTRA_COLORS.length])).join('')}
    </div>
  `;

  let html = '';
  const forceOpen = filter !== 'all' || searchActive; // an explicit filter or search always beats a folded section
  let shownCount = 0;
  if (filtered.length === 0) {
    html += searchActive
      ? '<div class="empty">No tasks match “' + escapeForHtml(searchQuery.trim()) + '”</div>'
      : '<div class="empty">No tasks here.</div>';
  } else {
    const groupDefs = [
      { key: 'MHJ', label: 'Professional — MHJ', color: 'var(--c-mhj)', match: t => t.cat === 'MHJ' },
    ];
    // Any category beyond the fixed set (e.g. a newly created employer/client group)
    // gets its own section here, right after MHJ, so nothing ever becomes invisible.
    const extraColors = EXTRA_COLORS;
    extraCats.forEach((cat, i) => {
      groupDefs.push({ key: cat, label: 'Professional — ' + cat.replace(/_/g, ' '), color: extraColors[i % extraColors.length], match: t => t.cat === cat });
    });
    groupDefs.push(
      { key: 'SHK', label: 'Professional — SHK Husain Arif', color: 'var(--c-shk)', match: t => t.cat === 'SHK' },
      { key: 'OWN', label: 'Professional — OWN', color: 'var(--c-own)', match: t => t.cat === 'OWN' },
      { key: 'personal', label: 'Personal', color: 'var(--c-personal)', match: t => t.type === 'personal' },
      { key: 'FEES', label: 'Fees', color: 'var(--c-fees)', match: t => t.type === 'fee' && !t.name.includes('Advance Credit Balance') }
    );

    // One row. A fee shows what is still due at the right (red) or "Settled" (green); the small line
    // under the name keeps the received / payable figures, the overdue and due-date status, any
    // different linked name and the invoice number.
    const renderCard = (t, idx, g) => {
        const isFee = t.type === 'fee';
        const balance = isFee ? (t.payable - t.received - (t.discount || 0)) : 0;
        const taskOverdue = isOverdue(t);
        const dueDateLabel = t.dueDate ? new Date(t.dueDate).toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }) : '';
        const showLinked = !!t.linked && t.linked.trim().toLowerCase() !== t.name.replace(/^✅\s*/, '').trim().toLowerCase();
        const stateClass = (isFee ? ' fee' : '') + (t.done ? ' done' : (taskOverdue ? ' overdue' : (t.urgent ? ' urgent' : '')));
        const amount = !isFee ? '' : (balance > 0
          ? `<div class="amt owed">${inr(balance)}<small>due</small></div>`
          : '<div class="amt clear">Settled</div>');
        const status = (taskOverdue ? '<span class="badge over">Overdue</span>' : (t.urgent && !t.done ? '<span class="badge urgent">Urgent</span>' : ''))
          + (dueDateLabel && !t.done ? `<span class="due${taskOverdue ? ' over' : ''}">Due ${dueDateLabel}</span>` : '');
        const sub = !isFee ? '' : `<div class="task-sub"><span>${inr(t.received)} of ${inr(t.payable)} received${t.discount ? ' + ' + inr(t.discount) + ' discount' : ''}</span>${status ? '<span class="state">' + status + '</span>' : ''}${showLinked ? '<span>linked: ' + t.linked + '</span>' : ''}${t.invoice ? '<span>' + ICON.doc + t.invoice + '</span>' : ''}</div>`;
        const actions = [
          isFee ? `<button type="button" class="act pay" onclick="recordPayment('${t.id}')">Record payment</button>` : '',
          isFee && balance > 0 && t.phone ? `<button type="button" class="act wa" onclick="sendWhatsAppReminder('${t.id}', ${balance})">${ICON.chat}Send WhatsApp reminder</button>` : '',
          isFee && t.received > 0 && !t.name.includes('Advance Credit Balance') ? `<button type="button" class="act wa" onclick="offerReceipt('${t.id}')">${ICON.doc}Send receipt</button>` : '',
          !t.done ? `<button type="button" class="act" onclick="setDueDate('${t.id}')">${t.dueDate ? 'Change' : 'Set'} due date</button>` : '',
          !t.done ? `<button type="button" class="act" onclick="setRemark('${t.id}')">${t.remark ? 'Edit' : 'Add'} remark</button>` : ''
        ].join('');
        const meta = (isFee ? '' : status) + actions;   // a fee keeps its status on the detail line; other tasks keep it beside their buttons
        return `
          <div class="task${stateClass}" style="--catcolor:${g.color}">
            <span class="num">${idx + 1}.</span>
            ${isFee ? '' : `<input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggleTask('${t.id}')" aria-label="Mark done: ${escapeForHtml(t.name)}">`}
            <div class="task-body">
              <div class="task-top">
                <div class="task-name">${t.name}</div>${amount}
                <button type="button" class="act del" onclick="deleteTask('${t.id}')" title="Remove task" aria-label="Remove task">${ICON.x}</button>
              </div>
              ${sub}
              ${t.remark && !t.done ? `<div class="note">${ICON.note}<span>${t.remark}</span></div>` : ''}
              ${meta ? `<div class="task-meta">${meta}</div>` : ''}
            </div>
          </div>
        `;
    };

    // Finished tasks and fully settled fees are tucked behind a "✓ N completed" bar. Anything that
    // still needs attention stays in the list, including a fee marked done while money is still due.
    const feeBalance = t => (t.type === 'fee' && !t.name.includes('Advance Credit Balance')) ? (t.payable - t.received - (t.discount || 0)) : 0;
    const isFinished = t => t.done && feeBalance(t) <= 0;

    groupDefs.forEach(g => {
      const groupTasks = filtered.filter(g.match);
      if (groupTasks.length === 0) return;
      shownCount += groupTasks.length;
      const open = groupTasks.filter(t => !isFinished(t));
      const closed = groupTasks.filter(isFinished);
      const ordered = open.concat(closed);   // card numbers run 1..n through the open cards, then carry on through the completed ones
      const collapsed = !forceOpen && !!uiState.collapsed[g.key];
      const key = escapeForHtml(g.key);
      const countHtml = '<b>' + open.length + ' pending</b>' + (closed.length ? ' · ' + closed.length + ' done' : '');
      const titleParts = g.label.match(/^(Professional) — (.+)$/);
      const titleHtml = titleParts ? '<span class="kind">' + titleParts[1] + '</span><span>' + titleParts[2] + '</span>' : '<span>' + g.label + '</span>';
      const headAttrs = forceOpen ? '' : ` role="button" tabindex="0" aria-expanded="${!collapsed}" data-key="${key}" onclick="toggleGroup(this.dataset.key)" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleGroup(this.dataset.key);}"`;
      html += `<div class="cat-section${collapsed ? ' collapsed' : ''}">
        <div class="cat-heading${forceOpen ? '' : ' fold'}"${headAttrs}>${forceOpen ? '' : ICON.chev}<span class="dot" style="background:${g.color}"></span><span class="title">${titleHtml}</span><span class="count">${countHtml}</span></div>`;
      if (!collapsed) {
        html += '<div class="task-grid">';
        open.forEach(t => { html += renderCard(t, ordered.indexOf(t), g); });
        if (closed.length) {
          const showAll = filter === 'done' || searchActive;   // asked for explicitly, so no bar is needed
          const expanded = showAll || !!doneOpen[g.key];
          if (!showAll) {
            html += `<button class="done-toggle" data-key="${key}" aria-expanded="${expanded}" onclick="toggleDone(this.dataset.key)">${expanded ? '▴ Hide completed' : '✓ ' + closed.length + ' completed · show'}</button>`;
          }
          if (expanded) closed.forEach(t => { html += renderCard(t, ordered.indexOf(t), g); });
        }
        html += '</div>';
      }
      html += '</div>';
    });
  }

  if (!listOnly) summaryEl.innerHTML = summaryHtml;
  app.classList.toggle('no-anim', !!listOnly);   // no fade-in while typing in the search box
  app.innerHTML = html;
  const info = document.getElementById('searchInfo');
  if (info) info.textContent = searchActive ? shownCount + ' of ' + tasks.length + ' tasks' : '';
}

// Festival theming: overrides the base color palette for a few days around
// major festivals. Muharram/Ashura is treated as a mourning period, not a
// celebration, so it gets a deliberately muted, sombre palette instead of
// bright festive colors. Dates are for 2026 (confirmed from multiple sources
// where possible); Islamic dates shift ~11 days earlier each year and will
// need updating for 2027 onward.
const FESTIVAL_THEMES = [
  { name: 'Republic Day', start: '2026-01-25', end: '2026-01-26', vars: { coral:'#FF9933', teal:'#138808', violet:'#0B3D91', sky:'#138808', pink:'#FF9933', bg:'#FFF8ED' } },
  { name: 'Holi', start: '2026-03-03', end: '2026-03-05', accent: '#6D2FD0', vars: { coral:'#FF3D71', teal:'#00C2A8', violet:'#9B4DFF', sky:'#1FC4FF', pink:'#FF61D2', yellow:'#FFD400', bg:'#FFF9F0' } },
  { name: 'Eid al-Fitr', start: '2026-03-19', end: '2026-03-22', vars: { coral:'#0F9D6F', teal:'#0F9D6F', violet:'#0B6E4F', sky:'#0F9D6F', pink:'#C9A227', yellow:'#C9A227', bg:'#F5FBF7' } },
  { name: 'Eid al-Adha', start: '2026-05-26', end: '2026-05-29', vars: { coral:'#0F9D6F', teal:'#0F9D6F', violet:'#0B6E4F', sky:'#0F9D6F', pink:'#C9A227', yellow:'#C9A227', bg:'#F5FBF7' } },
  { name: 'Muharram (Ashara Mubaraka)', start: '2026-06-16', end: '2026-06-26', mourning: true, vars: { coral:'#3A3A3E', teal:'#4A4A4E', violet:'#2B2B2F', sky:'#5A5A5E', pink:'#3A3A3E', yellow:'#6A6A6E', bg:'#F2F1EF', ink:'#1C1C1E' } },
  { name: 'Independence Day', start: '2026-08-14', end: '2026-08-16', vars: { coral:'#FF9933', teal:'#138808', violet:'#0B3D91', sky:'#138808', pink:'#FF9933', bg:'#FFF8ED' } },
  { name: 'Mawlid al-Nabi', start: '2026-08-24', end: '2026-08-26', vars: { coral:'#0F9D6F', teal:'#0F9D6F', violet:'#0B6E4F', sky:'#0F9D6F', pink:'#C9A227', yellow:'#C9A227', bg:'#F5FBF7' } },
  { name: 'Ganesh Chaturthi', start: '2026-09-13', end: '2026-09-15', vars: { coral:'#E8542A', teal:'#C9A227', violet:'#8B2E2E', sky:'#E8542A', pink:'#C9A227', yellow:'#F2B705', bg:'#FFF6EC' } },
  { name: 'Dussehra', start: '2026-10-19', end: '2026-10-21', vars: { coral:'#E8542A', teal:'#0F9D6F', violet:'#8B2E2E', sky:'#1F9EFF', pink:'#FF3D9A', yellow:'#F2B705', bg:'#FFF8ED' } },
  { name: 'Diwali', start: '2026-11-06', end: '2026-11-10', vars: { coral:'#B8860B', teal:'#8B2E2E', violet:'#6B2020', sky:'#D4AF37', pink:'#B8860B', yellow:'#D4AF37', bg:'#FFF7E0' } },
  { name: 'Christmas', start: '2026-12-24', end: '2026-12-26', vars: { coral:'#C41E3A', teal:'#0F7A3D', violet:'#0F7A3D', sky:'#C41E3A', pink:'#C41E3A', yellow:'#D4AF37', bg:'#F7FAF7' } },
];

function applyFestivalTheme() {
  const today = new Date();
  const todayStr = today.getFullYear() + '-' + String(today.getMonth()+1).padStart(2,'0') + '-' + String(today.getDate()).padStart(2,'0');
  const active = FESTIVAL_THEMES.find(f => todayStr >= f.start && todayStr <= f.end);
  if (!active) return;
  const root = document.documentElement.style;
  Object.entries(active.vars).forEach(([key, val]) => root.setProperty('--' + key, val));
  const accent = active.accent || active.vars.violet;   // every theme's deep colour doubles as the accent
  if (accent) root.setProperty('--accent', accent);
  const themeMeta = document.querySelector('meta[name="theme-color"]');   // keep the phone's address bar in step with the page colour
  if (themeMeta && active.vars.bg) themeMeta.setAttribute('content', active.vars.bg);
  if (active.mourning) {
    document.body.style.setProperty('--confetti-disabled', 'true');
  }
  const banner = document.createElement('div');
  banner.textContent = active.mourning ? '· ' + active.name + ' ·' : '✨ ' + active.name + ' ✨';
  banner.className = 'festival-banner';
  document.body.insertBefore(banner, document.body.firstChild);
}
applyFestivalTheme();

const DASHBOARD_PASSWORD = 'Mustansir@2026';
const AUTH_KEY = 'dashboard-auth-ok';

function checkAuth() {
  const input = document.getElementById('authInput');
  if (input.value === DASHBOARD_PASSWORD) {
    localStorage.setItem(AUTH_KEY, 'yes');
    document.getElementById('authGate').style.display = 'none';
    startDashboard();
  } else {
    document.getElementById('authError').style.display = 'block';
    input.value = '';
  }
}

function startDashboard() {
  loadTasks().then(() => {
    pullFromCalendar();
  });
}

if (localStorage.getItem(AUTH_KEY) === 'yes') {
  document.getElementById('authGate').style.display = 'none';
  startDashboard();
} else {
  document.getElementById('authInput').focus();
}
