<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task List — Personal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FAFAF7; --card: #FFFFFF; --line: #ECEAE3; --ink: #22252B; --ink-soft: #8A8A85;
    --coral: #FF4E6A; --teal: #00BFA6; --yellow: #FFB800; --violet: #7C5CFC; --sky: #1F9EFF; --pink: #FF3D9A;
  }
  * { box-sizing: border-box; }
  html, body { overflow-x: hidden; max-width: 100vw; }
  body { font-family: 'Karla', -apple-system, sans-serif; background: var(--bg); color: var(--ink); margin: 0; padding: 22px 16px 44px; line-height: 1.5; }
  h1 { font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 26px; margin: 0 0 4px 0; }
  .sub { color: var(--ink-soft); font-size: 12.5px; margin-bottom: 20px; font-weight: 600; }
  .hero-stats { display: flex; gap: 10px; margin-bottom: 20px; }
  .hero-card { flex: 1; border-radius: 16px; padding: 14px 16px; color: #fff; }
  .hero-card.pending-c { background: linear-gradient(135deg, var(--yellow), #ff9d00); }
  .hero-card.done-c { background: linear-gradient(135deg, var(--teal), #00d9a3); }
  .hero-card .n { font-family: 'Baloo 2', sans-serif; font-size: 26px; font-weight: 800; line-height: 1; }
  .hero-card .l { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 700; opacity: 0.9; margin-top: 3px; }
  .add-box { display: flex; gap: 8px; margin-bottom: 24px; }
  .add-box input { flex: 1; background: #fff; border: 1.5px solid var(--line); color: var(--ink); padding: 11px 14px; border-radius: 12px; font-size: 14px; font-family: 'Karla', sans-serif; font-weight: 600; }
  .add-box input:focus { outline: none; border-color: var(--violet); }
  .add-box button { background: linear-gradient(135deg, var(--violet), var(--coral)); color: #fff; border: none; padding: 11px 22px; border-radius: 12px; font-weight: 800; font-size: 14px; cursor: pointer; font-family: 'Karla', sans-serif; }
  .task-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
  .task { display: flex; align-items: flex-start; gap: 10px; background: #fff; border: 1.5px solid var(--line); border-left: 4px solid var(--sky); border-radius: 14px; padding: 12px 13px; transition: transform 0.15s ease; }
  .task:hover { transform: translateY(-2px); }
  .task.done { opacity: 0.55; border-left-color: var(--line); }
  .task input[type=checkbox] { margin-top: 2px; width: 19px; height: 19px; accent-color: var(--teal); flex-shrink: 0; cursor: pointer; }
  .task-name { font-size: 13px; font-weight: 600; }
  .task.done .task-name { text-decoration: line-through; color: var(--ink-soft); font-weight: 400; }
  .empty { color: var(--ink-soft); font-size: 14px; text-align: center; padding: 34px; font-family: 'Baloo 2', sans-serif; font-weight: 600; }
  .loading { text-align: center; padding: 40px; color: var(--ink-soft); font-weight: 700; }
</style>
</head>
<body>

<h1 id="pageTitle">Task List</h1>
<div class="sub" id="syncStatus">Loading...</div>
<div id="statsRow"></div>

<div class="add-box">
  <input type="text" id="newTask" placeholder="Add a new task..." onkeydown="if(event.key==='Enter'){ event.preventDefault(); addTask(); }">
  <button onclick="addTask()">Add</button>
</div>

<div id="app"><div class="loading">Loading tasks...</div></div>

<script>
const WEBHOOK = 'https://script.google.com/macros/s/AKfycbwbXqpF6ok4OLydQae2ORcc_AL9_UM-2km5hQYUMR0y1grw24D42SQB6RGrUnEo68NZCg/exec';
const VIEW = 'personal';
document.title = 'Task List — Personal';
document.getElementById('pageTitle').textContent = 'Personal Tasks';

// Festival theming: overrides the base color palette for a few days around
// major festivals. Muharram/Ashura is treated as a mourning period, not a
// celebration, so it gets a deliberately muted, sombre palette instead of
// bright festive colors. Dates are for 2026 (confirmed from multiple sources
// where possible); Islamic dates shift ~11 days earlier each year and will
// need updating for 2027 onward.
const FESTIVAL_THEMES = [
  { name: 'Republic Day', start: '2026-01-25', end: '2026-01-26', vars: { coral:'#FF9933', teal:'#138808', violet:'#0B3D91', sky:'#138808', pink:'#FF9933', bg:'#FFF8ED' } },
  { name: 'Holi', start: '2026-03-03', end: '2026-03-05', vars: { coral:'#FF3D71', teal:'#00C2A8', violet:'#9B4DFF', sky:'#1FC4FF', pink:'#FF61D2', yellow:'#FFD400', bg:'#FFF9F0' } },
  { name: 'Eid al-Fitr', start: '2026-03-19', end: '2026-03-22', vars: { coral:'#0F9D6F', teal:'#0F9D6F', violet:'#0B6E4F', sky:'#0F9D6F', pink:'#C9A227', yellow:'#C9A227', bg:'#F5FBF7' } },
  { name: 'Eid al-Adha', start: '2026-05-26', end: '2026-05-29', vars: { coral:'#0F9D6F', teal:'#0F9D6F', violet:'#0B6E4F', sky:'#0F9D6F', pink:'#C9A227', yellow:'#C9A227', bg:'#F5FBF7' } },
  { name: 'Muharram (Ashara Mubaraka)', start: '2026-06-16', end: '2026-06-26', mourning: true, vars: { coral:'#3A3A3E', teal:'#4A4A4E', violet:'#2B2B2F', sky:'#5A5A5E', pink:'#3A3A3E', yellow:'#6A6A6E', bg:'#F2F1EF', ink:'#1C1C1E' } },
  { name: 'Independence Day', start: '2026-08-14', end: '2026-08-16', vars: { coral:'#FF9933', teal:'#138808', violet:'#0B3D91', sky:'#138808', pink:'#FF9933', bg:'#FFF8ED' } },
  { name: 'Mawlid al-Nabi', start: '2026-08-24', end: '2026-08-26', vars: { coral:'#0F9D6F', teal:'#0F9D6F', violet:'#0B6E4F', sky:'#0F9D6F', pink:'#C9A227', yellow:'#C9A227', bg:'#F5FBF7' } },
  { name: 'Ganesh Chaturthi', start: '2026-09-13', end: '2026-09-15', vars: { coral:'#E8542A', teal:'#C9A227', violet:'#8B2E2E', sky:'#E8542A', pink:'#C9A227', yellow:'#F2B705', bg:'#FFF6EC' } },
  { name: 'Dussehra', start: '2026-10-19', end: '2026-10-21', vars: { coral:'#E8542A', teal:'#0F9D6F', violet:'#8B2E2E', sky:'#1F9EFF', pink:'#FF3D9A', yellow:'#F2B705', bg:'#FFF8ED' } },
  { name: 'Diwali', start: '2026-11-06', end: '2026-11-10', vars: { coral:'#B8860B', teal:'#8B2E2E', violet:'#6B2020', sky:'#D4AF37', pink:'#B8860B', yellow:'#D4AF37', bg:'#FFF7E0' } },
  { name: 'Christmas', start: '2026-12-24', end: '2026-12-26', vars: { coral:'#C41E3A', teal:'#0F7A3D', violet:'#0F7A3D', sky:'#C41E3A', pink:'#C41E3A', yellow:'#D4AF37', bg:'#F7FAF7' } },
];

function applyFestivalTheme() {
  const today = new Date();
  const todayStr = today.getFullYear() + '-' + String(today.getMonth()+1).padStart(2,'0') + '-' + String(today.getDate()).padStart(2,'0');
  const active = FESTIVAL_THEMES.find(f => todayStr >= f.start && todayStr <= f.end);
  if (!active) return;
  const root = document.documentElement.style;
  Object.entries(active.vars).forEach(([key, val]) => root.setProperty('--' + key, val));
  if (active.mourning) {
    document.body.style.setProperty('--confetti-disabled', 'true');
  }
  const banner = document.createElement('div');
  banner.textContent = active.mourning ? '· ' + active.name + ' ·' : '✨ ' + active.name + ' ✨';
  banner.style.cssText = 'text-align:center; font-family:"Baloo 2",sans-serif; font-weight:700; font-size:12px; letter-spacing:0.04em; padding:6px; margin-bottom:12px; border-radius:10px; background:rgba(0,0,0,0.06); color:var(--ink);';
  document.body.insertBefore(banner, document.body.firstChild);
}
applyFestivalTheme();

let tasks = [];

async function loadTasks() {
  try {
    const res = await fetch(WEBHOOK + '?view=' + VIEW);
    const events = await res.json();
    tasks = events.map(ev => ({ id: ev.id, name: ev.title, done: ev.done }));
    document.getElementById('syncStatus').textContent = 'Synced ✓ ' + new Date().toLocaleTimeString();
    render();
  } catch (e) {
    document.getElementById('syncStatus').textContent = 'Sync failed — please refresh';
  }
}

function render() {
  const done = tasks.filter(t => t.done).length;
  const pending = tasks.filter(t => !t.done).length;

  document.getElementById('statsRow').innerHTML = `
    <div class="hero-stats">
      <div class="hero-card pending-c"><div class="n">${pending}</div><div class="l">Pending</div></div>
      <div class="hero-card done-c"><div class="n">${done}</div><div class="l">Done</div></div>
    </div>
  `;

  const sorted = [...tasks].sort((a, b) => (a.done === b.done) ? 0 : (a.done ? 1 : -1));
  let html = '';
  if (sorted.length === 0) {
    html = '<div class="empty">No tasks yet</div>';
  } else {
    html = '<div class="task-grid">';
    sorted.forEach(t => {
      html += `
        <div class="task ${t.done ? 'done' : ''}">
          <input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggleTask('${t.id}')">
          <div class="task-name">${t.name}</div>
        </div>
      `;
    });
    html += '</div>';
  }
  document.getElementById('app').innerHTML = html;
}

async function addTask() {
  const input = document.getElementById('newTask');
  const name = input.value.trim();
  if (!name) return;
  input.value = '';
  try {
    const params = new URLSearchParams({ action: 'add', name, view: VIEW });
    await fetch(WEBHOOK + '?' + params.toString());
  } catch (e) { /* fire and forget */ }
  setTimeout(loadTasks, 1500);
}

async function toggleTask(id) {
  const t = tasks.find(x => x.id === id);
  if (t) t.done = !t.done;
  render();
  try {
    const params = new URLSearchParams({ action: 'toggle', id, done: t.done ? 'true' : 'false', view: VIEW });
    await fetch(WEBHOOK + '?' + params.toString());
  } catch (e) { /* fire and forget */ }
}

loadTasks();
setInterval(loadTasks, 30000); // refresh every 30s so both sides stay in sync
</script>

</body>
</html>
