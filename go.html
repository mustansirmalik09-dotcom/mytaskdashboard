<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redirecting to payment...</title>
<style>
  body { font-family: -apple-system, sans-serif; background: #F2F0E7; margin: 0; padding: 60px 20px; text-align: center; color: #6B7570; }
</style>
</head>
<body>
  <p>Redirecting to secure payment page...</p>
  <script>
    const WEBHOOK = 'https://script.google.com/macros/s/AKfycbwbXqpF6ok4OLydQae2ORcc_AL9_UM-2km5hQYUMR0y1grw24D42SQB6RGrUnEo68NZCg/exec';
    const params = new URLSearchParams(window.location.search);
    const code = params.get('c');
    const legacyTarget = params.get('u');

    async function go() {
      if (code) {
        try {
          const res = await fetch(WEBHOOK + '?action=resolvelink&c=' + encodeURIComponent(code));
          const data = await res.json();
          if (data.status === 'ok' && data.url) {
            window.location.href = data.url;
            return;
          }
        } catch (e) { /* fall through to error below */ }
        document.body.innerHTML = '<p>This payment link has expired. Please ask for a fresh one.</p>';
      } else if (legacyTarget) {
        window.location.href = decodeURIComponent(legacyTarget);
      } else {
        document.body.innerHTML = '<p>Invalid payment link.</p>';
      }
    }
    go();
  </script>
</body>
</html>
