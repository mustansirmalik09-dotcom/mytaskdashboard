<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task List</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FAFAF7; --card: #FFFFFF; --line: #ECEAE3; --ink: #22252B; --ink-soft: #8A8A85;
    --coral: #FF4E6A; --teal: #00BFA6; --yellow: #FFB800; --violet: #7C5CFC; --sky: #1F9EFF; --pink: #FF3D9A;
  }
  * { box-sizing: border-box; }
  body { font-family: 'Karla', -apple-system, sans-serif; background: var(--bg); color: var(--ink); margin: 0; padding: 22px 16px 44px; line-height: 1.5; }
  h1 { font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 26px; margin: 0 0 4px 0; }
  .sub { color: var(--ink-soft); font-size: 12.5px; margin-bottom: 20px; font-weight: 600; }
  .hero-stats { display: flex; gap: 10px; margin-bottom: 20px; }
  .hero-card { flex: 1; border-radius: 16px; padding: 14px 16px; color: #fff; }
  .hero-card.pending-c { background: linear-gradient(135deg, var(--yellow), #ff9d00); }
  .hero-card.done-c { background: linear-gradient(135deg, var(--teal), #00d9a3); }
  .hero-card .n { font-family: 'Baloo 2', sans-serif; font-size: 26px; font-weight: 800; line-height: 1; }
  .hero-card .l { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 700; opacity: 0.9; margin-top: 3px; }
  .add-box { display: flex; gap: 8px; margin-bottom: 24px; }
  .add-box input { flex: 1; background: #fff; border: 1.5px solid var(--line); color: var(--ink); padding: 11px 14px; border-radius: 12px; font-size: 14px; font-family: 'Karla', sans-serif; font-weight: 600; }
  .add-box input:focus { outline: none; border-color: var(--violet); }
  .add-box button { background: linear-gradient(135deg, var(--violet), var(--coral)); color: #fff; border: none; padding: 11px 22px; border-radius: 12px; font-weight: 800; font-size: 14px; cursor: pointer; font-family: 'Karla', sans-serif; }
  .task-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
  .task { display: flex; align-items: flex-start; gap: 10px; background: #fff; border: 1.5px solid var(--line); border-left: 4px solid var(--sky); border-radius: 14px; padding: 12px 13px; transition: transform 0.15s ease; }
  .task:hover { transform: translateY(-2px); }
  .task.done { opacity: 0.55; border-left-color: var(--line); }
  .task input[type=checkbox] { margin-top: 2px; width: 19px; height: 19px; accent-color: var(--teal); flex-shrink: 0; cursor: pointer; }
  .task-name { font-size: 13px; font-weight: 600; }
  .task.done .task-name { text-decoration: line-through; color: var(--ink-soft); font-weight: 400; }
  .empty { color: var(--ink-soft); font-size: 14px; text-align: center; padding: 34px; font-family: 'Baloo 2', sans-serif; font-weight: 600; }
  .loading { text-align: center; padding: 40px; color: var(--ink-soft); font-weight: 700; }
</style>
</head>
<body>

<h1 id="pageTitle">Task List</h1>
<div class="sub" id="syncStatus">Loading...</div>
<div id="statsRow"></div>

<div class="add-box">
  <input type="text" id="newTask" placeholder="Add a new task..." onkeydown="if(event.key==='Enter'){ event.preventDefault(); addTask(); }">
  <button onclick="addTask()">Add</button>
</div>

<div id="app"><div class="loading">Loading tasks...</div></div>

<script>
const WEBHOOK = 'https://script.google.com/macros/s/AKfycbwbXqpF6ok4OLydQae2ORcc_AL9_UM-2km5hQYUMR0y1grw24D42SQB6RGrUnEo68NZCg/exec';
// Category comes from the URL - e.g. view.html?cat=HATIM_BHAI_ADV - so every new
// category automatically gets a working link with no new file needed.
const params0 = new URLSearchParams(window.location.search);
const VIEW = (params0.get('cat') || 'PERSONAL').toUpperCase();
const DISPLAY_NAME = VIEW.replace(/_/g, ' ');
document.title = 'Task List — ' + DISPLAY_NAME;
document.getElementById('pageTitle').textContent = DISPLAY_NAME + ' Tasks';

let tasks = [];

async function loadTasks() {
  try {
    const res = await fetch(WEBHOOK + '?view=' + VIEW);
    const events = await res.json();
    tasks = events.map(ev => ({ id: ev.id, name: ev.title, done: ev.done }));
    document.getElementById('syncStatus').textContent = 'Synced ✓ ' + new Date().toLocaleTimeString();
    render();
  } catch (e) {
    document.getElementById('syncStatus').textContent = 'Sync failed — please refresh';
  }
}

function render() {
  const done = tasks.filter(t => t.done).length;
  const pending = tasks.filter(t => !t.done).length;

  document.getElementById('statsRow').innerHTML = `
    <div class="hero-stats">
      <div class="hero-card pending-c"><div class="n">${pending}</div><div class="l">Pending</div></div>
      <div class="hero-card done-c"><div class="n">${done}</div><div class="l">Done</div></div>
    </div>
  `;

  const sorted = [...tasks].sort((a, b) => (a.done === b.done) ? 0 : (a.done ? 1 : -1));
  let html = '';
  if (sorted.length === 0) {
    html = '<div class="empty">No tasks yet</div>';
  } else {
    html = '<div class="task-grid">';
    sorted.forEach(t => {
      html += `
        <div class="task ${t.done ? 'done' : ''}">
          <input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggleTask('${t.id}')">
          <div class="task-name">${t.name}</div>
        </div>
      `;
    });
    html += '</div>';
  }
  document.getElementById('app').innerHTML = html;
}

async function addTask() {
  const input = document.getElementById('newTask');
  const name = input.value.trim();
  if (!name) return;
  input.value = '';
  try {
    const params = new URLSearchParams({ action: 'add', name, view: VIEW });
    await fetch(WEBHOOK + '?' + params.toString());
  } catch (e) { /* fire and forget */ }
  setTimeout(loadTasks, 1500);
}

async function toggleTask(id) {
  const t = tasks.find(x => x.id === id);
  if (t) t.done = !t.done;
  render();
  try {
    const params = new URLSearchParams({ action: 'toggle', id, done: t.done ? 'true' : 'false', view: VIEW });
    await fetch(WEBHOOK + '?' + params.toString());
  } catch (e) { /* fire and forget */ }
}

loadTasks();
setInterval(loadTasks, 30000); // refresh every 30s so both sides stay in sync
</script>

</body>
</html>
